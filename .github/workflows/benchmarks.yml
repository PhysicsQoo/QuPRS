name: Python CI & Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/test_benchmark_*.py'
      - 'rust/**'
      - 'pyproject.toml'
      - 'GPMC'
      - '.gitmodules'
      - 'benchmarks/**'
      - 'scripts/benchmark_provenance.py'
      - 'scripts/generate_benchmark_report.py'
      - 'scripts/profile_wmc_weight_precision.py'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/test_benchmark_*.py'
      - 'rust/**'
      - 'pyproject.toml'
      - 'GPMC'
      - '.gitmodules'
      - 'benchmarks/**'
      - 'scripts/benchmark_provenance.py'
      - 'scripts/generate_benchmark_report.py'
      - 'scripts/profile_wmc_weight_precision.py'
      - '.github/workflows/benchmarks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # ====================================================================
  # JOB 1: Build and save a new performance baseline when code is merged into main.
  # This job's sole responsibility is to run on the main branch and store
  # its performance benchmark results as a workflow artifact.
  # ====================================================================
  build-and-save-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Checkout main branch code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 🌟 新增：設定 Rust 環境與快取
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ubuntu-latest-benchmark-cargo-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Identify pinned GPMC submodule revision
        id: gpmc_commit
        run: |
          echo "sha=$(git rev-parse HEAD:GPMC)" >> "$GITHUB_OUTPUT"

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-gpmc-${{ steps.gpmc_commit.outputs.sha }}-wmc-${{ hashFiles('rust/pathsum/build.rs', 'src/QuPRS/utils/ganak-release.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev

      - name: Run benchmark and save results as JSON
        run: |
          pytest --benchmark-only --benchmark-json=output.json
          python scripts/benchmark_provenance.py --output "$RUNNER_TEMP/main_baseline.provenance.json"

      - name: Discard local changes to tracked files
        run: |
          echo "Cleaning up modified files to allow branch switching..."
          git checkout .

      - name: Process benchmark data (Generate Charts)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: QuPRS Benchmark History
          tool: 'pytest'
          output-file-path: output.json
          gh-pages-branch: benchmarks
          auto-push: true  
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: true
          fail-on-alert: false

      - name: Push results to benchmarks branch
        run: |
            # Set Git identity
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            cp output.json "$RUNNER_TEMP/main_baseline.json"
            
            git clean -fdx
            git checkout .
            
            # De-init submodules to prevent "No url found" error during cleanup
            # when switching to a branch (benchmarks) that doesn't have .gitmodules
            git submodule deinit -f --all

            # Fetch and switch to the benchmarks branch
            git fetch origin benchmarks
            git checkout benchmarks
            git pull origin benchmarks # Sync with the commit made by github-action-benchmark
            
            # Remove accidentally committed GPMC folder from previous bad runs
            git rm -rf --ignore-unmatch GPMC

            cp "$RUNNER_TEMP/main_baseline.json" .
            cp "$RUNNER_TEMP/main_baseline.provenance.json" .
            
            # Stage the baseline JSON
            git add main_baseline.json main_baseline.provenance.json
            
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Update benchmark: ${GITHUB_SHA::7}"
              git push origin benchmarks
            fi

  # ====================================================================
  # JOB 2: For Pull Requests, using the official GitHub CLI for robust artifact handling.
  # This is the definitive version to solve the artifact download issues.
  # ====================================================================
  test-and-benchmark-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read  # Required for accessing workflow history.
      pull-requests: write  # Needed for commenting on PRs.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      # Step 1: Setup PR environment
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ubuntu-latest-benchmark-cargo-v1

      # Step 2: Fetch baseline from main branch (Moved up)
      - name: Fetch baseline
        run: |
          echo "Fetching main_baseline.json from benchmarks branch..."
          git fetch origin benchmarks:benchmarks
          if git checkout benchmarks -- main_baseline.json; then
            echo "Baseline found."
          else
            echo "Baseline not found. Creating an empty baseline."
            echo "{}" > main_baseline.json
          fi

      - name: Fetch baseline provenance (legacy baseline may not contain it)
        run: |
          if git checkout benchmarks -- main_baseline.provenance.json; then
            echo "Baseline provenance found."
          else
            echo "::warning::No baseline provenance; old benchmark baseline cannot be authenticated."
            echo '{}' > main_baseline.provenance.json
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Identify pinned GPMC submodule revision
        id: gpmc_commit
        run: |
          echo "sha=$(git rev-parse HEAD:GPMC)" >> "$GITHUB_OUTPUT"

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-gpmc-${{ steps.gpmc_commit.outputs.sha }}-wmc-${{ hashFiles('rust/pathsum/build.rs', 'src/QuPRS/utils/ganak-release.txt') }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev

      - name: Inspect baseline provenance
        run: |
          python scripts/benchmark_provenance.py --output pr_benchmark.provenance.json \
            --baseline main_baseline.provenance.json \
            --expected-main-sha "$(git rev-parse origin/main)"

      # Step 4: Run benchmark on PR code (and compare if baseline exists)
      - name: Run and compare benchmarks
        id: benchmark_step 
        run: |
          # Default command: just run and save JSON
          CMD="pytest --benchmark-only --benchmark-json=pr_benchmark.json"
          
          # If baseline exists and is not empty, add comparison args
          if [ -s "main_baseline.json" ] && [ "$(cat main_baseline.json)" != "{}" ]; then
            echo "Baseline detected. Comparing for reporting only."
            echo "comparison_performed=true" >> $GITHUB_OUTPUT
            # Shared hosted runners can report >10% deltas without source changes.
            # Keep pytest benchmark failures hard; compare deltas informational.
            CMD="$CMD --benchmark-compare=main_baseline.json"
            echo "::warning::Benchmark deltas are informational; inspect provenance and CodSpeed before interpreting changes."
          else
            echo "Baseline missing or empty. Running without comparison."
            echo "comparison_performed=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Executing: $CMD"
          $CMD

      # Step 5: Generate benchmark report
      - name: Generate benchmark report
        if: success() || failure()
        run: |
          python scripts/generate_benchmark_report.py \
            --comparison-status ${{ steps.benchmark_step.outputs.comparison_performed }} \
            --main-file main_baseline.json \
            --pr-file pr_benchmark.json \
            --baseline-provenance main_baseline.provenance.json \
            --pr-provenance pr_benchmark.provenance.json \
            --expected-main-sha "$(git rev-parse origin/main)" \
            --benchmark-outcome "${{ steps.benchmark_step.outcome }}" \
            --report-file benchmark_report.md

      # Step 6: Comment on PR with benchmark results
      - name: Post benchmark results
        if: success() || failure()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: benchmark_report.md
          header: "🔍 Benchmark Comparison Report"

      # Observation only: run *after* the release benchmark gate to avoid
      # changing its cache/CPU state. Do not run on cancelled workflows.
      # The profile can still be reported if the benchmark comparison fails.
      - name: Profile WMC Python weight precision
        if: ${{ success() || failure() }}
        continue-on-error: true
        run: |
          python scripts/profile_wmc_weight_precision.py \
            --samples 96 --repeats 5 --warmups 2 \
            --json-file python_wmc_precision_profile.json

      # Step 7: Upload artifacts for debugging
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-data
          path: |
            benchmark_report.md
            pr_benchmark.json
            main_baseline.json
            main_baseline.provenance.json
            pr_benchmark.provenance.json
            python_wmc_precision_profile.json
