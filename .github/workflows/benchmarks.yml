name: Python CI & Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/hatch_build.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/hatch_build.py'
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # ====================================================================
  # JOB 1: Build and save a new performance baseline when code is merged into main.
  # This job's sole responsibility is to run on the main branch and store
  # its performance benchmark results as a workflow artifact.
  # ====================================================================
  build-and-save-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Checkout main branch code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system dependencies for GPMC
        run: |
          sudo apt-get update
          sudo apt-get update && sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-wmc-tools-v0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          pip install .[dev]

      - name: Run benchmark and save results as JSON
        run: pytest --benchmark-only --benchmark-json=output.json

      - name: Discard local changes to tracked files
        run: |
          echo "Cleaning up modified files (like _version.py) to allow branch switching..."
          git checkout .

      - name: Process benchmark data (Generate Charts)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: QuPRS Benchmark History
          tool: 'pytest'
          output-file-path: output.json
          gh-pages-branch: benchmarks
          auto-push: false  
          save-data-file: true
          fail-on-alert: false
      - name: Push results to benchmarks branch
        run: |
            # Set Git identity
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            cp output.json "$RUNNER_TEMP/main_baseline.json"
            
            git clean -fdx
            git checkout .
            
            # Fetch and switch to the benchmarks branch
            git fetch origin benchmarks
            git checkout benchmarks
            
            cp "$RUNNER_TEMP/main_baseline.json" .
            
            # Stage the baseline JSON
            git add main_baseline.json
            git add .
            
            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Update benchmark: ${GITHUB_SHA::7}"
              git push origin benchmarks
            fi

  # ====================================================================
  # JOB 2: For Pull Requests, using the official GitHub CLI for robust artifact handling.
  # This is the definitive version to solve the artifact download issues.
  # ====================================================================
  test-and-benchmark-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read  # Required for accessing workflow history.
      pull-requests: write  # Needed for commenting on PRs.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      # Step 1: Setup PR environment
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get update && sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-wmc-tools-v0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          pip install .[dev]

      # Step 2: Run benchmark on PR code
      - name: Run benchmark
        run: pytest --benchmark-only --benchmark-json=pr_benchmark.json

      # Step 3: Fetch baseline from main branch
      - name: Fetch baseline
        run: |
          echo "Fetching main_baseline.json from benchmarks branch..."
          git fetch origin benchmarks:benchmarks
          if git checkout benchmarks -- main_baseline.json; then
            echo "Baseline found."
          else
            echo "Baseline not found. Creating an empty baseline."
            echo "{}" > main_baseline.json
          fi

      # Step 4: Compare benchmarks
      - name: Compare benchmarks
        id: compare_benchmarks
        run: |
          if [ -s "main_baseline.json" ] && [ "$(cat main_baseline.json)" != "{}" ]; then
            echo "comparison_performed=true" >> $GITHUB_OUTPUT
            pytest --benchmark-compare=main_baseline.json --benchmark-compare-fail=mean:10%
          else
            echo "comparison_performed=false" >> $GITHUB_OUTPUT
            echo "Baseline is empty or missing. Skipping comparison."
          fi

      # Step 5: Generate benchmark report
      - name: Generate benchmark report
        if: success() || failure()
        run: |
          python scripts/generate_benchmark_report.py \
            --comparison-status ${{ steps.compare_benchmarks.outputs.comparison_performed }} \
            --main-file main_baseline.json \
            --pr-file pr_benchmark.json \
            --report-file benchmark_report.md

      # Step 6: Comment on PR with benchmark results
      - name: Post benchmark results
        if: success() || failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: benchmark_report.md
          header: "🔍 Benchmark Comparison Report"

      # Step 7: Upload artifacts for debugging
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmark-data
          path: |
            benchmark_report.md
            pr_benchmark.json
            main_baseline.json
