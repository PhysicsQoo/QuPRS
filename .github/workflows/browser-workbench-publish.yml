name: Browser Playground Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact validated Playground subtree
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-playground-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-validation:
    uses: ./.github/workflows/browser-workbench.yml
    permissions:
      contents: read
  publish:
    # Serialize all writes to the shared gh-pages branch with both docs publishers.
    concurrency:
      group: quprs-gh-pages-publish
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: browser-validation
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          name: tested-browser-site
          path: browser-site
      - name: Verify existing Pages configuration
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-config.json"
          python3 - "$RUNNER_TEMP/pages-config.json" <<'PYCODE'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['build_type']=='legacy' and p['source']=={'branch':'gh-pages','path':'/'}, 'Expected existing gh-pages root publishing; no settings were changed'
          PYCODE
          echo "PAGES_BASE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" >> "$GITHUB_ENV"
      - name: Publish only the reviewed playground subtree
        run: |
          set -euo pipefail
          test "$(cat browser-site/source-sha.txt)" = '${{ github.sha }}'
          python3 source/scripts/web/stage-pages.py browser-site pages
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m 'Deploy validated browser workbench'
            # A concurrent docs publication causes a normal non-fast-forward rejection.
            git -C pages push origin HEAD:gh-pages
          fi
          echo 'Published playground/; existing root, docs and previews preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Request and verify the actual Pages build
        run: |
          set -euo pipefail
          # GITHUB_TOKEN branch pushes alone do not trigger Pages builds.
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .url)
          built=false
          for attempt in $(seq 1 40); do
            status=$(gh api "$build_url" --jq .status)
            if [ "$status" = built ]; then built=true; break; fi
            if [ "$status" = errored ]; then gh api "$build_url"; exit 1; fi
            sleep 15
          done
          test "$built" = true
          base="${PAGES_BASE%/}/playground"
          matched=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "$base/source-sha.txt?verify=${{ github.sha }}" -o "$RUNNER_TEMP/public-sha.txt" && test "$(cat "$RUNNER_TEMP/public-sha.txt")" = '${{ github.sha }}'; then matched=true; break; fi
            sleep 10
          done
          test "$matched" = true
          for file in index.html app.js worker.js pkg/quprs_web_bg.wasm engines/gpmc.wasm; do
            curl --fail --silent --show-error --max-time 30 "$base/$file?verify=${{ github.sha }}" -o "$RUNNER_TEMP/public-asset"
            test "$(sha256sum "$RUNNER_TEMP/public-asset" | cut -d' ' -f1)" = "$(sha256sum "browser-site/$file" | cut -d' ' -f1)"
          done
          echo "Verified published workbench: $base/" >> "$GITHUB_STEP_SUMMARY"
