name: Experimental CNF weight boundary

# Branch-only bounded experimental CI, not a release gate.
on:
  push:
    branches: [experiment/cnf-weight-parity-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnf-boundary-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-parity-and-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: cnf-weight-bounded-experiment
      - name: Native dependencies and stand-alone reference math
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev cmake zlib1g-dev
          python -m pip install mpmath
      - name: Exact Gaussian-integer CNF source-structure oracle
        run: |
          mkdir -p "$RUNNER_TEMP/cnf-study"
          python scripts/experiments/cnf_semantic_probe.py --rounds 1200 \
            --json "$RUNNER_TEMP/cnf-study/semantic.json" \
            | tee "$RUNNER_TEMP/cnf-study/semantic.stdout"
      - name: Phase-to-weight precision and bounded cost
        run: |
          python scripts/experiments/weight_boundary_probe.py --rounds 120 \
            --json "$RUNNER_TEMP/cnf-study/weight-reference.json" \
            | tee "$RUNNER_TEMP/cnf-study/weight-reference.stdout"
          python scripts/experiments/weight_boundary_probe.py --rounds 12 \
            benchmarks/MQTBench/graphstate_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/graphstate_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            --json "$RUNNER_TEMP/cnf-study/weight-qasm-angle-proxy.json" \
            | tee "$RUNNER_TEMP/cnf-study/weight-qasm-angle-proxy.stdout"
      - name: Real native Rust free-pathvar correctness and matched-host encoder cost
        run: |
          set -o pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            experiment_free_var_contract -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/cnf-study/native-rust.log"
      - name: Native Rust source-to-35-digit weight A/B experiment
        run: |
          set -o pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            experimental_rust_weight_boundary -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/cnf-study/native-weight-boundary.log"
      - name: Native MPFR source-weight bridge and same-runner A/B
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/experimental-mpfr-lib"
          cc -std=c11 -O2 -Wall -Wextra -Werror=implicit-function-declaration -c scripts/experiments/mpfr_weight_bridge.c \
            -o "$RUNNER_TEMP/experimental-mpfr-lib/bridge.o"
          ar rcs "$RUNNER_TEMP/experimental-mpfr-lib/libquprs_exp_mpfr.a" \
            "$RUNNER_TEMP/experimental-mpfr-lib/bridge.o"
          RUSTFLAGS="-L native=$RUNNER_TEMP/experimental-mpfr-lib -l mpfr -l gmp" \
            cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
              --features mpfr-experiment experimental_native_mpfr -- --nocapture \
              2>&1 | tee "$RUNNER_TEMP/cnf-study/mpfr-native-weight.log"
      - name: Native real-algorithm CNF weights -> single GPMC solve A/B
        run: |
          set -o pipefail
          sudo apt-get install -y time
          RUSTFLAGS="-L native=$RUNNER_TEMP/experimental-mpfr-lib -l mpfr -l gmp" \
            cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
              --features mpfr-experiment experimental_end_to_end_algorithm_weight_ab \
              -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cnf-study/mpfr-end-to-end.log"
      - name: Higher-weight independent-oracle circuit A/B
        run: |
          set -o pipefail
          RUSTFLAGS="-L native=$RUNNER_TEMP/experimental-mpfr-lib -l mpfr -l gmp" \
            cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
              --features mpfr-experiment experimental_end_to_end_multi_phase_ab \
              -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cnf-study/mpfr-e2e-multi.log"
      - name: Bounded compiled-variant real circuit A/B
        run: |
          set -o pipefail
          failed=0
          for case in grover4 qaoa7 graphstate16 qft16; do
            echo "EXPERIMENT_COMPILED_START case=$case"
            set +e
            timeout -k 5s 75s env \
              QUPRS_E2E_COMPILED_CASE="$case" \
              RUSTFLAGS="-L native=$RUNNER_TEMP/experimental-mpfr-lib -l mpfr -l gmp" \
              cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
                --features mpfr-experiment experimental_end_to_end_compiled_ab \
                -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cnf-study/mpfr-compiled-$case.log"
            rc=$?
            set -e
            echo "EXPERIMENT_COMPILED_EXIT case=$case code=$rc"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Production Python SymEngine precision and actual solver parity
        run: |
          set -o pipefail
          python -m pip install -e . "pytest>=8,<9" mpmath
          python scripts/profile_wmc_weight_precision.py --samples 48 --repeats 5 \
            --json-file "$RUNNER_TEMP/cnf-study/symengine-weight-profile.json" \
            | tee "$RUNNER_TEMP/cnf-study/symengine-weight-profile.stdout"
          python scripts/experiments/public_solver_parity_probe.py \
            --json "$RUNNER_TEMP/cnf-study/public-solver-parity.json" \
            | tee "$RUNNER_TEMP/cnf-study/public-solver-parity.stdout"
          python -m pytest -q \
            test/test_v0140_source_weight_oracle.py \
            test/test_v0140_exact_printed_cnf.py \
            test/test_wmc_distance_single_pass.py \
            --junitxml="$RUNNER_TEMP/cnf-study/printed-cnf-oreacle-junit.xml" \
            | tee "$RUNNER_TEMP/cnf-study/printed-cnf-oracle.stdout"
      - name: Public distance boundary and unknown controls
        run: |
          set -o pipefail
          python scripts/experiments/public_distance_boundary_probe.py \
            --out "$RUNNER_TEMP/cnf-study/public-boundary.json" \
            2>&1 | tee "$RUNNER_TEMP/cnf-study/public-boundary.stdout"
      - name: Public compiled small-unitary Python/Rust parity diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          failed=0
          for case in grover4 qaoa7; do
            for backend in python rust; do
              set +e
              timeout -k 5s 65s python scripts/experiments/public_compiled_precision_parity.py \
                --case "$case" --backend "$backend" \
                --out "$RUNNER_TEMP/cnf-study/public-compiled-$case-$backend.json" \
                2>&1 | tee "$RUNNER_TEMP/cnf-study/public-compiled-$case-$backend.stdout"
              code=$?
              set -e
              echo "PUBLIC_COMPILED_EXIT case=$case backend=$backend code=$code"
              if [ "$code" -ne 0 ]; then failed=1; fi
            done
          done
          exit "$failed"
      - name: Opt-in production-path Rust high-precision compile and underflow guard
        run: |
          set -o pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            --features high-precision-gpmc native_source_exact_clifford_and_underflow_control \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cnf-study/production-path-native-precise.stdout"
      - name: Opt-in precision Rust/PyO3 public API scientific gate
        run: |
          set -o pipefail
          python -m pip install maturin
          mkdir -p "$RUNNER_TEMP/cnf-study/precise-wheels"
          maturin build --release --features high-precision-gpmc \
            --out "$RUNNER_TEMP/cnf-study/precise-wheels"
          python -m pip install --no-deps --force-reinstall \
            "$RUNNER_TEMP/cnf-study/precise-wheels/"*.whl
          for case in grover4 qaoa7; do
            python scripts/experiments/public_compiled_precision_parity.py \
              --case "$case" --backend rust \
              --out "$RUNNER_TEMP/cnf-study/highprecision-public-$case-rust.json"
          done
          python scripts/experiments/public_distance_boundary_probe.py --strict \
            --out "$RUNNER_TEMP/cnf-study/highprecision-public-boundary.json"
      - name: Recheck packaged Python/Rust GPMC/Ganak parity with precision feature
        run: |
          set -o pipefail
          python scripts/experiments/public_solver_parity_probe.py \
            --json "$RUNNER_TEMP/cnf-study/feature-enabled-solver-parity.json" \
            | tee "$RUNNER_TEMP/cnf-study/feature-enabled-solver-parity.stdout"
      - name: Single-solve original GPMC and Ganak printed-precision audit
        run: |
          set -o pipefail
          python scripts/experiments/solver_stdout_precision_probe.py \
            --json "$RUNNER_TEMP/cnf-study/solver-stdout-precision.json" \
            | tee "$RUNNER_TEMP/cnf-study/solver-stdout-precision.stdout"
      - name: Independent matrix and QCEC source/compiled oracle
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/qcec-independent-venv"
          "$RUNNER_TEMP/qcec-independent-venv/bin/python" -m pip install \
            "mqt-qcec==3.11.0" "qiskit>=2.1,<3" numpy
          failed=0
          for case in grover4 qaoa7 graphstate16 qft16; do
            echo "EXPERIMENT_INDEPENDENT_BEGIN case=$case"
            set +e
            timeout -k 5s 75s \
              "$RUNNER_TEMP/qcec-independent-venv/bin/python" \
              scripts/experiments/compiled_pair_independent_oracle.py \
              --case "$case" \
              --out "$RUNNER_TEMP/cnf-study/independent-$case.json" \
              2>&1 | tee "$RUNNER_TEMP/cnf-study/independent-$case.stdout"
            rc=$?
            set -e
            echo "EXPERIMENT_INDEPENDENT_EXIT case=$case code=$rc"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: QFT16 non-dense independent statevector and QCEC compilation crosscheck
        run: |
          set -o pipefail
          timeout -k 5s 120s \
            "$RUNNER_TEMP/qcec-independent-venv/bin/python" \
            scripts/experiments/qft16_statevector_independent_probe.py \
            2>&1 | tee "$RUNNER_TEMP/cnf-study/qft16-independent-statevectors.stdout"
          if test -f /tmp/quprs-qft16-independent-statevectors.json; then
            cp /tmp/quprs-qft16-independent-statevectors.json \
              "$RUNNER_TEMP/cnf-study/qft16-independent-statevectors.json"
          fi
      - name: Upload bounded experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnf-weight-boundary-evidence
          path: ${{ runner.temp }}/cnf-study/
          if-no-files-found: warn
          retention-days: 7

  macos-native-wheel-smoke:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS native dependencies
        run: |
          brew install gmp mpfr cmake pkg-config
          python -m pip install maturin
      - name: Source-exact native MPFR check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfr-lib"
          cc -std=c11 -O2 -Wall -Wextra -Werror=implicit-function-declaration \
            -I"$(brew --prefix mpfr)/include" -I"$(brew --prefix gmp)/include" \
            -c scripts/experiments/mpfr_weight_bridge.c \
            -o "$RUNNER_TEMP/mpfr-lib/bridge.o"
          ar rcs "$RUNNER_TEMP/mpfr-lib/libquprs_exp_mpfr.a" "$RUNNER_TEMP/mpfr-lib/bridge.o"
          export PKG_CONFIG_PATH="$(brew --prefix mpfr)/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig"
          export RUSTFLAGS="-L native=$RUNNER_TEMP/mpfr-lib -L native=$(brew --prefix mpfr)/lib -L native=$(brew --prefix gmp)/lib -l mpfr -l gmp"
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            --features mpfr-experiment \
            experimental_native_mpfr_precision_and_exact_clifford_fast_path -- --nocapture
      - name: macOS wheel build smoke
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels"
          python - <<'PY'
          import os,pathlib,zipfile
          wheels=list((pathlib.Path(os.environ["RUNNER_TEMP"])/"wheels").glob("*.whl"))
          assert len(wheels)==1,wheels
          with zipfile.ZipFile(wheels[0]) as f:
              assert any("_pathsum_rust" in p for p in f.namelist())
          print("MACOS_WHEEL_STRUCTURE_PASS",wheels[0].name)
          PY

      - name: macOS opt-in production-path precision wheel build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix mpfr)/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig"
          mkdir -p "$RUNNER_TEMP/precision-wheels"
          maturin build --release --features high-precision-gpmc \
            --out "$RUNNER_TEMP/precision-wheels"
          python - <<'PY'
          import os,pathlib,zipfile
          w=list((pathlib.Path(os.environ["RUNNER_TEMP"])/"precision-wheels").glob("*.whl"))
          assert len(w)==1,w
          with zipfile.ZipFile(w[0]) as z:
              assert any("_pathsum_rust" in x for x in z.namelist())
          print("MACOS_PRECISE_WHEEL_STRUCTURE_PASS",w[0].name)
          PY
      - name: Repair and clean-install opt-in macOS wheel, then run a real GPMC check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "delocate>=0.13,<1"
          mkdir -p "$RUNNER_TEMP/portable-wheels"
          delocate-wheel -v -w "$RUNNER_TEMP/portable-wheels" \
            "$RUNNER_TEMP/precision-wheels/"*.whl
          python - <<'PY'
          import os,pathlib,zipfile,subprocess,tempfile
          wheels=list((pathlib.Path(os.environ["RUNNER_TEMP"])/"portable-wheels").glob("*.whl"))
          assert len(wheels)==1,wheels
          with zipfile.ZipFile(wheels[0]) as z:
              files=[p for p in z.namelist()
                     if (p.endswith(".so") and "_pathsum_rust" in p)
                     or p.endswith(".dylib")]
              assert any("_pathsum_rust" in f for f in files)
              with tempfile.TemporaryDirectory() as tmp:
                  for name in files:
                      dest=pathlib.Path(tmp)/name
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(name))
                      linked=subprocess.run(["otool","-L",str(dest)],
                          capture_output=True,text=True,check=True).stdout
                      assert "/opt/homebrew/" not in linked, (name,linked)
          print("MACOS_PRECISE_WHEEL_RELOCATABLE_DEPENDENCIES_PASS")
          PY
          python -m venv "$RUNNER_TEMP/portable-venv"
          "$RUNNER_TEMP/portable-venv/bin/python" -m pip install --no-cache-dir \
            "$RUNNER_TEMP/portable-wheels/"*.whl
          "$RUNNER_TEMP/portable-venv/bin/python" - <<'PY'
          import QuPRS
          from QuPRS import check_equivalence
          lhs='OPENQASM 2.0;\ninclude "qelib1.inc";\nqreg q[1];\n'
          rhs=lhs+'rz(0.0000000201) q[0];\n'
          result=check_equivalence(lhs,rhs,method="wmc_only",
              strategy="Naive",tool_name="gpmc",backend="rust",
              approximate_distance_tolerance=1e-8,timeout=30)
          assert result.equivalent=="not_equivalent",result.equivalent
          assert result.wmc_solver_invoked
          print("MACOS_PRECISE_PORTABLE_WHEEL_PUBLIC_GPMC_PASS",result.equivalent)
          PY
