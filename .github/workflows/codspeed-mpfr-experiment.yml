name: Experimental MPFR CodSpeed

on:
  push:
    branches: [experiment/cnf-weight-parity-20261030]
    paths:
      - 'rust/pathsum/src/experimental_mpfr_bridge.rs'
      - 'rust/pathsum/src/wmc.rs'
      - 'scripts/experiments/test_codspeed_mpfr.py'
      - '.github/workflows/codspeed-mpfr-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: experiment-mpfr-codspeed
  cancel-in-progress: true

jobs:
  native-mpfr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: codspeed-mpfr-experiment
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev time
          python -m pip install "pytest>=8,<9" pytest-codspeed
      - name: Prebuild native test binary and MPFR outside all measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfr-lib"
          cc -std=c11 -O2 -Wall -Wextra -Werror=implicit-function-declaration \
            -c scripts/experiments/mpfr_weight_bridge.c \
            -o "$RUNNER_TEMP/mpfr-lib/bridge.o"
          ar rcs "$RUNNER_TEMP/mpfr-lib/libquprs_exp_mpfr.a" "$RUNNER_TEMP/mpfr-lib/bridge.o"
          cc -std=c11 -O2 -fPIC -shared scripts/experiments/mpfr_weight_bridge.c \
            -o "$RUNNER_TEMP/mpfr-lib/libquprs_cpu_weights.so" -lmpfr -lgmp -lm
          echo "QUPRS_CODSPEED_NATIVE_LIB=$RUNNER_TEMP/mpfr-lib/libquprs_cpu_weights.so" >> "$GITHUB_ENV"
          export RUSTFLAGS="-L native=$RUNNER_TEMP/mpfr-lib -l mpfr -l gmp"
          cargo test --locked --release --lib --no-run --message-format=json \
            --manifest-path rust/Cargo.toml -p pathsum --features mpfr-experiment \
            > "$RUNNER_TEMP/mpfr-test-artifacts.json"
          python - <<'PY'
          import json, os
          log = os.path.join(os.environ["RUNNER_TEMP"], "mpfr-test-artifacts.json")
          binaries = []
          for line in open(log):
              try: event = json.loads(line)
              except json.JSONDecodeError: continue
              if event.get("reason") != "compiler-artifact": continue
              target = event["target"]
              if target["name"] == "pathsum" and "lib" in target["kind"]:
                  if event.get("executable"): binaries.append(event["executable"])
          if len(binaries) != 1: raise SystemExit(f"unexpected test artifacts: {binaries}")
          binary = binaries[0]
          if not os.path.isfile(binary): raise SystemExit(f"test binary missing: {binary}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"QUPRS_CODSPEED_BINARY={binary}\n")
          print("Pinned native test executable", binary)
          PY
      - name: CodSpeed Simulation - in-process native phase weight kernel
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          simulation-track-subprocess: 'false'
          run: pytest -q scripts/experiments/test_codspeed_mpfr.py --codspeed -k test_inprocess_phase_weight_cpu
      - name: CodSpeed WallTime - complete native GPMC paths
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: pytest -q scripts/experiments/test_codspeed_mpfr.py --codspeed -k test_gpmc_end_to_end_walltime --codspeed-max-rounds=6 --codspeed-max-time=4
