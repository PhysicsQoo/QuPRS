name: CodSpeed three-shard controlled trial

on:
  pull_request:
    branches: [dev]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  balanced-three-shard:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 131 && github.event.label.name == 'ci-codspeed-three-shard') }}
    name: Trial CPU Simulation weighted 3-shard (${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0, 1, 2]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Checkout source and Solver submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Native compiler requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Cache solver binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build exact source, same release profile as default
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          pip install pytest-shard
      - name: Require exact 32 node IDs with no duplicate or missing case
        if: matrix.shard_id == 0
        run: |
          python scripts/check_codspeed_three_shards.py
          python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"
      - name: Collect matching CodSpeed v5 Simulation with weighted allocation
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'false'
          run: python -m pytest test/test_Feynman.py test/test_MQT.py --codspeed -p scripts.codspeed_three_shards --weighted-shard-id ${{ matrix.shard_id }}
