name: CodSpeed

on:
  # Retain baselines on both maintained branches: the default release branch
  # and the integration branch used as the target for feature/fix PRs.
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/_benchmark_*.py'
      - 'rust/**'
      - 'GPMC'           # Solver submodule revision affects measured workloads.
      - 'benchmarks/**'  # Benchmark fixtures and inputs are performance-sensitive.
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
      - 'scripts/check_codspeed_shards.py'
      - 'test/test_codspeed_qasm261_simulation_additive.py'
  # Cheap source-impact admission protects the complete CodSpeed suite from
  # CI-only/docs-only PRs. Keep edited for explicit PR-body scientific pilots;
  # workflow_dispatch remains the general manual pilot entrypoint.
  # Do NOT re-trigger the same SHA merely because a draft PR becomes ready.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pilot_only:
        description: 'Run bounded candidate pilot only, without regular 32+7+11 CI'
        type: boolean
        required: false
        default: false
      pilot_group:
        description: 'Select legacy eight or seven new paper-gap cases'
        type: choice
        required: false
        default: legacy_eight
        options: [legacy_eight, paper_gap]
      include_python_core:
        description: 'Add opt-in pure Python core CodSpeed microbenchmark'
        type: boolean
        required: false
        default: false
      base_sha:
        description: 'Manual paired source baseline'
        required: false
        type: string
      include_solver_cpu:
        type: boolean
        required: false
        default: false
      include_rust_memory:
        type: boolean
        required: false
        default: false
      include_cross_method:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'pilot-control' || 'regular' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  ci-impact:
    name: Incremental CI impact / codspeed.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.source_scope.outputs.run_source == 'true' && steps.resolve.outputs.run_heavy == 'true' }}
      reused_run_id: ${{ steps.resolve.outputs.reused_run_id }}
      measured_head_sha: ${{ steps.resolve.outputs.measured_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run incremental routing and source-impact negative contracts
        run: |
          node .github/scripts/test-ci-impact-reuse.cjs
          node .github/scripts/test-codspeed-pr-impact.cjs
      - id: source_scope
        name: Require performance-bearing source changes before recurring measurement
        uses: actions/github-script@v7
        with:
          script: |
            const { isPerformanceBearingPath } = require('./.github/scripts/codspeed-pr-impact.cjs');
            const { VERSION_PATHS, isVersionOnlyChange } = require('./.github/scripts/codspeed-metadata-only.cjs');
            if (context.eventName !== 'pull_request') {
              core.setOutput('run_source', 'true');
              return;
            }
            try {
              const pull = context.payload.pull_request;
              if (!pull || !Number.isInteger(pull.changed_files)) throw new Error('Missing changed-files count');
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pull.number, per_page: 100
              });
              if (files.length !== pull.changed_files) throw new Error('Incomplete PR changed-files listing');
              // GitHub partial diff hunks cannot certify Cargo.lock contents.
              // Fetch the complete source at exact PR base/HEAD SHA; missing
              // evidence, unexpected file types and API failures mean RUN.
              const loadFile = async (path, ref) => {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path, ref
                });
                const file = response.data;
                if (!file || Array.isArray(file) || file.type !== 'file' ||
                    file.encoding !== 'base64' || typeof file.content !== 'string' ||
                    file.size > 150000) throw new Error(`Unverifiable release source: ${path}`);
                return Buffer.from(file.content, 'base64').toString('utf8');
              };
              let hit = null;
              const releaseVersions = [];
              for (const f of files) {
                if (!isPerformanceBearingPath(f.filename) &&
                    !(f.previous_filename && isPerformanceBearingPath(f.previous_filename))) continue;
                if (f.status !== 'modified' || f.previous_filename ||
                    !VERSION_PATHS.has(f.filename)) {hit = f; break;}
                const before = await loadFile(f.filename, pull.base.sha);
                const after = await loadFile(f.filename, pull.head.sha);
                const version = isVersionOnlyChange(f.filename, before, after);
                if (!version) {hit = f; break;}
                releaseVersions.push({path:f.filename, ...version});
              }
              if (!hit && releaseVersions.length && !releaseVersions.every(
                x => x.before === releaseVersions[0].before &&
                     x.after === releaseVersions[0].after
              )) hit = {filename:'inconsistent release metadata versions'};
              core.setOutput('run_source', String(Boolean(hit)));
              core.info(hit
                ? `CodSpeed source-bearing change: ${hit.filename}`
                : releaseVersions.length
                  ? `Verified metadata-only ${releaseVersions[0].before} -> ${releaseVersions[0].after} across ${releaseVersions.map(x => x.path).join(', ')}; skip expensive CodSpeed, preserve correctness/packaging CI.`
                  : 'No source/solver/benchmark or measurement configuration changes; skip expensive recurring CodSpeed.');
            } catch (error) {
              core.warning(`CodSpeed impact lookup failed closed: ${error.message || error}`);
              core.setOutput('run_source', 'true');
            }
      - id: resolve
        if: ${{ steps.source_scope.outputs.run_source == 'true' }}
        name: Validate source and successful previous CI evidence
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./.github/scripts/ci-impact-reuse.cjs');
            await resolve({
              github, context, core,
              workflowFile: 'codspeed.yml',
              requiredJobs: [{"prefix":"Run benchmarks (3.12, ","count":5},{"name":"Same SHA native Rust CPU","count":1},{"name":"Paired Solver-inclusive CodSpeed WallTime","count":1},{"name":"Per-SHA CodSpeed cross-instrument evidence","count":1}]
            });

  codspeed:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' && github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        shard_id: [0, 1, 2, 3, 4] 
        num_shards: [5]
    env:
      BINARY_DIR: src/QuPRS/utils
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/simulation-${{ matrix.shard_id }}.json
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools 
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
          pip install pytest-shard

      - name: Verify all five benchmark shards and paper input integrity (shard 0)
        if: matrix.shard_id == 0
        run: |
          python scripts/check_codspeed_shards.py
          python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"

      - name: Verify exact HEAD source
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # v5 estimates CPU cycles rather than the pre-v5 simulation metric.
          # Do not compare v5 reports against pre-v5 measurements.
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          # Evaluate solver subprocess instrumentation independently.
          simulation-track-subprocess: 'false'
          run: pytest test/test_Feynman.py test/test_MQT.py benchmarks/codspeed/test_mqt_qasm261_simulation.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }}

      - name: Save original Simulation measurement and SHA
        run: |
          python scripts/write_codspeed_sha_manifest.py --sha "$HEAD_SHA" --family simulation-shard --instrument simulation --shard ${{ matrix.shard_id }} --measurement "$QUPRS_CODSPEED_EXPORT" --output "$RUNNER_TEMP/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-simulation-${{ matrix.shard_id }}
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14

  pr-solver-inclusive-walltime:
    needs: [ci-impact]
    name: Paired Solver-inclusive CodSpeed WallTime
    # Unlike CPU Simulation, measure complete verifier + GPMC/Ganak elapsed time.
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' && github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout PR HEAD with benchmark harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact PR base on the SAME runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          submodules: recursive
          persist-credentials: false
          path: pr-walltime-base

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build independent base and head verifier environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C pr-walltime-base rev-parse HEAD)" = "$BASE_SHA"
          for variant in base head; do
            if [[ "$variant" == base ]]; then
              source_root="$GITHUB_WORKSPACE/pr-walltime-base"
            else
              source_root="$GITHUB_WORKSPACE"
            fi
            venv="$RUNNER_TEMP/quprs-pr-walltime-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (
              cd "$source_root"
              VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev
            )
            "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/pr-walltime-$variant-freeze.txt"
          done
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
          {
            echo "### PR CodSpeed WallTime provenance"
            echo "- Base SHA: $BASE_SHA"
            echo "- Head SHA: $HEAD_SHA"
            echo "- Base GPMC submodule: $(git -C pr-walltime-base rev-parse HEAD:GPMC)"
            echo "- Head GPMC submodule: $(git rev-parse HEAD:GPMC)"
            echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WallTime case inventory
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pytest benchmarks/codspeed/test_pr_solver_walltime.py --collect-only -q

      - name: CodSpeed paired end-to-end GPMC/Ganak WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ${{ runner.temp }}/quprs-pr-walltime-head/bin/python -m pytest benchmarks/codspeed/test_pr_solver_walltime.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=10

      - name: Independent four-qubit source oracle for Ganak print limits
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" \
            scripts/check_codspeed_source_oracle.py \
            --fixture-root "$GITHUB_WORKSPACE" --head-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/quprs-source-oracle.json"

      - name: Pair measured CodSpeed WallTime and audit Solver semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_paired_walltime.py \
            --measurements "$RUNNER_TEMP/quprs-paired-walltime-codspeed.json" \
            --provenance "$RUNNER_TEMP/quprs-paired-walltime-provenance.jsonl" \
            --source-oracle "$RUNNER_TEMP/quprs-source-oracle.json" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --markdown paired-walltime-report.md \
            --json paired-walltime-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: P5 non-certifying CodSpeed WallTime sampling audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_variance_gate.py \
            --paired-report paired-walltime-report.json \
            --output paired-walltime-sampling.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload pinned dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-codspeed-walltime-provenance
          path: |
            ${{ runner.temp }}/pr-walltime-base-freeze.txt
            ${{ runner.temp }}/pr-walltime-head-freeze.txt
            ${{ runner.temp }}/quprs-paired-walltime-codspeed.json
            ${{ runner.temp }}/quprs-paired-walltime-provenance.jsonl
            ${{ runner.temp }}/quprs-source-oracle.json
            paired-walltime-report.md
            paired-walltime-report.json
            paired-walltime-sampling.json
          if-no-files-found: ignore
          retention-days: 14


  native-core:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' && github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    name: Same SHA native Rust CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare source-pinned Cargo benchmark
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          cargo install --locked --version 6.0.0 cargo-codspeed
          cd benchmarks/rust_core
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo codspeed build
      - name: CodSpeed Rust CPU
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run
      - name: Record exact native source and expected versioned identities
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family rust-core --instrument simulation \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-rust-core-simulation
          path: |
            ${{ runner.temp }}/manifest.json
            benchmarks/rust_core/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  native-memory:
    name: Same SHA native Rust Memory (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_rust_memory }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare source-pinned memory benchmark
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          cargo install --locked --version 6.0.0 cargo-codspeed
          cd benchmarks/rust_core
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo codspeed build
      - name: CodSpeed Rust Memory
        uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: cd benchmarks/rust_core && cargo codspeed run
      - name: Record memory source
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family rust-core --instrument memory \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-rust-core-memory
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  solver-inclusive-cpu:
    name: Same SHA Solver subprocess CPU (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_solver_cpu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/solver-cpu.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build exact source and solver instrumentation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-codspeed==5.0.3
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Measure verifier plus Solver CPU
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          run: python -m pytest test/test_codspeed_solver_cpu.py -q --codspeed
      - name: Record same SHA subprocess CPU evidence
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family solver-cpu --instrument simulation \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-solver-cpu
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  cross-validate:
    name: Per-SHA CodSpeed cross-instrument evidence
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' && always() && github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    needs: [ci-impact, codspeed, pr-solver-inclusive-walltime, native-core, native-memory, solver-inclusive-cpu, cross-method, python-core]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
      SOLVER_CPU: ${{ github.event_name == 'workflow_dispatch' && inputs.include_solver_cpu }}
      RUST_MEMORY: ${{ github.event_name == 'workflow_dispatch' && inputs.include_rust_memory }}
      CROSS_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.include_cross_method }}
      PYTHON_CORE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_python_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require each selected experiment on exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "${{ needs.codspeed.result }}" = success
          test "${{ needs.native-core.result }}" = success
          if [[ -n "$BASE_SHA" ]]; then
            test "${{ needs.pr-solver-inclusive-walltime.result }}" = success
          fi
          if [[ "$SOLVER_CPU" == true ]]; then
            test "${{ needs.solver-inclusive-cpu.result }}" = success
          fi
          if [[ "$RUST_MEMORY" == true ]]; then
            test "${{ needs.native-memory.result }}" = success
          fi
          if [[ "$CROSS_METHOD" == true ]]; then
            test "${{ needs.cross-method.result }}" = success
          fi
          if [[ "$PYTHON_CORE" == true ]]; then
            test "${{ needs.python-core.result }}" = success
          fi
      - name: Download original current-run instrument results
        uses: actions/download-artifact@v4
        with:
          pattern: quprs-sha-*
          path: cross-evidence
          merge-multiple: false
      - name: Download current-run Solver-inclusive report
        if: ${{ env.BASE_SHA != '' }}
        uses: actions/download-artifact@v4
        with:
          name: paired-codspeed-walltime-provenance
          path: cross-evidence/walltime-report
      - name: Check exact SHA, five shards, native core, and Solver verdict
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$SOLVER_CPU" == true ]]; then flags+=(--require-solver-cpu); fi
          if [[ "$RUST_MEMORY" == true ]]; then flags+=(--require-memory); fi
          if [[ "$CROSS_METHOD" == true ]]; then flags+=(--require-cross-method); fi
          if [[ "$PYTHON_CORE" == true ]]; then flags+=(--require-python-core); fi
          python scripts/report_codspeed_cross_instrument.py \
            --artifacts cross-evidence --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" --output cross-instrument-report.json \
            --summary "$GITHUB_STEP_SUMMARY" "${flags[@]}"
      - name: Preserve complete cross-instrument audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quprs-cross-instrument-audit
          path: cross-instrument-report.json
          if-no-files-found: warn
          retention-days: 14


  cross-method:
    name: Same SHA expanded cross-method ${{ matrix.mode }} (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_cross_method && inputs.base_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    env:
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/cross-method-${{ matrix.mode }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
