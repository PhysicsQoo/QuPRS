name: CodSpeed

on:
  # Retain baselines on both maintained branches: the default release branch
  # and the integration branch used as the target for feature/fix PRs.
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/_benchmark_*.py'
      - 'rust/**'
      - 'GPMC'           # Solver submodule revision affects measured workloads.
      - 'benchmarks/**'  # Benchmark fixtures and inputs are performance-sensitive.
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
      - 'scripts/check_codspeed_shards.py'
  # Run on code-affecting PRs, including feat/fix -> dev and dev -> main.
  # No hard percentage regression gate: CI job success is not no-regression proof.
  pull_request:
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/_benchmark_*.py'
      - 'rust/**'
      - 'GPMC'           # Solver submodule revision affects measured workloads.
      - 'benchmarks/**'  # Benchmark fixtures and inputs are performance-sensitive.
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
      - 'scripts/check_codspeed_shards.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify_shard_coverage:
    name: Verify CodSpeed five-shard coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install same collection environment as CodSpeed
        run: |
          python -m pip install --upgrade pip maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
          python -m pip install pytest-shard
      - name: Prove shard union, disjointness and nonempty collection
        run: python scripts/check_codspeed_shards.py
      - name: Verify benchmark input integrity
        run: python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"

  codspeed:
    name: Run benchmarks
    needs: verify_shard_coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        shard_id: [0, 1, 2, 3, 4] 
        num_shards: [5]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools 
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
          pip install pytest-shard

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # v5 estimates CPU cycles rather than the pre-v5 simulation metric.
          # Do not compare v5 reports against pre-v5 measurements.
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          # Evaluate solver subprocess instrumentation independently.
          simulation-track-subprocess: 'false'
          run: pytest test/test_Feynman.py test/test_MQT.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }}