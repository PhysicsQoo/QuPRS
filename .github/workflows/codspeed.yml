name: CodSpeed

on:
  # Retain baselines on both maintained branches: the default release branch
  # and the integration branch used as the target for feature/fix PRs.
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/_benchmark_*.py'
      - 'rust/**'
      - 'GPMC'           # Solver submodule revision affects measured workloads.
      - 'benchmarks/**'  # Benchmark fixtures and inputs are performance-sensitive.
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
      - 'scripts/check_codspeed_shards.py'
  # Always run BOTH Simulation and paired Solver-inclusive WallTime on PRs.
  # CI job success means evidence was collected, not proof of no regression.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        shard_id: [0, 1, 2, 3, 4] 
        num_shards: [5]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools 
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
          pip install pytest-shard

      - name: Verify all five benchmark shards and paper input integrity (shard 0)
        if: matrix.shard_id == 0
        run: |
          python scripts/check_codspeed_shards.py
          python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # v5 estimates CPU cycles rather than the pre-v5 simulation metric.
          # Do not compare v5 reports against pre-v5 measurements.
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          # Evaluate solver subprocess instrumentation independently.
          simulation-track-subprocess: 'false'
          run: pytest test/test_Feynman.py test/test_MQT.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }}

  pr-solver-inclusive-walltime:
    name: Paired Solver-inclusive CodSpeed WallTime
    # Unlike CPU Simulation, measure complete verifier + GPMC/Ganak elapsed time.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR HEAD with benchmark harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact PR base on the SAME runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: recursive
          persist-credentials: false
          path: pr-walltime-base

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build independent base and head verifier environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C pr-walltime-base rev-parse HEAD)" = "$BASE_SHA"
          for variant in base head; do
            if [[ "$variant" == base ]]; then
              source_root="$GITHUB_WORKSPACE/pr-walltime-base"
            else
              source_root="$GITHUB_WORKSPACE"
            fi
            venv="$RUNNER_TEMP/quprs-pr-walltime-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (
              cd "$source_root"
              VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev
            )
            "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/pr-walltime-$variant-freeze.txt"
          done
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
          {
            echo "### PR CodSpeed WallTime provenance"
            echo "- Base SHA: $BASE_SHA"
            echo "- Head SHA: $HEAD_SHA"
            echo "- Base GPMC submodule: $(git -C pr-walltime-base rev-parse HEAD:GPMC)"
            echo "- Head GPMC submodule: $(git rev-parse HEAD:GPMC)"
            echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WallTime case inventory
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pytest benchmarks/codspeed/test_pr_solver_walltime.py --collect-only -q

      - name: CodSpeed paired end-to-end GPMC/Ganak WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ${{ runner.temp }}/quprs-pr-walltime-head/bin/python -m pytest benchmarks/codspeed/test_pr_solver_walltime.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=10

      - name: Pair measured CodSpeed WallTime and audit Solver semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_paired_walltime.py \
            --measurements "$RUNNER_TEMP/quprs-paired-walltime-codspeed.json" \
            --provenance "$RUNNER_TEMP/quprs-paired-walltime-provenance.jsonl" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --markdown paired-walltime-report.md \
            --json paired-walltime-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload pinned dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-codspeed-walltime-provenance
          path: |
            ${{ runner.temp }}/pr-walltime-base-freeze.txt
            ${{ runner.temp }}/pr-walltime-head-freeze.txt
            ${{ runner.temp }}/quprs-paired-walltime-codspeed.json
            ${{ runner.temp }}/quprs-paired-walltime-provenance.jsonl
            paired-walltime-report.md
            paired-walltime-report.json
          if-no-files-found: ignore
          retention-days: 14
