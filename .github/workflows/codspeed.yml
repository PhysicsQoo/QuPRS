      - name: Build pinned base and HEAD environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C cross-method-base rev-parse HEAD)" = "$BASE_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          for variant in base head; do
            if [[ "$variant" == base ]]; then source="$GITHUB_WORKSPACE/cross-method-base"; else source="$GITHUB_WORKSPACE"; fi
            venv="$RUNNER_TEMP/cross-method-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
