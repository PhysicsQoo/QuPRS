name: CodSpeed

on:
  # Retain baselines on both maintained branches: the default release branch
  # and the integration branch used as the target for feature/fix PRs.
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'test/test_Feynman.py'
      - 'test/test_MQT.py'
      - 'test/conftest.py'
      - 'test/_benchmark_*.py'
      - 'rust/**'
      - 'GPMC'           # Solver submodule revision affects measured workloads.
      - 'benchmarks/**'  # Benchmark fixtures and inputs are performance-sensitive.
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
      - 'scripts/check_codspeed_shards.py'
  # Always run BOTH Simulation and paired Solver-inclusive WallTime on PRs.
  # CI job success means evidence was collected, not proof of no regression.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pilot_only:
        description: 'Run bounded candidate pilot only, without regular 32+7+11 CI'
        type: boolean
        required: false
        default: false
      include_python_core:
        description: 'Add opt-in pure Python core CodSpeed microbenchmark'
        type: boolean
        required: false
        default: false
      base_sha:
        description: 'Manual paired source baseline'
        required: false
        type: string
      include_solver_cpu:
        type: boolean
        required: false
        default: false
      include_rust_memory:
        type: boolean
        required: false
        default: false
      include_cross_method:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'pilot-control' || 'regular' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  codspeed:
    if: ${{ github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        shard_id: [0, 1, 2, 3, 4] 
        num_shards: [5]
    env:
      BINARY_DIR: src/QuPRS/utils
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/simulation-${{ matrix.shard_id }}.json
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools 
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
          pip install pytest-shard

      - name: Verify all five benchmark shards and paper input integrity (shard 0)
        if: matrix.shard_id == 0
        run: |
          python scripts/check_codspeed_shards.py
          python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"

      - name: Verify exact HEAD source
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # v5 estimates CPU cycles rather than the pre-v5 simulation metric.
          # Do not compare v5 reports against pre-v5 measurements.
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          # Evaluate solver subprocess instrumentation independently.
          simulation-track-subprocess: 'false'
          run: pytest test/test_Feynman.py test/test_MQT.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }}

      - name: Save original Simulation measurement and SHA
        run: |
          python scripts/write_codspeed_sha_manifest.py --sha "$HEAD_SHA" --family simulation-shard --instrument simulation --shard ${{ matrix.shard_id }} --measurement "$QUPRS_CODSPEED_EXPORT" --output "$RUNNER_TEMP/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-simulation-${{ matrix.shard_id }}
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14

  pr-solver-inclusive-walltime:
    name: Paired Solver-inclusive CodSpeed WallTime
    # Unlike CPU Simulation, measure complete verifier + GPMC/Ganak elapsed time.
    if: ${{ github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout PR HEAD with benchmark harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact PR base on the SAME runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          submodules: recursive
          persist-credentials: false
          path: pr-walltime-base

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build independent base and head verifier environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C pr-walltime-base rev-parse HEAD)" = "$BASE_SHA"
          for variant in base head; do
            if [[ "$variant" == base ]]; then
              source_root="$GITHUB_WORKSPACE/pr-walltime-base"
            else
              source_root="$GITHUB_WORKSPACE"
            fi
            venv="$RUNNER_TEMP/quprs-pr-walltime-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (
              cd "$source_root"
              VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev
            )
            "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/pr-walltime-$variant-freeze.txt"
          done
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
          {
            echo "### PR CodSpeed WallTime provenance"
            echo "- Base SHA: $BASE_SHA"
            echo "- Head SHA: $HEAD_SHA"
            echo "- Base GPMC submodule: $(git -C pr-walltime-base rev-parse HEAD:GPMC)"
            echo "- Head GPMC submodule: $(git rev-parse HEAD:GPMC)"
            echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WallTime case inventory
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pytest benchmarks/codspeed/test_pr_solver_walltime.py --collect-only -q

      - name: CodSpeed paired end-to-end GPMC/Ganak WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ${{ runner.temp }}/quprs-pr-walltime-head/bin/python -m pytest benchmarks/codspeed/test_pr_solver_walltime.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=10

      - name: Independent four-qubit source oracle for Ganak print limits
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" \
            scripts/check_codspeed_source_oracle.py \
            --fixture-root "$GITHUB_WORKSPACE" --head-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/quprs-source-oracle.json"

      - name: Pair measured CodSpeed WallTime and audit Solver semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_paired_walltime.py \
            --measurements "$RUNNER_TEMP/quprs-paired-walltime-codspeed.json" \
            --provenance "$RUNNER_TEMP/quprs-paired-walltime-provenance.jsonl" \
            --source-oracle "$RUNNER_TEMP/quprs-source-oracle.json" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --markdown paired-walltime-report.md \
            --json paired-walltime-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: P5 non-certifying CodSpeed WallTime sampling audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_variance_gate.py \
            --paired-report paired-walltime-report.json \
            --output paired-walltime-sampling.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload pinned dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-codspeed-walltime-provenance
          path: |
            ${{ runner.temp }}/pr-walltime-base-freeze.txt
            ${{ runner.temp }}/pr-walltime-head-freeze.txt
            ${{ runner.temp }}/quprs-paired-walltime-codspeed.json
            ${{ runner.temp }}/quprs-paired-walltime-provenance.jsonl
            ${{ runner.temp }}/quprs-source-oracle.json
            paired-walltime-report.md
            paired-walltime-report.json
            paired-walltime-sampling.json
          if-no-files-found: ignore
          retention-days: 14


  native-core:
    if: ${{ github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    name: Same SHA native Rust CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare source-pinned Cargo benchmark
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          cargo install --locked --version 6.0.0 cargo-codspeed
          cd benchmarks/rust_core
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo codspeed build
      - name: CodSpeed Rust CPU
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run
      - name: Record exact native source and expected versioned identities
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family rust-core --instrument simulation \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-rust-core-simulation
          path: |
            ${{ runner.temp }}/manifest.json
            benchmarks/rust_core/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  native-memory:
    name: Same SHA native Rust Memory (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_rust_memory }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare source-pinned memory benchmark
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          cargo install --locked --version 6.0.0 cargo-codspeed
          cd benchmarks/rust_core
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo codspeed build
      - name: CodSpeed Rust Memory
        uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: cd benchmarks/rust_core && cargo codspeed run
      - name: Record memory source
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family rust-core --instrument memory \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-rust-core-memory
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  solver-inclusive-cpu:
    name: Same SHA Solver subprocess CPU (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_solver_cpu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/solver-cpu.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build exact source and solver instrumentation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-codspeed==5.0.3
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Measure verifier plus Solver CPU
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          run: python -m pytest test/test_codspeed_solver_cpu.py -q --codspeed
      - name: Record same SHA subprocess CPU evidence
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family solver-cpu --instrument simulation \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-solver-cpu
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  cross-validate:
    name: Per-SHA CodSpeed cross-instrument evidence
    if: ${{ always() && github.event.action != 'edited' && !(github.event_name == 'workflow_dispatch' && inputs.pilot_only) }}
    needs: [codspeed, pr-solver-inclusive-walltime, native-core, native-memory, solver-inclusive-cpu, cross-method, python-core]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
      SOLVER_CPU: ${{ github.event_name == 'workflow_dispatch' && inputs.include_solver_cpu }}
      RUST_MEMORY: ${{ github.event_name == 'workflow_dispatch' && inputs.include_rust_memory }}
      CROSS_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.include_cross_method }}
      PYTHON_CORE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_python_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require each selected experiment on exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "${{ needs.codspeed.result }}" = success
          test "${{ needs.native-core.result }}" = success
          if [[ -n "$BASE_SHA" ]]; then
            test "${{ needs.pr-solver-inclusive-walltime.result }}" = success
          fi
          if [[ "$SOLVER_CPU" == true ]]; then
            test "${{ needs.solver-inclusive-cpu.result }}" = success
          fi
          if [[ "$RUST_MEMORY" == true ]]; then
            test "${{ needs.native-memory.result }}" = success
          fi
          if [[ "$CROSS_METHOD" == true ]]; then
            test "${{ needs.cross-method.result }}" = success
          fi
          if [[ "$PYTHON_CORE" == true ]]; then
            test "${{ needs.python-core.result }}" = success
          fi
      - name: Download original current-run instrument results
        uses: actions/download-artifact@v4
        with:
          pattern: quprs-sha-*
          path: cross-evidence
          merge-multiple: false
      - name: Download current-run Solver-inclusive report
        if: ${{ env.BASE_SHA != '' }}
        uses: actions/download-artifact@v4
        with:
          name: paired-codspeed-walltime-provenance
          path: cross-evidence/walltime-report
      - name: Check exact SHA, five shards, native core, and Solver verdict
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$SOLVER_CPU" == true ]]; then flags+=(--require-solver-cpu); fi
          if [[ "$RUST_MEMORY" == true ]]; then flags+=(--require-memory); fi
          if [[ "$CROSS_METHOD" == true ]]; then flags+=(--require-cross-method); fi
          if [[ "$PYTHON_CORE" == true ]]; then flags+=(--require-python-core); fi
          python scripts/report_codspeed_cross_instrument.py \
            --artifacts cross-evidence --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" --output cross-instrument-report.json \
            --summary "$GITHUB_STEP_SUMMARY" "${flags[@]}"
      - name: Preserve complete cross-instrument audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quprs-cross-instrument-audit
          path: cross-instrument-report.json
          if-no-files-found: warn
          retention-days: 14


  cross-method:
    name: Same SHA expanded cross-method ${{ matrix.mode }} (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_cross_method && inputs.base_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    env:
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/cross-method-${{ matrix.mode }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          submodules: recursive
          persist-credentials: false
          path: cross-method-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned base and HEAD environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C cross-method-base rev-parse HEAD)" = "$BASE_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          for variant in base head; do
            if [[ "$variant" == base ]]; then source="$GITHUB_WORKSPACE/cross-method-base"; else source="$GITHUB_WORKSPACE"; fi
            venv="$RUNNER_TEMP/cross-method-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (cd "$source" && VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev)
          done
          "$RUNNER_TEMP/cross-method-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
      - name: Run same-source cross-method instrument
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          simulation-track-subprocess: 'true'
          cycle-estimation: 'true'
          run: ${{ runner.temp }}/cross-method-head/bin/python -m pytest benchmarks/codspeed/test_cross_method_paired.py::test_cross_method_${{ matrix.mode == 'simulation' && 'cpu' || 'walltime' }} -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=10
      - name: Record this SHA and CodSpeed instrument data
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family cross-method --instrument ${{ matrix.mode }} \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-cross-method-${{ matrix.mode }}
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  candidate-pilot:
    name: Bounded SAME-SHA candidate screening (manual only)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.pilot_only) || (github.event_name == 'pull_request' && github.event.action == 'edited' && contains(github.event.pull_request.body, '<!-- quprs-codspeed-v3-pilot -->')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BINARY_DIR: src/QuPRS/utils
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/candidate-pilot-codspeed.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse compiled WMC solver tools without changing them
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build same-SHA verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-codspeed==5.0.4
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m pytest test/test_codspeed_registry.py -q
          python -m pytest benchmarks/codspeed/test_codspeed_candidate_pilot.py -q --collect-only
      - name: Run 8 bounded candidates with CodSpeed WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest benchmarks/codspeed/test_codspeed_candidate_pilot.py -q --codspeed --codspeed-warmup-time=0 --codspeed-max-rounds=1 --codspeed-max-time=120
      - name: Record pilot source and original measured output
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family candidate-pilot --instrument walltime \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-codspeed-v3-candidate-pilot
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/candidate-pilot-science.jsonl
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14

  python-core:
    name: SAME-SHA Python native-code CPU (opt-in)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_python_core && !inputs.pilot_only) || (github.event_name == 'pull_request' && github.event.action == 'edited' && contains(github.event.pull_request.body, '<!-- quprs-codspeed-v3-python-core -->')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/python-core-codspeed.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install source-pinned Python core
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-codspeed==5.0.4
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m pytest benchmarks/codspeed/test_python_core.py -q --collect-only
      - name: CodSpeed isolated Python algorithm CPU
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          simulation-track-subprocess: 'false'
          run: python -m pytest benchmarks/codspeed/test_python_core.py -q --codspeed

      - name: Record original Python core cases
        run: |
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family python-core --instrument simulation \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quprs-sha-python-core
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 14


  stage-repeatability:
    name: Same-SHA 4-case RR-vs-GPMC CodSpeed repeatability (one-shot)
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && contains(github.event.pull_request.body, '<!-- quprs-codspeed-v3-repeatability -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BINARY_DIR: src/QuPRS/utils
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/repeatability-codspeed.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse compiled WMC solver tools without modifying them
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact SHA and scientific source preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-codspeed==5.0.4
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m pytest test/test_codspeed_registry.py -q
          python scripts/check_codspeed_source_oracle.py \
            --fixture-root "$GITHUB_WORKSPACE" --head-sha "$HEAD_SHA" \
            --cases qnn4 vqe8 qpeexact8 wstate4 \
            --output "$RUNNER_TEMP/repeatability-source-oracle.json"
          python -m pytest benchmarks/codspeed/test_codspeed_repeatability.py -q --collect-only
      - name: Source-pinned CodSpeed 5-round four-case WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest benchmarks/codspeed/test_codspeed_repeatability.py -q --codspeed --codspeed-warmup-time=0 --codspeed-max-rounds=5 --codspeed-max-time=120
      - name: Enforce independent science and actual CodSpeed rounds
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_repeatability.py \
            --measurements "$QUPRS_CODSPEED_EXPORT" \
            --provenance "$RUNNER_TEMP/repeatability-science.jsonl" \
            --source-oracle "$RUNNER_TEMP/repeatability-source-oracle.json" \
            --sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/repeatability-report.json"
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family stage-repeatability --instrument walltime \
            --measurement "$QUPRS_CODSPEED_EXPORT" \
            --output "$RUNNER_TEMP/manifest.json"
      - name: Preserve repeatability and scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quprs-codspeed-v3-repeatability
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/repeatability-science.jsonl
            ${{ runner.temp }}/repeatability-source-oracle.json
            ${{ runner.temp }}/repeatability-report.json
            ${{ runner.temp }}/manifest.json
          if-no-files-found: warn
          retention-days: 14

  p5-ab-screen:
    name: P5 SAME-RUNNER 4-case base-HEAD CodSpeed seven-round diagnostic (one-shot)
    # Unlike CPU Simulation, measure complete verifier + GPMC/Ganak elapsed time.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && contains(github.event.pull_request.body, '<!-- quprs-codspeed-v3-ab-pilot -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout PR HEAD with benchmark harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout exact PR base on the SAME runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          submodules: recursive
          persist-credentials: false
          path: pr-walltime-base

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build independent base and head verifier environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C pr-walltime-base rev-parse HEAD)" = "$BASE_SHA"
          for variant in base head; do
            if [[ "$variant" == base ]]; then
              source_root="$GITHUB_WORKSPACE/pr-walltime-base"
            else
              source_root="$GITHUB_WORKSPACE"
            fi
            venv="$RUNNER_TEMP/quprs-pr-walltime-$variant"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (
              cd "$source_root"
              VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev
            )
            "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/pr-walltime-$variant-freeze.txt"
          done
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
          {
            echo "### PR CodSpeed WallTime provenance"
            echo "- Base SHA: $BASE_SHA"
            echo "- Head SHA: $HEAD_SHA"
            echo "- Base GPMC submodule: $(git -C pr-walltime-base rev-parse HEAD:GPMC)"
            echo "- Head GPMC submodule: $(git rev-parse HEAD:GPMC)"
            echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WallTime case inventory
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" -m pytest benchmarks/codspeed/test_pr_solver_walltime.py --collect-only -q -k 'qaoa7_gpmc or qft16_gpmc or vqe4_gpmc'

      - name: CodSpeed paired end-to-end GPMC/Ganak WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ${{ runner.temp }}/quprs-pr-walltime-head/bin/python -m pytest benchmarks/codspeed/test_pr_solver_walltime.py -q -k 'qaoa7_gpmc or qft16_gpmc or vqe4_gpmc' --codspeed --codspeed-max-rounds=7 --codspeed-max-time=30

      - name: Independent four-qubit source oracle for Ganak print limits
        shell: bash
        run: |
          "$RUNNER_TEMP/quprs-pr-walltime-head/bin/python" \
            scripts/check_codspeed_source_oracle.py \
            --fixture-root "$GITHUB_WORKSPACE" --head-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/quprs-source-oracle.json"

      - name: Pair measured CodSpeed WallTime and audit Solver semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_paired_walltime.py \
            --measurements "$RUNNER_TEMP/quprs-paired-walltime-codspeed.json" \
            --provenance "$RUNNER_TEMP/quprs-paired-walltime-provenance.jsonl" \
            --source-oracle "$RUNNER_TEMP/quprs-source-oracle.json" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --required-cases qaoa7_gpmc qft16_gpmc vqe4_gpmc vqe4_gpmc_python \
            --markdown paired-walltime-report.md \
            --json paired-walltime-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: P5 non-certifying CodSpeed WallTime sampling audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_codspeed_variance_gate.py \
            --paired-report paired-walltime-report.json \
            --expected-count 4 \
            --output paired-walltime-sampling.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload pinned dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quprs-codspeed-v3-p5-ab7
          path: |
            ${{ runner.temp }}/pr-walltime-base-freeze.txt
            ${{ runner.temp }}/pr-walltime-head-freeze.txt
            ${{ runner.temp }}/quprs-paired-walltime-codspeed.json
            ${{ runner.temp }}/quprs-paired-walltime-provenance.jsonl
            ${{ runner.temp }}/quprs-source-oracle.json
            paired-walltime-report.md
            paired-walltime-report.json
            paired-walltime-sampling.json
          if-no-files-found: ignore
          retention-days: 14



