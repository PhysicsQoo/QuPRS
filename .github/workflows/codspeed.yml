name: CodSpeed

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'rust/**'
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'rust/**'
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        shard_id: [0, 1, 2, 3, 4] 
        num_shards: [5]
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools 
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ matrix.os }}-${{ matrix.arch }}-wmc-tools-v0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pytest-shard

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: pytest test/test_Feynman.py test/test_MQT.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }} || ( [ $? -eq 5 ] && exit 0 || exit $? )