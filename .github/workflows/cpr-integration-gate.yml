# Branch-only integration evidence; remove before stable merge.
name: CPR Integration Gate
on:
  push:
    branches: [integration/cpr-optin]
    paths:
      - 'rust/quprs/src/**'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/tests/**'
      - '.github/workflows/cpr-integration-gate.yml'
permissions:
  contents: read
jobs:
  native-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Native core and original contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          git rev-parse 'HEAD^{tree}' | tee evidence/tree.txt
          rustc --version | tee evidence/rustc.txt
          sha256sum rust/quprs/src/{lib,cpr,strategy,wmc,reduction}.rs rust/Cargo.lock > evidence/source-sha256.txt
          tmp="$(mktemp -d)"
          python3 scripts/install_gpmc_release.py --dest "$tmp/gpmc" | tee evidence/gpmc-release.json
          sha256sum "$tmp/gpmc" | tee evidence/gpmc-sha256.txt
          export QUPRS_GPMC_PATH="$tmp/gpmc"
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --lib cpr::tests:: -- --nocapture 2>&1 | tee evidence/builder.log
          grep -F 'CPR_I1B_STREAM_GATE no_lift=4' evidence/builder.log
          grep -F 'CPR_I1B_HEAVY_GATE cases=5 shape_parity=true' evidence/builder.log
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --lib cpr_native_ -- --nocapture 2>&1 | tee evidence/handoff.log
          grep -F 'CPR_I1A_GATE cases=3 native_handoff=true phase=true timeout=true error=true' evidence/handoff.log
          grep -F 'CPR_I2A_GATE cases=6 raw_extracted_native_parity=true' evidence/handoff.log
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --lib exact_global_phase_verdict_tests 2>&1 | tee evidence/phase.log
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --lib verification_options_contract_tests 2>&1 | tee evidence/options.log
          cargo check --locked --manifest-path rust/Cargo.toml -p quprs --no-default-features --features browser-transport 2>&1 | tee evidence/browser-check.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpr-integration-native-core
          path: evidence/
