# Branch-only integration evidence; remove before stable merge.
name: CPR Integration Gate
on:
  push:
    branches: [integration/cpr-optin]
    paths:
      - 'rust/quprs/src/**'
      - 'rust/Cargo.toml'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/tests/**'
      - 'rust/quprs/examples/**'
      - '.github/workflows/cpr-integration-gate.yml'
permissions:
  contents: read
jobs:
  engineering-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUPRS_SOLVER_PROVISION: source
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: G5a durable workspace test profile and engineering contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          git rev-parse 'HEAD^{tree}' | tee evidence/tree.txt
          rustc --version | tee evidence/rustc.txt
          sha256sum rust/quprs/src/{lib,cpr,cpr_optin,circuit,strategy,wmc,reduction}.rs rust/Cargo.toml rust/Cargo.lock rust/quprs/Cargo.toml rust/quprs/examples/cpr_native_optin.rs > evidence/source-sha256.txt
          git cat-file -e '00496e7fef00c629912f5621d1a2e209d1b1978c^{commit}'
          git merge-base --is-ancestor 00496e7fef00c629912f5621d1a2e209d1b1978c HEAD
          git diff --exit-code 00496e7fef00c629912f5621d1a2e209d1b1978c HEAD -- rust/quprs/src rust/quprs/tests rust/quprs/Cargo.toml rust/Cargo.lock rust/quprs/examples/cpr_native_optin.rs benchmarks/rust_core
          unset CRR_SOURCE CRR_TARGET QUPRS_GPMC_PATH QUPRS_GANAK_PATH
          # CLI fault injection requires debug assertions; the frozen CPR heavy gate
          # also requires optimized execution to meet its unchanged 15s deadline.
          # Test the workspace manifest, not branch-only environment overrides.
          # All tests remain unfiltered; release gates below remain unchanged.
          # Continue independent gates on a failure, but aggregate every exit code.
          failed=0
          run_gate() {
            local label="$1"; shift
            local rc=0
            "$@" 2>&1 | tee "evidence/${label}.log" || rc=$?
            printf '%s %s\n' "$label" "$rc" | tee -a evidence/gate-exits.txt
            if [ "$rc" -ne 0 ]; then failed=1; fi
          }
          unset CARGO_PROFILE_TEST_OPT_LEVEL CARGO_PROFILE_TEST_DEBUG_ASSERTIONS CARGO_PROFILE_TEST_OVERFLOW_CHECKS
          run_gate default-checked-optimized-full cargo test --locked --manifest-path rust/Cargo.toml -p quprs -p QuPRS_cli
          run_gate checked-heavy-receipt grep -F 'cpr::tests::i1b_frozen_heavy_construction ... ok' evidence/default-checked-optimized-full.log
          run_gate checked-cli-receipt grep -F 'supervisor_timeout_includes_qasm_read_and_both_cli_modes ... ok' evidence/default-checked-optimized-full.log
          run_gate default-release-core cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs
          run_gate optin-full cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr
          run_gate entry-contract grep -F 'cpr_optin::tests::optin_request_and_rr_first_contract ... ok' evidence/optin-full.log
          run_gate stop-contract grep -F 'cpr_optin::tests::stop_and_native_failure_classification ... ok' evidence/optin-full.log
          run_gate worker-isolation grep -F 'cpr_native_router_tests::i2b_locked_source_worker ... ignored' evidence/optin-full.log
          run_gate browser-contract cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr,browser-transport --lib cpr_optin::tests::browser_capture_is_not_native_optin -- --exact
          run_gate browser-rejection grep -F 'cpr_optin::tests::browser_capture_is_not_native_optin ... ok' evidence/browser-contract.log
          run_gate browser-check cargo check --locked --manifest-path rust/Cargo.toml -p quprs --no-default-features --features browser-transport
          run_gate example-build cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr --example cpr_native_optin
          test "$failed" = 0
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpr-integration-engineering
          path: evidence/
