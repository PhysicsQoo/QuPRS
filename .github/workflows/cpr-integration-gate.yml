# Branch-only integration evidence; remove before stable merge.
name: CPR Integration Gate
on:
  push:
    branches: [integration/cpr-optin]
    paths:
      - 'rust/quprs/src/**'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/tests/**'
      - 'rust/quprs/examples/**'
      - '.github/workflows/cpr-integration-gate.yml'
permissions:
  contents: read
jobs:
  engineering-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUPRS_SOLVER_PROVISION: source
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Full unfiltered native correctness and explicit opt-in contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          git rev-parse 'HEAD^{tree}' | tee evidence/tree.txt
          rustc --version | tee evidence/rustc.txt
          sha256sum rust/quprs/src/{lib,cpr,cpr_optin,circuit,strategy,wmc,reduction}.rs rust/Cargo.lock rust/quprs/Cargo.toml rust/quprs/examples/cpr_native_optin.rs > evidence/source-sha256.txt
          unset CRR_SOURCE CRR_TARGET QUPRS_GPMC_PATH QUPRS_GANAK_PATH
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs -p QuPRS_cli 2>&1 | tee evidence/default-full.log
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr 2>&1 | tee evidence/optin-full.log
          grep -F 'cpr_optin::tests::optin_request_and_rr_first_contract ... ok' evidence/optin-full.log
          grep -F 'cpr_optin::tests::stop_and_native_failure_classification ... ok' evidence/optin-full.log
          grep -F 'cpr_native_router_tests::i2b_locked_source_worker ... ignored' evidence/optin-full.log
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr,browser-transport --lib cpr_optin::tests::browser_capture_is_not_native_optin -- --exact 2>&1 | tee evidence/browser-contract.log
          grep -F 'cpr_optin::tests::browser_capture_is_not_native_optin ... ok' evidence/browser-contract.log
          cargo check --locked --manifest-path rust/Cargo.toml -p quprs --no-default-features --features browser-transport 2>&1 | tee evidence/browser-check.log
          cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --features experimental-cpr --example cpr_native_optin 2>&1 | tee evidence/example-build.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpr-integration-engineering
          path: evidence/
