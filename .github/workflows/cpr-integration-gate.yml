# Branch-only integration evidence; remove before stable merge.
name: CPR Integration Gate
on:
  push:
    branches: [integration/cpr-optin]
    paths:
      - 'rust/quprs/src/**'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/tests/**'
      - 'rust/research/**'
      - '.github/workflows/cpr-integration-gate.yml'
permissions:
  contents: read
jobs:
  native-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev python3-venv
      - name: Native routed count and independent literal-QASM oracle
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head.txt
          git rev-parse 'HEAD^{tree}' | tee evidence/tree.txt
          rustc --version | tee evidence/rustc.txt
          sha256sum rust/quprs/src/{lib,cpr,strategy,wmc,reduction}.rs rust/Cargo.lock rust/research/{cpr_native_i2b,conditional_rr_source_ball,conditional_rr_tensor_source}.py > evidence/source-sha256.txt
          tmp="$(mktemp -d)"
          python3 scripts/install_gpmc_release.py --dest "$tmp/gpmc" | tee evidence/gpmc-release.json
          sha256sum "$tmp/gpmc" | tee evidence/gpmc-sha256.txt
          export QUPRS_GPMC_PATH="$tmp/gpmc"
          python3 -m py_compile rust/research/{cpr_native_i2b,conditional_rr_source_ball,conditional_rr_tensor_source}.py
          cargo test --locked --release --manifest-path rust/Cargo.toml -p quprs --lib --no-run --message-format=json > evidence/build.jsonl
          export CPR_I2B_BIN="$(python3 -c 'import json; p=[r["executable"] for l in open("evidence/build.jsonl") if (r:=json.loads(l)).get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="quprs" and r.get("profile",{}).get("test") and r.get("executable")]; assert len(p)==1,p; print(p[0])')"
          env -u CRR_SOURCE -u CRR_TARGET "$CPR_I2B_BIN" cpr_native_router_tests::i2b_locked_source_worker --exact --nocapture 2>&1 | tee evidence/worker-isolation.log
          grep -F '1 ignored' evidence/worker-isolation.log
          set +e
          timeout --kill-after=5s 240s python3 rust/research/cpr_native_i2b.py 2>&1 | tee evidence/native.log
          native_status=${PIPESTATUS[0]}
          set -e
          python3 -m venv "$tmp/reference-venv"
          "$tmp/reference-venv/bin/pip" install --disable-pip-version-check python-flint==0.9.0
          set +e
          CRR_GENERIC_LOG=evidence/native.log CRR_BALL_BITS=2048 timeout --kill-after=5s 480s "$tmp/reference-venv/bin/python" rust/research/cpr_native_i2b.py 2>&1 | tee evidence/source.log
          source_status=${PIPESTATUS[0]}
          set -e
          test "$native_status" = 0
          test "$source_status" = 0
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpr-integration-native-router
          path: evidence/
