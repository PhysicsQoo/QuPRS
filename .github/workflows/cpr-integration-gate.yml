# Branch-only integration evidence; remove before stable merge.
name: CPR Integration Gate
on:
  push:
    branches: [integration/cpr-optin]
    paths:
      - 'rust/quprs/src/**'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/examples/**'
      - 'rust/research/**'
      - '.github/workflows/cpr-integration-gate.yml'
permissions:
  contents: read
jobs:
  matched-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b398f07d6845efc23540549ccbfec717c27b1722
          path: pinned-main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            pinned-main/rust -> target
          key: cpr-g4a-main
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev python3-venv
      - name: G4a frozen matched native admission
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git rev-parse 'HEAD^{tree}' | tee evidence/source-tree.txt
          git -C pinned-main rev-parse HEAD | tee evidence/main-head.txt
          git -C pinned-main rev-parse 'HEAD^{tree}' | tee evidence/main-tree.txt
          test "$(cat evidence/main-head.txt)" = "b398f07d6845efc23540549ccbfec717c27b1722"
          test "$(cat evidence/main-tree.txt)" = "1dc21015f0f4f69f057c4685b886b686d82b882d"
          # Exact G3-certified runtime and fixture tree; new evidence code only.
          git diff --exit-code 00496e7fef00c629912f5621d1a2e209d1b1978c HEAD -- rust/quprs/src rust/quprs/tests rust/quprs/Cargo.toml rust/Cargo.lock rust/quprs/examples/cpr_native_optin.rs benchmarks docs/development/paper-corpus-manifest.json
          git diff --exit-code b398f07d6845efc23540549ccbfec717c27b1722 HEAD -- rust/Cargo.lock benchmarks docs/development/paper-corpus-manifest.json
          git diff --stat b398f07d6845efc23540549ccbfec717c27b1722 HEAD -- rust/quprs/src rust/quprs/Cargo.toml rust/Cargo.lock | tee evidence/main-source-diff.txt
          sha256sum rust/quprs/src/{lib,cpr,cpr_optin,circuit,strategy,wmc,reduction}.rs rust/research/{cpr_native_i2b,cpr_native_i3b,conditional_rr_source_ball,conditional_rr_tensor_source}.py rust/quprs/examples/{cpr_native_optin,cpr_native_public}.rs rust/quprs/examples/cpr_support/public.rs rust/Cargo.lock pinned-main/rust/Cargo.lock > evidence/source-sha256.txt
          rustc --version | tee evidence/rustc.txt
          tmp="$(mktemp -d)"
          python3 scripts/install_gpmc_release.py --dest "$tmp/gpmc" | tee evidence/gpmc-release.json
          sha256sum "$tmp/gpmc" | tee evidence/gpmc-sha256.txt
          export QUPRS_GPMC_PATH="$tmp/gpmc"
          test ! -e pinned-main/rust/quprs/examples/cpr_native_public.rs
          test ! -e pinned-main/rust/quprs/examples/cpr_support/public.rs
          mkdir -p pinned-main/rust/quprs/examples/cpr_support
          cp rust/quprs/examples/cpr_native_public.rs pinned-main/rust/quprs/examples/
          cp rust/quprs/examples/cpr_support/public.rs pinned-main/rust/quprs/examples/cpr_support/
          build_example() {
            local manifest="$1" name="$2" dest="$3"; shift 3
            cargo build --release --locked --manifest-path "$manifest" -p quprs --example "$name" "$@" --message-format=json > "$dest"
            python3 -c 'import json,sys; rows=[json.loads(l) for l in open(sys.argv[1])]; p=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")==sys.argv[2] and r.get("executable")]; assert len(p)==1,p; print(p[0])' "$dest" "$name"
          }
          export CPR_BIN_MAIN="$(build_example pinned-main/rust/Cargo.toml cpr_native_public evidence/main-build.jsonl)"
          export CPR_BIN_CPR="$(build_example rust/Cargo.toml cpr_native_optin evidence/cpr-build.jsonl --features experimental-cpr)"
          test "$(git -C pinned-main diff --name-only)" = ""
          size "$CPR_BIN_MAIN" "$CPR_BIN_CPR" | tee evidence/binary-size.txt
          set +e
          timeout --kill-after=5s 1200s python3 rust/research/cpr_native_i3b.py 2>&1 | tee evidence/matched.log
          cohort_status=${PIPESTATUS[0]}
          set -e
          python3 -m venv "$tmp/reference-venv"
          "$tmp/reference-venv/bin/pip" install --disable-pip-version-check python-flint==0.9.0
          set +e
          CRR_GENERIC_LOG=evidence/matched.log CRR_BALL_BITS=2048 timeout --kill-after=5s 480s "$tmp/reference-venv/bin/python" rust/research/cpr_native_i3b.py 2>&1 | tee evidence/source-parity.log
          source_status=${PIPESTATUS[0]}
          set -e
          printf 'native %s\nsource %s\n' "$cohort_status" "$source_status" | tee evidence/gate-exits.txt
          test "$cohort_status" = 0
          test "$source_status" = 0
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p evidence
          (cd evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpr-integration-g4a-matched
          path: evidence/
