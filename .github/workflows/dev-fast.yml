name: Dev Fast CI

# Check only code-affecting dev PRs; the 12-platform matrix covers dev integration pushes.
# No required status is configured on dev, so documentation-only PRs need no CI status.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'rust/**'
      - 'benchmarks/**'
      - 'scripts/paper_corpus_audit.py'
      - 'scripts/check_benchmark_evidence.py'
      - 'scripts/generate_stubs.py'
      - 'scripts/check_generated_stub.py'
      - 'docs/development/paper-corpus-manifest.json'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'scripts/install_linux_deps.sh'
      - '.github/workflows/dev-fast.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
      - 'scripts/check_coverage_xml.py'
      - '.github/workflows/pytest.yml'
      - '.github/workflows/native-cross-platform-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    name: Incremental CI impact / dev-fast.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_heavy: ${{ steps.resolve.outputs.run_heavy }}
      reused_run_id: ${{ steps.resolve.outputs.reused_run_id }}
      measured_head_sha: ${{ steps.resolve.outputs.measured_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run incremental routing negative contracts
        run: node .github/scripts/test-ci-impact-reuse.cjs
      - id: resolve
        name: Validate source and successful previous CI evidence
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./.github/scripts/ci-impact-reuse.cjs');
            await resolve({
              github, context, core,
              workflowFile: 'dev-fast.yml',
              requiredJobs: [{"name":"Dev / Fast Source Correctness","count":1}]
            });

  fast-source-correctness:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' }}
    name: Dev / Fast Source Correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      - name: Check out exact source (no native solver submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Assert submodule-free GPMC build
        run: test ! -f GPMC/CMakeLists.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify paper benchmark input integrity
        run: python scripts/paper_corpus_audit.py --json "$RUNNER_TEMP/paper_corpus_sha256.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: dev-fast-linux-rust-v1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev

      - name: Cache compiled solver tools
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-dev-fast-ganak-2.8.0-${{ hashFiles('src/QuPRS/utils/ganak-release.txt') }}

      - name: Restore pinned Ganak archive cache
        uses: actions/cache@v4
        with:
          path: rust/target/ganak-release-cache
          key: ganak-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/QuPRS/utils/ganak-release.txt') }}

      - name: Build Rust/Python package with existing development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev

      - name: Verify source-correct and deterministic core.pyi regeneration
        shell: bash
        run: |
          set -euo pipefail
          # The checked-in stub is formatted for review. Regeneration need not
          # rewrite formatting, but must preserve the complete public API.
          # Griffe/rendering are independently verified in Documentation CI.
          original="$(mktemp)"
          generated="$(mktemp)"
          cp src/QuPRS/pathsum/core.pyi "$original"
          python scripts/generate_stubs.py --write
          PYTHONPATH=scripts python - <<'PY'
          from check_docs_gate_stubs import check_core_stub, check_gate_stub
          gates = check_gate_stub()
          check_core_stub(gates)
          print("Regenerated core.pyi source semantic parity PASS")
          PY
          # Compare every generated declaration, return annotation and docstring
          # to the committed source, ignoring only formatting/import ordering.
          python scripts/check_generated_stub.py "$original" src/QuPRS/pathsum/core.pyi
          cp src/QuPRS/pathsum/core.pyi "$generated"
          python scripts/generate_stubs.py --write
          if ! cmp -s "$generated" src/QuPRS/pathsum/core.pyi; then
            echo "::error::core.pyi generator is nondeterministic"
            exit 1
          fi
          echo "Regenerated core.pyi deterministic output PASS"
          cp "$original" src/QuPRS/pathsum/core.pyi

      - name: Verify default pinned GPMC release and Python adapter
        run: |
          test -x src/QuPRS/utils/wmc_tools/gpmc
          python scripts/check_gpmc_release_runtime.py \
            --binary src/QuPRS/utils/wmc_tools/gpmc --adapter

      - name: Verify bundled native solver distribution
        run: python -m QuPRS.utils.ganak_distribution

      - name: Run locked Rust correctness tests
        run: cargo test --locked --manifest-path rust/Cargo.toml -p quprs -p QuPRS_cli

      - name: Run all Python correctness tests without report/coverage duplication
        id: python_correctness
        run: python -m pytest -n auto -q -ra --junitxml=dev-fast-pytest.xml

      - name: Audit representative benchmark outcomes
        if: ${{ !cancelled() && steps.python_correctness.outcome != 'skipped' }}
        run: |
          python scripts/check_benchmark_evidence.py \
            --junit dev-fast-pytest.xml \
            --json dev-fast-benchmark-evidence.json \
            --markdown dev-fast-benchmark-evidence.md

      - name: Upload Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-fast-pytest
          path: |
            dev-fast-pytest.xml
            dev-fast-benchmark-evidence.json
            dev-fast-benchmark-evidence.md
          if-no-files-found: ignore
          retention-days: 14
