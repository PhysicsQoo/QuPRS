name: Documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/check_generated_stub.py'
      - 'test/test_generated_stub_parity.py'
      - 'scripts/check_docs_examples.py'
      - 'scripts/check_docs_scoped_contract.py'
      - 'src/QuPRS/utils/solver_adapter.py'
      - 'src/QuPRS/utils/wmc_problem.py'
      - '.github/workflows/docs-check.yml'
      - '.github/scripts/test-docs-workflow-coverage.cjs'
  push:
    branches: [dev]
    paths:
      - 'scripts/check_generated_stub.py'
      - 'test/test_generated_stub_parity.py'
      - 'scripts/check_docs_examples.py'
      - 'scripts/check_docs_scoped_contract.py'
      - 'src/QuPRS/utils/solver_adapter.py'
      - 'src/QuPRS/utils/wmc_problem.py'
      - '.github/workflows/docs-check.yml'
      - '.github/scripts/test-docs-workflow-coverage.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Documentation / Strict Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements-site.txt
      - name: Validate site source selection
        run: python scripts/check_docs_site.py --sources
      - name: Verify committed core.pyi against Python and Gate source (no runtime import)
        run: python scripts/generate_stubs.py --check
      - name: Check generated stub comparison negative contracts (offline)
        run: python -m unittest discover -s test -p 'test_generated_stub_parity.py'
      - name: Check stub generator and release typing smoke syntax
        run: python -m py_compile scripts/generate_stubs.py scripts/check_generated_stub.py scripts/release_artifact_smoke.py
      - name: Check published example syntax
        run: python scripts/check_docs_examples.py --check
      - name: Check published rule witnesses and solver adapter source contracts
        run: python scripts/check_docs_scoped_contract.py
      - name: Check documentation coverage and workflow ownership
        run: node .github/scripts/test-docs-workflow-coverage.cjs
      - name: Build documentation in strict mode
        run: zensical build --strict --clean
      - name: Validate generated documentation
        run: python scripts/check_docs_site.py --site
      - name: Check rendered dynamic Gate members
        run: python scripts/check_docs_gate_stubs.py --site
      - name: Reject broken internal links
        run: python scripts/check_docs_site.py --negative-link-test
