name: Documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mkdocs.yml'
      - 'docs/requirements-site.txt'
      - 'docs/site/**'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_docs_gate_stubs.py'
      - 'scripts/generate_stubs.py'
      - 'src/QuPRS/py.typed'
      - 'src/QuPRS/pathsum/core.py'
      - 'src/QuPRS/pathsum/core.pyi'
      - 'src/QuPRS/pathsum/statistics.py'
      - 'src/QuPRS/pathsum/__init__.py'
      - 'src/QuPRS/pathsum/gates/**'
      - 'scripts/check_docs_examples.py'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [dev]
    paths:
      - 'mkdocs.yml'
      - 'docs/requirements-site.txt'
      - 'docs/site/**'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_docs_gate_stubs.py'
      - 'scripts/generate_stubs.py'
      - 'src/QuPRS/py.typed'
      - 'src/QuPRS/pathsum/core.py'
      - 'src/QuPRS/pathsum/core.pyi'
      - 'src/QuPRS/pathsum/statistics.py'
      - 'src/QuPRS/pathsum/__init__.py'
      - 'src/QuPRS/pathsum/gates/**'
      - 'scripts/check_docs_examples.py'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Documentation / Strict Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements-site.txt
      - name: Validate site source selection
        run: python scripts/check_docs_site.py --sources
      - name: Check static PathSum Gate signatures against source and Griffe
        run: python scripts/check_docs_gate_stubs.py --check
      - name: Check stub generator and release typing smoke syntax
        run: python -m py_compile scripts/generate_stubs.py scripts/release_artifact_smoke.py
      - name: Check published example syntax
        run: python scripts/check_docs_examples.py --check
      - name: Build documentation in strict mode
        run: zensical build --strict --clean
      - name: Validate generated documentation
        run: python scripts/check_docs_site.py --site
      - name: Check rendered dynamic Gate members
        run: python scripts/check_docs_gate_stubs.py --site
      - name: Reject broken internal links
        run: python scripts/check_docs_site.py --negative-link-test
