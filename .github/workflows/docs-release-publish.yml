name: Documentation Stable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag containing versioned docs (vX.Y.Z)"
        required: true
        type: string
      publish:
        description: "Publish reviewed docs to stable alias (false = dry run only)"
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: quprs-docs-stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Check release provenance and stage immutable docs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      pages_base: ${{ steps.pages.outputs.base_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Check out documentation tooling
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve and admit immutable release source
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          python scripts/docs_versioning.py check-release "$RELEASE_TAG"
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '[.isDraft,.isPrerelease] | tostring')"
          if [[ "$release_state" != '[false,false]' ]]; then
            echo 'Stable docs require an officially published, non-prerelease GitHub Release' >&2
            exit 1
          fi
          source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git checkout --detach "$source_sha"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install pinned versioned docs dependencies from tag
        run: python -m pip install -r docs/requirements-versioned.txt
      - name: Verify release's scientific documentation
        run: |
          python scripts/check_docs_site.py --sources
          python scripts/check_docs_science.py
          python scripts/check_docs_examples.py --check
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache release Rustdoc
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: docs-stable-rustdoc
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev libssl-dev
      - name: Restore pinned release archive from matching released manifest
        uses: actions/cache@v4
        with:
          path: rust/target/ganak-release-cache
          key: ganak-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/QuPRS/utils/ganak-release.txt') }}
      - name: Generate Rustdoc from the same release SHA
        run: |
          cargo doc --locked --manifest-path rust/Cargo.toml -p quprs --no-deps
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs --doc
          python scripts/docs_versioning.py stage-native --source-sha '${{ steps.resolve.outputs.source_sha }}'
          python scripts/docs_versioning.py config --ref '${{ steps.resolve.outputs.release_tag }}'
      - name: Stage versioned docs without publishing
        id: pages
        env:
          TAG: ${{ steps.resolve.outputs.release_tag }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:refs/heads/gh-pages
          base_sha="$(git rev-parse gh-pages)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          if git cat-file -e "gh-pages:docs/$TAG/index.html" 2>/dev/null; then
            echo "Immutable release docs already published: $TAG" >&2
            exit 1
          fi
          root_before="$(git rev-parse gh-pages:index.html)"
          preview_before="$(git rev-parse gh-pages:pr-preview 2>/dev/null || printf absent)"
          mike deploy --branch gh-pages --config-file mkdocs.versioned.yml \
            --update-aliases "$TAG" stable
          mike set-default --branch gh-pages --config-file mkdocs.versioned.yml stable
          test "$(git show "gh-pages:docs/$TAG/source-sha.txt" | tr -d '\r\n')" = "$EXPECTED_SHA"
          git cat-file -e "gh-pages:docs/$TAG/rust-api/quprs/index.html"
          test "$(git rev-parse gh-pages:index.html)" = "$root_before"
          test "$(git rev-parse gh-pages:pr-preview 2>/dev/null || printf absent)" = "$preview_before"
          git worktree add --detach "$RUNNER_TEMP/version-pages" gh-pages
          python scripts/docs_versioning.py check-layout --pages "$RUNNER_TEMP/version-pages" \
            --versions "$TAG" stable
          python scripts/check_docs_links.py \
            --site "$RUNNER_TEMP/version-pages/docs/$TAG" \
            --base-url "https://physicsqoo.github.io/QuPRS/docs/$TAG/"
          mkdir -p "$RUNNER_TEMP/publish-evidence"
          git archive gh-pages docs | gzip -9 > "$RUNNER_TEMP/publish-evidence/docs.tar.gz"
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/publish-evidence/source-sha.txt"
          printf '%s\n' "$base_sha" > "$RUNNER_TEMP/publish-evidence/base-sha.txt"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/publish-evidence/tag.txt"
      - name: Preserve reviewed, non-published release site
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-stable-docs-${{ steps.resolve.outputs.release_tag }}-${{ steps.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/publish-evidence/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish stable alias after every validation passes
    needs: build
    if: inputs.publish == true && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch reviewed release artifact
        uses: actions/download-artifact@v4
        with:
          name: reviewed-stable-docs-${{ needs.build.outputs.release_tag }}-${{ needs.build.outputs.source_sha }}
          path: reviewed
      - name: Check out existing public Pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          persist-credentials: true
          fetch-depth: 1
          path: pages
      - name: Fail closed on concurrent Pages edits and existing tags
        id: publish
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          BASE_SHA: ${{ needs.build.outputs.pages_base }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < reviewed/tag.txt)" = "$TAG"
          test "$(tr -d '\r\n' < reviewed/source-sha.txt)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < reviewed/base-sha.txt)" = "$BASE_SHA"
          test "$(git -C pages rev-parse HEAD)" = "$BASE_SHA"
          if [[ -e "pages/docs/$TAG/index.html" ]]; then
            echo 'Immutable documentation version already exists' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unpacked"
          if tar -tzf reviewed/docs.tar.gz | grep -v -E '^docs(/|$)'; then
            echo 'Archive contains paths outside the isolated docs subtree' >&2
            exit 1
          fi
          tar -xzf reviewed/docs.tar.gz -C "$RUNNER_TEMP/unpacked" --no-same-owner
          test -f "$RUNNER_TEMP/unpacked/docs/$TAG/source-sha.txt"
          test "$(tr -d '\r\n' < "$RUNNER_TEMP/unpacked/docs/$TAG/source-sha.txt")" = "$SOURCE_SHA"
          if find "$RUNNER_TEMP/unpacked/docs" -type l | grep -q .; then
            echo 'Symlinks in versioned site are not allowed' >&2
            exit 1
          fi
          rm -rf pages/docs
          cp -a "$RUNNER_TEMP/unpacked/docs" pages/docs
          git -C pages add -- docs
          test -z "$(git -C pages diff --cached --name-only | grep -v '^docs/' || true)"
          git -C pages -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: publish immutable $TAG and update stable alias"
          git -C pages push origin HEAD:gh-pages
          published_sha="$(git -C pages rev-parse HEAD)"
          echo "pages_sha=$published_sha" >> "$GITHUB_OUTPUT"
      - name: Verify published gh-pages provenance and stable alias
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          PAGES_SHA: ${{ steps.publish.outputs.pages_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git -C pages fetch --no-tags origin gh-pages
          remote="$(git -C pages rev-parse FETCH_HEAD)"
          # Concurrent preview updates are allowed, provided they preserve
          # the reviewed immutable tag and the stable alias.
          actual="$(git -C pages show "$remote:docs/$TAG/source-sha.txt" | tr -d '\r\n')"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "::error::Published gh-pages revision does not contain the reviewed release source"
            exit 1
          fi
          git -C pages show "$remote:docs/$TAG/rust-api/quprs/index.html" > /dev/null
          git -C pages show "$remote:docs/versions.json" |
            jq -e --arg tag "$TAG" '
              [.[] | select(.version == $tag and ((.aliases // []) | index("stable") != null))]
              | length == 1
            ' > /dev/null
          echo "Reviewed immutable docs and stable alias are present in remote gh-pages ($remote)"
          echo "Published gh-pages commit: $PAGES_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for actual GitHub Pages deployment of published revision
        env:
          PAGES_SHA: ${{ steps.publish.outputs.pages_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The built-in dynamic Pages workflow can remain queued for several
          # minutes after the branch push. A published git tree is not proof of
          # a public Pages deployment.
          deadline=$((SECONDS + 900))
          while ((SECONDS < deadline)); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=gh-pages&per_page=100")"
            status="$(jq -r --arg sha "$PAGES_SHA" '
              [.workflow_runs[] |
                select(.name == "pages build and deployment"
                  and .head_branch == "gh-pages" and .head_sha == $sha)]
              | sort_by(.created_at) | last
              | if . == null then "pending"
                elif .status != "completed" then .status
                elif .conclusion == "success" then "success"
                else "failed:" + (.conclusion // "unknown") end
            ' <<< "$runs")"
            case "$status" in
              success)
                echo "GitHub Pages deployment succeeded for $PAGES_SHA"
                break
                ;;
              failed:*)
                echo "::error::GitHub Pages deployment of $PAGES_SHA finished $status"
                exit 1
                ;;
              *)
                echo "Pages deployment pending for $PAGES_SHA: $status"
                ;;
            esac
            sleep 20
          done
          if [[ "$status" != success ]]; then
            echo "::error::No successful Pages deployment for $PAGES_SHA within 15 minutes"
            exit 1
          fi
          echo "Pages deployment for $PAGES_SHA: success" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public release tag and stable alias
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          PAGES_SHA: ${{ steps.publish.outputs.pages_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://physicsqoo.github.io/QuPRS/docs"
          # The deployment is already confirmed above. Allow a separate,
          # bounded public/CDN propagation interval without rebuilding docs.
          deadline=$((SECONDS + 180))
          matched=false
          while ((SECONDS < deadline)); do
            if curl --fail --location --silent --show-error --max-time 12 \
                  -H 'Cache-Control: no-cache' \
                  -o checked-sha.txt "$base/$TAG/source-sha.txt?v=$PAGES_SHA" &&
               [[ "$(tr -d '\r\n' < checked-sha.txt)" == "$EXPECTED_SHA" ]] &&
               curl --fail --location --silent --show-error --max-time 12 \
                  -H 'Cache-Control: no-cache' \
                  -o checked-versions.json "$base/versions.json?v=$PAGES_SHA" &&
               jq -e --arg tag "$TAG" '
                 [.[] | select(.version == $tag and ((.aliases // []) | index("stable") != null))]
                 | length == 1
               ' checked-versions.json > /dev/null &&
               curl --fail --location --silent --show-error --max-time 12 \
                  -o stable.html "$base/stable/?v=$PAGES_SHA" &&
               grep -qiE '<!doctype html|<html' stable.html; then
              matched=true
              break
            fi
            echo "Live tag or stable alias has not propagated after Pages deployment"
            sleep 15
          done
          if [[ "$matched" != true ]]; then
            echo "::error::Pages deployment succeeded, but live tag/stable alias did not match $TAG within 3 minutes"
            exit 1
          fi
          echo "Public immutable docs ($TAG) and stable alias verified"
          echo "Live docs: $base/$TAG/ ; stable: $base/stable/" >> "$GITHUB_STEP_SUMMARY"
