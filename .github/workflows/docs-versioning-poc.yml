name: Documentation Versioning PoC

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/docs_versioning.py'
      - '.github/workflows/docs-release-publish.yml'
      - 'scripts/check_docs_version_browser.py'
      - 'docs/requirements-versioned.txt'
      - '.github/workflows/docs-versioning-poc.yml'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-versioning-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versioning-poc:
    name: Isolated mike version selector / no publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Validate publication workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error             -o "$RUNNER_TEMP/actionlint.tar.gz"             'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          printf '%s  %s\n'             '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'             "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"             .github/workflows/docs-release-publish.yml             .github/workflows/docs-versioning-poc.yml             .github/workflows/rust-api-docs.yml
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned versioned documentation toolchain
        run: python -m pip install -r docs/requirements-versioned.txt
      - name: Reject historical release tags without site sources
        run: |
          python scripts/docs_versioning.py assert-historical-unavailable v0.14.1
          python scripts/docs_versioning.py assert-historical-unavailable v0.14.0
      - name: Prepare versioned Zensical configuration
        run: python scripts/docs_versioning.py config --ref dev
      - name: Prepare isolated local gh-pages branch
        run: |
          set -euo pipefail
          git config user.name 'QuPRS Documentation CI'
          git config user.email 'docs-ci@users.noreply.github.com'
          git fetch origin gh-pages:refs/heads/gh-pages
          git rev-parse gh-pages:index.html > "$RUNNER_TEMP/root-before.txt"
          git rev-parse gh-pages:pr-preview/pr-159/source-sha.txt > "$RUNNER_TEMP/preview-before.txt"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust documentation build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: docs-version-native-poc
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev libssl-dev
      - name: Build source-matched Rustdoc
        run: |
          cargo doc --locked --manifest-path rust/Cargo.toml -p pathsum --no-deps
          python scripts/docs_versioning.py stage-native --source-sha ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Simulate dev and stable version deployments locally
        run: |
          set -euo pipefail
          mike deploy --branch gh-pages --config-file mkdocs.versioned.yml dev
          mike set-default --branch gh-pages --config-file mkdocs.versioned.yml dev
          # Synthetic release exists only on the CI runner, never published.
          mike deploy --branch gh-pages --config-file mkdocs.versioned.yml \
            --update-aliases v0.99.99-test stable
          mike set-default --branch gh-pages --config-file mkdocs.versioned.yml stable
          git rev-parse gh-pages:index.html > "$RUNNER_TEMP/root-after.txt"
          git rev-parse gh-pages:pr-preview/pr-159/source-sha.txt > "$RUNNER_TEMP/preview-after.txt"
          diff -u "$RUNNER_TEMP/root-before.txt" "$RUNNER_TEMP/root-after.txt"
          diff -u "$RUNNER_TEMP/preview-before.txt" "$RUNNER_TEMP/preview-after.txt"
      - name: Inspect generated versions and URL boundaries
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/versioned-pages" gh-pages
          python scripts/docs_versioning.py check-layout \
            --pages "$RUNNER_TEMP/versioned-pages" \
            --versions dev v0.99.99-test stable
          python scripts/check_docs_links.py \
            --site "$RUNNER_TEMP/versioned-pages/docs/dev" \
            --base-url https://physicsqoo.github.io/QuPRS/docs/dev/
          python scripts/check_docs_links.py \
            --site "$RUNNER_TEMP/versioned-pages/docs/v0.99.99-test" \
            --base-url https://physicsqoo.github.io/QuPRS/docs/v0.99.99-test/
      - name: Install Chromium for selector interaction
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify version switcher in a real browser
        run: python scripts/check_docs_version_browser.py --pages "$RUNNER_TEMP/versioned-pages"
      - name: Upload local version selector screenshots
        uses: actions/upload-artifact@v4
        with:
          name: docs-version-selector-${{ github.event.pull_request.head.sha || github.sha }}
          path: docs-version-review/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve compiled preview for inspection
        uses: actions/upload-artifact@v4
        with:
          name: docs-versioning-poc-${{ github.sha }}
          path: mkdocs.versioned.yml
          retention-days: 7
          if-no-files-found: error
