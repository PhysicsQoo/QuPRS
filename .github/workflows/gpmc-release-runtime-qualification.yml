# GPMC owns native release ABI/loader/scientific qualification.
# This is only a manual QuPRS consumer integration check for intentional
# solver release upgrades. Daily PRs use the normal QuPRS adapter tests.
name: GPMC pinned release consumer integration (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpmc-consumer-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    name: GPMC pinned release runtime + adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Assert no GPMC source checkout
        run: test ! -f GPMC/CMakeLists.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native runtime / build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install gmp mpfr zlib cmake
            GMP=$(brew --prefix gmp)
            MPFR=$(brew --prefix mpfr)
            ZLIB=$(brew --prefix zlib)
            echo "CFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> "$GITHUB_ENV"
            echo "LDFLAGS=-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib -L$ZLIB/lib -Wl,-rpath,$ZLIB/lib" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev pkg-config
          fi
      - uses: actions/cache@v4
        with:
          path: rust/target/gpmc-release-cache
          key: gpmc-v102-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/QuPRS/utils/gpmc-release.txt') }}
      - name: Verify and extract pinned release executable
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/gpmc-cli"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            otool -L "$RUNNER_TEMP/gpmc-cli"
          else
            ldd "$RUNNER_TEMP/gpmc-cli" || true
          fi
      - name: Real CLI complex WMC / shared-library smoke
        run: python scripts/check_gpmc_release_runtime.py --binary "$RUNNER_TEMP/gpmc-cli"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: gpmc-v102-source-${{ runner.os }}
      - name: Build QuPRS from source without the gitlink's contents
        env:
          QUPRS_GPMC_RELEASE: v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/quprs-venv"
          source "$RUNNER_TEMP/quprs-venv/bin/activate"
          python -m pip install 'maturin>=1.5,<2' 'pytest>=8,<9'
          maturin develop --release
          python scripts/check_gpmc_release_runtime.py --binary "$RUNNER_TEMP/gpmc-cli" --adapter
          python -m pytest -q test/test_gpmc_release_consumer.py test/test_solver_adapter_contract.py test/test_wmc_solver_adapters.py
      - name: Rust real GPMC WMC-only and hybrid cases
        env:
          QUPRS_GPMC_RELEASE: v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          export QUPRS_GPMC_PATH="$RUNNER_TEMP/gpmc-cli"
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test external_wmc
