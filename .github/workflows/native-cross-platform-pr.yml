# Additional pre-merge correctness validation for native/FFI/solver-sensitive dev PRs.
# Reuse exactly the same 12-platform Rust/Python tests that protect dev integration.
# This workflow is informational; protect-dev has no required status check.
name: Native Cross-Platform PR

on:
  pull_request:
    branches: [dev]
    paths:
      - 'rust/**'
      - 'src/QuPRS/utils/**'
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'src/QuPRS/interface/rust_*.py'
      - 'pyproject.toml'
      - 'scripts/install_linux_deps.sh'
      - 'scripts/check_coverage_xml.py'
      - '.github/workflows/pytest.yml'
      - '.github/workflows/native-cross-platform-pr.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
      - '.github/scripts/ci-docs-only-admission.cjs'
      - '.github/scripts/test-ci-docs-only-admission.cjs'
      - '.github/scripts/codspeed-pr-impact.cjs'
  workflow_dispatch:

permissions:
  contents: read

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    name: Incremental CI impact / native-cross-platform-pr.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.source_scope.outputs.run_source == 'true' && steps.resolve.outputs.run_heavy == 'true' }}
      reused_run_id: ${{ steps.resolve.outputs.reused_run_id }}
      measured_head_sha: ${{ steps.resolve.outputs.measured_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify incremental routing and fail-closed native matrix reuse policy
        run: |
          node .github/scripts/test-ci-impact-reuse.cjs
          node .github/scripts/test-native-matrix-reuse-admission.cjs
          node .github/scripts/test-ci-docs-only-admission.cjs
      - id: source_scope
        name: Exclude proven Rustdoc-only first-run PRs
        uses: actions/github-script@v7
        with:
          script: |
            const admit = require('./.github/scripts/ci-docs-only-admission.cjs');
            const verdict = await admit({github, context, baseBranches: ["dev"]});
            core.setOutput('run_source', String(verdict.run));
            core.info(verdict.reason);
      - id: resolve
        if: ${{ steps.source_scope.outputs.run_source == 'true' }}
        name: Validate source and successful previous CI evidence
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./.github/scripts/ci-impact-reuse.cjs');
            await resolve({
              github, context, core,
              workflowFile: 'native-cross-platform-pr.yml',
              requiredJobs: [{"prefix":"Native source correctness matrix / build (","count":12}]
            });

  native-source-matrix:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' }}
    name: Native source correctness matrix
    uses: ./.github/workflows/pytest.yml
