name: Native QASM3 and Rust source scientific contracts
on:
  pull_request:
    branches: [dev]
    paths:
      - 'rust/quprs/src/qasm.rs'
      - 'rust/quprs/src/ir.rs'
      - 'rust/quprs/src/rational.rs'
      - 'rust/quprs/src/gates.rs'
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'test/test_qasm3_python_global_phase.py'
      - 'test/test_rust_qasm3_subset.py'
      - 'test/test_rust_qasm_fail_closed.py'
      - 'test/test_rust_p_phase_semantics.py'
      - 'test/test_graphstate16_qiskit_provenance.py'
      - '.github/workflows/native-qasm3-contract.yml'
      - '.github/scripts/test-native-qasm-gate-unification.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-native:
    name: Single source-pinned wheel and native parser unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: native-qasm3-contract
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev libmpfr-dev libatomic1 zlib1g-dev
          python -m pip install --upgrade pip 'maturin>=1.5,<2'
      - name: Guard consolidated QASM scientific coverage and manual fallback
        run: node .github/scripts/test-native-qasm-gate-unification.cjs
      - name: Restore pinned Ganak archive when available
        uses: ./.github/actions/cache-ganak-release
      - name: Run exact source-native QASM parser unit controls
        run: |
          set -euo pipefail
          mkdir -p evidence dist
          cargo test --manifest-path rust/Cargo.toml -p quprs qasm::tests --lib --release -- --nocapture 2>&1 | tee evidence/rust-qasm3.log
      - name: Preserve native P and U1 phase-normalization unit proofs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml -p quprs gates::tests::test_apply_p --lib --release -- --nocapture 2>&1 | tee evidence/rust-p-phase.log
          cargo test --manifest-path rust/Cargo.toml -p quprs gates::tests::test_p_u1_relative_phase_unit_contract --lib --release -- --nocapture 2>&1 | tee evidence/rust-p-u1.log
      - name: Build public verifier wheel once
        run: |
          set -euo pipefail
          maturin build --release --interpreter python --out dist --compatibility off
          sha256sum dist/*.whl > dist/SHA256SUMS
          git rev-parse HEAD > dist/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qasm3-source-wheel
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qasm3-native-unit-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
  # One current-resolver scientific regression, not a pinned Qiskit major/minor matrix.
  public-parity:
    name: Public QASM3 Python/Rust / resolved Qiskit
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qasm3-source-wheel
          path: dist
      - name: Install actual candidate wheel with full dependency resolver
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(cat dist/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c dist/SHA256SUMS
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl 'pytest>=8,<9' 2>&1 | tee evidence/install.log
          python -m pip check 2>&1 | tee evidence/pip-check.log
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          from importlib.metadata import version
          print('RESOLVED_QISKIT_VERSION', version('qiskit'))
          PY
      - name: Exact-head public Rust, Python and fail-closed contract
        run: |
          set -euo pipefail
          python -m pytest -q -ra test/test_rust_qasm3_subset.py \
            test/test_qasm3_python_global_phase.py \
            test/test_rust_qasm_fail_closed.py::test_direct_unsupported_qasm_rejected_before_solver \
            --junitxml=evidence/qasm3-public-contract.xml \
            2>&1 | tee evidence/qasm3-public-contract.log
      - name: Independent public Rust source-rejection and P/U1 phase regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_rust_qasm_fail_closed.py \
            test/test_rust_p_phase_semantics.py \
            --junitxml=evidence/rust-qasm-source-safety.xml \
            2>&1 | tee evidence/rust-qasm-source-safety.log
      - name: Graphstate16 independent full-state Qiskit source oracle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_graphstate16_qiskit_provenance.py \
            --junitxml=evidence/graphstate-source-oracle.xml \
            2>&1 | tee evidence/graphstate-source-oracle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qasm3-public-resolved
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
