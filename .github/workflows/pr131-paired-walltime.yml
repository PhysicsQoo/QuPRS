name: PR131 controlled same-host cross-method CodSpeed

on:
  # Existing opt-in PR label; do not trigger full matrix on every synchronize.
  pull_request:
    branches: [dev]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cross-method:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 131 && github.event.label.name == 'ci-pr131-walltime') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source-pinned HEAD harness and fixture
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Checkout source-pinned base (same host)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: recursive
          path: cross-method-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GMP and MPFR build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Build two exact revisions with distinct Rust/Python environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C cross-method-base rev-parse HEAD)" = "$BASE_SHA"
          for revision in base head; do
            root="$GITHUB_WORKSPACE"
            if [[ "$revision" == "base" ]]; then root="$GITHUB_WORKSPACE/cross-method-base"; fi
            venv="$RUNNER_TEMP/cross-method-$revision"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check maturin
            (cd "$root"; VIRTUAL_ENV="$venv" "$venv/bin/maturin" develop --release -E dev)
            "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/cross-method-$revision-freeze.txt"
            git -C "$root" rev-parse HEAD:GPMC > "$RUNNER_TEMP/cross-method-$revision-gpmc.sha"
          done
          "$RUNNER_TEMP/cross-method-head/bin/python" -m pip install --disable-pip-version-check pytest-codspeed==5.0.3
          "$RUNNER_TEMP/cross-method-head/bin/python" -m pytest test/test_cross_method_paired_report.py -q
          "$RUNNER_TEMP/cross-method-head/bin/python" -m pytest benchmarks/codspeed/test_cross_method_paired.py --collect-only -q
      - name: CodSpeed same-host complete cross-method WallTime
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: ${{ runner.temp }}/cross-method-head/bin/python -m pytest benchmarks/codspeed/test_cross_method_paired.py -k cross_method_walltime -q --codspeed --codspeed-max-rounds=2 --codspeed-max-time=12
      - name: Validate full WallTime pairing and distinct scientific evidence
        shell: bash
        run: |
          "$RUNNER_TEMP/cross-method-head/bin/python" scripts/report_cross_method_paired.py --instrument walltime --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --provenance "$RUNNER_TEMP/cross-method-walltime.jsonl" --json cross-method-walltime-audit.json --summary "$GITHUB_STEP_SUMMARY"
      - name: CodSpeed paired CPU Simulation with tracked verifier and Solver subprocesses
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          run: ${{ runner.temp }}/cross-method-head/bin/python -m pytest benchmarks/codspeed/test_cross_method_paired.py -k cross_method_cpu -q --codspeed
      - name: Validate same-host subprocess CPU pairings
        shell: bash
        run: |
          "$RUNNER_TEMP/cross-method-head/bin/python" scripts/report_cross_method_paired.py --instrument simulation --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --provenance "$RUNNER_TEMP/cross-method-simulation.jsonl" --json cross-method-cpu-audit.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-method source/metric provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr131-cross-method-codspeed-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/cross-method-base-freeze.txt
            ${{ runner.temp }}/cross-method-head-freeze.txt
            ${{ runner.temp }}/cross-method-base-gpmc.sha
            ${{ runner.temp }}/cross-method-head-gpmc.sha
            ${{ runner.temp }}/cross-method-walltime.jsonl
            ${{ runner.temp }}/cross-method-simulation.jsonl
            cross-method-walltime-audit.json
            cross-method-cpu-audit.json
