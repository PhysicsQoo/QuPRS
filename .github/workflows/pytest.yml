# .github/workflows/pytest.yml

name: Python Pytest CI

# Trigger this workflow on push or pull request to main branch
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
      - 'scripts/hatch_build.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build:
        # Specify the runner environment
        runs-on: ${{ matrix.os }}

        # Test matrix for multiple operating systems
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14]
                include:
                - os: ubuntu-latest
                  arch: auto
                  name: "Linux x86_64"
                - os: ubuntu-24.04-arm   # ARM64 Linux
                  arch: aarch64
                  name: "Linux ARM64"
                - os: macos-15-intel    # Intel Mac (x86_64)
                  arch: "x86_64"  # Build only x86_64
                  name: "macOS Intel"
                - os: macos-14    # M1/M2 Mac (ARM64)
                  arch: "arm64"   # Build only arm64
                  name: "macOS Silicon"
        env:
          BINARY_DIR: src/QuPRS/utils
        steps:
          # Step 1: Checkout repository code
          - name: Check out repository code
            uses: actions/checkout@v4
            with:
              submodules: recursive
              fetch-depth: 0

          # Step 2: Set up Python environment
          - name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
              python-version: ${{ matrix.python-version }}
              cache: 'pip'
          # Step 3: Install system dependencies
          - name: Install system dependencies (Linux)
            if: runner.os == 'Linux'
            run: sudo apt-get update && sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          
          - name: Install system dependencies (macOS)
            if: runner.os == 'macOS'
            run: brew install cmake gmp mpfr zlib 
          - name: Export Compiler Paths (macOS)
            if: runner.os == 'macOS'
            run: |
              GMP=$(brew --prefix gmp)
              MPFR=$(brew --prefix mpfr)
              ZLIB=$(brew --prefix zlib) 
              echo "CFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> $GITHUB_ENV
              echo "LDFLAGS=-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib -L$ZLIB/lib -Wl,-rpath,$ZLIB/lib" >> $GITHUB_ENV

          - name: Setup MSYS2 and install dependencies (Windows)
            if: matrix.os == 'windows-latest'
            uses: msys2/setup-msys2@v2
            with:
              msystem: MINGW64
              update: true
              path-type: inherit
              install: >-
                mingw-w64-x86_64-zlib

          # Cache compiled GPMC/Ganak binaries
          - name: Cache Compiled Binaries (GPMC/Ganak)
            id: cache-wmc-tools
            uses: actions/cache@v4
            with:
               path: ${{ env.BINARY_DIR }}/wmc_tools
               key: ${{ matrix.os }}-${{ matrix.arch }}-wmc-tools-v0

          # Step 4: Install Python dependencies and build binary (Now split by platform)
          - name: Install and build (Unix)
            if: matrix.os != 'windows-latest'
            run: python -m pip install --upgrade pip && pip install .[dev]
          - name: Install and build (Windows)
            if: matrix.os == 'windows-latest'
            shell: msys2 {0}
            run: python -m pip install --upgrade pip && pip install .[dev]

          # Step 7: Run pytest (Now split by platform)
          - name: Run tests (Unix)
            if: matrix.os != 'windows-latest'
            run: pytest -n auto -v --junitxml=pytest-results.xml --html=pytest-results.html --self-contained-html --cov=QuPRS --cov-report=xml --cov-report=html
          - name: Run tests (Windows)
            if: matrix.os == 'windows-latest'
            shell: msys2 {0}
            run: pytest -n auto -v --junitxml=pytest-results.xml --html=pytest-results.html --self-contained-html --cov=QuPRS --cov-report=xml --cov-report=html

          # Step 5: Upload pytest HTML results as artifact
          - name: Upload pytest HTML results
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: pytest-results-html-${{ matrix.os }}-${{ matrix.python-version }}
              path: pytest-results.html

          # Step 6: Upload pytest XML results as artifact
          - name: Upload pytest XML results
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: pytest-results-xml-${{ matrix.os }}-${{ matrix.python-version }}
              path: pytest-results.xml
          # Step 7: Upload coverage XML report  
          - name: Upload coverage XML report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: coverage-report-xml-${{ matrix.os }}-${{ matrix.python-version }}
              path: coverage.xml

          # Step 8: Upload coverage HTML report  
          - name: Upload coverage HTML report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: coverage-report-html-${{ matrix.os }}-${{ matrix.python-version }}
              path: htmlcov
            