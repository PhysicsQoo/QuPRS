# .github/workflows/pytest.yml

name: Python Pytest CI

# Full cross-platform integration coverage for dev/main pushes and explicit reusable/manual invocations.
on:
  workflow_call:
    inputs:
      require_full_matrix:
        description: 'Reusable callers always retain the full 12-platform matrix'
        type: boolean
        required: false
        default: true
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'test/**'
      - 'benchmarks/**'
      - 'scripts/paper_corpus_audit.py'
      - 'scripts/check_benchmark_evidence.py'
      - 'docs/development/paper-corpus-manifest.json'
      - 'rust/**'
      - 'pyproject.toml'
      - 'scripts/check_coverage_xml.py'
      - '.github/workflows/pytest.yml'
      - '.github/scripts/ci-pytest-push-impact.cjs'
      - '.github/scripts/test-pytest-push-impact.cjs'
      - '.github/scripts/codspeed-pr-impact.cjs'
  workflow_dispatch:

concurrency:
  # Distinct push SHAs cannot cancel one another, including docs-only pushes.
  # Keep stale-run cancellation for non-push callers.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  source-admission:
    name: Pytest push source admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test Pytest source-routing safety contracts
        run: node .github/scripts/test-pytest-push-impact.cjs
      - name: Test coverage XML positive and failure contracts
        run: python3 -m unittest discover -s test -p 'test_coverage_xml_validation.py'
      - id: scope
        name: Verify exact push source before allocating 12-platform matrix
        uses: actions/github-script@v7
        env:
          REQUIRE_FULL_MATRIX: ${{ inputs.require_full_matrix }}
        with:
          script: |
            const decide = require('./.github/scripts/ci-pytest-push-impact.cjs');
            const verdict = await decide({
              github, context,
              forceFullMatrix: process.env.REQUIRE_FULL_MATRIX === 'true'
            });
            core.setOutput('run_heavy', String(verdict.run));
            core.info(verdict.reason);
  build:
    needs: [source-admission]
    if: ${{ needs.source-admission.outputs.run_heavy == 'true' }}
    # Specify the runner environment
    runs-on: ${{ matrix.os }}
    # Resource safety ceiling, not a software-correctness assertion. An exhausted
    # runner leaves this matrix slot INCONCLUSIVE until the exact slot is retried.
    # Avoid turning a short runner stall into a false application regression.
    timeout-minutes: 60

    # Test matrix for multiple operating systems
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        include:
          - os: ubuntu-latest
            arch: auto
            name: "Linux x86_64"
          - os: ubuntu-24.04-arm   # ARM64 Linux
            arch: aarch64
            name: "Linux ARM64"
          - os: macos-15-intel    # Intel Mac (x86_64)
            arch: "x86_64"  # Build only x86_64
            name: "macOS Intel"
          - os: macos-15    # Apple Silicon arm64; matches the macOS 15+ wheel support minimum
            arch: "arm64"   # Build only arm64
            name: "macOS Silicon"
    env:
      BINARY_DIR: src/QuPRS/utils
    steps:
      # Step 1: Checkout repository code
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Enforce submodule-free source checkout for default Python/Rust builds
        run: test ! -f GPMC/CMakeLists.txt

      # Step 2: Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      # Verify the actual published archive once per native OS/architecture,
      # without replacing the default source-built solver or spawning it.
      - name: Cache pinned GPMC CLI release
        if: matrix.python-version == '3.12'
        uses: actions/cache@v4
        with:
          path: rust/target/gpmc-release-cache
          key: gpmc-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/QuPRS/utils/gpmc-release.txt') }}
      - name: Verify pinned GPMC release archive and provenance
        if: matrix.python-version == '3.12'
        run: python scripts/install_gpmc_release.py --verify-only

      # ==========================================
      # Rust env and cache
      # ==========================================
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ${{ matrix.os }}-${{ matrix.arch }}-ganak-2.8.0-${{ hashFiles('src/QuPRS/utils/ganak-release.txt') }}

      # ==========================================
      # System Dependencies Installation
      # ==========================================
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake gmp mpfr zlib 
      - name: Export Compiler Paths (macOS)
        if: runner.os == 'macOS'
        run: |
          GMP=$(brew --prefix gmp)
          MPFR=$(brew --prefix mpfr)
          ZLIB=$(brew --prefix zlib) 
          echo "CFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib -L$ZLIB/lib -Wl,-rpath,$ZLIB/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$GMP/lib:$MPFR/lib:$ZLIB/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Setup MSYS2 and install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-zlib

      # ==========================================
      # Compilation & Installation
      # ==========================================
      # Cache compiled GPMC/Ganak binaries
      - name: Cache Compiled Binaries (GPMC/Ganak)
        id: cache-wmc-tools
        uses: actions/cache@v4
        with:
           path: ${{ env.BINARY_DIR }}/wmc_tools
           key: ${{ matrix.os }}-${{ matrix.arch }}-ganak-2.8.0-${{ hashFiles('src/QuPRS/utils/ganak-release.txt') }}

      - name: Restore pinned Ganak archive when available
        uses: ./.github/actions/cache-ganak-release
      - name: Install and build (Unix)
        if: matrix.os != 'windows-latest'
        run: | 
          python -m pip install --upgrade pip 
          pip install maturin
          export VIRTUAL_ENV=$(dirname $(dirname $(which python)))
          maturin develop --release -E dev
      - name: Install and build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: | 
          python -m pip install --upgrade pip 
          pip install maturin
          $PYTHON_EXE = (Get-Command python).Source
          $VENV_PATH = (Split-Path (Split-Path $PYTHON_EXE -Parent) -Parent)
          $env:VIRTUAL_ENV = $VENV_PATH
          maturin develop --release -E dev

      # ==========================================
      # Testing & Coverage
      # ==========================================
      # Exercise the actual isolated .crate once on Apple Silicon using the
      # solvers already produced by this matrix's source build.
      - name: Validate extracted quprs Rust crate on macOS ARM64
        if: matrix.os == 'macos-15' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/quprs-macos-candidate"
          unpack="$RUNNER_TEMP/quprs-macos-unpacked"
          python scripts/stage_rust_crate_candidate.py --output "$candidate"
          cargo package --manifest-path "$candidate/Cargo.toml" --no-verify
          version="$(python -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' "$candidate/Cargo.toml")"
          archive="$candidate/target/package/quprs-$version.crate"
          test -s "$archive"
          mkdir -p "$unpack"
          tar -xzf "$archive" -C "$unpack"
          crate="$unpack/quprs-$version"
          cmp "$crate/src/ganak-release.txt" src/QuPRS/utils/ganak-release.txt
          export QUPRS_GPMC_PATH="$GITHUB_WORKSPACE/src/QuPRS/utils/wmc_tools/gpmc"
          export QUPRS_GANAK_PATH="$GITHUB_WORKSPACE/src/QuPRS/utils/wmc_tools/ganak"
          test -x "$QUPRS_GPMC_PATH"
          test -x "$QUPRS_GANAK_PATH"
          cargo test --manifest-path "$crate/Cargo.toml" --test external_wmc -- --list | grep -F "wmc_only_x_uses_real_ganak: test"
          cargo test --manifest-path "$crate/Cargo.toml" --test external_wmc
          cargo test --manifest-path "$crate/Cargo.toml" --test public_api_parity
          QUPRS_GPMC_PATH="$RUNNER_TEMP/quprs-missing-gpmc" cargo test \
            --manifest-path "$crate/Cargo.toml" --test external_wmc \
            missing_solver_fails_closed -- --ignored
      - name: Verify source default GPMC release executes and matches Python SolverAdapter
        if: matrix.os != 'windows-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          test ! -f GPMC/CMakeLists.txt
          test -x src/QuPRS/utils/wmc_tools/gpmc
          python scripts/check_gpmc_release_runtime.py \
            --binary src/QuPRS/utils/wmc_tools/gpmc --adapter
      - name: Verify pinned solver distribution (Unix)
        if: matrix.os != 'windows-latest'
        run: python -m QuPRS.utils.ganak_distribution

      # quprs is a Python-independent Rust crate; its default features and
      # source-tested solvers are identical across Python interpreter versions.
      # Keep one locked Rust correctness run on every OS/architecture.
      - name: Run Rust source tests (once per OS)
        if: matrix.os != 'windows-latest' && matrix.python-version == '3.12'
        run: cargo test --locked --manifest-path rust/Cargo.toml -p quprs

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        # faulthandler below emits stacks after 180 s, but does NOT fail tests.
        # Do not impose a short pytest-only timeout on potentially slow runners.
        run: |
          pytest -n auto -v -ra \
          -o faulthandler_timeout=180 \
          --durations=20 \
          --junitxml=pytest-results.xml \
          --html=pytest-results.html --self-contained-html \
          --cov=src/QuPRS --cov-report=xml --cov-report=html
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: >
          pytest -n auto -v -ra 
          --junitxml=pytest-results.xml 
          --html=pytest-results.html --self-contained-html 
          --cov=src/QuPRS --cov-report=xml --cov-report=html

      - name: Audit representative benchmark outcomes
        if: ${{ always() && !cancelled() }}
        run: python scripts/check_benchmark_evidence.py --junit pytest-results.xml --json benchmark-evidence.json

      # Report-only provenance for possible exact-tree PR→dev evidence reuse.
      # This NEVER skips a platform test; runner image and resolved packages
      # may drift even when the Git tree and test commands are unchanged.
      - name: Seal native matrix source and environment witness
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
          TEST_STEP_STATUS: ${{ job.status }}
        run: python scripts/ci_native_matrix_fingerprint.py --output native-matrix-evidence.json

      # ==========================================
      # Artifact Uploads
      # ==========================================
      - name: Upload pytest HTML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-html-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.html

      - name: Upload pytest XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            benchmark-evidence.json
            native-matrix-evidence.json
          
      - name: Upload coverage XML report  
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      # Keep a diagnostic XML artifact when tests fail, but only publish valid
      # coverage from a successful matrix job to the Codecov dashboard.
      - name: Validate coverage XML for reporting
        id: validate-coverage
        if: ${{ always() && !cancelled() }}
        run: python scripts/check_coverage_xml.py coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ success() && steps.validate-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
