#.github/workflows/python-publish.yml

name: Build and Publish Python Package

# Workflow Triggers:
# 1. Push a v* tag: verify tag/version/main SHA, build wheels and sdist,
#    then automatically publish to PyPI and create a public GitHub Release.
# 2. workflow_dispatch: build and test the selected branch (packaging dry-run),
#    upload artifacts, and never publish.
# 3. PRs changing packaging/release gate inputs: build nonpublishing wheels and
#    sdist and verify clean artifact installations on the supported matrix.
#    Ordinary branch pushes do not run the release workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      recover_tag:
        description: 'Existing signed release tag for Rust-only recovery (blank for dry-run)'
        required: false
        type: string
        default: ''
      source_run_id:
        description: 'Original tag-triggered release run ID (required with recover_tag)'
        required: false
        type: string
        default: ''
  # dev PRs get packaging preflight; main PRs use Release-Ready Main's
  # reusable artifact matrix exactly once. Tag publication is unchanged.
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/python-publish.yml'
      - 'scripts/verify_crates_io_registry_state.py'
      - 'scripts/reconcile_crates_io_publish.py'
      - 'test/test_crates_io_publish_recovery.py'
      - 'scripts/test_release_ready_policy.js'
      - 'test/test_crates_io_registry_state.py'
      - 'scripts/release_artifact_smoke.py'
      - 'scripts/check_installed_typing.py'
      - 'src/QuPRS/py.typed'
      - '.github/workflows/release-artifact-ci.yml'
      - 'scripts/verify_macos_wheel_support.py'
      - 'test/test_macos_wheel_support.py'
      - 'rust/Cargo.toml'
      - 'src/QuPRS/_version.py'
      - 'pyproject.toml'

# Only a newer HEAD of the *same PR* may cancel its obsolete package matrix.
# Manual dry runs and official tag publications have unique concurrency groups.
concurrency:
  group: python-publish-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify_release_ref:
    name: Verify version and release ref
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source for verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Cargo/Python version and tagged main commit
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          import sys
          sys.path.insert(0, "scripts")
          from release_version import python_from_cargo
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text())
          workspace_version = cargo["workspace"]["package"]["version"]
          version_module = Path("src/QuPRS/_version.py").read_text()
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', version_module, re.MULTILINE)
          if not match or match.group(1) != python_from_cargo(workspace_version):
              raise SystemExit(
                  f"Cargo version {workspace_version} != Python version "
                  f"{match.group(1) if match else '<missing>'}"
              )

          if os.environ["RELEASE_EVENT"] == "push" and os.environ["RELEASE_REF_TYPE"] == "tag":
              expected_tag = f"v{workspace_version}"
              actual_tag = os.environ["RELEASE_REF_NAME"]
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Tag {actual_tag!r} != expected {expected_tag!r}"
                  )
              print(f"Release version verified: {expected_tag}")
          elif os.environ["RELEASE_EVENT"] == "workflow_dispatch" or (
              os.environ["RELEASE_EVENT"] == "push"
              and os.environ["RELEASE_REF_TYPE"] == "branch"
          ):
              print(f"Packaging dry-run for version {workspace_version}; no publishing")
          else:
              print(f"PR-only preflight for version {workspace_version}; no build or publish")
          PY

          if [[ "$RELEASE_EVENT" == "push" && "$RELEASE_REF_TYPE" == "tag" ]]; then
            # Tag must point to latest protected main commit, not a feature
            # branch or an outdated main ancestor.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            tag_commit="$(git rev-parse HEAD)"
            main_commit="$(git rev-parse refs/remotes/origin/main)"
            echo "Release tag commit: $tag_commit"
            echo "Current main commit: $main_commit"
            if [[ "$tag_commit" != "$main_commit" ]]; then
              echo "::error::Release tag must point at the current main HEAD"
              exit 1
            fi
          fi

      - name: Check crates.io API from this runner without publishing
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 2 \
            --user-agent 'QuPRS-release/1.0 (+https://github.com/PhysicsQoo/QuPRS)' \
            --header 'Accept: application/json' \
            --output "$RUNNER_TEMP/crates-api-probe.json" \
            https://crates.io/api/v1/crates/quprs
          python3 - "$RUNNER_TEMP/crates-api-probe.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as file:
              record = json.load(file)
          if record.get("crate", {}).get("name") != "quprs":
              raise SystemExit("crates.io did not return expected package metadata")
          PY

      - name: Verify release publication safety policy
        run: |
          node scripts/test_release_ready_policy.js
          python3 scripts/verify_release_artifact_workflow_parity.py --self-test
          python -m unittest discover -s test -p 'test_pypi_publish_recovery.py'
          python -m unittest discover -s test -p 'test_crates_io_registry_state.py'
          python -m unittest discover -s test -p 'test_crates_io_publish_recovery.py'

      - name: Verify reproducible locked native crate archives without uploading
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          cargo --version
          for attempt in first second; do
            candidate="$RUNNER_TEMP/quprs-package-$attempt"
            python3 scripts/stage_rust_crate_candidate.py --output "$candidate"
            cargo package --manifest-path "$candidate/Cargo.toml" --locked --no-verify
            test -s "$candidate/target/package/quprs-$version.crate"
          done
          sha256sum "$RUNNER_TEMP"/quprs-package-{first,second}/target/package/"quprs-$version.crate"
          cmp "$RUNNER_TEMP/quprs-package-first/target/package/quprs-$version.crate" \
              "$RUNNER_TEMP/quprs-package-second/target/package/quprs-$version.crate"

      - name: Check platform support statements against deployment policy
        run: |
          python scripts/verify_macos_wheel_support.py
          python -m unittest discover -s test -p 'test_macos_wheel_support.py'

  # --- Job 1: Build Cross-Platform Wheels ---
  # This job runs on all triggers and builds binary wheels for multiple platforms.
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: verify_release_ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            name: "Linux x86_64"
          - os: ubuntu-24.04-arm   # ARM64 Linux
            arch: aarch64
            name: "Linux ARM64"
          - os: macos-15-intel    # Intel Mac (x86_64)
            arch: "x86_64"  # Build only x86_64
            name: "macOS Intel"
          - os: macos-15    # ARM64 release wheels target macOS 15+; source smoke is separate
            arch: "arm64"   # Build only arm64
            name: "macOS Silicon"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Export Compiler Paths (macOS)
        if: runner.os == 'macOS'
        run: |
          GMP=$(brew --prefix gmp)
          MPFR=$(brew --prefix mpfr)
          
          # Release wheel deployment minimum is macOS 15.0.
          # A macOS 14 sdist smoke is not evidence of macOS 14 wheel compatibility.
            echo "CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=15.0 CFLAGS=\"-I$GMP/include -I$MPFR/include\" LDFLAGS=\"-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib\" CMAKE_PREFIX_PATH=\"$GMP;$MPFR\"" >> $GITHUB_ENV          

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

          # Install the built wheel with its dev extras, not the source tree.
          CIBW_TEST_EXTRAS: dev
          CIBW_TEST_COMMAND: >-
            python -c "from pathlib import Path; from importlib.metadata import distribution, version;
            import QuPRS; import QuPRS._pathsum_rust as ext; from QuPRS._version import __version__;
            root = Path(distribution('QuPRS').locate_file('')).resolve();
            assert Path(QuPRS.__file__).resolve().is_relative_to(root), QuPRS.__file__;
            assert Path(ext.__file__).resolve().is_relative_to(root), ext.__file__;
            assert version('QuPRS') == __version__"
            && pytest -n auto -k "not (Feynman or MQT)" {project}/test

      - name: Validate built macOS wheel tags and metadata
        if: runner.os == 'macOS'
        run: python scripts/verify_macos_wheel_support.py --wheel-dir wheelhouse --arch "${{ matrix.arch }}"

      - name: Upload wheel artifacts (for all builds - general purpose)
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload wheel artifacts (for PyPI release - only on tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
  # --- Job 2: Build Source Distribution (Sdist) ---
  # This job runs on all triggers and builds the source distribution.
  build_sdist:
    name: Build source distribution
    needs: verify_release_ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build tool
        run: pip install build maturin

      - name: Clean up existing dist directory
        run: rm -rf dist/

      - name: Build sdist with build module
        run: python -m build --sdist

      - name: Upload sdist artifact (for all builds - general purpose)
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist artifact (for PyPI release - only on tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error


  # --- Release candidate gate: install actual archives, not a source editable build. ---
  artifact_install:
    name: Wheel smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [verify_release_ref, build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install gmp mpfr zlib
          else
            sudo apt-get update
            sudo apt-get install -y libgmp10 libmpfr6 zlib1g
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: all-builds-dist-wheels-*
          path: ${{ runner.temp }}/candidate-wheels
          merge-multiple: true
      - name: Install compatible wheel from this run, never PyPI QuPRS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip packaging
          export WHEEL_DIR="$RUNNER_TEMP/candidate-wheels"
          export QU_VERSION="$(python scripts/release_version.py --kind python)"
          export LOCAL_WHEEL="$(python - <<'PY'
          import os
          from pathlib import Path
          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename
          candidates = []
          supported = set(sys_tags())
          for wheel in sorted(Path(os.environ["WHEEL_DIR"]).glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              if str(name) == "quprs" and str(version) == os.environ["QU_VERSION"] and (tags & supported):
                  candidates.append(wheel)
          if len(candidates) != 1:
              raise SystemExit(f"Expected one compatible current-build QuPRS wheel, got {candidates}")
          print(candidates[0])
          PY
          )"
          python -m pip install "$LOCAL_WHEEL"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/release_artifact_smoke.py" --expected-version "$QU_VERSION"

      # The PR and tag workflow has its own artifact-install jobs; keep the
      # same representative consumer typing gate as release-artifact-ci.yml.
      - name: Check wheel typing from outside source with mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'mypy==1.18.2'
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/check_installed_typing.py" --mypy
      - name: Run published Python examples against the installed wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/check_docs_examples.py" --installed

  sdist_install:
    name: Sdist smoke (${{ matrix.os }}, py3.12)
    needs: [verify_release_ref, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native source-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install cmake gmp mpfr zlib
          else
            sudo apt-get update
            sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          fi
      - uses: actions/download-artifact@v4
        with:
          name: all-builds-dist-sdist
          path: ${{ runner.temp }}/candidate-sdist
      - name: Install the candidate source archive into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python scripts/release_version.py --kind python)"
          SDIST_COUNT="$(find "$RUNNER_TEMP/candidate-sdist" -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')"
          if [[ "$SDIST_COUNT" -ne 1 ]]; then
            echo "::error::Expected one release source archive, got $SDIST_COUNT"
            exit 1
          fi
          SDIST="$(find "$RUNNER_TEMP/candidate-sdist" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          python -m venv "$RUNNER_TEMP/quprs-sdist-env"
          source "$RUNNER_TEMP/quprs-sdist-env/bin/activate"
          python -m pip install --upgrade pip
          cd "$RUNNER_TEMP"
          python -m pip install --no-cache-dir "$SDIST"
          python "$GITHUB_WORKSPACE/scripts/release_artifact_smoke.py" --expected-version "$VERSION"
      - name: Run published Python examples against the installed sdist
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/quprs-sdist-env/bin/activate"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/check_docs_examples.py" --installed

  # --- Job 3: Publish to PyPI only after native registry preflight ---
  # No registry writes are permitted until the tagged source, both Python
  # archives, the native crate, and crates.io Trusted Publishing are admitted.
  rust_preflight:
    name: Validate Rust crate and crates.io identity (no upload)
    needs: verify_release_ref
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require an explicitly enabled dual-registry release
        env:
          CRATES_IO_PUBLISH_ENABLED: ${{ vars.QUPRS_CRATES_IO_PUBLISH_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CRATES_IO_PUBLISH_ENABLED" != "true" ]]; then
            echo "::error::Dual-registry release requires QUPRS_CRATES_IO_PUBLISH_ENABLED=true"
            exit 1
          fi

      - name: Checkout immutable signed release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag still points at main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Stage, package and verify the exact native crate
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --list --locked \
            | tee "$RUNNER_TEMP/quprs-crate-files.txt"
          grep -Fxq "README.md" "$RUNNER_TEMP/quprs-crate-files.txt"
          grep -Fxq "src/lib.rs" "$RUNNER_TEMP/quprs-crate-files.txt"
          cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --dry-run --locked
          # A successful publish dry-run verifies the unpacked crate, but Cargo
          # does not guarantee a persistent archive at the expected path.
          # Explicitly package the same locked sources for upload hand-off.
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked --no-verify
          crate="$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate"
          test -s "$crate"
          mkdir -p "$RUNNER_TEMP/quprs-native-assets"
          cp "$crate" "$RUNNER_TEMP/quprs-native-assets/"
          (cd "$RUNNER_TEMP/quprs-native-assets" && sha256sum "quprs-$version.crate" > SHA256SUMS)

      - name: Save the reviewed Rust crate archive
        uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/quprs-native-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify crates.io registry access before PyPI publication
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://crates.io/api/v1/crates/quprs/$version"
          code="$(curl --silent --show-error --location \
            --user-agent 'QuPRS-release/1.0 (+https://github.com/PhysicsQoo/QuPRS)' \
            --header 'Accept: application/json' \
            --retry 4 --retry-delay 2 \
            --output "$RUNNER_TEMP/crates-io-preflight.json" \
            --write-out '%{http_code}' "$url")"
          case "$code" in
            200)
              python3 scripts/verify_crates_io_registry_state.py \
                "$version" "$RUNNER_TEMP/quprs-native-assets/quprs-$version.crate" \
                "$RUNNER_TEMP/crates-io-preflight.json"
              ;;
            404)
              echo "crates.io registry accessible; version has not been published"
              ;;
            *)
              printf '::error::crates.io registry preflight returned HTTP %s\n' "$code"
              if [[ "$code" == "403" ]]; then
                python3 - "$RUNNER_TEMP/crates-io-preflight.json" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          if path.is_file():
              detail = path.read_text(encoding="utf-8", errors="replace")[:500]
              print("Registry response: " + detail.replace("\r", " ").replace("\n", " "))
          PY
              fi
              exit 1
              ;;
          esac

      # The action mints and revokes a temporary token. This job never publishes.
      - name: Verify crates.io GitHub OIDC authorization without uploading
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  publish:
    name: Publish verified Python artifacts to PyPI
    needs: [verify_release_ref, build_wheels, build_sdist, artifact_install, sdist_install, rust_preflight]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out immutable source for PyPI artifact reconciliation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified Python distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          path: dist
          merge-multiple: true

      - name: Verify distribution inventory
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*.whl' >/dev/null
          compgen -G 'dist/*.tar.gz' >/dev/null

      - name: Reconcile immutable PyPI files before any upload
        id: pypi_plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_pypi_artifacts.py plan \
            --version "${GITHUB_REF_NAME#v}" \
            --dist-dir dist --upload-dir pypi-to-upload

      - name: Publish only missing, preverified Python artifacts
        if: steps.pypi_plan.outputs.publish_required == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-to-upload/

      - name: Verify all PyPI archive hashes after publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_pypi_artifacts.py verify \
            --version "${GITHUB_REF_NAME#v}" --dist-dir dist

  publish_crates_io:
    name: Publish matching Rust crate to crates.io
    needs: [verify_release_ref, rust_preflight, publish]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') &&
          vars.QUPRS_CRATES_IO_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved immutable tag and Python/Rust versions
        shell: bash
        run: |
          set -euo pipefail
          # The prerelease gate already admitted the exact tag against main.
          # Do not reject the same immutable source if main moves after PyPI upload.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib
          import sys
          sys.path.insert(0, "scripts")
          from release_version import python_from_cargo
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text())
          version = cargo["workspace"]["package"]["version"]
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', Path("src/QuPRS/_version.py").read_text(), re.M)
          assert match and match.group(1) == python_from_cargo(version)
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          assert cargo["workspace"]["package"]["publish"] is False
          PY

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Download the preflight crate checksum
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/quprs-native-assets

      - name: Rebuild staged crate and match preflight bytes before upload
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked
          cd "$RUNNER_TEMP/quprs-crate/target/package"
          cp "$RUNNER_TEMP/quprs-native-assets/SHA256SUMS" .
          sha256sum -c SHA256SUMS
          test -s "quprs-$version.crate"

      - name: Admit a previously published identical crate on safe retries
        id: registry_state
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate="quprs-$version.crate"
          url="https://crates.io/api/v1/crates/quprs/$version"
          http_code="$(curl --silent --show-error --location \
            --user-agent 'QuPRS-release/1.0 (+https://github.com/PhysicsQoo/QuPRS)' \
            --header 'Accept: application/json' \
            --retry 4 --retry-delay 2 \
            --output "$RUNNER_TEMP/registry-version.json" \
            --write-out '%{http_code}' "$url")"
          if [[ "$http_code" == "200" ]]; then
            # A retry is safe only when the published bytes match the reviewed archive.
            python3 scripts/verify_crates_io_registry_state.py \
              "$version" "$RUNNER_TEMP/quprs-crate/target/package/$crate" \
              "$RUNNER_TEMP/registry-version.json"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$http_code" == "404" ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            printf '::error::Cannot verify crates.io version metadata (HTTP %s)\n' "$http_code"
            if [[ "$http_code" == "403" ]]; then
              python3 - "$RUNNER_TEMP/registry-version.json" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          if path.is_file():
              detail = path.read_text(encoding="utf-8", errors="replace")[:500]
              print("Registry response: " + detail.replace("\r", " ").replace("\n", " "))
          PY
            fi
            exit 1
          fi
      - name: Obtain short-lived crates.io publishing token
        id: crates_io_auth
        if: steps.registry_state.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the matching native crate
        if: steps.registry_state.outputs.already_published == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          cargo_exit=0
          cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --registry crates-io --locked \
            2>&1 | tee "$RUNNER_TEMP/quprs-cargo-publish.log" || cargo_exit=$?
          # Never upload again to resolve an uncertain Cargo registry-index wait.
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/reconcile_crates_io_publish.py \
            "$version" "$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate" \
            "$RUNNER_TEMP/quprs-cargo-publish.log" "$cargo_exit"
          (cd "$RUNNER_TEMP/quprs-crate/target/package" && sha256sum -c SHA256SUMS)

  github_release:
    name: Create GitHub Release after both registries publish
    needs: [verify_release_ref, rust_preflight, publish, publish_crates_io]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Python release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          path: ${{ runner.temp }}/python-dist
          merge-multiple: true

      - name: Download verified native Rust archive
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/rust-dist

      - name: Check registry archive matches and prepare release attachments
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python_version="${version/-beta./b}"
          python_version="${python_version/-rc./rc}"
          python_version="${python_version/-alpha./a}"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          crate="quprs-$version.crate"
          mkdir -p "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/rust-dist" && sha256sum -c SHA256SUMS)
          # crates.io stores the published .crate bytes. Check them, not just a
          # independently repackaged source tree or the registry version name.
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --silent --show-error \
            "https://static.crates.io/crates/quprs/$crate" \
            --output "$RUNNER_TEMP/registry-$crate"
          cmp "$RUNNER_TEMP/rust-dist/$crate" "$RUNNER_TEMP/registry-$crate"
          cp "$RUNNER_TEMP/python-dist"/* "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/registry-$crate" "$RUNNER_TEMP/release-assets/$crate"
          compgen -G "$RUNNER_TEMP/release-assets/*.whl" >/dev/null
          compgen -G "$RUNNER_TEMP/release-assets/*.tar.gz" >/dev/null
          (cd "$RUNNER_TEMP/release-assets" && sha256sum -- *.whl *.tar.gz *.crate > SHA256SUMS.txt)

      - name: Create GitHub Release with Python and Rust artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body: |
            ## QuPRS ${{ github.ref_name }}

            Python: [QuPRS on PyPI](https://pypi.org/project/QuPRS/${{ steps.prepare.outputs.python_version }}/) — install with `pip install QuPRS==${{ steps.prepare.outputs.python_version }}`.

            Rust: [quprs on crates.io](https://crates.io/crates/quprs/${{ steps.prepare.outputs.version }}) — install with `cargo add quprs@${{ steps.prepare.outputs.version }}`. Native Hybrid/WMC execution requires an external GPMC or Ganak solver.

            [Changelog](https://github.com/PhysicsQoo/QuPRS/blob/${{ github.ref_name }}/CHANGELOG.md).

            This release includes Python wheels, Python source distribution, the matching published Rust .crate and SHA-256 checksums.
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true


  # Manual recovery reuses this exact trusted publisher identity without
  # republishing Python. Both the tag and original release run are immutable inputs.
  recover_crates_io:
    name: Recover Rust crate from a verified release run
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.recover_tag != '' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      tag_commit: ${{ steps.source.outputs.tag_commit }}
    steps:
      - name: Validate recovery request against original tag-triggered run
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.recover_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CRATES_IO_PUBLISH_ENABLED: ${{ vars.QUPRS_CRATES_IO_PUBLISH_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$CRATES_IO_PUBLISH_ENABLED" != "true" ]]; then
            echo "::error::Rust registry publishing is not enabled"
            exit 1
          fi
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || exit 1
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$RUNNER_TEMP/recovery-source-run.json"

      - name: Checkout original release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recover_tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify original source commit and versions
        id: source
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          tag_commit="$(git -C release-source rev-parse HEAD)"
          test "$(git -C release-source cat-file -t "refs/tags/$RECOVERY_TAG")" = tag
          python3 - "$RUNNER_TEMP/recovery-source-run.json" "$RECOVERY_TAG" "$tag_commit" <<'PY'
          import json
          import sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          if (record.get("event") != "push"
                  or record.get("path") != ".github/workflows/python-publish.yml"
                  or record.get("head_branch") != sys.argv[2]
                  or record.get("head_sha") != sys.argv[3]):
              raise SystemExit("Source is not the original tag-triggered release")
          PY
          (
            cd release-source
            version="${RECOVERY_TAG#v}"
            python3 - "$version" <<'PY'
          from pathlib import Path
          import re
          import sys
          import tomllib
          sys.path.insert(0, "scripts")
          from release_version import python_from_cargo
          cargo_version = tomllib.loads(Path("rust/Cargo.toml").read_text())["workspace"]["package"]["version"]
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', Path("src/QuPRS/_version.py").read_text(), re.M)
          if cargo_version != sys.argv[1] or not match or match.group(1) != python_from_cargo(cargo_version):
              raise SystemExit("Recovery tag and Cargo/Python versions differ")
          PY
          )
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Download reviewed Rust archive from original run
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ steps.source.outputs.tag_commit }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovery-native-assets

      - name: Repackage tag and compare against original archive
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          version="${RECOVERY_TAG#v}"
          cd release-source
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked
          (cd "$RUNNER_TEMP/recovery-native-assets" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/recovery-native-assets/quprs-$version.crate" \
              "$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate"

      - name: Verify registry state before one permitted upload
        id: registry_state
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          version="${RECOVERY_TAG#v}"
          code="$(curl --silent --show-error --location \
            --user-agent 'QuPRS-release/1.0 (+https://github.com/PhysicsQoo/QuPRS)' \
            --header 'Accept: application/json' \
            --retry 4 --retry-delay 2 \
            --output "$RUNNER_TEMP/registry-version.json" \
            --write-out '%{http_code}' "https://crates.io/api/v1/crates/quprs/$version")"
          if [[ "$code" == "200" ]]; then
            python3 release-source/scripts/verify_crates_io_registry_state.py \
              "$version" "$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate" \
              "$RUNNER_TEMP/registry-version.json"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "404" ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            printf '::error::crates.io registry returned HTTP %s\n' "$code"
            exit 1
          fi

      - name: Obtain short-lived crates.io publishing token
        id: crates_io_auth
        if: steps.registry_state.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish original matching crate and confirm registry state
        if: steps.registry_state.outputs.already_published == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          QUPRS_SOLVER_PROVISION: external
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          version="${RECOVERY_TAG#v}"
          cd release-source
          cargo_exit=0
          cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --registry crates-io --locked \
            2>&1 | tee "$RUNNER_TEMP/quprs-cargo-publish.log" || cargo_exit=$?
          python3 scripts/reconcile_crates_io_publish.py \
            "$version" "$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate" \
            "$RUNNER_TEMP/quprs-cargo-publish.log" "$cargo_exit"
          cmp "$RUNNER_TEMP/recovery-native-assets/quprs-$version.crate" \
              "$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate"

  recover_github_release:
    name: Create GitHub Release after Rust-only recovery
    needs: recover_crates_io
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout original release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recover_tag }}
          path: release-source
          persist-credentials: false

      - name: Download original Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/python-dist
          merge-multiple: true

      - name: Download original Rust archive
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ needs.recover_crates_io.outputs.tag_commit }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-dist

      - name: Verify both registries and prepare release
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists; refusing to overwrite"
            exit 1
          fi
          version="${RECOVERY_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python_version="${version/-beta./b}"
          python_version="${python_version/-rc./rc}"
          python_version="${python_version/-alpha./a}"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          compgen -G "$RUNNER_TEMP/python-dist/*.whl" >/dev/null
          compgen -G "$RUNNER_TEMP/python-dist/*.tar.gz" >/dev/null
          python3 release-source/scripts/reconcile_pypi_artifacts.py verify \
            --version "$version" --dist-dir "$RUNNER_TEMP/python-dist"
          crate="quprs-$version.crate"
          (cd "$RUNNER_TEMP/rust-dist" && sha256sum -c SHA256SUMS)
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --user-agent 'QuPRS-release/1.0 (+https://github.com/PhysicsQoo/QuPRS)' \
            --silent --show-error \
            "https://static.crates.io/crates/quprs/$crate" \
            --output "$RUNNER_TEMP/registry-$crate"
          cmp "$RUNNER_TEMP/rust-dist/$crate" "$RUNNER_TEMP/registry-$crate"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/python-dist"/* "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/registry-$crate" "$RUNNER_TEMP/release-assets/$crate"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum -- *.whl *.tar.gz *.crate > SHA256SUMS.txt)

      - name: Create GitHub Release from original tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.recover_tag }}
          name: Release ${{ inputs.recover_tag }}
          prerelease: ${{ contains(inputs.recover_tag, '-') }}
          make_latest: ${{ contains(inputs.recover_tag, '-') && 'false' || 'true' }}
          body: |
            ## QuPRS ${{ inputs.recover_tag }}

            Python: [QuPRS on PyPI](https://pypi.org/project/QuPRS/${{ steps.prepare.outputs.python_version }}/) — install with pip install QuPRS==${{ steps.prepare.outputs.python_version }}.

            Rust: [quprs on crates.io](https://crates.io/crates/quprs/${{ steps.prepare.outputs.version }}) — install with cargo add quprs@${{ steps.prepare.outputs.version }}. Native Hybrid/WMC execution requires an external GPMC or Ganak solver.

            [Changelog](https://github.com/PhysicsQoo/QuPRS/blob/${{ inputs.recover_tag }}/CHANGELOG.md).

            This release includes Python wheels, Python source distribution, the matching published Rust .crate and SHA-256 checksums.
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
