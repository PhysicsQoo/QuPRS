#.github/workflows/python-publish.yml

name: Build and Publish Python Package

# Workflow Triggers:
# 1. Push a v* tag: validate immutable source and both packages, publish to
#    PyPI and crates.io in parallel, then create GitHub Release after both succeed.
# 2. workflow_dispatch without recover_tag: packaging dry-run, never publish.
#    With recover_tag: recover a signed existing tag from original build assets;
#    perform_publish defaults to false and must be explicitly enabled.
# 3. PRs changing packaging/release gates: build without publishing and verify
#    installed artifacts on supported platforms.
#    Ordinary branch pushes do not run the release workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      recover_tag:
        description: 'Existing signed release tag for Rust-only recovery (blank for dry-run)'
        type: string
        required: false
        default: ''
      source_run_id:
        description: 'Original tag release workflow run ID (required with recover_tag)'
        type: string
        required: false
        default: ''
      perform_publish:
        description: 'Publish missing Rust crate and create GitHub Release'
        type: boolean
        required: false
        default: false
  # dev PRs get packaging preflight; main PRs use Release-Ready Main's
  # reusable artifact matrix exactly once. Tag publication is unchanged.
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/python-publish.yml'
      - 'scripts/test_release_ready_policy.js'
      - 'scripts/release_artifact_smoke.py'
      - 'scripts/check_installed_typing.py'
      - 'src/QuPRS/py.typed'
      - '.github/workflows/release-artifact-ci.yml'
      - '.github/workflows/platform-wheel-ci.yml'
      - 'scripts/verify_macos_wheel_support.py'
      - 'test/test_macos_wheel_support.py'
      - 'rust/Cargo.toml'
      - 'src/QuPRS/_version.py'
      - 'pyproject.toml'

# Serialize tag publication and exceptional recovery of the same version.
# Only a newer HEAD of the same PR may cancel its obsolete package matrix.
concurrency:
  group: python-publish-${{ github.event_name == 'workflow_dispatch' && inputs.recover_tag != '' && format('release-{0}', inputs.recover_tag) || github.event_name == 'push' && github.ref_type == 'tag' && format('release-{0}', github.ref_name) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify_release_ref:
    name: Verify version and release ref
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.recover_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source for verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Cargo/Python version and tagged main commit
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          import sys
          sys.path.insert(0, "scripts")
          from release_version import python_from_cargo
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text())
          workspace_version = cargo["workspace"]["package"]["version"]
          version_module = Path("src/QuPRS/_version.py").read_text()
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', version_module, re.MULTILINE)
          if not match or match.group(1) != python_from_cargo(workspace_version):
              raise SystemExit(
                  f"Cargo version {workspace_version} != Python version "
                  f"{match.group(1) if match else '<missing>'}"
              )

          if os.environ["RELEASE_EVENT"] == "push" and os.environ["RELEASE_REF_TYPE"] == "tag":
              expected_tag = f"v{workspace_version}"
              actual_tag = os.environ["RELEASE_REF_NAME"]
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Tag {actual_tag!r} != expected {expected_tag!r}"
                  )
              print(f"Release version verified: {expected_tag}")
          elif os.environ["RELEASE_EVENT"] == "workflow_dispatch" or (
              os.environ["RELEASE_EVENT"] == "push"
              and os.environ["RELEASE_REF_TYPE"] == "branch"
          ):
              print(f"Packaging dry-run for version {workspace_version}; no publishing")
          else:
              print(f"PR-only preflight for version {workspace_version}; no build or publish")
          PY

          if [[ "$RELEASE_EVENT" == "push" && "$RELEASE_REF_TYPE" == "tag" ]]; then
            # Tag must point to latest protected main commit, not a feature
            # branch or an outdated main ancestor.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            tag_commit="$(git rev-parse HEAD)"
            main_commit="$(git rev-parse refs/remotes/origin/main)"
            echo "Release tag commit: $tag_commit"
            echo "Current main commit: $main_commit"
            if [[ "$tag_commit" != "$main_commit" ]]; then
              echo "::error::Release tag must point at the current main HEAD"
              exit 1
            fi
          fi

      - name: Verify release publication safety policy
        run: |
          node scripts/test_release_ready_policy.js
          python3 scripts/verify_release_artifact_workflow_parity.py --self-test
          python -m unittest discover -s test -p 'test_pypi_publish_recovery.py'

      - name: Verify reproducible locked native crate archives without uploading
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          cargo --version
          for attempt in first second; do
            candidate="$RUNNER_TEMP/quprs-package-$attempt"
            python3 scripts/stage_rust_crate_candidate.py --output "$candidate"
            cargo package --manifest-path "$candidate/Cargo.toml" --locked --no-verify
            test -s "$candidate/target/package/quprs-$version.crate"
          done
          sha256sum "$RUNNER_TEMP"/quprs-package-{first,second}/target/package/"quprs-$version.crate"
          cmp "$RUNNER_TEMP/quprs-package-first/target/package/quprs-$version.crate" \
              "$RUNNER_TEMP/quprs-package-second/target/package/quprs-$version.crate"

      - name: Check platform support statements against deployment policy
        run: |
          python scripts/verify_macos_wheel_support.py
          python -m unittest discover -s test -p 'test_macos_wheel_support.py'

  # Parallel platform pipelines; each smoke depends only on its own wheel build.
  platform_wheels:
    name: Platform wheels (${{ matrix.os }})
    needs: verify_release_ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    uses: ./.github/workflows/platform-wheel-ci.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
  # --- Job 2: Build Source Distribution (Sdist) ---
  # This job runs on all triggers and builds the source distribution.
  build_sdist:
    name: Build source distribution
    needs: verify_release_ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build tool
        run: pip install build maturin

      - name: Clean up existing dist directory
        run: rm -rf dist/

      - name: Build sdist with build module
        run: python -m build --sdist

      - name: Upload sdist artifact (for all builds - general purpose)
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist artifact (for PyPI release - only on tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error


  # Wheel smoke is platform-local in platform-wheel-ci.yml.
  sdist_install:
    name: Sdist smoke (${{ matrix.os }}, py3.12)
    needs: [verify_release_ref, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native source-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install cmake gmp mpfr zlib
          else
            sudo apt-get update
            sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          fi
      - uses: actions/download-artifact@v4
        with:
          name: all-builds-dist-sdist
          path: ${{ runner.temp }}/candidate-sdist
      - name: Install the candidate source archive into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python scripts/release_version.py --kind python)"
          SDIST_COUNT="$(find "$RUNNER_TEMP/candidate-sdist" -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')"
          if [[ "$SDIST_COUNT" -ne 1 ]]; then
            echo "::error::Expected one release source archive, got $SDIST_COUNT"
            exit 1
          fi
          SDIST="$(find "$RUNNER_TEMP/candidate-sdist" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          python -m venv "$RUNNER_TEMP/quprs-sdist-env"
          source "$RUNNER_TEMP/quprs-sdist-env/bin/activate"
          python -m pip install --upgrade pip
          cd "$RUNNER_TEMP"
          python -m pip install --no-cache-dir "$SDIST"
          python "$GITHUB_WORKSPACE/scripts/release_artifact_smoke.py" --expected-version "$VERSION"
      - name: Run published Python examples against the installed sdist
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/quprs-sdist-env/bin/activate"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/check_docs_examples.py" --installed

  # --- Job 3: Publish to PyPI after native crate preflight ---
  # The native preflight validates the locked crate and records its exact bytes.
  # Both registries publish independently only after all artifact smoke gates pass.
  rust_preflight:
    name: Validate staged Rust crate (no upload)
    needs: verify_release_ref
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Require an explicitly enabled dual-registry release
        env:
          CRATES_IO_PUBLISH_ENABLED: ${{ vars.QUPRS_CRATES_IO_PUBLISH_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CRATES_IO_PUBLISH_ENABLED" != "true" ]]; then
            echo "::error::Dual-registry release requires QUPRS_CRATES_IO_PUBLISH_ENABLED=true"
            exit 1
          fi

      - name: Checkout immutable signed release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag still points at main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Stage, package and verify the exact native crate
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --list --locked \
            | tee "$RUNNER_TEMP/quprs-crate-files.txt"
          grep -Fxq "README.md" "$RUNNER_TEMP/quprs-crate-files.txt"
          grep -Fxq "src/lib.rs" "$RUNNER_TEMP/quprs-crate-files.txt"
          cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --dry-run --locked
          # A successful publish dry-run verifies the unpacked crate, but Cargo
          # does not guarantee a persistent archive at the expected path.
          # Explicitly package the same locked sources for upload hand-off.
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked --no-verify
          crate="$RUNNER_TEMP/quprs-crate/target/package/quprs-$version.crate"
          test -s "$crate"
          mkdir -p "$RUNNER_TEMP/quprs-native-assets"
          cp "$crate" "$RUNNER_TEMP/quprs-native-assets/"
          (cd "$RUNNER_TEMP/quprs-native-assets" && sha256sum "quprs-$version.crate" > SHA256SUMS)

      - name: Save the reviewed Rust crate archive
        uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/quprs-native-assets/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified Python artifacts to PyPI
    needs: [verify_release_ref, platform_wheels, build_sdist, sdist_install, rust_preflight]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out immutable source for PyPI artifact reconciliation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified Python distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          path: dist
          merge-multiple: true

      - name: Verify distribution inventory
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*.whl' >/dev/null
          compgen -G 'dist/*.tar.gz' >/dev/null

      - name: Reconcile immutable PyPI files before any upload
        id: pypi_plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_pypi_artifacts.py plan \
            --version "${GITHUB_REF_NAME#v}" \
            --dist-dir dist --upload-dir pypi-to-upload

      - name: Publish only missing, preverified Python artifacts
        if: steps.pypi_plan.outputs.publish_required == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-to-upload/

      - name: Verify all PyPI archive hashes after publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_pypi_artifacts.py verify \
            --version "${GITHUB_REF_NAME#v}" --dist-dir dist

  publish_crates_io:
    name: Publish matching Rust crate to crates.io
    needs: [verify_release_ref, platform_wheels, build_sdist, sdist_install, rust_preflight]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') &&
          vars.QUPRS_CRATES_IO_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved immutable tag and Python/Rust versions
        shell: bash
        run: |
          set -euo pipefail
          # The common preflight admitted the exact tag against main.
          # Both registries publish the same immutable tag independently.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib
          import sys
          sys.path.insert(0, "scripts")
          from release_version import python_from_cargo
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text())
          version = cargo["workspace"]["package"]["version"]
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', Path("src/QuPRS/_version.py").read_text(), re.M)
          assert match and match.group(1) == python_from_cargo(version)
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          assert cargo["workspace"]["package"]["publish"] is False
          PY

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Download the preflight crate checksum
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/quprs-native-assets

      - name: Rebuild staged crate and match preflight bytes before upload
        shell: bash
        env:
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked
          cd "$RUNNER_TEMP/quprs-crate/target/package"
          cp "$RUNNER_TEMP/quprs-native-assets/SHA256SUMS" .
          sha256sum -c SHA256SUMS
          test -s "quprs-$version.crate"

      - name: Obtain crates.io Trusted Publishing token
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish native crate with Cargo
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          QUPRS_SOLVER_PROVISION: external
        run: |
          set -euo pipefail
          cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --registry crates-io --locked

  github_release:
    name: Create GitHub Release after both registries publish
    needs: [verify_release_ref, rust_preflight, publish, publish_crates_io]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Python release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          path: ${{ runner.temp }}/python-dist
          merge-multiple: true

      - name: Download verified native Rust archive
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ github.sha }}
          path: ${{ runner.temp }}/rust-dist

      - name: Verify staged release archives and prepare attachments
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python_version="${version/-beta./b}"
          python_version="${python_version/-rc./rc}"
          python_version="${python_version/-alpha./a}"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          crate="quprs-$version.crate"
          mkdir -p "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/rust-dist" && sha256sum -c SHA256SUMS)
          cp "$RUNNER_TEMP/python-dist"/* "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/rust-dist/$crate" "$RUNNER_TEMP/release-assets/$crate"
          compgen -G "$RUNNER_TEMP/release-assets/*.whl" >/dev/null
          compgen -G "$RUNNER_TEMP/release-assets/*.tar.gz" >/dev/null
          (cd "$RUNNER_TEMP/release-assets" && sha256sum -- *.whl *.tar.gz *.crate > SHA256SUMS.txt)

      - name: Create GitHub Release with Python and Rust artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body: |
            ## QuPRS ${{ github.ref_name }}

            Python: [QuPRS on PyPI](https://pypi.org/project/QuPRS/${{ steps.prepare.outputs.python_version }}/) — install with `pip install QuPRS==${{ steps.prepare.outputs.python_version }}`.

            Rust: [quprs on crates.io](https://crates.io/crates/quprs/${{ steps.prepare.outputs.version }}) — install with `cargo add quprs@${{ steps.prepare.outputs.version }}`. Native Hybrid/WMC execution requires an external GPMC or Ganak solver.

            [Changelog](https://github.com/PhysicsQoo/QuPRS/blob/${{ github.ref_name }}/CHANGELOG.md).

            This release includes Python wheels, Python source distribution, the matching published Rust .crate and SHA-256 checksums.
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true


  # Exceptional recovery uses the same crates.io Trusted Publishing identity.
  # The crates-io Environment must admit version tags for normal releases and
  # the main branch for manual recovery. Keep those deployment rules restricted.
  # No recovery job publishes Python distributions or alters an existing tag.
  recover_crates_io:
    name: Recover Rust crate from an existing signed release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_tag != '' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      tag_sha: ${{ steps.source.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recover_tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed tag and original release run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recover_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CRATES_IO_PUBLISH_ENABLED: ${{ vars.QUPRS_CRATES_IO_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$CRATES_IO_PUBLISH_ENABLED" == true ]]
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          tag_sha="$(git -C release-source rev-parse HEAD)"
          [[ "$(git -C release-source cat-file -t "refs/tags/$RECOVERY_TAG")" == tag ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          python3 - "$RECOVERY_TAG" "$tag_sha" "$run" <<'PY'
          import json
          import sys
          run = json.loads(sys.argv[3])
          if (run.get("event") != "push" or run.get("head_branch") != sys.argv[1]
                  or run.get("head_sha") != sys.argv[2]
                  or run.get("path") != ".github/workflows/python-publish.yml"):
              raise SystemExit("Recovery run does not match the immutable release tag")
          PY
          tag_obj="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RECOVERY_TAG" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_obj" \
            --jq '.verification.verified' | grep -qx true
          version="${RECOVERY_TAG#v}"
          test "v$(python3 -c 'import tomllib; print(tomllib.load(open("release-source/rust/Cargo.toml","rb"))["workspace"]["package"]["version"])')" = "$RECOVERY_TAG"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Download original Rust archive
        uses: actions/download-artifact@v4
        with:
          name: release-native-${{ steps.source.outputs.tag_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-crate

      - name: Verify exact original Rust crate without publishing
        env:
          QUPRS_SOLVER_PROVISION: external
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-source
          python3 scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/quprs-crate"
          cargo package --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --locked
          (cd "$RUNNER_TEMP/original-crate" && sha256sum -c SHA256SUMS)
          cmp "$RUNNER_TEMP/original-crate/quprs-${RECOVERY_TAG#v}.crate" \
              "$RUNNER_TEMP/quprs-crate/target/package/quprs-${RECOVERY_TAG#v}.crate"

      - name: Authenticate with crates.io
        if: inputs.perform_publish == true
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish original Rust crate
        if: inputs.perform_publish == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          QUPRS_SOLVER_PROVISION: external
        run: cargo publish --manifest-path "$RUNNER_TEMP/quprs-crate/Cargo.toml" --registry crates-io --locked

  recover_github_release:
    name: Complete GitHub Release after Rust recovery
    needs: recover_crates_io
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.perform_publish == true && inputs.recover_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recover_tag }}
          path: release-source
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-release-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/python-dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-native-${{ needs.recover_crates_io.outputs.tag_sha }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-dist

      - name: Verify published Python files and package release assets
        id: prepare
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          version="${RECOVERY_TAG#v}"
          python3 release-source/scripts/reconcile_pypi_artifacts.py verify \
            --version "$version" --dist-dir "$RUNNER_TEMP/python-dist"
          (cd "$RUNNER_TEMP/rust-dist" && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/python-dist"/* "$RUNNER_TEMP/release-assets/"
          cp "$RUNNER_TEMP/rust-dist/quprs-$version.crate" "$RUNNER_TEMP/release-assets/"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum -- *.whl *.tar.gz *.crate > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python_version=$(cd release-source && python3 scripts/release_version.py --kind python)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.recover_tag }}
          name: Release ${{ inputs.recover_tag }}
          prerelease: ${{ contains(inputs.recover_tag, '-') }}
          make_latest: ${{ contains(inputs.recover_tag, '-') && 'false' || 'true' }}
          body: |
            ## QuPRS ${{ inputs.recover_tag }}

            Python: [QuPRS on PyPI](https://pypi.org/project/QuPRS/${{ steps.prepare.outputs.python_version }}/) — install with `pip install QuPRS==${{ steps.prepare.outputs.python_version }}`.

            Rust: [quprs on crates.io](https://crates.io/crates/quprs/${{ steps.prepare.outputs.version }}) — install with `cargo add quprs@${{ steps.prepare.outputs.version }}`. Native Hybrid/WMC execution requires an external GPMC or Ganak solver.

            [Changelog](https://github.com/PhysicsQoo/QuPRS/blob/${{ inputs.recover_tag }}/CHANGELOG.md).

            This release includes Python wheels, Python source distribution, the matching published Rust .crate and SHA-256 checksums.
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
