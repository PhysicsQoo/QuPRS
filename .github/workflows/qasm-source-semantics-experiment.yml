name: QASM source semantics experiment

# Validation-only workflow, exact candidate source untouched. Do not merge.
on:
  push:
    branches:
      - research/qasm-shared-semantics-p0-validation
    paths:
      - .github/workflows/qasm-source-semantics-experiment.yml

permissions:
  contents: read
concurrency:
  group: qasm-shared-semantics-p0-validation
  cancel-in-progress: false
jobs:
  shared-semantics-native:
    name: Shared fixed-basis native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qasm-source-semantics-experiment
      - name: Record provenance and install native prerequisites
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git merge-base --is-ancestor f9bcbf6e0ff807c631213af015417c2220ef22c7 HEAD
          rustc --version | tee evidence/rustc-version.txt
          cargo --version | tee evidence/cargo-version.txt
          lscpu > evidence/cpu.txt
          sha256sum rust/quprs/tests/support/autoq_hsl_p0.rs rust/quprs/tests/property_hoare_experiment.rs rust/research/autoq_grover_p0.py rust/research/autoq_c3_pilot.py rust/research/autoq_shared_width_p0.py rust/research/autoq_shared_family_p0.py rust/research/autoq_ss2_p0.py rust/research/autoq_ss3_p0.py rust/quprs/tests/support/cps_core_p0.rs > evidence/source-sha256.txt
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev libboost-filesystem-dev libboost-test-dev libantlr4-runtime-dev
      - name: Provision pinned GPMC and qualify packed count
        run: |
          set -euo pipefail
          python3 scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-release.json
          sha256sum "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-sha256.txt
          PYTHONPATH=rust/research python3 - "$RUNNER_TEMP/cps-gpmc" <<'PY'
          import pathlib, subprocess, sys
          from hoare_ganak_exact import single_fibre_pack, single_fibre_decode, parse_gpmc_integer
          data, radix, bound = single_fibre_pack("p cnf 3 1\n1 0\n",[2,3,-1],2)
          path=pathlib.Path("evidence/packed-smoke.cnf")
          path.write_text(data)
          run=subprocess.run([sys.argv[1],"-mode=1","-natw",str(path)],capture_output=True,text=True,timeout=20,check=True)
          pathlib.Path("evidence/packed-smoke.log").write_text(run.stdout+run.stderr)
          bins=single_fibre_decode(parse_gpmc_integer(run.stdout,"wmc",bound*radix**7),radix,bound,8)
          assert bins == [1,1,1,1,0,0,0,0],bins
          print("CPS_PACKED_SMOKE=PASS",bins)
          PY
      - name: Build and verify shared initial lowering
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test property_hoare_experiment --no-run --message-format=json > evidence/build.jsonl
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(l) for l in open("evidence/build.jsonl")]
          paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="property_hoare_experiment" and r.get("executable")]
          assert len(paths)==1,paths
          pathlib.Path("evidence/property_hoare_experiment.path").write_text(paths[0])
          PY
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_autoq_shared_fixed_basis_lowering --nocapture | tee evidence/shared-lowering.log
          grep -F 'AQ_SHARED_FIXED_BASIS_ORACLE checks=12' evidence/shared-lowering.log
          timeout 60s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_closure --nocapture | tee evidence/cps-core-closure.log
          grep -F 'CPS_CORE_CLOSURE composition=128 adjoint=128 associativity=128 reverse=128' evidence/cps-core-closure.log
          grep -F 'rejection_controls=9' evidence/cps-core-closure.log
          grep -F 'CPS_CORE_CANONICAL padding=384' evidence/cps-core-closure.log
          timeout 60s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_guarded_rr --nocapture | tee evidence/cps-core-rr.log
          grep -F 'CPS_CORE_RR traces=' evidence/cps-core-rr.log
      - name: Verify wide encoder boundaries and original-source WMC pairs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p evidence/width-smoke
          bin="$(cat evidence/property_hoare_experiment.path)"
          AQ_SHARED_WIDE=0 "$bin" --exact exact_property_cnf::hoare_autoq_shared_width_encoder --nocapture | tee evidence/width-default.log
          AQ_SHARED_WIDE=1 AQ_SHARED_WIDTH_SMOKE_DIR="$PWD/evidence/width-smoke" "$bin" --exact exact_property_cnf::hoare_autoq_shared_width_encoder --nocapture | tee evidence/width-wide.log
          grep -F 'AQ_SHARED_WIDTH_BOUNDARY wide=false checks=5' evidence/width-default.log
          grep -F 'AQ_SHARED_WIDTH_BOUNDARY wide=true checks=5' evidence/width-wide.log
          pin=7eed39ad7ba5615a87c3f532a24f866e08967c12
          src="$(mktemp -d)"
          trap 'rm -rf "$src"' EXIT
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/fmlab-iis/AutoQ.git
          timeout 120s git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$pin"
          timeout 220s python3 rust/research/autoq_shared_width_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-width "$src" evidence/width-smoke 2>&1 | tee evidence/aq-width.log
          grep -F 'AQ_SHARED_WIDTH_SUMMARY ' evidence/aq-width.log
          timeout 150s python3 rust/research/autoq_shared_family_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-family "$src" 2>&1 | tee evidence/aq-family.log
          grep -F 'AQ_SHARED_FAMILY_SUMMARY ' evidence/aq-family.log
          timeout 110s python3 rust/research/autoq_ss2_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-ss2 2>&1 | tee evidence/aq-ss2.log
          grep -F 'AQ_SS2_SUMMARY ' evidence/aq-ss2.log
          timeout 150s python3 rust/research/autoq_ss3_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-ss3 2>&1 | tee evidence/aq-ss3.log
          grep -F 'AQ_SS3_SUMMARY ' evidence/aq-ss3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qasm-shared-semantics-p0-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
