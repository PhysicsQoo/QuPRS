name: QASM source semantics experiment

# A branch-scoped diagnostic workflow. No release or deployment privileges.
on:
  push:
    branches:
      - experiment/qasm-source-semantics-ci
    paths:
      - rust/quprs/tests/qasm_source_semantics_experiment.rs
      - rust/quprs/tests/property_hoare_experiment.rs
      - rust/research/hoare_ganak_exact.py
      - rust/research/hoare_projected_count.py
      - rust/research/hoare_sector_transport.py
      - rust/research/hoare_quokka_compare.py
      - rust/quprs/tests/qasm_strict_unitary_matrix_oracle.rs
      - rust/quprs/tests/qasm_two_qubit_source_contract.rs
      - rust/quprs/tests/qasm_source_ir_certificate_experiment.rs
      - rust/research/p8c1_checker.rs
      - rust/research/p8c1_dense_oracle.rs
      - rust/research/p8c1_two_copy_wmc.rs
      - rust/research/p8c1_two_copy_cnf.rs
      - rust/research/p8c1_two_copy_structural.rs
      - rust/research/p8c1_two_copy_count_trace.rs
      - rust/research/p8c1_two_copy_count_dag.rs
      - rust/research/p8c1_f8c1_chain.rs
      - rust/research/p8c1_f8c1_symbolic.rs
      - rust/research/lean/**
      - rust/research/p8c1_f8g1_property.rs
      - rust/research/p8c1_count_to_gram.rs
      - rust/quprs/tests/qasm_independent_source_kernel_experiment.rs
      - .github/workflows/qasm-source-semantics-experiment.yml

permissions:
  contents: read

concurrency:
  group: qasm-source-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-probe:
    name: Native source admission and phase diagnostics (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUPRS_SOLVER_PROVISION: external
      HOARE_SECTOR_TRANSPORT: '1'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qasm-source-semantics-experiment

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev minisat=1:2.2.1-8build1

      - name: Record source and toolchain
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git merge-base --is-ancestor 0b28736651b3740ed3b201edd2efdef3da541e0d HEAD
          printf '%s\n' 0b28736651b3740ed3b201edd2efdef3da541e0d | tee evidence/base-commit.txt
          rustc --version | tee evidence/rustc-version.txt
          cargo --version | tee evidence/cargo-version.txt
          sha256sum rust/quprs/src/qasm.rs rust/quprs/src/gates.rs \
            rust/quprs/src/ir.rs rust/quprs/tests/qasm_source_semantics_experiment.rs \
            rust/quprs/tests/qasm_strict_unitary_matrix_oracle.rs \
            rust/quprs/tests/qasm_two_qubit_source_contract.rs \
            rust/quprs/tests/qasm_source_ir_certificate_experiment.rs \
            rust/research/p8c1_checker.rs rust/research/p8c1_dense_oracle.rs rust/research/p8c1_two_copy_wmc.rs rust/research/p8c1_two_copy_cnf.rs \
            rust/research/p8c1_two_copy_structural.rs \
            rust/research/p8c1_two_copy_count_trace.rs rust/research/p8c1_two_copy_count_dag.rs rust/research/p8c1_f8c1_chain.rs rust/research/p8c1_f8c1_symbolic.rs rust/research/p8c1_f8g1_property.rs rust/research/lean/PathSumLocal.lean rust/research/lean/CanonicalANF.lean rust/research/lean/BitMask16.lean rust/research/lean/MaskSet16.lean rust/research/lean/TermFrame16.lean rust/research/lean/Replay16.lean rust/research/lean/lean-toolchain rust/research/p8c1_count_to_gram.rs \
            rust/quprs/tests/qasm_independent_source_kernel_experiment.rs \
            > evidence/source-sha256.txt

      - name: Verify experimental property-directed Hoare cases
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test property_hoare_experiment -- --nocapture \
            2>&1 | tee evidence/property-hoare.log

      - name: Verify exact GPMC and Ganak property counts
        run: |
          set -euo pipefail
          mkdir -p evidence/hoare-exact-fixtures
          HOARE_EXACT_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/hoare-exact-fixtures" \
            cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
              --test property_hoare_experiment hoare_export_external_exact_fixtures -- --nocapture
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-time 60 \
            https://github.com/meelgroup/ganak/releases/download/release/v2.8.0/ganak-v2.8.0-linux-amd64.tar.gz \
            -o "$tmp/ganak.tar.gz"
          echo "bea7150787a1e8f2b1bd658cb5a3c227d631d25054f5ff77ce23422e1c8b040c  $tmp/ganak.tar.gz" | sha256sum -c -
          tar -xOzf "$tmp/ganak.tar.gz" ganak > "$tmp/ganak"
          chmod 700 "$tmp/ganak"
          dpkg-query -W minisat | tee evidence/hoare-sat-version.txt
          sha256sum "$(command -v minisat)" | tee evidence/hoare-sat-sha256.txt
          python3 scripts/install_gpmc_release.py --dest "$tmp/gpmc" | tee evidence/hoare-gpmc-release.json
          python3 rust/research/hoare_ganak_exact.py "$tmp/ganak" evidence/hoare-exact-fixtures "$(command -v minisat)" "$tmp/gpmc" \
            2>&1 | tee evidence/hoare-ganak-exact.log
          # Reuse the same GPMC binary; isolate the upstream Python package.
          python3 -m venv "$tmp/quokka-env"
          "$tmp/quokka-env/bin/python" -m pip install --disable-pip-version-check numpy==2.2.6
          "$tmp/quokka-env/bin/python" -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --dest "$tmp" quokka_sharp==2.7.5
          wheel="$(find "$tmp" -maxdepth 1 -name 'quokka_sharp-2.7.5-*.whl' -print -quit)"
          test -n "$wheel"
          echo "17ee064116300619d622e7806c30bd25e30ec68a4cf8b97677d5ae878e73c042  $wheel" | sha256sum -c -
          "$tmp/quokka-env/bin/python" -m pip install --no-deps "$wheel"
          "$tmp/quokka-env/bin/python" -m pip freeze | tee evidence/hoare-quokka-dependencies.txt
          "$tmp/quokka-env/bin/python" rust/research/hoare_quokka_compare.py evidence/hoare-exact-fixtures "$tmp/gpmc" \
            2>&1 | tee evidence/hoare-quokka.log

      - name: Observe native parser, CX and U/U3 phase behavior
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_semantics_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/observed-native.log

      - name: Reconstruct exact native unitary matrices independently
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_strict_unitary_matrix_oracle observed_ -- --nocapture \
            2>&1 | tee evidence/exact-unitary-matrices.log

      - name: Observe exact two-qubit source and effect diagnostics
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_two_qubit_source_contract observed_ -- --nocapture \
            2>&1 | tee evidence/two-qubit-observed.log

      - name: Check bounded source IR certificates and Z4 normal forms
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_ir_certificate_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/source-ir-certificate.log

      - name: Check standalone std-only P8C1 checker
        run: |
          set -euo pipefail
          # Independent verifier is compiled with rustc, no Cargo package,
          # QuPRS API, producer, external libraries or native dependencies.
          rustc --edition=2021 --test rust/research/p8c1_checker.rs -o evidence/p8c1-checker-tests
          evidence/p8c1-checker-tests --nocapture 2>&1 | tee evidence/p8c1-standalone-tests.log
          rustc --edition=2021 rust/research/p8c1_checker.rs -o evidence/p8c1-checker
          # Native research producer exports source/proof pairs. The CLI
          # re-reads the actual files in a separate process and checks each.
          P8C1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_ir_certificate_experiment \
            observed_p8c1_exports_cross_binary_fixtures_when_requested -- --nocapture \
            2>&1 | tee evidence/p8c1-fixture-export.log
          : > evidence/p8c1-cross-binary.log
          for case in h-cx-t cx-t-parity mixed-3q structural-16q; do
            evidence/p8c1-checker \
              "evidence/p8c1-fixtures/$case.qasm" \
              "evidence/p8c1-fixtures/$case.p8c1" | tee -a evidence/p8c1-cross-binary.log
          done
          test "$(grep -c '^SCOPED_REPLAY_PASS ' evidence/p8c1-cross-binary.log)" -eq 4
          set +e
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/forged.p8c1 > evidence/p8c1-cross-binary-forged.log
          status=$?
          set -e
          test "$status" -eq 4
          grep -x 'INVALID_PROOF' evidence/p8c1-cross-binary-forged.log
          echo 'P8C1_STANDALONE_CROSS_BINARY=4 exact_pass; 1 invalid_proof_rejected'
          # Explicitly separate parser failures from proof failures and
          # resource exhaustion. These are typed exit codes, not PROVED.
          printf 'OPENQASM 3.1;\n' > evidence/p8c1-unsupported.qasm
          printf 'OPENQASM 3.0;\ninclude "stdgates.inc";\nqubit[0] q;\n' \
            > evidence/p8c1-invalid.qasm
          head -c 1048577 /dev/zero > evidence/p8c1-overlimit.p8c1
          head -c 32769 /dev/zero > evidence/p8c1-overlimit.qasm
          head -c 60 evidence/p8c1-fixtures/h-cx-t.p8c1 \
            > evidence/p8c1-truncated.p8c1
          check_reject() {
            expected_label="$1"; expected_code="$2"; shift 2
            set +e
            evidence/p8c1-checker "$@" > evidence/p8c1-typed-negative-last.log
            actual_code=$?
            set -e
            test "$actual_code" -eq "$expected_code"
            grep -E "^$expected_label( |$)" evidence/p8c1-typed-negative-last.log
          }
          check_reject UNSUPPORTED_SOURCE 3 \
            evidence/p8c1-unsupported.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject INVALID_SOURCE 2 \
            evidence/p8c1-invalid.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject UNKNOWN_RESOURCE 5 \
            evidence/p8c1-fixtures/h-cx-t.qasm evidence/p8c1-overlimit.p8c1
          check_reject UNKNOWN_RESOURCE 5 \
            evidence/p8c1-overlimit.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm evidence/p8c1-truncated.p8c1
          echo 'P8C1_TYPED_NEGATIVES=5 exact_classes=true'

          # P0-C: exact basis-only P/B/delta property, cryptographically
          # bound to the source, normalized spec bytes and verified P8C1.
          # SHA digests are equality binding, not signatures or source trust.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          d=Path("evidence/p8c1-fixtures")
          src=(d/"h-cx-t.qasm").read_bytes()
          proof=(d/"h-cx-t.p8c1").read_bytes()
          for name, bad, delta in [
              ("safe","0000000000000002","0/1"),
              ("violated","0000000000000008","1/3")]:
              sp=(f"SPB1\nn=2\nbasis_pre=0x0000000000000001\n"
                  f"basis_bad=0x{bad}\ndelta={delta}\n").encode()
              binding=(b"P8S1"+hashlib.sha256(src).digest()
                  +hashlib.sha256(sp).digest()+hashlib.sha256(proof).digest())
              (d/f"{name}.spb1").write_bytes(sp)
              (d/f"{name}.p8s1").write_bytes(binding)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/safe.spb1 \
            evidence/p8c1-fixtures/safe.p8s1 | tee evidence/p8s1-safe.log
          grep -x 'SCOPED_PROPERTY_SAT source_trust=BLOCKED' evidence/p8s1-safe.log
          check_reject SCOPED_PROPERTY_VIOLATED 6 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/violated.spb1 \
            evidence/p8c1-fixtures/violated.p8s1
          # Reuse old binding while swapping both a valid spec and a proof.
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/violated.spb1 \
            evidence/p8c1-fixtures/safe.p8s1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/forged.p8c1 \
            evidence/p8c1-fixtures/safe.spb1 \
            evidence/p8c1-fixtures/safe.p8s1
          echo 'P8S1_CROSS_BINARY_PROPERTY=sat_1 violated_1 forged_2 source_trust_blocked'

          # Distinct SCG1 semantics: ALL normalized coherent states in the
          # two-dimensional support, not SPB1 basis-only quantification.
          # A separate Python fixture author prepares the small exact
          # rank-2 Gram claim; standalone Rust checks its content against
          # the real producer's source-bound P8C1 transition proof.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          d=Path("evidence/p8c1-fixtures")
          src=(d/"h-1q.qasm").read_bytes()
          proof=(d/"h-1q.p8c1").read_bytes()
          for name,num,den in [
              ("coherent-violation",1,2),("coherent-satisfied",1,1)]:
              sp=(f"SCG1\nn=1\nspan_basis=0x0000000000000003\n"
                  f"basis_bad=0x0000000000000001\ndelta={num}/{den}\n").encode()
              # On H, B={|0>}, P={|0>,|1>}: the unnormalized
              # numerator Gram is [[1,1],[1,1]], divided by 2^1.
              certificate=(b"P8G1"
                  +hashlib.sha256(src).digest()
                  +hashlib.sha256(sp).digest()
                  +hashlib.sha256(proof).digest()
                  +bytes([1,1,0,1])
                  +struct.pack("<Q",1)
                  +struct.pack("<qqqqqqqq",1,0,1,0,1,0,0,0))
              assert len(certificate)==176
              (d/f"{name}.scg1").write_bytes(sp)
              (d/f"{name}.p8g1").write_bytes(certificate)
          bad=bytearray((d/"coherent-satisfied.p8g1").read_bytes())
          bad[112]^=1
          (d/"coherent-forged.p8g1").write_bytes(bad)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-satisfied.scg1 \
            evidence/p8c1-fixtures/coherent-satisfied.p8g1 \
            | tee evidence/p8g1-coherent-sat.log
          grep -x 'SCOPED_COHERENT_SPAN_SAT source_trust=BLOCKED' \
            evidence/p8g1-coherent-sat.log
          check_reject SCOPED_COHERENT_SPAN_VIOLATED 6 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-violation.scg1 \
            evidence/p8c1-fixtures/coherent-violation.p8g1
          grep -E '^SCOPED_COHERENT_SPAN_VIOLATED reason=negative_determinant ' \
            evidence/p8c1-typed-negative-last.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-satisfied.scg1 \
            evidence/p8c1-fixtures/coherent-forged.p8g1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-violation.scg1 \
            evidence/p8c1-fixtures/coherent-satisfied.p8g1
          echo 'P8G1_CROSS_BINARY_COHERENT=sat_1 violated_det_1 forged_2 basis_only_not_span'

          # P8W1 witness is an explicitly normalized *coherent state* via
          # its symbolic denominator sqrt(norm). Independent CLI checks
          # exact negative quadratic gap after replaying Gram and P8C1.
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from struct import pack
          d=Path("evidence/p8c1-fixtures")
          gram=(d/"coherent-violation.p8g1").read_bytes()
          # H/2 risk example: input (|0>+|1>)/sqrt(2).
          witness=b"P8W1"+sha256(gram).digest() + pack(
              "<qqqqqqqqqq",1,0,0,0,1,0,0,0,2,0)
          assert len(witness)==116
          (d/"coherent-witness-valid.p8w1").write_bytes(witness)
          fake=bytearray(witness)
          fake[36]^=1
          (d/"coherent-witness-forged.p8w1").write_bytes(fake)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-violation.scg1 \
            evidence/p8c1-fixtures/coherent-violation.p8g1 \
            evidence/p8c1-fixtures/coherent-witness-valid.p8w1 \
            | tee evidence/p8w1-normalized-witness.log
          grep -E '^SCOPED_COHERENT_WITNESS_ACCEPTED norm_surd=2:0 negative_gap_surd=-4:0 ' \
            evidence/p8w1-normalized-witness.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-violation.scg1 \
            evidence/p8c1-fixtures/coherent-violation.p8g1 \
            evidence/p8c1-fixtures/coherent-witness-forged.p8w1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/coherent-satisfied.scg1 \
            evidence/p8c1-fixtures/coherent-satisfied.p8g1 \
            evidence/p8c1-fixtures/coherent-witness-valid.p8w1
          echo 'P8W1_CROSS_BINARY_WITNESS=normalized_plus_risk_one exact_negative_gap verified; forged2 rejected'

          # A separate exact *two-copy* weighted-counting certificate:
          # no CNF solver is trusted; exhaustive matching paths check each
          # eighth-root bucket, including conjugated cross interference.
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from struct import pack
          d=Path("evidence/p8c1-fixtures")
          src=(d/"h-1q.qasm").read_bytes()
          proof=(d/"h-1q.p8c1").read_bytes()
          # For H and B={|0>}, input pair (0,1), exactly one y,z pair
          # contributes phase omega^0. All other roots have weight zero.
          counts=[1]+[0]*7
          evidence=(b"W8C1"+sha256(src).digest()+sha256(proof).digest()
              +bytes([0,1])+pack("<Q",1)+bytes([1])
              +pack("<8H",*counts))
          assert len(evidence)==95
          (d/"two-copy-h1.w8c1").write_bytes(evidence)
          forged=bytearray(evidence)
          forged[-16]^=1
          (d/"two-copy-h1-forged.w8c1").write_bytes(forged)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/two-copy-h1.w8c1 \
            | tee evidence/w8c1-two-copy-proof.log
          grep -E '^SCOPED_TWO_COPY_WMC_ENUM_EXACT buckets=8 total_weighted_pairs=1 ' \
            evidence/w8c1-two-copy-proof.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/two-copy-h1-forged.w8c1
          echo 'W8C1_CROSS_BINARY_ENUM=complex_weighted_pair_count_verified forged_rejected no_general_CNF_proof'

          # C8C1 is a deliberately exponential, canonical *complete
          # assignment-blocking CNF*, one for each root-of-unity phase
          # bucket; the proof checker checks every clause/assignment and
          # computes the exact complex-weighted bucket counts anew.
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from struct import pack
          d=Path("evidence/p8c1-fixtures")
          source=(d/"h-1q.qasm").read_bytes()
          proof=(d/"h-1q.p8c1").read_bytes()
          data=bytearray(b"C8C1"+sha256(source).digest()+sha256(proof).digest()
              +bytes([0,1])+pack("<Q",1)+bytes([1]))
          for phase in range(8):
              excluded=[1,2,3] if phase==0 else [0,1,2,3]
              data.extend(pack("<H",len(excluded)))
              for assignment in excluded:
                  data.extend(pack("<HH",(~assignment)&3,assignment))
          assert len(data)==219
          (d/"two-copy-h1.c8c1").write_bytes(data)
          forged=bytearray(data)
          forged[79+2]^=1
          (d/"two-copy-h1-forged.c8c1").write_bytes(forged)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/two-copy-h1.c8c1 \
            | tee evidence/c8c1-two-copy-cnf.log
          grep -x 'SCOPED_TWO_COPY_CNF_EXHAUSTIVE buckets=8 checked_models=1 source_trust=BLOCKED' \
            evidence/c8c1-two-copy-cnf.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/two-copy-h1-forged.c8c1
          echo 'C8C1_CROSS_BINARY_CNF=8_canonical_CNF_buckets_exactly_checked forged_rejected not_solver_proof'

          # S8C1 uses an ordered, structural GF(2)-XOR/Tseitin gate
          # network rather than exponential truth-table blocking clauses.
          # The independent checker replays source semantics and verifies
          # each deterministic auxiliary gate's unique extension.
          S8C1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::s8c1_export_external_producer_fixtures_when_requested \
            --nocapture 2>&1 | tee evidence/s8c1-export.log
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            | tee evidence/s8c1-two-copy-structural.log
          grep -x 'SCOPED_TWO_COPY_STRUCTURAL_UNIQUE_EXTENSION buckets=8 checked_models=1 source_trust=BLOCKED' \
            evidence/s8c1-two-copy-structural.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q-forged.s8c1
          echo 'S8C1_CROSS_BINARY_STRUCTURAL=unique_aux_extension true_eight_buckets forged_rejected reference_C8C1_match'

          # D8C1 counts are certified by conservative three-valued gate
          # propagation and local Shannon branch-sum identities. Unlike
          # the S8C1 reference harness, this checker path does NOT
          # enumerate all original primary path assignments.
          D8C1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::d8c1_export_native_source_linked_fixture_when_requested \
            --nocapture 2>&1 | tee evidence/d8c1-export.log
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q.d8c1 \
            | tee evidence/d8c1-count-trace.log
          grep -F 'SCOPED_TWO_COPY_COUNT_TRACE_EXACT buckets=8 checked_models=1 ' evidence/d8c1-count-trace.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q-forged.d8c1
          echo 'D8C1_CROSS_BINARY_COUNT_TRACE=source_bound local_shannon_counts_verified forged_rejected no_solver_count_trust'
          M8D1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::m8d1_export_external_producer_fixture_when_requested --nocapture
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q.m8d1 | tee evidence/m8d1-shared-dag.log
          grep -F 'SCOPED_TWO_COPY_SHARED_DAG_EXACT buckets=8 checked_models=1' evidence/m8d1-shared-dag.log
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q-forged.m8d1
          echo 'M8D1_CROSS_BINARY_SHARED_DAG=verified_contexts forged_rejected source_bound'
          F8C1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::f8c1_export_source_bound_fixture_when_requested --nocapture
          evidence/p8c1-checker --chain \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q.m8d1 \
            evidence/p8c1-fixtures/h-1q.f8c1 | tee evidence/f8c1-chain.log
          grep -F 'SCOPED_F8C1_SOURCE_COUNT_CHAIN_EXACT' evidence/f8c1-chain.log
          check_reject INVALID_PROOF 4 --chain \
            evidence/p8c1-fixtures/h-1q.qasm \
            evidence/p8c1-fixtures/h-1q.p8c1 \
            evidence/p8c1-fixtures/h-1q.s8c1 \
            evidence/p8c1-fixtures/h-1q.m8d1 \
            evidence/p8c1-fixtures/h-1q-forged.f8c1
          echo 'F8C1_CROSS_BINARY_CHAIN=raw_source_prefix_to_structural_count_exact forged_rejected'
          G8D1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::g8d1_export_external_producer_fixtures_when_requested --nocapture
          g8d1() {
            evidence/p8c1-checker \
              evidence/p8c1-fixtures/h-1q.qasm \
              evidence/p8c1-fixtures/h-1q.p8c1 \
              "evidence/p8c1-fixtures/gram-$1.scg1" \
              evidence/p8c1-fixtures/gram-{0,1,2}.s8c1 \
              evidence/p8c1-fixtures/gram-{0,1,2}.d8c1 \
              "evidence/p8c1-fixtures/gram-$2.p8g1"
          }
          g8d1 sat sat | tee evidence/g8d1-sat.log
          grep -F SCOPED_COUNT_TO_GRAM_PSD_SAT evidence/g8d1-sat.log
          set +e
          g8d1 violated violated > evidence/g8d1-violate.log
          rc=$?
          set -e
          test "$rc" -eq 6
          grep -F 'reason=negative_determinant' evidence/g8d1-violate.log
          set +e
          g8d1 violated sat > evidence/g8d1-forged.log
          rc=$?
          set -e
          test "$rc" -eq 4
          grep -x INVALID_PROOF evidence/g8d1-forged.log
          echo 'G8D1_CROSS_BINARY=verified_counts_to_exact_Gram_PSD'
          F8G1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            evidence/p8c1-checker-tests --exact \
            tests::f8g1_export_cross_binary_rank2_fixtures_when_requested --nocapture
          f8g1() {
            evidence/p8c1-checker --rank2 \
              evidence/p8c1-fixtures/h-1q.qasm \
              evidence/p8c1-fixtures/h-1q.p8c1 \
              "evidence/p8c1-fixtures/gram-$1.scg1" \
              evidence/p8c1-fixtures/gram-{0,1,2}.s8c1 \
              evidence/p8c1-fixtures/gram-{0,1,2}.d8c1 \
              evidence/p8c1-fixtures/gram-{0,1,2}.f8c1 \
              "evidence/p8c1-fixtures/gram-$2.p8g1" \
              "evidence/p8c1-fixtures/gram-$2.p8w1" \
              "evidence/p8c1-fixtures/gram-$3.f8g1"
          }
          f8g1 sat sat sat | tee evidence/f8g1-sat.log
          grep -F 'SCOPED_F8G1_RANK2_PROPERTY_SAT' evidence/f8g1-sat.log
          set +e
          f8g1 violated violated violated > evidence/f8g1-violated.log
          rc=$?
          set -e
          test "$rc" -eq 6
          grep -F 'SCOPED_F8G1_RANK2_PROPERTY_VIOLATED' evidence/f8g1-violated.log
          grep -F 'witness_checked=true' evidence/f8g1-violated.log
          set +e
          f8g1 violated sat violated > evidence/f8g1-cross-spec-forged.log
          rc=$?
          set -e
          test "$rc" -eq 4
          grep -x INVALID_PROOF evidence/f8g1-cross-spec-forged.log
          set +e
          f8g1 violated violated violated-forged > evidence/f8g1-forged-envelope.log
          rc=$?
          set -e
          test "$rc" -eq 4
          grep -x INVALID_PROOF evidence/f8g1-forged-envelope.log
          echo 'F8G1_CROSS_BINARY_PROPERTY=source_spec_three_F8C1_exact_Gram_PSD_violating_witness tamper_rejected'

          if test -x /usr/bin/time; then
            /usr/bin/time -f 'P8C1_PILOT_WALL_S=%e\nP8C1_PILOT_PEAK_RSS_KB=%M' \
              -o evidence/p8c1-standalone-resource-pilot.log \
              evidence/p8c1-checker \
                evidence/p8c1-fixtures/structural-16q.qasm \
                evidence/p8c1-fixtures/structural-16q.p8c1
            cat evidence/p8c1-standalone-resource-pilot.log
          else
            echo 'P8C1_PILOT_RSS=UNAVAILABLE' > evidence/p8c1-standalone-resource-pilot.log
          fi


      - name: Check independent source semantics and gate-prefix certificates
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_independent_source_kernel_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/independent-source-kernel.log

      - name: Check strict two-qubit source matrices (diagnostic, may fail)
        id: two_qubit
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_two_qubit_source_contract strict_contract_ -- --nocapture \
            2>&1 | tee evidence/two-qubit-strict.log

      - name: Check official strict unitary matrices (diagnostic, may fail)
        id: exact_matrix
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_strict_unitary_matrix_oracle strict_contract_ -- --nocapture \
            2>&1 | tee evidence/exact-unitary-conformance.log

      - name: Compare against strict source contract (diagnostic, may fail)
        id: strict
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_semantics_experiment strict_contract_ -- --nocapture \
            2>&1 | tee evidence/strict-source-contract.log

      - name: Report diagnostic outcome
        if: always()
        env:
          STRICT_RESULT: ${{ steps.strict.outcome }}
          MATRIX_RESULT: ${{ steps.exact_matrix.outcome }}
          TWOQ_RESULT: ${{ steps.two_qubit.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'strict_source_contract=%s\nstrict_matrix_contract=%s\nstrict_two_qubit_contract=%s\n' "$STRICT_RESULT" "$MATRIX_RESULT" "$TWOQ_RESULT" > evidence/summary.txt
          {
            echo '## QASM source semantics — research-only diagnostic'
            echo
            echo "Strict conformance test outcome: **$STRICT_RESULT**"
            echo "Strict full-matrix outcome: **$MATRIX_RESULT**"
            echo "Strict two-qubit outcome: **$TWOQ_RESULT**"
            echo
            echo 'A failed strict test identifies a source semantic discrepancy.'
            echo 'It is **not** a failure of unrelated production CI, nor a verified correction.'
            echo 'A successful observed-behavior test does not certify OpenQASM conformance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qasm-source-semantics-diagnostics
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7


  standalone-no-native-prerequisites:
    name: Standalone P8C1 + Lean proof kernels (without QuPRS/Cargo/native libs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Install stable Rust only
        uses: dtolnay/rust-toolchain@stable
      - name: Kernel-check pinned Lean 4 local algebraic lemmas
        run: |
          set -euo pipefail
          # Isolated research toolchain: no Lake or Mathlib and no changes
          # to the Rust/Python production dependency graph.
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             https://elan.lean-lang.org/elan-init.sh -o /tmp/qasm-elan-init.sh
          sh /tmp/qasm-elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd rust/research/lean
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.36.0"
          lean --version
          lean PathSumLocal.lean 2>&1 | tee /tmp/qasm-lean-local-proof.log
          # Each exposed theorem prints its transitive axiom dependencies.
          # A compilation-only PASS must not mask proof holes or custom trust.
          if grep -E 'sorryAx|Lean[.]trustCompiler' /tmp/qasm-lean-local-proof.log; then
            echo 'Unexpected Lean proof axiom dependency' >&2
            exit 1
          fi
          report_count="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-local-proof.log)"
          test "$report_count" -eq 12
          echo 'LEAN4_LOCAL_KERNEL_PROOFS_PASS pinned_toolchain=4.36.0 no_mathlib=true theorem_axiom_reports=12'
          lean CanonicalANF.lean 2>&1 | tee /tmp/qasm-lean-canonical-anf.log
          if grep -E 'sorryAx|Lean[.]trustCompiler' /tmp/qasm-lean-canonical-anf.log; then
            echo 'Unexpected Lean ANF theorem axiom dependency' >&2
            exit 1
          fi
          anf_report_count="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-canonical-anf.log)"
          test "$anf_report_count" -eq 12
          echo 'LEAN4_CANONICAL_ANF_PROOFS_PASS theorem_axiom_reports=12'
          LEAN_PATH=. lean -o BitMask16.olean BitMask16.lean 2>&1 | tee /tmp/qasm-lean-mask16.log
          if grep -E 'sorryAx|Lean[.]trustCompiler' /tmp/qasm-lean-mask16.log; then
            echo 'Unexpected Lean 16-bit mask theorem axiom dependency' >&2
            exit 1
          fi
          word_report_count="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-mask16.log)"
          test "$word_report_count" -eq 14
          echo 'LEAN4_MASK16_PROOFS_PASS theorem_axiom_reports=14'
          LEAN_PATH=. lean MaskSet16.lean 2>&1 | tee /tmp/qasm-lean-maskset16.log
          if grep -E 'sorryAx|Lean[.]trustCompiler|Classical[.]choice' /tmp/qasm-lean-maskset16.log; then
            echo 'Unexpected Lean finite mask-set theorem axiom dependency' >&2
            exit 1
          fi
          maskset_reports="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-maskset16.log)"
          test "$maskset_reports" -eq 23
          echo 'LEAN4_MASKSET16_PROOFS_PASS theorem_axiom_reports=23'
          LEAN_PATH=. lean -o TermFrame16.olean TermFrame16.lean 2>&1 | tee /tmp/qasm-lean-termframe16.log
          if grep -E 'sorryAx|Lean[.]trustCompiler|Classical[.]choice' /tmp/qasm-lean-termframe16.log; then
            echo 'Unexpected Lean term-frame theorem axiom dependency' >&2
            exit 1
          fi
          frame_reports="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-termframe16.log)"
          test "$frame_reports" -eq 25
          echo 'LEAN4_TERMFRAME16_PROOFS_PASS theorem_axiom_reports=25'
          LEAN_PATH=. lean Replay16.lean 2>&1 | tee /tmp/qasm-lean-replay16.log
          if grep -E 'sorryAx|Lean[.]trustCompiler|Classical[.]choice' /tmp/qasm-lean-replay16.log; then
            echo 'Unexpected Lean replay theorem axiom dependency' >&2
            exit 1
          fi
          replay_reports="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-replay16.log)"
          test "$replay_reports" -eq 7
          echo 'LEAN4_REPLAY16_PROOFS_PASS theorem_axiom_reports=7'
          lean HoareComposition.lean 2>&1 | tee /tmp/qasm-lean-hoare-composition.log
          if grep -E 'sorryAx|Lean[.]trustCompiler|Classical[.]choice' /tmp/qasm-lean-hoare-composition.log; then
            echo 'Unexpected Hoare composition theorem axiom dependency' >&2
            exit 1
          fi
          hoare_reports="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-hoare-composition.log)"
          test "$hoare_reports" -eq 17
          for theorem in mass_false first_failure_step first_failure_mass prefix_split positive_child zero_mass_member dispatch_sound sumBelow_congr sumBelow_all_zero sumBelow_delta sumBelow_nonneg sumBelow_zero_iff negacyclicDiffTerm_zero norm_constant norm_constant_nonneg norm_constant_zero_iff family_norm_constant_zero_iff; do
            test "$(grep -Ec "^'QuPRS[.]HoareComposition[.]$theorem' (does not depend on any axioms|depends on axioms)" /tmp/qasm-lean-hoare-composition.log)" -eq 1
          done
          echo 'LEAN4_HOARE_COMPOSITION_PROOFS_PASS theorem_axiom_reports=17 natural_mass=true negacyclic_coefficients=true conditional_dispatch=true complex_embedding_formalized=false'
          lean HoareSectorTransport.lean 2>&1 | tee /tmp/qasm-lean-hoare-sector.log
          if grep -E 'sorryAx|Lean[.]trustCompiler|Classical[.]choice' /tmp/qasm-lean-hoare-sector.log; then
            echo 'Unexpected sector transport theorem axiom dependency' >&2
            exit 1
          fi
          sector_reports="$(grep -Ec 'does not depend on any axioms|depends on axioms' /tmp/qasm-lean-hoare-sector.log)"
          test "$sector_reports" -eq 18
          for theorem in sign_mul opposite_sign_zero support_sector sector_proved sector_refuted terminal_unknown terminal_sound bit_xor single_phase_shift cz_phase_shift even_xor_mod8 bx_flip bx_four advance_shift local_phase_delta replay_state_shift replay_phase_shift replay_constant_translation; do
            test "$(grep -Ec "^'QuPRS[.]SectorTransport[.]$theorem' (does not depend on any axioms|depends on axioms)" /tmp/qasm-lean-hoare-sector.log)" -eq 1
          done
          echo 'LEAN4_HOARE_SECTOR_TRANSPORT_PROOFS_PASS theorem_axiom_reports=18 conditional_support=true terminal_sound=true local_z8=true gate_replay_formalized=true complex_embedding_formalized=false'

      - name: Build and test std-only independent verifier
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test rust/research/p8c1_dense_oracle.rs -o /tmp/p8c1-dense-unit
          /tmp/p8c1-dense-unit --nocapture
          rustc --edition=2021 --test rust/research/p8c1_checker.rs -o /tmp/p8c1-standalone-unit
          /tmp/p8c1-standalone-unit --nocapture
          rustc --edition=2021 rust/research/p8c1_checker.rs -o /tmp/p8c1-standalone
          set +e
          /tmp/p8c1-standalone > /tmp/p8c1-no-input.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -x INVALID_SOURCE /tmp/p8c1-no-input.log
          echo 'P8C1_STANDALONE_NO_CARGO=checker_and_dense_oracle_tests_pass'
