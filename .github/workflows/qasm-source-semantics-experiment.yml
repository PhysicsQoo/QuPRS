ero inverse_phase_walsh_nonzero cube_sum_add unit_state_supported flip_is_unit_shift cnot_is_conditional_shift shift_unit_other control_slice_partition cnot_slice_partition cube_sum_gate_reindex cube_sum_eval_reindex inverse_phase_walsh_eq_fourier fourier_nonzero_output gate_ok_sound reversible_ok_sound reversible_implies_bounded advance_delta_supported trace_delta_supported same_mask_prefix same_mask_supported_eq check_below_sound check_phase_samples_sound run_sector_sound square_mod_two double_square square_twice_even sqrt2_square_zero_bounded sqrt2_square_zero quadratic_norm_zero_iff scaled_norm_zero_iff scaled_norm_nonzero_iff finite_algebraic_bad_iff run_sector_algebraic_sound phase_real_r phase_real_u phase_imag_r phase_imag_u cube_sum_sub direct_real_r direct_real_u direct_imag_r direct_imag_u direct_coordinate_zero_iff finite_direct_bad_iff run_sector_direct_sound; do
