name: QASM source semantics experiment

# Validation-only workflow, exact candidate source untouched. Do not merge.
on:
  push:
    branches:
      - research/qasm-shared-semantics-p0-validation
    paths:
      - .github/workflows/qasm-source-semantics-experiment.yml

permissions:
  contents: read
concurrency:
  group: qasm-shared-semantics-p0-validation
  cancel-in-progress: false
jobs:
  shared-semantics-native:
    name: Shared fixed-basis native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qasm-source-semantics-experiment
      - name: Record provenance and install native prerequisites
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git merge-base --is-ancestor f9bcbf6e0ff807c631213af015417c2220ef22c7 HEAD
          rustc --version | tee evidence/rustc-version.txt
          cargo --version | tee evidence/cargo-version.txt
          lscpu > evidence/cpu.txt
          sha256sum rust/quprs/tests/support/autoq_hsl_p0.rs rust/quprs/tests/property_hoare_experiment.rs rust/research/autoq_grover_p0.py rust/research/autoq_c3_pilot.py rust/research/autoq_shared_width_p0.py rust/research/autoq_shared_family_p0.py rust/research/autoq_ss2_p0.py rust/research/autoq_ss3_p0.py rust/quprs/tests/support/cps_core_p0.rs rust/research/cps_core_wmc_p0.py rust/research/cps_core_source_decision_p0.py rust/research/cps_core_matched_p0.py rust/research/cps_core_encoding_ab_p0.py rust/research/cps_core_heldout_p0.py rust/research/cps_core_guard_cofactor_p0.py rust/research/cps_core_selector_ab_p0.py rust/research/cps_core_basis_family_p0.py rust/research/cps_core_fourth_p0.py > evidence/source-sha256.txt
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev libboost-filesystem-dev libboost-test-dev libantlr4-runtime-dev
      - name: Provision pinned GPMC and qualify packed count
        run: |
          set -euo pipefail
          # Validate lifecycle receipt semantics without launching a solver.
          PYTHONPATH=rust/research python3 - <<'PY' | tee evidence/cps-timeout-receipt-smoke.log
          import json, pathlib, tempfile
          from cps_core_matched_p0 import atomic_receipt, timeout_row, sha
          with tempfile.TemporaryDirectory() as temp:
              folder=pathlib.Path(temp)
              assert timeout_row(folder,"wmc") == dict(verdict="UNKNOWN",reason="PROCESS_TIMEOUT")
              for name in ("base.cnf","packed.cnf","initial.txt"):
                  (folder/name).write_text(name)
              ready=dict(verdict="UNKNOWN",reason="QUERY_PREPARED",solver_invoked=None,
                         cnf_sha256=sha(folder/"base.cnf"),packed_sha256=sha(folder/"packed.cnf"),
                         initial_sha256=sha(folder/"initial.txt"))
              atomic_receipt(folder,"query-ready.json",ready)
              row=timeout_row(folder,"wmc")
              assert row["solver_invoked"] is None and row["timeout_boundary"]=="prepared-no-launch-receipt",row
              launch=dict(packed_sha256=ready["packed_sha256"],pid=123)
              atomic_receipt(folder,"solver-launch.json",launch)
              row=timeout_row(folder,"hybrid-dag")
              assert row["solver_invoked"] is True and row["timeout_boundary"]=="launched-no-exit-receipt",row
              atomic_receipt(folder,"solver-exit.json",dict(launch,solver_s=0.25,returncode=0))
              row=timeout_row(folder,"wmc")
              assert row["verdict"]=="UNKNOWN" and row["timeout_boundary"]=="exit-observed-before-worker-result" and row["solver_s"]==0.25,row
              assert timeout_row(folder,"autoq")==dict(verdict="UNKNOWN",reason="PROCESS_TIMEOUT")
              (folder/"packed.cnf").write_text("mutated")
              try:
                  timeout_row(folder,"wmc")
              except AssertionError:
                  pass
              else:
                  raise AssertionError("mutated query accepted")
          print("CPS_TIMEOUT_RECEIPTS prepared=PASS launch=PASS exit=PASS mutation=REJECTED")
          PY
          grep -Fx 'CPS_TIMEOUT_RECEIPTS prepared=PASS launch=PASS exit=PASS mutation=REJECTED' evidence/cps-timeout-receipt-smoke.log
          python3 scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-release.json
          sha256sum "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-sha256.txt
          PYTHONPATH=rust/research python3 - "$RUNNER_TEMP/cps-gpmc" <<'PY'
          import pathlib, subprocess, sys
          from hoare_ganak_exact import single_fibre_pack, single_fibre_decode, parse_gpmc_integer
          data, radix, bound = single_fibre_pack("p cnf 3 1\n1 0\n",[2,3,-1],2)
          path=pathlib.Path("evidence/packed-smoke.cnf")
          path.write_text(data)
          run=subprocess.run([sys.argv[1],"-mode=1","-natw",str(path)],capture_output=True,text=True,timeout=20,check=True)
          pathlib.Path("evidence/packed-smoke.log").write_text(run.stdout+run.stderr)
          bins=single_fibre_decode(parse_gpmc_integer(run.stdout,"wmc",bound*radix**7),radix,bound,8)
          assert bins == [1,1,1,1,0,0,0,0],bins
          print("CPS_PACKED_SMOKE=PASS",bins)
          # Qualify packed MPZ counts above the old 63-primary boundary.
          # Each primary appears in a unique-extension alias, so this is
          # not dependent on handling unused DIMACS variables.
          for primary in (80,92,126,129):
              rows=["1 0"]
              for j in range(primary):
                  x=j+2
                  a=primary+j+2
                  rows.extend((f"{-a} {x} 0",f"{a} {-x} 0"))
              base=f"p cnf {2*primary+1} {len(rows)}\n"+"\n".join(rows)+"\n"
              data,radix,bound=single_fibre_pack(base,[2,3,-1],primary)
              path=pathlib.Path(f"evidence/packed-wide-{primary}.cnf")
              path.write_text(data)
              run=subprocess.run([sys.argv[1],"-mode=1","-natw",str(path)],capture_output=True,text=True,timeout=20,check=True)
              pathlib.Path(f"evidence/packed-wide-{primary}.log").write_text(run.stdout+run.stderr)
              bins=single_fibre_decode(parse_gpmc_integer(run.stdout,"wmc",bound*radix**7),radix,bound,8)
              assert bins==[1<<(primary-2)]*4+[0]*4,(primary,bins)
              print("CPS_PACKED_WIDE_SMOKE=PASS",primary,bins)
          PY
      - name: Build and verify shared initial lowering
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test property_hoare_experiment --no-run --message-format=json > evidence/build.jsonl || {
            status=$?
            python3 -c 'import json,sys; [print(r["message"].get("rendered") or r["message"]["message"],file=sys.stderr) for r in map(json.loads,open("evidence/build.jsonl")) if r.get("reason")=="compiler-message" and r["message"].get("level")=="error"]' || true
            exit "$status"
          }
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(l) for l in open("evidence/build.jsonl")]
          paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="property_hoare_experiment" and r.get("executable")]
          assert len(paths)==1,paths
          pathlib.Path("evidence/property_hoare_experiment.path").write_text(paths[0])
          PY
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_autoq_shared_fixed_basis_lowering --nocapture | tee evidence/shared-lowering.log
          grep -F 'AQ_SHARED_FIXED_BASIS_ORACLE checks=12' evidence/shared-lowering.log
          timeout 60s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_closure --nocapture | tee evidence/cps-core-closure.log
          grep -F 'CPS_CORE_CLOSURE composition=128 adjoint=128 associativity=128 reverse=128' evidence/cps-core-closure.log
          grep -F 'CPS_GUARD_INTERFACE small_parity=PASS wide_replacement=PASS transient_id=PASS formal_native_reject=PASS' evidence/cps-core-closure.log
          grep -F 'CPS_AFFINE_ADJOINT matrix=PASS unique_extension=PASS zero_row=PASS reject=PASS' evidence/cps-core-closure.log
          grep -F 'CPS_SHARED_AFFINE matrix=PASS zero_row=PASS high_id=PASS reject=PASS' evidence/cps-core-closure.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_affine_phase_cancellation --nocapture | tee evidence/cps-affine-phase-cancellation.log
          grep -F 'CPS_AFFINE_PHASE_CANCELLATION transient=PASS final_cap=PASS mixed_z8=PASS scratch_reject=PASS' evidence/cps-affine-phase-cancellation.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_sparse_rr --nocapture | tee evidence/cps-sparse-rr.log
          grep -F 'CPS_SPARSE_RR elim=PASS hh=PASS omega=PASS high_id=PASS replay=PASS mutant=REJECTED' evidence/cps-sparse-rr.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_sparse_guard_section --nocapture | tee evidence/cps-core8-section.log
          grep -Fx 'CPS_CORE8_SECTION matrix=PASS scale=PASS mutant=REJECTED' evidence/cps-core8-section.log
          # Independent offline truth oracle; never timed as a verification arm.
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_guard_truth_oracle --nocapture | tee evidence/cps-core8-truth-oracle.log
          grep -Fx 'CPS_CORE8_TRUTH_ORACLE direct=PASS all_coordinates=PASS width_cap=PASS' evidence/cps-core8-truth-oracle.log
          grep -F 'rejection_controls=9' evidence/cps-core-closure.log
          grep -F 'CPS_CORE_CANONICAL padding=384' evidence/cps-core-closure.log
          timeout 60s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_guarded_rr --nocapture | tee evidence/cps-core-rr.log
          grep -F 'CPS_CORE_RR traces=' evidence/cps-core-rr.log
          grep -F 'CPS_RR_PHASE_ADMISSION=PASS legacy512=PASS wide_non_growth=PASS' evidence/cps-core-rr.log
          grep -F 'CPS_RECTANGULAR_RR matrix=PASS replay=PASS dense_ids=PASS scale_mutant=REJECTED' evidence/cps-core-rr.log
          grep -F 'CPS_PREFIX_RR full_matrix=PASS replay=PASS insufficient=REJECTED' evidence/cps-core-rr.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_shared_guard_algebra --nocapture | tee evidence/cps-shared-guard-algebra.log
          grep -F 'CPS_SHARED_GUARD_ALGEBRA checks=4096 narrow_wide=PASS primary67=PASS unique_extension=PASS malformed_reject=PASS' evidence/cps-shared-guard-algebra.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_sparse_frame --nocapture | tee evidence/cps-sparse-frame.log
          grep -F 'CPS_SPARSE_FRAME high_id=PASS matrix=PASS adjoint=PASS live134=PASS missing_id=REJECTED' evidence/cps-sparse-frame.log
          timeout 30s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_factored_guard --nocapture | tee evidence/cps-core-factored-guard.log
          grep -F 'CPS_CORE_FACTORED_GUARD matrix=PASS native_rr=PASS replay_mutant=REJECTED wmc_plan=PASS' evidence/cps-core-factored-guard.log
          CPS_CORE_WMC_DIR="$PWD/evidence/cps-core-wmc" timeout 60s "$(cat evidence/property_hoare_experiment.path)" --exact exact_property_cnf::hoare_cps_core_wmc_export --nocapture | tee evidence/cps-core-wmc-export.log
          timeout 180s python3 rust/research/cps_core_wmc_p0.py evidence/cps-core-wmc "$RUNNER_TEMP/cps-gpmc" | tee evidence/cps-core-wmc.log
          grep -F 'CPS_SPARSE_WMC_PARITY {"flat": 28,' evidence/cps-core-wmc.log
          grep -F 'CPS_CORE_WMC_SUMMARY ' evidence/cps-core-wmc.log
      - name: Verify wide encoder boundaries and original-source WMC pairs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p evidence/width-smoke
          bin="$(cat evidence/property_hoare_experiment.path)"
          AQ_SHARED_WIDE=0 "$bin" --exact exact_property_cnf::hoare_autoq_shared_width_encoder --nocapture | tee evidence/width-default.log
          AQ_SHARED_WIDE=1 AQ_SHARED_WIDTH_SMOKE_DIR="$PWD/evidence/width-smoke" "$bin" --exact exact_property_cnf::hoare_autoq_shared_width_encoder --nocapture | tee evidence/width-wide.log
          grep -F 'AQ_SHARED_WIDTH_BOUNDARY wide=false checks=5' evidence/width-default.log
          grep -F 'AQ_SHARED_WIDTH_BOUNDARY wide=true checks=5' evidence/width-wide.log
          pin=7eed39ad7ba5615a87c3f532a24f866e08967c12
          src="$(mktemp -d)"
          trap 'rm -rf "$src"' EXIT
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/fmlab-iis/AutoQ.git
          timeout 120s git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$pin"
          CPS_CORE_SOURCE_DIR="$src" timeout 60s "$bin" --exact exact_property_cnf::hoare_cps_core_source_lowering --nocapture | tee evidence/cps-core-source.log
          test "$(grep -c '^CPS_CORE_SOURCE_FILE .* verified=true$' evidence/cps-core-source.log)" = 9
          grep -F 'CPS_CORE_SOURCE_SUMMARY predicates=6 oracle_columns=20 oracle_entries=4192' evidence/cps-core-source.log
          CPS_CORE_SOURCE_DIR="$src" CPS_CORE_DECISION_DIR="$PWD/evidence/cps-core-decision" timeout 60s "$bin" --exact exact_property_cnf::hoare_cps_core_source_obligation_admission --nocapture | tee evidence/cps-core-obligation.log
          grep -F 'CPS_CORE_OBLIGATION_SUMMARY cases=9 gate_composition=3 bv_exact=3 ready=9 blocked=0' evidence/cps-core-obligation.log
          grep -F 'CPS_CORE_DECISION_EXPORT cases=9 arms=27 label_certificates=9' evidence/cps-core-obligation.log
          timeout 120s python3 rust/research/cps_core_source_decision_p0.py evidence/cps-core-decision "$RUNNER_TEMP/cps-gpmc" | tee evidence/cps-core-decision.log
          grep -F 'CPS_CORE_DECISION_SUMMARY ' evidence/cps-core-decision.log
          timeout 220s python3 rust/research/autoq_shared_width_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-width "$src" evidence/width-smoke 2>&1 | tee evidence/aq-width.log
          grep -F 'AQ_SHARED_WIDTH_SUMMARY ' evidence/aq-width.log
          timeout 150s python3 rust/research/autoq_shared_family_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-family "$src" 2>&1 | tee evidence/aq-family.log
          grep -F 'AQ_SHARED_FAMILY_SUMMARY ' evidence/aq-family.log
          timeout 110s python3 rust/research/autoq_ss2_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-ss2 2>&1 | tee evidence/aq-ss2.log
          grep -F 'AQ_SS2_SUMMARY ' evidence/aq-ss2.log
          timeout 150s python3 rust/research/autoq_ss3_p0.py "$bin" "$RUNNER_TEMP/cps-gpmc" evidence/aq-ss3 2>&1 | tee evidence/aq-ss3.log
          grep -F 'AQ_SS3_SUMMARY ' evidence/aq-ss3.log
      - name: Matched release source verification pilot
        timeout-minutes: 25
        run: |
          set -euo pipefail
          pin=7eed39ad7ba5615a87c3f532a24f866e08967c12
          src="$RUNNER_TEMP/autoq-matched"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/fmlab-iis/AutoQ.git
          timeout 120s git -C "$src" fetch --depth=1 origin "$pin"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$pin"
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release > evidence/autoq-configure.log 2>&1
          timeout 600s cmake --build "$src/build" --target autoq -j2 > evidence/autoq-build.log 2>&1
          export LD_LIBRARY_PATH="$src:$src/build/lib:$src/build/cli:${LD_LIBRARY_PATH:-}"
          "$src/build/cli/autoq" -v | tee evidence/autoq-version.txt
          cargo test --release --locked --manifest-path rust/Cargo.toml -p quprs --test property_hoare_experiment --no-run --message-format=json > evidence/release-build.jsonl
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(l) for l in open("evidence/release-build.jsonl")]
          paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="property_hoare_experiment" and r.get("executable")]
          assert len(paths)==1,paths
          pathlib.Path("evidence/release-bin.path").write_text(paths[0])
          PY
          timeout 660s python3 rust/research/cps_core_matched_p0.py "$(cat evidence/release-bin.path)" "$RUNNER_TEMP/cps-gpmc" "$src/build/cli/autoq" "$src" evidence/cps-core-matched | tee evidence/cps-core-matched.log
          grep -F 'CPS_MATCHED_SUMMARY {"arms": 324, "periods": 6' evidence/cps-core-matched.log
          CPS_CORE_SOURCE_DIR="$src" CPS_CORE_ENCODING_DIR="$PWD/evidence/cps-core-encoding" timeout 60s "$(cat evidence/release-bin.path)" --exact exact_property_cnf::hoare_cps_core_encoding_ab --nocapture | tee evidence/cps-core-encoding-export.log
          grep -F 'CPS_ENCODING_EXPORT arms=36 pairs=18 nonreal_reject=PASS' evidence/cps-core-encoding-export.log
          timeout 360s python3 rust/research/cps_core_encoding_ab_p0.py evidence/cps-core-encoding "$RUNNER_TEMP/cps-gpmc" | tee evidence/cps-core-encoding.log
          grep -F 'CPS_ENCODING_SUMMARY ' evidence/cps-core-encoding.log
      - name: Held-out original source 04 and 05 admission pilot
        timeout-minutes: 12
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/autoq-matched"
          export LD_LIBRARY_PATH="$src:$src/build/lib:$src/build/cli:${LD_LIBRARY_PATH:-}"
          CPS_CORE8_ELIM_DIR="$PWD/evidence/cps-core8-elim" CPS_AFFINE_PHASE_DIAGNOSTIC=1 CPS_CORE_SOURCE_DIR="$src" timeout 30s "$(cat evidence/release-bin.path)" --exact exact_property_cnf::hoare_cps_sparse_source_admission --nocapture | tee evidence/cps-sparse-source-admission.log
          grep -F "CPS_SPARSE_SOURCE_ADMISSION case=MOGrover05 status=" evidence/cps-sparse-source-admission.log
          grep -F "CPS_SPARSE_AFFINE_ADMISSION case=MOGrover05 status=" evidence/cps-sparse-source-admission.log
          grep -F 'CPS_CORE8_STRUCTURE stage=initial ' evidence/cps-sparse-source-admission.log
          grep -F 'CPS_CORE8_STRUCTURE stage=residual ' evidence/cps-sparse-source-admission.log
          grep -F 'CPS_CORE8_HH_ADMISSION ' evidence/cps-sparse-source-admission.log
          grep -Fx 'CPS_CORE8_ELIM_EXPORT candidates=15' evidence/cps-sparse-source-admission.log
          grep -F 'CPS_CORE8_TRUTH_SUMMARY candidates=15 exact=15 ' evidence/cps-sparse-source-admission.log
          timeout 45s python3 rust/research/cps_core_guard_cofactor_p0.py evidence/cps-core8-elim "$RUNNER_TEMP/cps-gpmc" | tee evidence/cps-core8-elim.log
          grep -F 'CPS_CORE8_ELIM_SUMMARY {"candidates": 15,' evidence/cps-core8-elim.log
          python3 - <<'PY' | tee evidence/cps-core8-truth-parity.log
          import csv, json, pathlib
          d=pathlib.Path("evidence/cps-core8-elim")
          truth={r["key"]:list(map(int,r["bins"].split(","))) for r in csv.DictReader((d/"truth-bins.tsv").open(),delimiter="\t")}
          rows=json.loads((d/"summary.json").read_text())["rows"]
          assert len(truth)==len(rows)==15 and set(truth)=={r["key"] for r in rows}
          compared=0
          for row in rows:
              if row.get("bins") is not None:
                  assert row["bins"]==truth[row["key"]],row
                  compared+=1
          print(f"CPS_CORE8_TRUTH_PARITY exact_oracle={len(truth)} gpmc_compared={compared}")
          PY
          grep -F 'CPS_CORE8_STRUCTURE stage=section-pilot ' evidence/cps-sparse-source-admission.log
          grep -F 'CPS_CORE8_SECTION_PILOT case=MOGrover05 ' evidence/cps-sparse-source-admission.log
          CPS_CORE_SOURCE_DIR="$src" timeout 30s "$(cat evidence/release-bin.path)" --exact exact_property_cnf::hoare_cps_source_selector_pilot --nocapture | tee evidence/cps-core9-selector.log
          grep -Fx 'CPS_CORE9_SELECTOR_PILOT variants=3 source_parity=PASS' evidence/cps-core9-selector.log
          test "$(grep -c '^CPS_CORE9_SELECTOR_COMPOSE ' evidence/cps-core9-selector.log)" -eq 6
          CPS_CORE_SOURCE_DIR="$src" timeout 90s "$(cat evidence/release-bin.path)" --exact exact_property_cnf::hoare_cps_core_heldout_predicates --nocapture | tee evidence/cps-core-heldout-predicates.log
          grep -F 'CPS_HELDOUT_PREDICATE_SUMMARY predicates=12' evidence/cps-core-heldout-predicates.log
          test "$(grep -c '^CPS_HELDOUT_ADJOINT ' evidence/cps-core-heldout-predicates.log)" -eq 12
          timeout 580s python3 rust/research/cps_core_heldout_p0.py "$(cat evidence/release-bin.path)" "$RUNNER_TEMP/cps-gpmc" "$src/build/cli/autoq" "$src" evidence/cps-core-heldout | tee evidence/cps-core-heldout.log
          # Preserve admitted BV04/05, Grover04 and MOGrover04 Hybrid verdicts;
          # preserve query-ready receipts on outer timeout and diagnose 05 admission.
          grep -F 'CPS_HELDOUT_SUMMARY {"arms": 108, "cases": 6, "obligations": 18' evidence/cps-core-heldout.log
          grep -Fx 'CPS_HELDOUT_MANDATORY_REGRESSIONS []' evidence/cps-core-heldout.log
          # Require diagnostic receipts for the actual held-out sparse workload,
          # but never require an expected failure to remain a failure.
          python3 - <<'PY' | tee evidence/cps-core8-diagnostics.log
          import json, pathlib
          root=pathlib.Path("evidence/cps-core-heldout")
          lines=pathlib.Path("evidence/cps-core-heldout.log").read_text().splitlines()
          rows=[json.loads(line.split(" ",1)[1]) for line in lines if line.startswith("CPS_HELDOUT_ARM ")]
          mo=[r for r in rows if r["case"]=="MOGrover/05"]
          assert len(mo)==18,mo
          flat=[r for r in mo if r["mode"] in ("wmc","hybrid")]
          dag=[r for r in mo if r["mode"] in ("wmc-dag","hybrid-dag")]
          assert len(flat)==len(dag)==6
          for row in flat:
              if row["reason"]=="UNSUPPORTED" and row.get("stage")=="flat-encoder" and row.get("storage")=="sparse":
                  assert row.get("encoder_detail") and row.get("initial_sha256"),row
          for row in dag:
              if row.get("query_prepared"):
                  assert row["reason"]=="PROCESS_TIMEOUT" and row["verdict"]=="UNKNOWN",row
                  assert row.get("timeout_boundary") in ("prepared-no-launch-receipt","launched-no-exit-receipt","exit-observed-before-worker-result"),row
                  assert row.get("cnf_sha256") and row.get("packed_sha256"),row
          for row in flat+dag:
