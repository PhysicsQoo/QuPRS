      - name: Prepare bounded native Conditional RR CodSpeed target
        if: env.CRR_PERF_STAGE == 'simulation'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          cases = {x["id"]: x for x in json.loads(Path("docs/development/paper-corpus-manifest.json").read_text())["cohorts"]["table2_mqt"]["cases"]}
          for name in ["qft_16","qft_20","qft_24","qpeexact_20","qwalk-noancilla_4","wstate_8","vqe_8","qnn_8"]:
              for side in ("source", "transpiled"):
                  entry = cases[name][side]
                  data = Path(entry["path"]).read_bytes()
                  assert hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest() == entry["git_blob_sha1"]
                  print(name, side, hashlib.sha256(data).hexdigest())
          PY
          sha256sum benchmarks/rust_core/Cargo.lock benchmarks/rust_core/Cargo.toml benchmarks/rust_core/benches/conditional_trace.rs >> evidence/source-sha256.txt
          cargo install --locked --version 6.0.0 cargo-codspeed
          cd benchmarks/rust_core
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo codspeed build -m simulation --bench conditional_trace
      - name: Conditional RR native CPU Simulation
        if: env.CRR_PERF_STAGE == 'simulation'
        uses: CodSpeedHQ/action@v5
        env:
          CURL_HOME: ${{ github.workspace }}/.github/codspeed-download
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'false'
          run: cd benchmarks/rust_core && cargo codspeed run --bench conditional_trace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-rr-incidence
          path: evidence/
