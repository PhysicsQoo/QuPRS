  conditional-rr-incidence:
    if: github.ref == 'refs/heads/experiment/conditional-rr'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
      CRR_PERF_STAGE: formal_local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: conditional-rr-incidence
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Build and run bounded exact controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          rustc --version | tee evidence/rustc-version.txt
          sha256sum rust/quprs/tests/conditional_rr_experiment.rs rust/quprs/tests/support/conditional_trace.rs rust/research/conditional_rr_incidence.py docs/development/paper-corpus-manifest.json > evidence/source-sha256.txt
          CRR_GATE_DIR="$PWD/evidence/portable-gates" cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test conditional_rr_experiment exact_ -- --nocapture 2>&1 | tee evidence/conditional-controls.log
      - name: Profile source-locked original EQ pairs
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python3 scripts/install_gpmc_release.py --dest "$tmp/gpmc" | tee evidence/conditional-gpmc-release.json
          sha256sum "$tmp/gpmc" | tee evidence/conditional-gpmc-sha256.txt
          CRR_GATE_DIR="$PWD/evidence/portable-gates" QUPRS_GPMC_PATH="$tmp/gpmc" cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test conditional_rr_experiment gpmc_trace_witness -- --nocapture 2>&1 | tee evidence/conditional-gpmc-witness.log
          if [[ "$CRR_PERF_STAGE" == formal_local ]]; then
            echo "Prior reference and performance evidence retained; this stage checks formal local lemmas."
          elif [[ "$CRR_PERF_STAGE" == independent_reference ]]; then
            sha256sum rust/research/conditional_rr_reference.py rust/Cargo.lock >> evidence/source-sha256.txt
            python3 -m venv "$tmp/reference-venv"
            "$tmp/reference-venv/bin/pip" install --disable-pip-version-check mpmath==1.3.0
            cargo test --release --locked --manifest-path rust/Cargo.toml -p quprs --test conditional_rr_experiment --no-run
            QUPRS_GPMC_PATH="$tmp/gpmc" timeout --kill-after=5s 600s "$tmp/reference-venv/bin/python" rust/research/conditional_rr_reference.py 2>&1 | tee evidence/conditional-independent-reference.jsonl
          elif [[ "$CRR_PERF_STAGE" == native_walltime ]]; then
            sha256sum rust/research/conditional_rr_walltime.py rust/Cargo.lock >> evidence/source-sha256.txt
            cargo test --release --locked --manifest-path rust/Cargo.toml -p quprs --test conditional_rr_experiment --no-run
            QUPRS_GPMC_PATH="$tmp/gpmc" python3 rust/research/conditional_rr_walltime.py 2>&1 | tee evidence/conditional-native-walltime.jsonl
          else
            CRR_GPMC_COMPARE=1 QUPRS_GPMC_PATH="$tmp/gpmc" \
              python3 rust/research/conditional_rr_incidence.py 2>&1 | tee evidence/conditional-incidence.jsonl
          fi
