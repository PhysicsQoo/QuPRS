name: QASM source semantics experiment

# Isolated CPS reducibility branch only. Do not merge this branch-specific
# workflow replacement into the live source-semantics branch or main.
on:
  push:
    branches:
      - research/cps-reducibility-orbit-eq
    paths:
      - .github/workflows/qasm-source-semantics-experiment.yml
      - rust/research/cps_reducibility_pilot.py
      - rust/research/cps_reducibility_stage2.py
      - rust/research/cps_reducibility_stage3.py
      - rust/research/cps_reducibility_stage4.py
      - rust/research/cps_reducibility_stage5.py
      - rust/research/autoq_c3_pilot.py
      - rust/quprs/tests/property_hoare_experiment.rs
      - rust/quprs/tests/cps_orbit_eq_experiment.rs
      - rust/quprs/tests/support/autoq_hsl_p0.rs

permissions:
  contents: read
concurrency:
  group: qasm-source-semantics-cps-reducibility
  cancel-in-progress: false
jobs:
  bounded-cps-native:
    name: CPS reducibility paired native pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qasm-source-semantics-experiment
      - name: Record provenance and install native prerequisites
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git merge-base --is-ancestor 1527cd0a10bcefa08153023022c211b2b9ed4b17 HEAD
          rustc --version | tee evidence/rustc-version.txt
          cargo --version | tee evidence/cargo-version.txt
          lscpu > evidence/cpu.txt
          sha256sum rust/quprs/tests/cps_orbit_eq_experiment.rs rust/quprs/tests/support/autoq_hsl_p0.rs rust/research/cps_reducibility_pilot.py rust/research/cps_reducibility_stage2.py rust/research/cps_reducibility_stage3.py rust/research/cps_reducibility_stage4.py rust/research/cps_reducibility_stage5.py rust/quprs/tests/property_hoare_experiment.rs rust/research/autoq_c3_pilot.py rust/research/hoare_ganak_exact.py > evidence/source-sha256.txt
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Provision pinned GPMC and qualify packed count
        run: |
          set -euo pipefail
          python3 scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-release.json
          sha256sum "$RUNNER_TEMP/cps-gpmc" | tee evidence/gpmc-sha256.txt
          PYTHONPATH=rust/research python3 - "$RUNNER_TEMP/cps-gpmc" <<'PY'
          import pathlib, subprocess, sys
          from hoare_ganak_exact import single_fibre_pack, single_fibre_decode, parse_gpmc_integer
          data, radix, bound = single_fibre_pack("p cnf 3 1\n1 0\n",[2,3,-1],2)
          path=pathlib.Path("evidence/packed-smoke.cnf")
          path.write_text(data)
          run=subprocess.run([sys.argv[1],"-mode=1","-natw",str(path)],capture_output=True,text=True,timeout=20,check=True)
          pathlib.Path("evidence/packed-smoke.log").write_text(run.stdout+run.stderr)
          bins=single_fibre_decode(parse_gpmc_integer(run.stdout,"wmc",bound*radix**7),radix,bound,8)
          assert bins == [1,1,1,1,0,0,0,0],bins
          print("CPS_PACKED_SMOKE=PASS",bins)
          PY
      - name: Build exact native test binaries
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs --test cps_orbit_eq_experiment --test property_hoare_experiment --no-run --message-format=json > evidence/build.jsonl
          python3 - <<'PY'
          import json, pathlib
          rows=[json.loads(line) for line in open("evidence/build.jsonl")]
          for name in ("cps_orbit_eq_experiment","property_hoare_experiment"):
              paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")==name and r.get("executable")]
              assert len(paths)==1,(name,paths)
              pathlib.Path("evidence/"+name+".path").write_text(paths[0])
          PY
      - name: Execute paired native pilot
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout 480s python3 rust/research/cps_reducibility_stage5.py \
            "$(cat evidence/cps_orbit_eq_experiment.path)" "$(cat evidence/property_hoare_experiment.path)" "$RUNNER_TEMP/cps-gpmc" evidence/cps-pilot \
            2>&1 | tee evidence/cps-pilot.log
          grep -F 'CPS_STAGE5_ACCEPTANCE ' evidence/cps-pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps-reducibility-native-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
