name: QASM source semantics experiment

# A branch-scoped diagnostic workflow. No release or deployment privileges.
on:
  push:
    branches:
      - experiment/qasm-source-semantics-ci
    paths:
      - rust/quprs/tests/qasm_source_semantics_experiment.rs
      - rust/quprs/tests/qasm_strict_unitary_matrix_oracle.rs
      - rust/quprs/tests/qasm_two_qubit_source_contract.rs
      - rust/quprs/tests/qasm_source_ir_certificate_experiment.rs
      - rust/research/p8c1_checker.rs
      - rust/quprs/tests/qasm_independent_source_kernel_experiment.rs
      - .github/workflows/qasm-source-semantics-experiment.yml

permissions:
  contents: read

concurrency:
  group: qasm-source-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-probe:
    name: Native source admission and phase diagnostics (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUPRS_SOLVER_PROVISION: external
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qasm-source-semantics-experiment

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev

      - name: Record source and toolchain
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt
          git merge-base --is-ancestor 0b28736651b3740ed3b201edd2efdef3da541e0d HEAD
          printf '%s\n' 0b28736651b3740ed3b201edd2efdef3da541e0d | tee evidence/base-commit.txt
          rustc --version | tee evidence/rustc-version.txt
          cargo --version | tee evidence/cargo-version.txt
          sha256sum rust/quprs/src/qasm.rs rust/quprs/src/gates.rs \
            rust/quprs/src/ir.rs rust/quprs/tests/qasm_source_semantics_experiment.rs \
            rust/quprs/tests/qasm_strict_unitary_matrix_oracle.rs \
            rust/quprs/tests/qasm_two_qubit_source_contract.rs \
            rust/quprs/tests/qasm_source_ir_certificate_experiment.rs \
            rust/research/p8c1_checker.rs \
            rust/quprs/tests/qasm_independent_source_kernel_experiment.rs \
            > evidence/source-sha256.txt

      - name: Observe native parser, CX and U/U3 phase behavior
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_semantics_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/observed-native.log

      - name: Reconstruct exact native unitary matrices independently
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_strict_unitary_matrix_oracle observed_ -- --nocapture \
            2>&1 | tee evidence/exact-unitary-matrices.log

      - name: Observe exact two-qubit source and effect diagnostics
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_two_qubit_source_contract observed_ -- --nocapture \
            2>&1 | tee evidence/two-qubit-observed.log

      - name: Check bounded source IR certificates and Z4 normal forms
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_ir_certificate_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/source-ir-certificate.log

      - name: Check standalone std-only P8C1 checker
        run: |
          set -euo pipefail
          # Independent verifier is compiled with rustc, no Cargo package,
          # QuPRS API, producer, external libraries or native dependencies.
          rustc --edition=2021 --test rust/research/p8c1_checker.rs -o evidence/p8c1-checker-tests
          evidence/p8c1-checker-tests --nocapture 2>&1 | tee evidence/p8c1-standalone-tests.log
          rustc --edition=2021 rust/research/p8c1_checker.rs -o evidence/p8c1-checker
          # Native research producer exports source/proof pairs. The CLI
          # re-reads the actual files in a separate process and checks each.
          P8C1_FIXTURE_DIR="$GITHUB_WORKSPACE/evidence/p8c1-fixtures" \
            cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_ir_certificate_experiment \
            observed_p8c1_exports_cross_binary_fixtures_when_requested -- --nocapture \
            2>&1 | tee evidence/p8c1-fixture-export.log
          : > evidence/p8c1-cross-binary.log
          for case in h-cx-t cx-t-parity mixed-3q structural-16q; do
            evidence/p8c1-checker \
              "evidence/p8c1-fixtures/$case.qasm" \
              "evidence/p8c1-fixtures/$case.p8c1" | tee -a evidence/p8c1-cross-binary.log
          done
          test "$(grep -c '^SCOPED_REPLAY_PASS ' evidence/p8c1-cross-binary.log)" -eq 4
          set +e
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/forged.p8c1 > evidence/p8c1-cross-binary-forged.log
          status=$?
          set -e
          test "$status" -eq 4
          grep -x 'INVALID_PROOF' evidence/p8c1-cross-binary-forged.log
          echo 'P8C1_STANDALONE_CROSS_BINARY=4 exact_pass; 1 invalid_proof_rejected'
          # Explicitly separate parser failures from proof failures and
          # resource exhaustion. These are typed exit codes, not PROVED.
          printf 'OPENQASM 3.1;\n' > evidence/p8c1-unsupported.qasm
          printf 'OPENQASM 3.0;\ninclude "stdgates.inc";\nqubit[0] q;\n' \
            > evidence/p8c1-invalid.qasm
          head -c 1048577 /dev/zero > evidence/p8c1-overlimit.p8c1
          head -c 32769 /dev/zero > evidence/p8c1-overlimit.qasm
          head -c 60 evidence/p8c1-fixtures/h-cx-t.p8c1 \
            > evidence/p8c1-truncated.p8c1
          check_reject() {
            expected_label="$1"; expected_code="$2"; shift 2
            set +e
            evidence/p8c1-checker "$@" > evidence/p8c1-typed-negative-last.log
            actual_code=$?
            set -e
            test "$actual_code" -eq "$expected_code"
            grep -x "$expected_label" evidence/p8c1-typed-negative-last.log
          }
          check_reject UNSUPPORTED_SOURCE 3 \
            evidence/p8c1-unsupported.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject INVALID_SOURCE 2 \
            evidence/p8c1-invalid.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject UNKNOWN_RESOURCE 5 \
            evidence/p8c1-fixtures/h-cx-t.qasm evidence/p8c1-overlimit.p8c1
          check_reject UNKNOWN_RESOURCE 5 \
            evidence/p8c1-overlimit.qasm evidence/p8c1-fixtures/h-cx-t.p8c1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm evidence/p8c1-truncated.p8c1
          echo 'P8C1_TYPED_NEGATIVES=5 exact_classes=true'

          # P0-C: exact basis-only P/B/delta property, cryptographically
          # bound to the source, normalized spec bytes and verified P8C1.
          # SHA digests are equality binding, not signatures or source trust.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          d=Path("evidence/p8c1-fixtures")
          src=(d/"h-cx-t.qasm").read_bytes()
          proof=(d/"h-cx-t.p8c1").read_bytes()
          for name, bad, delta in [
              ("safe","0000000000000002","0/1"),
              ("violated","0000000000000008","1/3")]:
              sp=(f"SPB1\nn=2\nbasis_pre=0x0000000000000001\n"
                  f"basis_bad=0x{bad}\ndelta={delta}\n").encode()
              binding=(b"P8S1"+hashlib.sha256(src).digest()
                  +hashlib.sha256(sp).digest()+hashlib.sha256(proof).digest())
              (d/f"{name}.spb1").write_bytes(sp)
              (d/f"{name}.p8s1").write_bytes(binding)
          PY
          evidence/p8c1-checker \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/safe.spb1 \
            evidence/p8c1-fixtures/safe.p8s1 | tee evidence/p8s1-safe.log
          grep -x 'SCOPED_PROPERTY_SAT source_trust=BLOCKED' evidence/p8s1-safe.log
          check_reject SCOPED_PROPERTY_VIOLATED 6 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/violated.spb1 \
            evidence/p8c1-fixtures/violated.p8s1
          # Reuse old binding while swapping both a valid spec and a proof.
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/h-cx-t.p8c1 \
            evidence/p8c1-fixtures/violated.spb1 \
            evidence/p8c1-fixtures/safe.p8s1
          check_reject INVALID_PROOF 4 \
            evidence/p8c1-fixtures/h-cx-t.qasm \
            evidence/p8c1-fixtures/forged.p8c1 \
            evidence/p8c1-fixtures/safe.spb1 \
            evidence/p8c1-fixtures/safe.p8s1
          echo 'P8S1_CROSS_BINARY_PROPERTY=sat_1 violated_1 forged_2 source_trust_blocked'

          if test -x /usr/bin/time; then
            /usr/bin/time -f 'P8C1_PILOT_WALL_S=%e\nP8C1_PILOT_PEAK_RSS_KB=%M' \
              -o evidence/p8c1-standalone-resource-pilot.log \
              evidence/p8c1-checker \
                evidence/p8c1-fixtures/structural-16q.qasm \
                evidence/p8c1-fixtures/structural-16q.p8c1
            cat evidence/p8c1-standalone-resource-pilot.log
          else
            echo 'P8C1_PILOT_RSS=UNAVAILABLE' > evidence/p8c1-standalone-resource-pilot.log
          fi


      - name: Check independent source semantics and gate-prefix certificates
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_independent_source_kernel_experiment observed_ -- --nocapture \
            2>&1 | tee evidence/independent-source-kernel.log

      - name: Check strict two-qubit source matrices (diagnostic, may fail)
        id: two_qubit
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_two_qubit_source_contract strict_contract_ -- --nocapture \
            2>&1 | tee evidence/two-qubit-strict.log

      - name: Check official strict unitary matrices (diagnostic, may fail)
        id: exact_matrix
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_strict_unitary_matrix_oracle strict_contract_ -- --nocapture \
            2>&1 | tee evidence/exact-unitary-conformance.log

      - name: Compare against strict source contract (diagnostic, may fail)
        id: strict
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p quprs \
            --test qasm_source_semantics_experiment strict_contract_ -- --nocapture \
            2>&1 | tee evidence/strict-source-contract.log

      - name: Report diagnostic outcome
        if: always()
        env:
          STRICT_RESULT: ${{ steps.strict.outcome }}
          MATRIX_RESULT: ${{ steps.exact_matrix.outcome }}
          TWOQ_RESULT: ${{ steps.two_qubit.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'strict_source_contract=%s\nstrict_matrix_contract=%s\nstrict_two_qubit_contract=%s\n' "$STRICT_RESULT" "$MATRIX_RESULT" "$TWOQ_RESULT" > evidence/summary.txt
          {
            echo '## QASM source semantics — research-only diagnostic'
            echo
            echo "Strict conformance test outcome: **$STRICT_RESULT**"
            echo "Strict full-matrix outcome: **$MATRIX_RESULT**"
            echo "Strict two-qubit outcome: **$TWOQ_RESULT**"
            echo
            echo 'A failed strict test identifies a source semantic discrepancy.'
            echo 'It is **not** a failure of unrelated production CI, nor a verified correction.'
            echo 'A successful observed-behavior test does not certify OpenQASM conformance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qasm-source-semantics-diagnostics
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7


  standalone-no-native-prerequisites:
    name: Standalone P8C1 verifier without QuPRS/Cargo/native libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Install stable Rust only
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test std-only independent verifier
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test rust/research/p8c1_checker.rs -o /tmp/p8c1-standalone-unit
          /tmp/p8c1-standalone-unit --nocapture
          rustc --edition=2021 rust/research/p8c1_checker.rs -o /tmp/p8c1-standalone
          set +e
          /tmp/p8c1-standalone > /tmp/p8c1-no-input.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -x INVALID_SOURCE /tmp/p8c1-no-input.log
          echo 'P8C1_STDALONE_NO_CARGO=4_tests_pass'
