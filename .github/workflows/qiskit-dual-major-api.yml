name: Qiskit 1.x and 2.x clean dependency compatibility
on:
  pull_request:
    branches: [dev]
    paths:
      - 'pyproject.toml'
      - 'src/QuPRS/utils/Qiskit_Circuit_Utils.py'
      - 'test/test_qiskit_library_constructor_compat.py'
      - '.github/workflows/qiskit-dual-major-api.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    name: Build a single source-pinned wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qiskit-dual-major-api
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev libmpfr-dev libatomic1 zlib1g-dev
          python -m pip install --upgrade pip 'maturin>=1.5,<2'
      - name: Build exact HEAD for four independent version installers
        run: |
          set -euo pipefail
          maturin build --release --interpreter python --out dist --compatibility off
          sha256sum dist/*.whl > dist/SHA256SUMS
          git rev-parse HEAD > dist/source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qiskit-dual-major-source-wheel
          path: dist/
          retention-days: 14
          if-no-files-found: error
  installed-api:
    needs: package
    name: Fresh pip installer / Qiskit ${{ matrix.qiskit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qiskit: ['1.0.0', '1.4.6', '2.0.0', '2.6.1']
    env:
      EXPECTED_QISKIT: ${{ matrix.qiskit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qiskit-dual-major-source-wheel
          path: dist
      - name: True clean dependency resolution and source-matched public API
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(cat dist/source-head.txt)" = "$GITHUB_SHA"
          sha256sum -c dist/SHA256SUMS
          python -m pip install --upgrade pip
          python -m pip install "qiskit==$EXPECTED_QISKIT" dist/*.whl 'pytest>=8,<9' 2>&1 | tee evidence/install.log
          python -m pip check 2>&1 | tee evidence/pip-check.log
          python -m pip freeze > evidence/pip-freeze.txt
          python - <<'PY'
          from importlib.metadata import version, requires
          import os
          assert version('qiskit') == os.environ['EXPECTED_QISKIT']
          assert any('qiskit' in x.lower() and '<3.0' in x for x in requires('QuPRS') or [])
          PY
          python -m pytest -q -ra test/test_qiskit_library_constructor_compat.py \
            --junitxml=evidence/qiskit-api-junit.xml 2>&1 | tee evidence/test.log
      - name: Preserve version-resolver fingerprints and diagnostic failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qiskit-dual-major-installed-${{ matrix.qiskit }}
          path: evidence/
          retention-days: 14
          if-no-files-found: ignore
