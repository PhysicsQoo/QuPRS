name: QOO-134 Rust Exact-Angle Prototype

on:
  pull_request:
    paths:
      - 'rust/pathsum/tests/qoo134_angle_domain.rs'
      - '.diagnostics/qoo134_angle_prototype/**'
      - '.github/workflows/qoo134-exact-angle-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo134-exact-angle-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-test-only-exact-angle-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo134-angle-testonly-v1
      - name: Install native build prerequisites and record toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          mkdir -p qoo134-angle-prototype-results
          rustc --version > qoo134-angle-prototype-results/rust-version.txt
          cargo --version > qoo134-angle-prototype-results/cargo-version.txt
          sha256sum rust/Cargo.lock > qoo134-angle-prototype-results/lock-sha256.txt
      - name: Execute independent test-only BigRational angle model
        shell: bash
        run: |
          mkdir -p qoo134-angle-prototype-results
          set -o pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            --test qoo134_angle_domain -- --nocapture 2>&1 |
            tee qoo134-angle-prototype-results/original-cargo-test.log
      - name: Hash raw test evidence regardless of result
        if: always()
        shell: bash
        run: |
          mkdir -p qoo134-angle-prototype-results
          git rev-parse HEAD > qoo134-angle-prototype-results/source-sha.txt
          sha256sum rust/pathsum/tests/qoo134_angle_domain.rs \
            > qoo134-angle-prototype-results/source-file-sha256.txt
          find qoo134-angle-prototype-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > qoo134-angle-prototype-results/SHA256SUMS
      - name: Upload original test log with SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo134-rust-exact-angle-prototype
          path: qoo134-angle-prototype-results/
          retention-days: 30
          if-no-files-found: error
