name: QOO-134 RED Semantic Regression and Reference-Angle Model

on:
  pull_request:
    paths:
      - '.github/workflows/qoo134-semantic-red.yml'
      - '.diagnostics/qoo134_semantic_red/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-angle-green:
    name: Exact angle expression reference model (GREEN)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reference-only algebraic controls
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q \
            .diagnostics/qoo134_semantic_red/test_reference_angle_expr.py \
            --junitxml=reference-angle-results/junit.xml
      - name: Seal source and reference test evidence
        if: always()
        run: |
          mkdir -p reference-angle-results
          git rev-parse HEAD > reference-angle-results/source-sha.txt
          sha256sum .diagnostics/qoo134_semantic_red/test_reference_angle_expr.py > reference-angle-results/reference-source-sha256.txt
          find reference-angle-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > reference-angle-results/SHA256SUMS
      - name: Archive reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo134-reference-angle-green
          path: reference-angle-results/
          retention-days: 30
          if-no-files-found: error

  native-semantic-red:
    name: Native Reduction/Hybrid strict semantic RED gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned native Rust FFI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: First verify actual inequivalent and symbolic-equality controls are GREEN
        run: |
          python -m pytest -q \
            .diagnostics/qoo134_semantic_red/test_native_red.py::test_native_control_semantics_remain_green \
            --junitxml=qoo134-native-red-results/control-junit.xml
      - name: Enforce genuine Reduction/Hybrid RED without xfail or WMC substitute
        run: |
          python -m pytest -q \
            .diagnostics/qoo134_semantic_red/test_native_red.py::test_qoo134_native_equivalent_up_to_phase_red \
            --junitxml=qoo134-native-red-results/red-junit.xml
      - name: Preserve source-pinned RED artifacts even when semantic check fails
        if: always()
        run: |
          mkdir -p qoo134-native-red-results
          git rev-parse HEAD > qoo134-native-red-results/source-sha.txt
          python -m pip freeze > qoo134-native-red-results/python-packages.txt
          sha256sum .diagnostics/qoo134_semantic_red/test_native_red.py > qoo134-native-red-results/native-test-source-sha256.txt
          sha256sum benchmarks/MQTBench/qpeexact_nativegates_ibm_qiskit_opt0_8.qasm \
            'benchmarks/MQTBench/h,ry,rz,cx/qpeexact_nativegates_ibm_qiskit_opt0_8.qasm' \
            > qoo134-native-red-results/qpe-input-sha256.txt
          find qoo134-native-red-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > qoo134-native-red-results/SHA256SUMS
      - name: Upload strict RED original test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo134-native-semantic-red
          path: qoo134-native-red-results/
          retention-days: 30
          if-no-files-found: error
