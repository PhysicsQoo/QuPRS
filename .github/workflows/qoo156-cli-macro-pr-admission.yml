name: QOO-156 CLI source-paired CodSpeed Macro admission

# Controlled staging source-paired measurement BEFORE a dev PR, OR dev PR.
# Both are opt-in: repository admins must verify a Macro runner is provisioned
# and set QOO156_MACRO_ENABLED=true before either job can claim admission.
# A skipped/queued job is NOT a performance certificate.
on:
  push:
    branches: [staging/qoo156-cli-resource-admission]
    paths:
      - 'rust/cli/**'
      - 'rust/Cargo.lock'
      - 'benchmarks/codspeed/test_qoo156_cli_supervisor.py'
      - '.github/workflows/qoo156-cli-macro-pr-admission.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'rust/cli/**'
      - 'rust/Cargo.lock'
      - 'benchmarks/codspeed/test_qoo156_cli_supervisor.py'
      - '.github/workflows/qoo156-cli-macro-pr-admission.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: qoo156-macro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-paired-cli-walltime:
    if: vars.QOO156_MACRO_ENABLED == 'true'
    runs-on: codspeed-macro
    timeout-minutes: 30
    env:
      QOO156_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '79e975b0b21c0c650db7a76fe6e35b926c67c2c8' }}
      QOO156_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QOO156_HEAD_SHA }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QOO156_BASE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: qoo156-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin same-runner, source identity, and instrument readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$QOO156_HEAD_SHA"
          test "$(git -C qoo156-base rev-parse HEAD)" = "$QOO156_BASE_SHA"
          test "$(git rev-parse HEAD:rust/pathsum)" = \
               "$(git -C qoo156-base rev-parse HEAD:rust/pathsum)"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgmp-dev libmpfr-dev
          python -m pip install --disable-pip-version-check pytest-codspeed==5.0.4
          mkdir -p evidence
          {
            echo "base=$QOO156_BASE_SHA"
            echo "head=$QOO156_HEAD_SHA"
            echo "pathsum_tree=$(git rev-parse HEAD:rust/pathsum)"
            echo "runner=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "uname=$(uname -a)"
            echo "rustc=$(rustc --version)"
          } > evidence/provenance.txt
      - name: Build old and new CLI with isolated target directories
        shell: bash
        run: |
          set -euo pipefail
          for variant in base head; do
            if [[ "$variant" == base ]]; then
              source="$GITHUB_WORKSPACE/qoo156-base"
            else
              source="$GITHUB_WORKSPACE"
            fi
            cargo build --manifest-path "$source/rust/Cargo.toml" \
              --locked --release -p QuPRS_cli \
              --target-dir "$RUNNER_TEMP/qoo156-$variant-target"
          done
          echo "QOO156_BASE_CLI=$RUNNER_TEMP/qoo156-base-target/release/QuPRS_cli" >> "$GITHUB_ENV"
          echo "QOO156_HEAD_CLI=$RUNNER_TEMP/qoo156-head-target/release/QuPRS_cli" >> "$GITHUB_ENV"
          python -m pytest benchmarks/codspeed/test_qoo156_cli_supervisor.py \
            -q --collect-only
      - name: Only CodSpeed Macro WallTime counts for P1 admission (ABBA)
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest benchmarks/codspeed/test_qoo156_cli_supervisor.py -q --codspeed --codspeed-warmup-time=0 --codspeed-max-rounds=3 --codspeed-max-time=5
      - name: Archive exact source/runner identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo156-cli-macro-${{ env.QOO156_HEAD_SHA }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
