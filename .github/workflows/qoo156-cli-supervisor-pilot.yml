name: QOO-156 CLI isolated resource supervisor pilot

on:
  push:
    branches:
      - experiment/qoo156-cli-supervisor
      - experiment/qoo156-cli-io-admission
      - experiment/qoo156-internal-cgroup-p0
    paths:
      - 'rust/cli/**'
      - 'rust/Cargo.lock'
      - '.github/workflows/qoo156-cli-supervisor-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo156-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-cli-science:
    name: CLI isolation and resource contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native GPMC precision library headers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pkg-config libgmp-dev libmpfr-dev
          else
            brew install pkg-config gmp mpfr
            echo "PKG_CONFIG_PATH=$(brew --prefix mpfr)/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - name: Source provenance
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/head-sha.txt
          uname -sm | tee evidence/host-architecture.txt
          # macos-14 is an existing Intel smoke-check runner; the unavailable
          # macos-15 Apple Silicon job is a distinct NOT_ADMITTED gate.
          rustc --version | tee evidence/rustc.txt
          cargo --version | tee evidence/cargo.txt
          shasum -a 256 rust/cli/src/{main.rs,args.rs,supervisor.rs,runner.rs} > evidence/source-sha256.txt
      - name: Test full CLI package and integration contracts only
        shell: bash
        run: |
          set -eo pipefail
          cargo test --manifest-path rust/Cargo.toml --locked -p QuPRS_cli -- --nocapture \
            2>&1 | tee evidence/cli-tests.log
      - name: Release CLI compile
        shell: bash
        run: |
          set -eo pipefail
          cargo build --manifest-path rust/Cargo.toml --locked -p QuPRS_cli --release \
            2>&1 | tee evidence/release-build.log
      - name: Preserve scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo156-cli-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 20
