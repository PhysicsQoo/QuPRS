name: QOO-156 scoped failed-CNF-only retention regression

on:
  push:
    branches: [experiment/qoo156-cnf-retention-minimal]
    paths:
      - 'rust/cli/**'
      - 'rust/Cargo.lock'
      - '.github/workflows/qoo156-cnf-retention-minimal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo156-cnf-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-cli:
    name: CNF-only opt-in + timeout cleanup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Native build headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libgmp-dev libmpfr-dev
      - name: Check exact source and native-core scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:rust/pathsum)" = "142508b35e9e0833f9fd4f3a22c3eb5497d9336d"
      - name: Focused supervisor science-safety tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --bin QuPRS_cli failed_cnf_opt_in_never_overrides_cgroup_oom_or_unknown_resource_state
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --bin QuPRS_cli parent_owned_temporary_directory_reclaims_forced_worker_artifacts
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor explicit_failed_cnf_opt_in_preserves_private_directory_only_on_failure
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor forced_worker_timeout_removes_private_cnf_and_solver_capture_files
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor signal_cancellation_removes_private_cnf_and_solver_capture_files
      - name: Compile release CLI without changing native algorithms
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p QuPRS_cli
