name: QOO-156 Ganak Native Internal cgroup Boundary (scoped)

# One source-pinned native Ganak 2.8.0 boundary sweep; 71/72/73/74/80
# MiB + 256 MiB positive science control. NO algorithm changes.
# Do NOT use observed duration for performance decisions; CodSpeed only.
on:
  push:
    branches: [experiment/qoo156-ganak-boundary-p0]
    paths:
      - '.github/workflows/qoo156-ganak-internal-boundary.yml'
      - 'scripts/qoo156_internal_cgroup/ganak_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo156-ganak-internal-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-ganak-internal-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build one pinned release CLI + authenticate genuine mode6 Ganak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/qoo156-ganak-boundary
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python3 -m py_compile \
            scripts/qoo156_internal_cgroup/pilot.py \
            scripts/qoo156_internal_cgroup/release_solver.py \
            scripts/qoo156_internal_cgroup/ganak_boundary.py
          cargo build --manifest-path rust/Cargo.toml --locked --release -p QuPRS_cli
          git rev-parse HEAD > evidence/qoo156-ganak-boundary/source-sha.txt
          git rev-parse HEAD:rust/pathsum > evidence/qoo156-ganak-boundary/rust-core-tree.txt
          git rev-parse HEAD:rust/cli > evidence/qoo156-ganak-boundary/cli-tree.txt
          git rev-parse HEAD:GPMC > evidence/qoo156-ganak-boundary/gpmc-tree.txt
          sha256sum rust/target/release/QuPRS_cli \
            src/QuPRS/utils/wmc_tools/ganak \
            scripts/qoo156_internal_cgroup/pilot.py \
            scripts/qoo156_internal_cgroup/release_solver.py \
            scripts/qoo156_internal_cgroup/ganak_boundary.py \
            benchmarks/MQTBench/vqe_nativegates_ibm_qiskit_opt0_4.qasm \
            > evidence/qoo156-ganak-boundary/sha256.txt
          grep -Fq 934a79a3db2f5b3928ce89edde20837f652e4679b099320ac71c198699c709dd \
            evidence/qoo156-ganak-boundary/sha256.txt
          docker build -q -t qoo156:ganak-boundary scripts/qoo156_docker_wmc_envelope \
            > evidence/qoo156-ganak-boundary/image-build.txt
          docker image inspect qoo156:ganak-boundary --format '{{.Id}}' \
            > evidence/qoo156-ganak-boundary/image-id.txt
      - name: Nonroot CLI authentic Ganak near-boundary typed safety sweep
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 4s 105s docker run --rm --privileged --cgroupns=private \
            --memory=512m --memory-swap=512m --pids-limit=64 \
            --network=none --read-only --user 0:0 --tmpfs /tmp:rw,nosuid,size=64m \
            --entrypoint python3 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/rust/target/release/QuPRS_cli,target=/opt/QuPRS_cli,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src/QuPRS/utils/wmc_tools/ganak,target=/opt/ganak,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/benchmarks/MQTBench/vqe_nativegates_ibm_qiskit_opt0_4.qasm,target=/opt/vqe4.qasm,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/qoo156_internal_cgroup/pilot.py,target=/opt/pilot.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/qoo156_internal_cgroup/release_solver.py,target=/opt/release_solver.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/qoo156_internal_cgroup/ganak_boundary.py,target=/opt/ganak_boundary.py,readonly" \
            qoo156:ganak-boundary -u /opt/ganak_boundary.py \
            | tee evidence/qoo156-ganak-boundary/boundary-results.txt
          grep -Fq QOO156_GANAK_CGROUP_BOUNDARY_SAFETY=PASS \
            evidence/qoo156-ganak-boundary/boundary-results.txt
      - name: Preserve source-locked boundary evidence even on NOT_ADMITTED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo156-ganak-boundary-${{ github.sha }}
          path: evidence/qoo156-ganak-boundary/
          if-no-files-found: warn
          retention-days: 30
