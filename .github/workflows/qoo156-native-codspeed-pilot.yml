name: QOO-156 Native CodSpeed Observation Only

# One isolated native Rust simulation upload, not the full release benchmark
# matrix or a performance acceptance gate. Source-only code changes do not
# trigger this job; re-run manually when a new exact SHA has passed scoped CI.
on:
  push:
    branches:
      - experiment/qoo156-rust-cooperative-cancellation
    paths:
      - '.github/workflows/qoo156-native-codspeed-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qoo156-native-only:
    name: Native Rust simulation (observational)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture source and fixed-host class
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          rustc --version > evidence/rustc.txt
          cargo --version > evidence/cargo.txt
          lscpu > evidence/lscpu.txt
          sha256sum rust/pathsum/src/{pathsum/mod.rs,pathsum/boolean_state.rs,pathsum/phase_poly.rs,pathsum/bra_cx.rs,gates.rs,ir.rs,reduction.rs,strategy.rs,wmc.rs,lib.rs} > evidence/source-sha256.txt
      - name: Prepare source-pinned native CodSpeed benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          cargo install --locked --version 6.0.0 cargo-codspeed
          (
            cd benchmarks/rust_core
            cargo metadata --locked --no-deps --format-version 1 >/dev/null
            cargo codspeed build
          ) 2>&1 | tee evidence/native-codspeed-build.log
      - name: CodSpeed native Rust CPU Simulation (existing benchmark identities)
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cd benchmarks/rust_core && cargo codspeed run
      - name: Preserve CodSpeed exact-SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_codspeed_sha_manifest.py \
            --sha "$HEAD_SHA" --family rust-core --instrument simulation \
            --output evidence/native-codspeed-manifest.json
          cp benchmarks/rust_core/Cargo.lock evidence/rust-core-cargo.lock
      - name: Preserve observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo156-native-codspeed-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
