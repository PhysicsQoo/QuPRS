name: QOO-156 Rust exact-science stdout assertions (test-only)

on:
  push:
    branches: [experiment/qoo156-rust-science-verdict-assertions]
    paths:
      - "rust/cli/tests/supervisor.rs"
      - ".github/workflows/qoo156-rust-verdict-assertions-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-linux-verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust native compilation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:rust/pathsum)" = "142508b35e9e0833f9fd4f3a22c3eb5497d9336d"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libgmp-dev libmpfr-dev
      - name: Focused actual QuPRS CLI EQ + fail-closed cap assertions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor dual_circuit_worker_returns_only_complete_equivalence -- --exact --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor explicit_address_space_cap_does_not_fail_open -- --exact --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor physical_memory_cap_never_silently_falls_back_to_unlimited -- --exact --nocapture
