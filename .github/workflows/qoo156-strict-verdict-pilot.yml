name: QOO-156 strict exact-verdict benchmark guard (test-only)

on:
  push:
    branches: [experiment/qoo156-strict-verdict-guard]
    paths:
      - "scripts/qoo156_cli_abba.py"
      - "benchmarks/codspeed/test_qoo156_cli_supervisor.py"
      - "scripts/test_qoo156_verdict_guard.py"
      - ".github/workflows/qoo156-strict-verdict-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdict-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact source and Python guard syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m py_compile scripts/qoo156_cli_abba.py benchmarks/codspeed/test_qoo156_cli_supervisor.py scripts/test_qoo156_verdict_guard.py
      - name: Run real-path mock negative-verdict tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q scripts/test_qoo156_verdict_guard.py
