name: QOO-157 d4 opt-in SolverAdapter PoC

on:
  push:
    branches: [experiment/qoo157-d4-adapter-poc]
    paths:
      - 'research/qoo157_d4/d4_transport.py'
      - 'research/qoo157_d4/d4_solver_adapter_poc.py'
      - 'research/qoo157_d4/test_d4_transport.py'
      - 'research/qoo157_d4/test_d4_solver_adapter_poc.py'
      - 'research/qoo157_d4/run_native_adapter_poc.py'
      - 'research/qoo157_d4/source-cnf-manifest.sha256'
      - '.github/workflows/qoo157-d4-adapter-poc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qoo157-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone parser and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python -m unittest discover -v -s research/qoo157_d4 \
            -p test_d4_transport.py 2>&1 | tee evidence/transport.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo157-adapter-parser-${{ github.sha }}
          path: evidence/
          retention-days: 30
  adapter:
    needs: transport
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo157-adapter-poc-v1
      - name: Install dependencies and existing QuPRS dev package
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Scoped third-solver and incumbent adapter tests
        shell: bash
        env:
          PYTHONPATH: research/qoo157_d4
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python -m pytest -q -ra \
            research/qoo157_d4/test_d4_solver_adapter_poc.py \
            test/test_solver_adapter_contract.py \
            --junitxml=evidence/scoped.xml \
            2>&1 | tee evidence/scoped.log
          git diff --name-only 79e975b0b21c0c650db7a76fe6e35b926c67c2c8..HEAD \
            > evidence/changed-files.txt
          if grep -E '^(src/|rust/pathsum/src/|pyproject.toml$|GPMC$)' evidence/changed-files.txt; then
            exit 2
          fi
      - name: Compile pinned external 426-bit d4 research variant, no distribution
        shell: bash
        run: |
          set -euo pipefail
          export UPSTREAM_SHA=be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$RUNNER_TEMP/qoo157-d4"
          git -C "$RUNNER_TEMP/qoo157-d4" checkout --detach "$UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/qoo157-d4" rev-parse HEAD)" = "$UPSTREAM_SHA"
          mkdir -p evidence/d4-variant
          python research/qoo157_d4/precision_variant.py \
            --upstream "$RUNNER_TEMP/qoo157-d4" --evidence evidence/d4-variant
          git -C "$RUNNER_TEMP/qoo157-d4" diff --check
          git -C "$RUNNER_TEMP/qoo157-d4" diff -- c++/counter/src/Main.cpp \
            > evidence/d4-variant/only-source-change.diff
          (
            cd "$RUNNER_TEMP/qoo157-d4/c++/counter"
            ./build.sh -j
          ) 2>&1 | tee evidence/d4-variant/build.log
          binary="$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter"
          test -x "$binary"
          sha256sum "$binary" > evidence/d4-variant/binary-sha256.txt
          python - <<'PY'
          import hashlib, json, os, pathlib
          executable = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qoo157-d4/c++/counter/build/counter"
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          pathlib.Path("evidence/d4-variant/provenance-for-adapter.json").write_text(
              json.dumps({
                  "binary_sha256": digest,
                  "d4_upstream_commit": "be15f91f3e9769e1f5cb175fa27e3eca3a1ea690",
                  "gmp_preparse_bits": 426,
                  "source_patch_approved_for_research": True,
                  "scope": "ephemeral external CI build only",
              }, indent=2) + "\n"
          )
          PY
      - name: Real native d4 through installed Python WMC facade on six pinned QuPRS CNFs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: research/qoo157_d4
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen-cnf
          gh run download 41807195090 --repo PhysicsQoo/QuPRS \
            --name qoo157-d4-native-5b7b6027c90438a2c1b9cdbbfe35d4b80fafed95 \
            --dir evidence/frozen-cnf
          (
            cd evidence/frozen-cnf
            sha256sum -c "$GITHUB_WORKSPACE/research/qoo157_d4/source-cnf-manifest.sha256"
          )
          args=(
            --binary "$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter"
            --provenance evidence/d4-variant/provenance-for-adapter.json
            --out evidence/native-python-adapter.json
          )
          for cnf in evidence/frozen-cnf/quprs-source-cnf/*.cnf; do
            args+=(--cnf "$cnf")
          done
          python research/qoo157_d4/run_native_adapter_poc.py "${args[@]}" \
            2>&1 | tee evidence/native-python-adapter.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo157-adapter-poc-${{ github.sha }}
          path: evidence/
          retention-days: 30
