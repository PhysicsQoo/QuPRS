name: QOO157 P8 BiPe same-residual preproc-only v full official CodSpeed
on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-d4-bipe-stage-codspeed.yml'
      - 'research/qoo157_d4/d4_preproc_only_patch.py'
      - 'research/qoo157_d4/qoo157_d4_preproc_only_science.py'
      - 'research/qoo157_d4/test_codspeed_d4_bipe_stage.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  d4-bipe-preproc-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: research/qoo157_d4
      QOO157_P8_SCIENCE: evidence/d4-p8-native-science.json
      QOO157_P8_CNF: evidence/original/cnfs/qaoa7_neq.cnf
      QUPRS_CODSPEED_EXPORT: evidence/d4-p8-codspeed-walltime.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin syntax and official CodSpeed v5 measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/qoo157_d4/d4_preproc_only_patch.py research/qoo157_d4/qoo157_d4_preproc_only_science.py research/qoo157_d4/test_codspeed_d4_bipe_stage.py
          python -m pip install 'pytest-codspeed==5.0.3' pytest
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-residual-identity-6f1c7093c766424fb1b1fb6352f20bc89074d150
          run-id: 41942959399
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/p7
      - name: Build one source-pinned d4 scratch binary with env-gated P8 preproc-only path
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo157-d4-stage"
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$root"
          git -C "$root" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$root" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          mkdir -p evidence
          python research/qoo157_d4/matched_precision_variant.py --upstream "$root" --evidence evidence --digits 38
          python research/qoo157_d4/d4_bipe_instrument.py --source "$root" --evidence evidence
          python research/qoo157_d4/d4_residual_dump_patch.py --source "$root" --evidence evidence
          python research/qoo157_d4/d4_preproc_only_patch.py --root "$root" --evidence evidence
          git -C "$root" diff --check
          git -C "$root" diff -- c++/counter/src/Main.cpp c++/counter/src/Counter.cpp > evidence/d4-p8-scratch.patch
          (cd "$root/c++/counter" && ./build.sh -j) > evidence/d4-p8-build.log 2>&1
          binary="$root/c++/counter/build/counter"
          test -x "$binary"
          echo "QOO157_P8_BINARY=$binary" >> "$GITHUB_ENV"
          sha256sum "$binary" > evidence/d4-p8-binary.sha256
          "$binary" -h > evidence/d4-p8-help.log
          grep -q 'actual-gmp-precision-bits 128' evidence/d4-p8-help.log
      - name: Same binary exact P7 native raw residual identities and complete original WMC gate
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/qoo157_d4_preproc_only_science.py \
            --binary "$QOO157_P8_BINARY" \
            --cnf "$QOO157_P8_CNF" \
            --source evidence/original/matched-science-report.json \
            --p7 evidence/p7/d4-residual-identity.json \
            --out "$QOO157_P8_SCIENCE" \
            --dumps evidence/p8-native-residual-dumps
      - name: Official CodSpeed v5 — three QAOA7 option arms, preproc-only vs full
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/test_codspeed_d4_bipe_stage.py -q --codspeed --codspeed-max-rounds=5 --codspeed-max-time=12
      - name: Scientific evidence / run identity
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/research-head.txt
          echo 'Full and preproc-only share pinned 38d binary, identical source CNF and native residual bytes. Only official CodSpeed measures time; hosted observations not fixed Macro Runner.' > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-d4-bipe-stage-${{ github.sha }}
          path: |
            evidence/d4-p8-native-science.json
            evidence/d4-p8-codspeed-walltime.json
            evidence/d4-p8-scratch.patch
            evidence/d4-p8-preproc-only-source.json
            evidence/d4-p8-build.log
            evidence/d4-p8-binary.sha256
            evidence/d4-p8-help.log
            evidence/p8-native-residual-dumps/
            evidence/research-head.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
