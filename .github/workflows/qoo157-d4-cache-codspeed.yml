name: QOO157 d4 cache on-off science-gated official CodSpeed pilot

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-d4-cache-codspeed.yml'
      - 'research/qoo157_d4/test_codspeed_d4_cache_p5.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  cache-onoff-codspeed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: research/qoo157_d4
      QOO157_D4_CACHE_CNF_DIR: evidence/original/cnfs
      QOO157_D4_CACHE_REPORT: evidence/d4-cache-bipe-current-science.json
      QUPRS_CODSPEED_EXPORT: evidence/d4-cache-onoff-codspeed-walltime.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source pin and official CodSpeed v5 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:GPMC)" = a1bda3489e959d3695b6798d327c5a1fc1bed305
          python -m py_compile research/qoo157_d4/d4_cache_bipe_science.py research/qoo157_d4/test_codspeed_d4_cache_p5.py
          python -m pip install 'pytest-codspeed==5.0.3' pytest
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Build actual native d4 original source with precision and output-only BiPe evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo157-d4-cache-p5-codspeed"
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$root"
          git -C "$root" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$root" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          mkdir -p evidence
          python research/qoo157_d4/matched_precision_variant.py --upstream "$root" --evidence evidence --digits 38
          python research/qoo157_d4/d4_bipe_instrument.py --source "$root" --evidence evidence
          git -C "$root" diff --check
          git -C "$root" diff -- c++/counter/src/Main.cpp c++/counter/src/Counter.cpp > evidence/d4-scratch.patch
          (cd "$root/c++/counter" && ./build.sh -j) > evidence/d4-build.log 2>&1
          bin="$root/c++/counter/build/counter"
          test -x "$bin"
          echo "QOO157_D4_CACHE_BINARY=$bin" >> "$GITHUB_ENV"
          sha256sum "$bin" > evidence/d4-current-binary.sha256
          "$bin" -h > evidence/d4-current-help.log
          grep -q 'isActivated' evidence/d4-current-help.log
          grep -q 'actual-gmp-precision-bits 128' evidence/d4-current-help.log
      - name: Fresh 8-case original weighted WMC and cache work requalification on THIS binary
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/d4_cache_bipe_science.py \
            --binary "$QOO157_D4_CACHE_BINARY" \
            --cnfs evidence/original/cnfs \
            --archive evidence/original/matched-science-report.json \
            --out "$QOO157_D4_CACHE_REPORT"
      - name: Official CodSpeed v5 six science-admitted d4 cache arms only
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/test_codspeed_d4_cache_p5.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=100
      - name: Evidence and interpretation scope
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/experiment-head.txt
          uname -a > evidence/runner-kernel.txt
          echo 'Official CodSpeed v5 WallTime; hosted runner observation only, no Macro Runner ABBA; within d4 same BiPe, 38-digit, source CNF and native solver only' > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-d4-cache-codspeed-${{ github.sha }}
          path: |
            evidence/d4-cache-bipe-current-science.json
            evidence/d4-cache-onoff-codspeed-walltime.json
            evidence/d4-scratch.patch
            evidence/d4-build.log
            evidence/d4-current-binary.sha256
            evidence/d4-current-help.log
            evidence/experiment-head.txt
            evidence/runner-kernel.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
