name: QOO157 d4 BiPe canonical residual identity audit no CodSpeed

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-d4-canonical-residual.yml'
      - 'research/qoo157_d4/d4_residual_dump_patch.py'
      - 'research/qoo157_d4/qoo157_d4_residual_identity.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  residual-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QOO157_CNF_DIR: evidence/original/cnfs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard science-only source and fixed solver dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/qoo157_d4/d4_residual_dump_patch.py research/qoo157_d4/qoo157_d4_residual_identity.py
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Pinned source scratch-only d4 with environment-gated residual export
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo157-d4-residual"
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$root"
          git -C "$root" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$root" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          mkdir -p evidence
          python research/qoo157_d4/matched_precision_variant.py --upstream "$root" --evidence evidence --digits 38
          python research/qoo157_d4/d4_bipe_instrument.py --source "$root" --evidence evidence
          python research/qoo157_d4/d4_residual_dump_patch.py --source "$root" --evidence evidence
          git -C "$root" diff --check
          git -C "$root" diff -- c++/counter/src/Main.cpp c++/counter/src/Counter.cpp > evidence/d4-residual-scratch.patch
          (cd "$root/c++/counter" && ./build.sh -j) > evidence/d4-residual-build.log 2>&1
          binary="$root/c++/counter/build/counter"
          test -x "$binary"
          echo "QOO157_D4_RESIDUAL_BINARY=$binary" >> "$GITHUB_ENV"
          sha256sum "$binary" > evidence/d4-residual-binary.sha256
          "$binary" -h > evidence/d4-residual-help.log
          grep -q 'actual-gmp-precision-bits 128' evidence/d4-residual-help.log
      - name: Original source SHA, full-weighted WMC and clause/projection/protected fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/qoo157_d4_residual_identity.py \
            --binary "$QOO157_D4_RESIDUAL_BINARY" \
            --cnf-dir "$QOO157_CNF_DIR" \
            --science-report evidence/original/matched-science-report.json \
            --dumps evidence/native-residual-dumps \
            --out evidence/d4-residual-identity.json
      - name: Provenance and explicit no-performance status
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/runner-head.txt
          echo 'No CodSpeed, no performance inference. Native residual clause multisets, weights, and projection provenance only' > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-d4-residual-identity-${{ github.sha }}
          path: |
            evidence/d4-residual-identity.json
            evidence/native-residual-dumps/
            evidence/d4-residual-scratch.patch
            evidence/d4-residual-dump-source.json
            evidence/d4-residual-binary.sha256
            evidence/d4-residual-build.log
            evidence/runner-head.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
