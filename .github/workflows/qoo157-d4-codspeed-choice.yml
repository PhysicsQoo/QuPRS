name: QOO-157 isolated d4 versus GPMC CodSpeed choice pilot

on:
  push:
    branches: [experiment/qoo157-d4-codspeed-choice-pilot]
    paths:
      - 'rust/pathsum/examples/qoo157_export_paper_cnf.rs'
      - 'research/qoo157_d4/codspeed_choice_preflight.py'
      - 'research/qoo157_d4/test_codspeed_solver_choice.py'
      - '.github/workflows/qoo157-d4-codspeed-choice.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qoo157-choice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver-walltime-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QOO157_PREFLIGHT: ${{ github.workspace }}/evidence/qoo157-choice-science.json
      QOO157_CNF_DIR: ${{ github.workspace }}/evidence/cnfs
      QOO157_D4_BINARY: ${{ runner.temp }}/qoo157-d4/c++/counter/build/counter
      QOO157_D4_PROVENANCE: ${{ github.workspace }}/evidence/d4-provenance.json
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/evidence/qoo157-codspeed-walltime.json
      PYTHONPATH: research/qoo157_d4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo157-d4-choice-v1
      - name: Prepare installed QuPRS and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cnfs
          git rev-parse HEAD > evidence/head.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git rev-parse HEAD:GPMC > evidence/gpmc-submodule.txt
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2' pytest-codspeed==5.0.3
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Compile native QuPRS WMC-only QASM-to-CNF exporter
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path rust/Cargo.toml --locked --release -p pathsum \
            --example qoo157_export_paper_cnf 2>&1 | tee evidence/exporter-build.log
      - name: Source-pinned paper-family WMC-only candidate CNFs
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r case filename pair; do
            if test -z "$case"; then continue; fi
            timeout --signal=TERM --kill-after=5s 90s \
              rust/target/release/examples/qoo157_export_paper_cnf \
              "$case" "benchmarks/MQTBench/$filename" \
              "benchmarks/MQTBench/$pair/$filename" evidence/cnfs \
              > "evidence/$case-export.log" 2>&1 || {
                echo "QOO157_GENERATION_CENSORED=$case" | tee -a evidence/censored.log
              }
          done <<'CASES'
          grover4_eq|grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm|h,ry,rz,cx
          qaoa7_neq|qaoa_nativegates_ibm_qiskit_opt0_7.qasm|qiskit-2.6.1-opt0/Random_Rotation
          qpeexact8_eq|qpeexact_nativegates_ibm_qiskit_opt0_8.qasm|h,ry,rz,cx
          qft16_eq|qft_nativegates_ibm_qiskit_opt0_16.qasm|h,ry,rz,cx
          CASES
          sha256sum evidence/cnfs/*.cnf > evidence/cnf-sha256.txt || true
      - name: Compile pinned external d4 with experimental 426-bit preparse precision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$RUNNER_TEMP/qoo157-d4"
          git -C "$RUNNER_TEMP/qoo157-d4" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$RUNNER_TEMP/qoo157-d4" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          python research/qoo157_d4/precision_variant.py \
            --upstream "$RUNNER_TEMP/qoo157-d4" --evidence evidence
          git -C "$RUNNER_TEMP/qoo157-d4" diff --check
          git -C "$RUNNER_TEMP/qoo157-d4" diff -- c++/counter/src/Main.cpp > evidence/d4-source.patch
          (cd "$RUNNER_TEMP/qoo157-d4/c++/counter" && ./build.sh -j) \
            2>&1 | tee evidence/d4-build.log
          test -x "$QOO157_D4_BINARY"
          sha256sum "$QOO157_D4_BINARY" > evidence/d4-binary-sha256.txt
          python - <<'PY'
          import hashlib,json,os,pathlib
          binary=pathlib.Path(os.environ["QOO157_D4_BINARY"])
          pathlib.Path(os.environ["QOO157_D4_PROVENANCE"]).write_text(json.dumps({
            "binary_sha256":hashlib.sha256(binary.read_bytes()).hexdigest(),
            "d4_upstream_commit":"be15f91f3e9769e1f5cb175fa27e3eca3a1ea690",
            "gmp_preparse_bits":426,
            "source_patch_approved_for_research":True,
            "arithmetic_certified":False
          },indent=2)+"\n")
          PY
      - name: Untimed scientific preflight determines eligible paired cases
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/codspeed_choice_preflight.py \
            --cnf-dir "$QOO157_CNF_DIR" --binary "$QOO157_D4_BINARY" \
            --manifest "$QOO157_D4_PROVENANCE" --source-dir benchmarks/MQTBench \
            --out "$QOO157_PREFLIGHT" --timeout 15 \
            2>&1 | tee evidence/scientific-preflight.log
      - name: CodSpeed v5 official WallTime on qualified solver-inclusive CNFs
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/test_codspeed_solver_choice.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=5
      - name: Save exact provenance and first-party measurement
        if: always()
        shell: bash
        run: |
          printf 'head=%s\nrunner=%s\nos=%s\narch=%s\nimage=%s\n' \
            "$GITHUB_SHA" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageVersion" \
            > evidence/runner.txt
          test -f "$QUPRS_CODSPEED_EXPORT" || echo CODSPEED_EXPORT_NOT_VISIBLE > evidence/export-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-d4-choice-codspeed-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
