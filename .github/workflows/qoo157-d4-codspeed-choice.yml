name: QOO157 workflow permission and environment admission

on:
  push:
    branches:
      - experiment/qoo157-d4-codspeed-choice-pilot
    paths:
      - '.github/workflows/qoo157-d4-codspeed-choice.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check env and permissions
        run: echo QOO157_ENV_ADMISSION_PASS
