name: QOO-157 Same-CNF Python Rust d4 Parity and Boundary

on:
  push:
    branches: [experiment/qoo157-d4-parity-boundary-poc]
    paths:
      - 'rust/pathsum/src/wmc.rs'
      - 'rust/pathsum/examples/qoo157_d4_same_cnf.rs'
      - 'rust/pathsum/examples/qoo157_d4_native_probe.rs'
      - 'research/qoo157_d4/compare_rust_python_d4.py'
      - '.github/workflows/qoo157-d4-parity-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qoo157-same-cnf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo157-same-cnf-parity-v1
      - name: Install native dependencies and QuPRS Python package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/sha.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Pinned external 426-bit d4 C++ build (not bundled)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$RUNNER_TEMP/qoo157-d4"
          git -C "$RUNNER_TEMP/qoo157-d4" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$RUNNER_TEMP/qoo157-d4" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          python research/qoo157_d4/precision_variant.py --upstream "$RUNNER_TEMP/qoo157-d4" --evidence evidence
          git -C "$RUNNER_TEMP/qoo157-d4" diff --check
          git -C "$RUNNER_TEMP/qoo157-d4" diff -- c++/counter/src/Main.cpp > evidence/d4-research.patch
          (
            cd "$RUNNER_TEMP/qoo157-d4/c++/counter"
            ./build.sh -j
          ) 2>&1 | tee evidence/d4-build.log
          test -x "$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter"
          sha256sum "$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter" > evidence/d4-binary.sha256
      - name: Recover and SHA-check six fixed QuPRS f64 and MPFR256 CNFs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/frozen
          gh run download 41807195090 --repo PhysicsQoo/QuPRS \
            --name qoo157-d4-native-5b7b6027c90438a2c1b9cdbbfe35d4b80fafed95 \
            --dir evidence/frozen
          (
            cd evidence/frozen
            sha256sum -c "$GITHUB_WORKSPACE/research/qoo157_d4/source-cnf-manifest.sha256"
          )
      - name: Python Rust native d4 count of exactly same CNF bytes
        shell: bash
        env:
          PYTHONPATH: research/qoo157_d4
          QUPRS_D4_UPSTREAM_SHA: be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          QUPRS_D4_SOURCE_PATCH_ACK: '1'
          QUPRS_D4_PREPARSE_BITS: '426'
        run: |
          set -euo pipefail
          export QUPRS_D4_PATH="$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter"
          export QUPRS_D4_SHA256="$(sha256sum "$QUPRS_D4_PATH" | cut -d ' ' -f1)"
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["QUPRS_D4_PATH"])
          pathlib.Path("evidence/d4-manifest.json").write_text(json.dumps({
            "binary_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "d4_upstream_commit":"be15f91f3e9769e1f5cb175fa27e3eca3a1ea690",
            "gmp_preparse_bits":426,
            "source_patch_approved_for_research":True,
          })+"\n")
          PY
          pyargs=()
          rustargs=()
          for cnf in evidence/frozen/quprs-source-cnf/*.cnf; do
            pyargs+=(--cnf "$cnf")
            rustargs+=("$cnf")
          done
          python research/qoo157_d4/run_native_adapter_poc.py \
            --binary "$QUPRS_D4_PATH" --provenance evidence/d4-manifest.json \
            --out evidence/python-native.json "${pyargs[@]}" \
            2>&1 | tee evidence/python-native.log
          cargo run --manifest-path rust/Cargo.toml --locked --release -p pathsum \
            --features experimental-d4 --example qoo157_d4_same_cnf -- \
            "${rustargs[@]}" 2>&1 | tee evidence/rust-native.log
          python research/qoo157_d4/compare_rust_python_d4.py \
            --python-report evidence/python-native.json \
            --rust-log evidence/rust-native.log \
            --output evidence/parity.json 2>&1 | tee evidence/parity.log
      - name: Genuine WmcOnly near-distance EQ NEQ versus GPMC
        shell: bash
        env:
          QUPRS_D4_UPSTREAM_SHA: be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          QUPRS_D4_SOURCE_PATCH_ACK: '1'
          QUPRS_D4_PREPARSE_BITS: '426'
        run: |
          set -euo pipefail
          export QUPRS_D4_PATH="$RUNNER_TEMP/qoo157-d4/c++/counter/build/counter"
          export QUPRS_D4_SHA256="$(sha256sum "$QUPRS_D4_PATH" | cut -d ' ' -f1)"
          cargo run --manifest-path rust/Cargo.toml --locked --release -p pathsum \
            --features experimental-d4 --example qoo157_d4_native_probe \
            2>&1 | tee evidence/boundary-verdicts.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo157-d4-parity-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
