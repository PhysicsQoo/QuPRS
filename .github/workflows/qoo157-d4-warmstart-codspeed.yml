name: QOO157 P6 d4 warm-start science-gated official CodSpeed pilot

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-d4-warmstart-codspeed.yml'
      - 'research/qoo157_d4/test_codspeed_d4_warmstart_p6.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  d4-warmstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: research/qoo157_d4
      QOO157_P6_CNF_DIR: evidence/original/cnfs
      QOO157_P6_WARM_REPORT: evidence/d4-warmstart-native-science.json
      QUPRS_CODSPEED_EXPORT: evidence/d4-warmstart-codspeed-walltime.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin, syntax, dependencies (no perf)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:GPMC)" = a1bda3489e959d3695b6798d327c5a1fc1bed305
          python -m py_compile research/qoo157_d4/d4_warmstart_science.py research/qoo157_d4/test_codspeed_d4_warmstart_p6.py
          python -m pip install 'pytest-codspeed==5.0.3' pytest
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Pinned 38d d4 warm-on original source plus constant BiPe output diagnostics
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo157-d4-warm-p6"
          git clone --filter=blob:none https://github.com/jm62300/d4.git "$root"
          git -C "$root" checkout --detach be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          test "$(git -C "$root" rev-parse HEAD)" = be15f91f3e9769e1f5cb175fa27e3eca3a1ea690
          mkdir -p evidence
          python research/qoo157_d4/matched_precision_variant.py --upstream "$root" --evidence evidence --digits 38
          python research/qoo157_d4/d4_bipe_instrument.py --source "$root" --evidence evidence
          test -z "$(git -C "$root" diff -- src/methods/DpllStyleMethod.hpp)"
          git -C "$root" diff --check
          git -C "$root" diff -- c++/counter/src/Main.cpp c++/counter/src/Counter.cpp > evidence/d4-common-38d-bipe-scratch.patch
          (cd "$root/c++/counter" && ./build.sh -j) > evidence/d4-warm-on-build.log 2>&1
          test -x "$root/c++/counter/build/counter"
          cp "$root/c++/counter/build/counter" "$RUNNER_TEMP/qoo157-d4-warm-on"
          echo "QOO157_WARM_ON=$RUNNER_TEMP/qoo157-d4-warm-on" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/qoo157-d4-warm-on" > evidence/d4-warm-on.sha256
          "$RUNNER_TEMP/qoo157-d4-warm-on" -h > evidence/warm-on-native-help.log
          grep -q 'actual-gmp-precision-bits 128' evidence/warm-on-native-help.log
          echo "QOO157_D4_SCRATCH=$root" >> "$GITHUB_ENV"
      - name: Change ONLY original d4 run() warm-start argument, then incrementally rebuild
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/d4_warmstart_science.py \
            --patch-scratch "$QOO157_D4_SCRATCH" --evidence evidence
          git -C "$QOO157_D4_SCRATCH" diff --check
          git -C "$QOO157_D4_SCRATCH" diff -- src/methods/DpllStyleMethod.hpp > evidence/d4-warm-off-only-scratch.patch
          test "$(grep -c '^+    T result = compute(setOfVar, m_out, false);' evidence/d4-warm-off-only-scratch.patch)" = 1
          (cd "$QOO157_D4_SCRATCH/c++/counter" && ./build.sh -j) > evidence/d4-warm-off-build.log 2>&1
          test -x "$QOO157_D4_SCRATCH/c++/counter/build/counter"
          cp "$QOO157_D4_SCRATCH/c++/counter/build/counter" "$RUNNER_TEMP/qoo157-d4-warm-off"
          echo "QOO157_WARM_OFF=$RUNNER_TEMP/qoo157-d4-warm-off" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/qoo157-d4-warm-off" > evidence/d4-warm-off.sha256
          "$RUNNER_TEMP/qoo157-d4-warm-off" -h > evidence/warm-off-native-help.log
          grep -q 'actual-gmp-precision-bits 128' evidence/warm-off-native-help.log
      - name: 4 original CNF x BiPe auto/none x warm on/off — bounded native complex WMC science
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/d4_warmstart_science.py \
            --on "$QOO157_WARM_ON" --off "$QOO157_WARM_OFF" \
            --cnfs evidence/original/cnfs \
            --original evidence/original/matched-science-report.json \
            --patch evidence/warmstart-source-patch.json \
            --output evidence/d4-warmstart-native-science.json
      - name: Official CodSpeed v5 10 science-admitted warm-start variants only
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/test_codspeed_d4_warmstart_p6.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=30
      - name: Preserve exact provenance and official-time instrumentation
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/experiment-head.txt
          uname -a > evidence/kernel.txt
          echo "Official CodSpeed v5 within-d4 warmStart-only full native subprocess and parse, hosted WallTime is OBSERVATION_ONLY until same fixed Macro Runner ABBA/BAAB. Original CNF + 38d. No dev/main/default changes." > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-d4-warmstart-codspeed-${{ github.sha }}
          path: |
            evidence/d4-warmstart-native-science.json
            evidence/d4-warmstart-codspeed-walltime.json
            evidence/warmstart-source-patch.json
            evidence/d4-warm-on.sha256
            evidence/d4-warm-off.sha256
            evidence/d4-common-38d-bipe-scratch.patch
            evidence/d4-warm-off-only-scratch.patch
            evidence/d4-warm-on-build.log
            evidence/d4-warm-off-build.log
            evidence/warm-on-native-help.log
            evidence/warm-off-native-help.log
            evidence/experiment-head.txt
            evidence/kernel.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
