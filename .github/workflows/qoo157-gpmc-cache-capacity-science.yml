name: QOO157 P4 GPMC safe cache-capacity SCIENCE only

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-gpmc-cache-capacity-science.yml'
      - 'research/qoo157_d4/gpmc_cache_capacity_science.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gpmc-native-cap-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin and no-timing syntax guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:GPMC)" = a1bda3489e959d3695b6798d327c5a1fc1bed305
          test "$(git -C GPMC rev-parse HEAD)" = a1bda3489e959d3695b6798d327c5a1fc1bed305
          python -m py_compile research/qoo157_d4/gpmc_cache_capacity_science.py
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Compile pinned unmodified GPMC
        shell: bash
        run: |
          set -euo pipefail
          cmake -S GPMC -B "$RUNNER_TEMP/qoo157-cache-cap" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qoo157-cache-cap" --parallel 2
          mkdir -p evidence
          sha256sum "$RUNNER_TEMP/qoo157-cache-cap/gpmc" > evidence/solver-binary.sha256
      - name: Bounded cache 16 64 4000 MiB complex count and native counters; NO timed performance
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/gpmc_cache_capacity_science.py \
            --binary "$RUNNER_TEMP/qoo157-cache-cap/gpmc" \
            --cnfs evidence/original/cnfs \
            --archived evidence/original/matched-science-report.json \
            --out evidence/gpmc-safe-cache-capacity-science.json
      - name: Immutable provenance and explicit no-CodSpeed scope
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/experiment-head.txt
          echo 'Native source pinned cache capacity 16/64/4000 only; no runtime performance metric and no CodSpeed' > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-gpmc-safe-cache-capacity-${{ github.sha }}
          path: |
            evidence/gpmc-safe-cache-capacity-science.json
            evidence/solver-binary.sha256
            evidence/experiment-head.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
