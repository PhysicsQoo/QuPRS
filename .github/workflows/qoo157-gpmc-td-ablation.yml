name: QOO157 GPMC TD effect scoped CodSpeed pilot

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-gpmc-td-ablation.yml'
      - 'research/qoo157_d4/gpmc_td_ablation.py'
      - 'research/qoo157_d4/test_codspeed_gpmc_td_ablation.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  td-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QOO157_TD_CNF_DIR: evidence/original/cnfs
      QOO157_TD_PREFLIGHT: evidence/gpmc-td-preflight.json
      QUPRS_CODSPEED_EXPORT: evidence/gpmc-td-codspeed-walltime.json
      PYTHONPATH: research/qoo157_d4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CodSpeed pytest integration
        shell: bash
        run: python -m pip install 'pytest-codspeed==5.0.3' 'pytest'
      - name: Verify pinned GPMC and bounded experiment source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence-head.txt
          test "$(git rev-parse HEAD:GPMC)" = 'a1bda3489e959d3695b6798d327c5a1fc1bed305'
          python -m py_compile research/qoo157_d4/gpmc_td_ablation.py research/qoo157_d4/test_codspeed_gpmc_td_ablation.py
      - name: Reuse original exact-SHA weighted CNFs (no QASM or solver regeneration)
        uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Build only pinned GPMC native executable
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          cmake -S GPMC -B "$RUNNER_TEMP/gpmc-qoo157-td" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/gpmc-qoo157-td" --parallel 2
          echo "QOO157_GPMC_BINARY=$RUNNER_TEMP/gpmc-qoo157-td/gpmc" >> "$GITHUB_ENV"
          mkdir -p evidence
          sha256sum "$RUNNER_TEMP/gpmc-qoo157-td/gpmc" > evidence/gpmc-ablation-binary.sha256
          git rev-parse HEAD:GPMC > evidence/gpmc-submodule.txt
      - name: Scientific preflight — same CNF, same 38-digit MPFR, WMC count agreement
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/gpmc_td_ablation.py \
            --binary "$QOO157_GPMC_BINARY" \
            --cnf-dir "$QOO157_TD_CNF_DIR" \
            --science-report evidence/original/matched-science-report.json \
            --out "$QOO157_TD_PREFLIGHT"
          test "$(python -c 'import json;print(json.load(open("evidence/gpmc-td-preflight.json"))["status"])')" = 'COMPLETED_COUNT_CONCORDANCE_UNCERTIFIED'
      - name: Official CodSpeed v5, prepared-CNF solver-inclusive, TD on/off
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/test_codspeed_gpmc_td_ablation.py -q --codspeed --codspeed-max-rounds=3 --codspeed-max-time=5
      - name: Record scope of evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/auditor-head.txt
          uname -a > evidence/runner-kernel.txt
          echo '2 cases x 2 GPMC 38-digit TD variants; single source-CNF, unmodified pinned solver' > evidence/scope.txt
          echo 'Hosted CodSpeed WallTime OBSERVATION ONLY; not a qualified Macro Runner / ABBA significance test' >> evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-gpmc-td-${{ github.sha }}
          path: |
            evidence/gpmc-td-preflight.json
            evidence/gpmc-ablation-binary.sha256
            evidence/gpmc-submodule.txt
            evidence/gpmc-td-codspeed-walltime.json
            evidence/auditor-head.txt
            evidence/runner-kernel.txt
            evidence/scope.txt
          retention-days: 30
          if-no-files-found: warn
