name: QOO157 P9 source-only structural feature science

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-p9-source-feature.yml'
      - 'research/qoo157_d4/p9_source_structural_features.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  feature-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard script syntax
        run: python -m py_compile research/qoo157_d4/p9_source_structural_features.py
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - name: Extract original SHA-pinned pre-BiPe structure; no solver or timings
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/p9_source_structural_features.py \
            --cnfs evidence/original/cnfs \
            --output evidence/p9-source-structural-features.json
      - name: Evidence provenance
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/p9-head.txt
          echo 'Source-only science; source SHA pinned; no timing or shipping auto-policy; QAOA/QFT holdouts required' > evidence/p9-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo157-p9-source-structure-${{ github.sha }}
          path: |
            evidence/p9-source-structural-features.json
            evidence/p9-head.txt
            evidence/p9-scope.txt
          retention-days: 30
          if-no-files-found: warn
