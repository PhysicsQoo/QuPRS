name: QOO173 RaWMoCS A0 exact-count science (research-only)

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo157-rawmocs-a0-reference.yml'
      - 'research/qoo157_d4/rawmocs_a0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-count-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax (stdlib only, no solver)
        run: python -m py_compile research/qoo157_d4/rawmocs_a0/exact_complex_oracle.py
      - name: Exact rational complex enumeration and metamorphic tests
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/rawmocs_a0/exact_complex_oracle.py \
            --report evidence/rawmocs-a0-exact-count-results.json
      - name: Pin evidence provenance
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/rawmocs-a0-head.txt
          echo 'A0 science only; no Rust counter, no numerical solver, no performance timings; QuPRS main/dev unchanged.' > evidence/rawmocs-a0-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-a0-${{ github.sha }}
          path: |
            evidence/rawmocs-a0-exact-count-results.json
            evidence/rawmocs-a0-head.txt
            evidence/rawmocs-a0-scope.txt
          retention-days: 30
          if-no-files-found: warn
