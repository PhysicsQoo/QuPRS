name: QOO160 Qiskit261 additive 56 Simulation (experiment only)

# Historical 32+24 experiment preserved for provenance. Do not auto-run five expensive
# shards on every research code edit after the 12-ID consolidation.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qoo160-additive-56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Additive 32+24 Simulation shard ${{ matrix.shard_id }} / 5
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0, 1, 2, 3, 4]
        num_shards: [5]
    env:
      HEAD_SHA: ${{ github.sha }}
      BINARY_DIR: src/QuPRS/utils
      QUPRS_CODSPEED_EXPORT: ${{ github.workspace }}/simulation-${{ matrix.shard_id }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ env.BINARY_DIR }}/wmc_tools
          key: ${{ runner.os }}-${{ runner.arch }}-wmc-tools-v0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build identical source and solver preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install --disable-pip-version-check maturin pytest-shard pytest-codspeed==5.0.4
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Verify legacy identity, additive fixture hashes and shard coverage
        if: matrix.shard_id == 0
        run: |
          python -m pytest test/test_codspeed_qasm261_simulation_additive.py test/test_codspeed_cross_instrument.py -q
          python scripts/check_codspeed_shards.py
      - name: CodSpeed five-shard Simulation with versioned QASM input
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'false'
          run: python -m pytest test/test_Feynman.py test/test_MQT.py benchmarks/codspeed/test_mqt_qasm261_simulation.py --codspeed --shard-id ${{ matrix.shard_id }} --num-shards ${{ matrix.num_shards }}
      - name: Persist SHA and both legacy/addon identities
        run: |
          python scripts/write_codspeed_sha_manifest.py --sha "$HEAD_SHA" --family simulation-shard --instrument simulation --shard ${{ matrix.shard_id }} --measurement "$QUPRS_CODSPEED_EXPORT" --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qasm261-simulation-shard-${{ matrix.shard_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.QUPRS_CODSPEED_EXPORT }}
            ${{ runner.temp }}/manifest.json

  verify-simulation:
    name: Verify complete 56 unique CodSpeed identities across five shards
    runs-on: ubuntu-24.04
    needs: [simulation]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ needs.simulation.result == 'success' }}
        with:
          pattern: qasm261-simulation-shard-*
          path: qasm261-measured
          merge-multiple: false
      - name: Validate successful shards and their distinct legacy/addon URIs
        env:
          SIM_RESULT: ${{ needs.simulation.result }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          test "$SIM_RESULT" = "success" || { echo "Simulation shard failure" >&2; exit 1; }
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.report_codspeed_cross_instrument import validate_simulation
          results = validate_simulation(Path("qasm261-measured"), os.environ["HEAD_SHA"])
          assert len(results) == 56
          print("QASM261_32_PLUS_24_SIMULATION_PASS",
                {"legacy": 32, "qasm261": 24, "total": len(results)})
          PY
