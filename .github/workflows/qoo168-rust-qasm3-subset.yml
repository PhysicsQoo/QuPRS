name: Research / Native OpenQASM3 bounded subset
on:
  push:
    branches: [research/qoo168-native-qasm3-subset-20261103]
    paths:
      - 'rust/pathsum/src/qasm.rs'
      - 'test/test_rust_qasm3_subset.py'
      - 'test/test_rust_qasm_fail_closed.py'
      - 'docs/development/rust-qasm3-supported-subset.md'
      - '.github/workflows/qoo168-rust-qasm3-subset.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-qasm3:
    name: Rust QASM3 / Qiskit ${{ matrix.qiskit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        qiskit: ['1.4.6', '2.6.1']
    env:
      QISKIT_VERSION: ${{ matrix.qiskit }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo168-native-qasm3
      - name: Install only needed native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgmp-dev libmpfr-dev libatomic1 zlib1g-dev
          python -m pip install --upgrade pip 'maturin>=1.5,<2'
      - name: Rust QASM parser unit contract (real source)
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo test --manifest-path rust/Cargo.toml -p pathsum qasm::tests --lib --release -- --nocapture 2>&1 | tee evidence/rust-qasm3.log
      - name: Build public Rust/Python API and pin Qiskit source for this research only
        run: |
          set -euo pipefail
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m pip install --no-deps "qiskit==$QISKIT_VERSION"
          python -m pip install 'qiskit-qasm3-import==0.6.0'
          python - <<'PY'
          import importlib.metadata as md
          import os
          assert md.version('qiskit') == os.environ['QISKIT_VERSION']
          PY
      - name: Bounded real FFI and legacy fail-closed controls
        run: |
          set -euo pipefail
          python -m pytest -q -ra test/test_rust_qasm3_subset.py \
            test/test_rust_qasm_fail_closed.py::test_direct_unsupported_qasm_rejected_before_solver \
            --junitxml=evidence/qasm3-source-junit.xml \
            2>&1 | tee evidence/qasm3-public-ffi.log
      - name: Record environment, hash, and the packaging distinction
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/head-sha.txt
          python -m pip freeze > evidence/pip-freeze.txt
          python -m pip check > evidence/pip-check-observation.txt 2>&1 || true
          sha256sum rust/pathsum/src/qasm.rs test/test_rust_qasm3_subset.py \
            test/test_rust_qasm_fail_closed.py > evidence/source-sha256.txt
          printf '%s\n' 'Qiskit 2.x is an isolated --no-deps scientific probe, not a QOO-169 installer gate.' \
            > evidence/metadata-scope.txt
      - name: Preserve exact-SHA source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo168-rust-qasm3-${{ matrix.qiskit }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
