name: Research / manylinux ARM MPFR pkg-config preflight
on:
  push:
    branches: [research/qoo169-qiskit-dual-major-installer-20261103]
    paths: ['.github/workflows/qoo169-manylinux-arm-pc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce installed header versus missing pkg-config metadata
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$PWD:/project:ro" -w /project \
            quay.io/pypa/manylinux_2_28_aarch64:2026.01.04-1 /bin/bash -s <<'CONTAINER'
          set -euo pipefail
          sh scripts/install_linux_deps.sh
          for dep in gmp mpfr; do
            echo "========== $dep / RPM FILES =========="
            rpm -ql "${dep}-devel" | grep -E '(^/usr/include/|\.so$|\.pc$)' || true
            if pkg-config --exists "$dep"; then
              echo "PKGCONFIG_INITIAL_SUCCESS:$dep"
            else
              echo "PKGCONFIG_INITIAL_MISSING:$dep"
            fi
          done
          echo "========== SOURCE HEADER / SHARED LINK FILES =========="
          test -f /usr/include/gmp.h
          test -f /usr/include/mpfr.h
          test -f /usr/lib64/libgmp.so
          test -f /usr/lib64/libmpfr.so
          echo "HEADERS_AND_LINK_LIBS_PRESENT"
          echo "========== ASSERT ACTUAL INSTALLER CONTRACT =========="
          pkg-config --exists gmp mpfr
          echo "PKGCONFIG_BOTH_AVAILABLE_AFTER_SCRIPT"
          cat >/tmp/quprs-mpfr-probe.c <<'EOF'
          #include <gmp.h>
          #include <mpfr.h>
          void quprs_mpfr_compile_probe(void) { mpfr_t x; mpfr_init2(x, 128); mpfr_clear(x); }
          EOF
          cc -c /tmp/quprs-mpfr-probe.c $(pkg-config --cflags mpfr gmp) -o /tmp/quprs-mpfr-probe.o
          echo "MPFR_COMPILE_PROBE_PASS"
          CONTAINER
