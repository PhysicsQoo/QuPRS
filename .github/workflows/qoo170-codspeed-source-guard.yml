name: QOO170 source-pinned CPU suite selection guard (research only)

on:
  push:
    branches:
      - experiment/qoo160-qasm261-codspeed-selection
    paths:
      - .github/workflows/qoo170-codspeed-source-guard.yml
      - benchmarks/codspeed/simulation_addon.py
      - test/test_codspeed_qasm261_simulation_additive.py
      - scripts/report_codspeed_cross_instrument.py
      - test/test_codspeed_cross_instrument.py
      - scripts/check_codspeed_shards.py
      - scripts/write_codspeed_sha_manifest.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo170-focused-12cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only:
    name: 32 canonical and 12 additive URI/source identities, no Solver
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install just pytest for deterministic metadata checks
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify registry, SHA manifest and cross-instrument aggregation
        run: |
          python -m pytest -q test/test_codspeed_qasm261_simulation_additive.py test/test_codspeed_cross_instrument.py
          python - <<'PY'
          import hashlib
          from benchmarks.codspeed.simulation_addon import QASM261_URIS, QASM261_SHA256, SOLVERS, BACKENDS, QASM261_COUNT
          assert QASM261_COUNT == 12
          assert len(BACKENDS) == 2 and SOLVERS == ("gpmc",)
          assert hashlib.sha256("\n".join(sorted(QASM261_URIS)).encode()).hexdigest() == QASM261_SHA256
          assert all("_ganak_" not in x for x in QASM261_URIS)
          print("QOO170_SOURCE_ONLY_32_PLUS_12_PASS")
          PY
