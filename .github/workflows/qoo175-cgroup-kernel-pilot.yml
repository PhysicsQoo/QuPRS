name: QOO-175 delegated cgroup v2 kernel pilot

# Research-only proof on a disposable Ubuntu VM; no Rust build or CodSpeed.
on:
  push:
    branches:
      - experiment/qoo175-cgroup-preexec-p3
    paths:
      - 'scripts/qoo175_cgroup_kernel_pilot.py'
      - 'scripts/qoo175_cgroup_service.sh'
      - 'src/QuPRS/interface/rust_resources.py'
      - '.github/workflows/qoo175-cgroup-kernel-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoo175-delegation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-admission-and-oom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect disposable VM admission prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -f -c %T /sys/fs/cgroup)" = cgroup2fs
          test -e /run/systemd/system
          systemd-run --version | head -1
          cat /proc/self/cgroup
          findmnt -no OPTIONS /sys/fs/cgroup
      - name: Run isolated systemd-delegated service kernel proof
        shell: bash
        run: |
          set -euo pipefail
          UNIT="qoo175-cgroup-${GITHUB_RUN_ID}"
          echo "QOO175_UNIT=$UNIT" >> "$GITHUB_ENV"
          # Only a newly allocated, transient service subtree is modified.
          sudo systemd-run --wait --collect --pipe \
            --unit="$UNIT" \
            --property="Type=exec" \
            --property="User=$(id -un)" \
            --property="Delegate=memory" \
            --property="DelegateSubgroup=quprs-pilot" \
            --property="WorkingDirectory=${GITHUB_WORKSPACE}" \
            /usr/bin/bash scripts/qoo175_cgroup_service.sh
      - name: Diagnose failed transient service, without modifying host cgroups
        if: failure()
        shell: bash
        run: |
          set +e
          echo "QOO175_SERVICE_DIAGNOSTIC_START"
          sudo journalctl --no-pager -o short-iso -u "$QOO175_UNIT" -n 120
          sudo systemctl show "$QOO175_UNIT" \
            -p Result -p ExecMainStatus -p ControlGroup -p Delegate \
            -p DelegateControllers -p DelegateSubgroup
          cat /proc/self/cgroup
          echo "QOO175_SERVICE_DIAGNOSTIC_END"
      - name: Preserve standalone kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoo175-delegated-cgroup-kernel
          path: qoo175-kernel-*.json
          if-no-files-found: warn
          retention-days: 14
