name: QOO175 Darwin native safety pilot

on:
  push:
    branches: [experiment/qoo175-darwin-safety-p0]
    paths:
      - 'src/QuPRS/interface/rust_macos_process.py'
      - 'src/QuPRS/interface/rust_isolation.py'
      - 'docs/python_rust_isolation.md'
      - 'src/QuPRS/interface/rust_supervisor.py'
      - 'test/test_rust_macos_process.py'
      - 'test/test_rust_macos_supervisor_faults.py'
      - '.github/workflows/qoo175-darwin-safety-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: qoo175-darwin-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo175-darwin-p0
      - name: Native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gmp mpfr zlib
          GMP="$(brew --prefix gmp)"
          MPFR="$(brew --prefix mpfr)"
          ZLIB="$(brew --prefix zlib)"
          echo "CFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib -L$ZLIB/lib -Wl,-rpath,$ZLIB/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$GMP/lib:$MPFR/lib:$ZLIB/lib" >> "$GITHUB_ENV"
      - name: Build distributable QuPRS wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin
          maturin build --locked --release --interpreter python --out dist
      - name: Install only built wheel and test macOS contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/qoo175-wheel-venv
          source /tmp/qoo175-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl | head -n 1)"
          pip install "${WHEEL}[dev]"
          python -c 'import QuPRS, importlib.util; assert importlib.util.find_spec("QuPRS.interface.rust_macos_process")'
          python -m pytest -q -ra test/test_rust_macos_process.py test/test_rust_macos_supervisor_faults.py test/test_rust_isolated_worker.py test/test_verifier_api_defaults.py
          cargo test --locked --manifest-path rust/Cargo.toml -p QuPRS_cli --test supervisor
