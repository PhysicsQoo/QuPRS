name: macOS Rust isolation CodSpeed pilot

on:
  push:
    branches: [experiment/qoo175-macos-postaudit-p2]
    paths:
      - 'benchmarks/codspeed/test_qoo175_macos_isolation_pilot.py'
      - '.github/workflows/qoo175-macos-codspeed-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qoo175-macos-codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-codspeed-paired:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qoo175-macos-codspeed
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gmp mpfr zlib
          GMP="$(brew --prefix gmp)"
          MPFR="$(brew --prefix mpfr)"
          ZLIB="$(brew --prefix zlib)"
          echo "CFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I$GMP/include -I$MPFR/include -I$ZLIB/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$GMP/lib -Wl,-rpath,$GMP/lib -L$MPFR/lib -Wl,-rpath,$MPFR/lib -L$ZLIB/lib -Wl,-rpath,$ZLIB/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$GMP/lib:$MPFR/lib:$ZLIB/lib" >> "$GITHUB_ENV"
      - name: Build Python/Rust extension once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install maturin pytest-codspeed 'pytest>=8,<9'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: One-shot same-Mac CodSpeed ABBA
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: >-
            python -m pytest -q
            benchmarks/codspeed/test_qoo175_macos_isolation_pilot.py
            --codspeed --codspeed-max-rounds=5
            --codspeed-warmup-time=0 --codspeed-max-time=3
