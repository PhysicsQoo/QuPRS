name: QOO98 Ganak Arjun Puura intermediate CNF structure science

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo98-ganak-arjun-intermediate-science.yml'
      - 'research/qoo157_d4/qoo98_ganak_intermediate_science.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-intermediate-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: research/qoo157_d4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source syntax and pinned manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/qoo157_d4/qoo98_ganak_intermediate_science.py research/qoo157_d4/qoo98_ganak_native_mode6_admission.py
          mkdir -p evidence
          grep -q 'release/v2.8.0' src/QuPRS/utils/ganak-release.txt
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - uses: actions/download-artifact@v4
        with:
          name: qoo98-ganak-mode6-native-a144555269a03ed5333350faf236256d7f97dc09
          run-id: 41854306330
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/native
      - name: Pinned official Ganak executable and source-version guards
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo98-native-intermediate"
          mkdir -p "$root/expanded"
          archive="$root/ganak-v2.8.0-linux-amd64.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            'https://github.com/meelgroup/ganak/releases/download/release/v2.8.0/ganak-v2.8.0-linux-amd64.tar.gz'
          archive_sha=$(awk '$1=="linux" && $2=="x86_64" {print $4}' src/QuPRS/utils/ganak-release.txt)
          executable_sha=$(awk '$1=="linux" && $2=="x86_64" {print $5}' src/QuPRS/utils/ganak-release.txt)
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$archive_sha"
          tar -xzf "$archive" -C "$root/expanded"
          executable=$(find "$root/expanded" -type f -name ganak -print -quit)
          test -n "$executable" && test -f "$executable"
          chmod +x "$executable"
          test "$(sha256sum "$executable" | cut -d' ' -f1)" = "$executable_sha"
          "$executable" --version > evidence/ganak-intermediate-version.txt
          grep -q 'Ganak SHA1: b4ca02f78301aadeb7fa9acb5ed1524dc3fa0281' evidence/ganak-intermediate-version.txt
          sha256sum "$executable" > evidence/ganak-intermediate-binary.sha256
          echo "QOO98_GANAK_BIN=$executable" >> "$GITHUB_ENV"
      - name: QAOA7 and QFT16 pinned untimed structural debug audit with WMC printed-count guard
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/qoo98_ganak_intermediate_science.py \
            --binary "$QOO98_GANAK_BIN" \
            --source-science evidence/original/matched-science-report.json \
            --native-report evidence/native/ganak-native-mode6-report.json \
            --source-dir evidence/original/cnfs \
            --native-dir evidence/native/small-exact-fixtures \
            --out evidence/ganak-intermediate
      - name: Report scientific-only limits
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/ganak-intermediate-head.txt
          echo 'SOURCE-PINNED NATIVE ARJUN DEBUG STRUCTURE ONLY; NOT a complex-WMC-equivalent residual. Native stage timers invalid for performance. No CodSpeed, no solver modification.' > evidence/ganak-intermediate-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo98-ganak-native-intermediate-${{ github.sha }}
          path: |
            evidence/ganak-intermediate/
            evidence/ganak-intermediate-version.txt
            evidence/ganak-intermediate-binary.sha256
            evidence/ganak-intermediate-head.txt
            evidence/ganak-intermediate-scope.txt
          retention-days: 30
          if-no-files-found: warn
