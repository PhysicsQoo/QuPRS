name: QOO98 Ganak debug CNF native factor replay science

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - 'research/qoo157_d4/qoo98_ganak_debug_replay.py'
      - '.github/workflows/qoo98-ganak-native-debug-replay-science.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pinned-native-debug-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      PYTHONPATH: research/qoo157_d4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent scientific checker
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/qoo157_d4/qoo98_ganak_debug_replay.py
          python -m py_compile research/qoo157_d4/qoo98_ganak_native_mode6_admission.py
          mkdir -p evidence
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - uses: actions/download-artifact@v4
        with:
          name: qoo98-ganak-mode6-native-a144555269a03ed5333350faf236256d7f97dc09
          run-id: 41854306330
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/native
      - uses: actions/download-artifact@v4
        with:
          name: qoo98-ganak-native-intermediate-6cba8679a461f1d32495461b4fea9d1666949ede
          run-id: 41861376500
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/source-debug
      - name: Fetch only unmodified official Ganak binary and pin transitive identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo98-debug-replay"
          mkdir -p "$root/expanded"
          archive="$root/ganak-v2.8.0-linux-amd64.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            'https://github.com/meelgroup/ganak/releases/download/release/v2.8.0/ganak-v2.8.0-linux-amd64.tar.gz'
          archive_sha=$(awk '$1=="linux" && $2=="x86_64" {print $4}' src/QuPRS/utils/ganak-release.txt)
          binary_sha=$(awk '$1=="linux" && $2=="x86_64" {print $5}' src/QuPRS/utils/ganak-release.txt)
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$archive_sha"
          tar -xzf "$archive" -C "$root/expanded"
          binary=$(find "$root/expanded" -type f -name ganak -print -quit)
          test -f "$binary"
          chmod +x "$binary"
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$binary_sha"
          "$binary" --version > evidence/ganak-replay-version.txt
          grep -q 'Ganak SHA1: b4ca02f78301aadeb7fa9acb5ed1524dc3fa0281' evidence/ganak-replay-version.txt
          sha256sum "$binary" > evidence/ganak-replay-binary.sha256
          echo "QOO98_GANAK_BIN=$binary" >> "$GITHUB_ENV"
      - name: Five-arm debug CNF native reread and printed multiplier interval screen only
        shell: bash
        run: |
          set -euo pipefail
          python research/qoo157_d4/qoo98_ganak_debug_replay.py \
            --binary "$QOO98_GANAK_BIN" \
            --source-science evidence/original/matched-science-report.json \
            --native-report evidence/native/ganak-native-mode6-report.json \
            --intermediate-report evidence/source-debug/ganak-intermediate/native-intermediate-audit.json \
            --debug-dir evidence/source-debug/ganak-intermediate \
            --out evidence/qoo98-debug-replay-science.json
          python -m json.tool evidence/qoo98-debug-replay-science.json > /dev/null
      - name: Scope and source identity
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/qoo98-debug-replay-head.txt
          echo 'Read-only native Ganak2.8 debug CNF printed complex count x printed complex multiplier. Never CodSpeed; no claim of weight or projection WMC equivalence. 9 digit printing. No upstream patch.' > evidence/qoo98-debug-replay-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo98-ganak-debug-replay-science-${{ github.sha }}
          path: |
            evidence/qoo98-debug-replay-science.json
            evidence/qoo98-debug-replay-head.txt
            evidence/qoo98-debug-replay-scope.txt
            evidence/ganak-replay-version.txt
            evidence/ganak-replay-binary.sha256
          retention-days: 30
          if-no-files-found: warn
