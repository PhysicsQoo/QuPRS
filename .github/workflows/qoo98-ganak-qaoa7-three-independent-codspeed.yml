name: QOO98 Ganak QAOA7 Arjun-only three independent CodSpeed rounds

on:
  push:
    branches:
      - experiment/qoo157-d4-effective-digit-parity
    paths:
      - '.github/workflows/qoo98-ganak-qaoa7-three-independent-codspeed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  qaoa7-three-actual-rounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: research/qoo157_d4
      QOO98_SOURCE_SCIENCE: evidence/original/matched-science-report.json
      QOO98_SOURCE_CNF_DIR: evidence/original/cnfs
      QOO98_GANAK_NATIVE_REPORT: evidence/native/ganak-native-mode6-report.json
      QOO98_GANAK_CNF_DIR: evidence/native/small-exact-fixtures
      QOO98_GANAK_ABLATION_GATE: evidence/prior-gate/ganak-arjun-puura-science-preflight.json
      QUPRS_CODSPEED_EXPORT: evidence/qaoa7-three-actual-rounds-codspeed.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-cost syntax and scoped CodSpeed requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/qoo157_d4/qoo98_ganak_native_mode6_admission.py research/qoo157_d4/qoo98_ganak_arjun_puura.py
          python -m pip install pytest 'pytest-codspeed==5.0.3'
          mkdir -p evidence
      - uses: actions/download-artifact@v4
        with:
          name: qoo157-d4-matched-decimal-efab7ccd132214758d4209d0b5c4f6488f30695e
          run-id: 41822549728
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/original
      - uses: actions/download-artifact@v4
        with:
          name: qoo98-ganak-mode6-native-a144555269a03ed5333350faf236256d7f97dc09
          run-id: 41854306330
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/native
      - uses: actions/download-artifact@v4
        with:
          name: qoo98-ganak-arjun-puura-factorial-016007e5ec64bcc3a3fcde9f567b8d012b07603a
          run-id: 41857811857
          repository: PhysicsQoo/QuPRS
          github-token: ${{ github.token }}
          path: evidence/prior-gate
      - name: Verify official release archive, binary SHA and embedded version
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qoo98-qaoa7-validation"
          mkdir -p "$root/expanded"
          archive="$root/ganak-v2.8.0-linux-amd64.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            'https://github.com/meelgroup/ganak/releases/download/release/v2.8.0/ganak-v2.8.0-linux-amd64.tar.gz'
          expected_archive=$(awk '$1=="linux" && $2=="x86_64" {print $4}' src/QuPRS/utils/ganak-release.txt)
          expected_exe=$(awk '$1=="linux" && $2=="x86_64" {print $5}' src/QuPRS/utils/ganak-release.txt)
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected_archive"
          tar -xzf "$archive" -C "$root/expanded"
          binary=$(find "$root/expanded" -type f -name ganak -print -quit)
          test -f "$binary"
          chmod +x "$binary"
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$expected_exe"
          "$binary" --version > evidence/qaoa7-ganak-version.txt
          grep -q 'Ganak SHA1: b4ca02f78301aadeb7fa9acb5ed1524dc3fa0281' evidence/qaoa7-ganak-version.txt
          echo "QOO98_GANAK_BIN=$binary" >> "$GITHUB_ENV"
          sha256sum "$binary" > evidence/qaoa7-binary.sha256
      - name: Per-run two-arm complex source count preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from qoo98_ganak_arjun_puura import binary_pin, load_fixed_source, KNOBS, run_mode6
          from qoo98_ganak_native_mode6_admission import compare
          from pathlib import Path
          import json
          bin=binary_pin()
          case='qaoa7_neq'
          cnf,reference,row=load_fixed_source(case)
          evidence={}
          for name in ('arjun1_puura1','arjun1_puura0'):
              actual=compare(run_mode6(bin,cnf,KNOBS[name]),reference,large=True)
              evidence[name]={'status':actual['status'],'source_sha256':row['source_sha256'],
                              'binary_scope':'same_pinned_ganak127','count':actual}
              assert actual['status']=='PRINT_CONCORDANT_UNCERTIFIED',(name,actual)
          Path('evidence/qaoa7-current-science-preflight.json').write_text(json.dumps(evidence,indent=2))
          print('QOO98_TWO_ARM_CURRENT_SCIENCE_PREFLIGHT_PASS')
          PY
      - name: Official CodSpeed v5 baseline versus Arjun-only three full measured rounds
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: python -m pytest research/qoo157_d4/qoo98_ganak_arjun_puura.py -q -k 'qaoa7_neq and (arjun1_puura1 or arjun1_puura0)' --codspeed --codspeed-max-rounds=3 --codspeed-max-time=75
      - name: Record evidence provenance
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/qaoa7-head.txt
          uname -a > evidence/qaoa7-runner.txt
          echo 'Compare two exact same official Ganak binary/source CNF, MPFR127, threads=1. Require CodSpeed total_time >= 3*min_ns/1e9 to certify three actually executed rounds; 75s max budget. Science counts only, no 38d print parity.' > evidence/qaoa7-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo98-qaoa7-three-independent-codspeed-${{ github.sha }}
          path: |
            evidence/qaoa7-three-actual-rounds-codspeed.json
            evidence/qaoa7-current-science-preflight.json
            evidence/qaoa7-binary.sha256
            evidence/qaoa7-ganak-version.txt
            evidence/qaoa7-head.txt
            evidence/qaoa7-runner.txt
            evidence/qaoa7-scope.txt
          retention-days: 30
          if-no-files-found: warn
