name: Independent QPEexact8 QASM Unitary Oracle

on:
  pull_request:
    paths:
      - '.github/workflows/qpeexact8-oracle-audit.yml'
      - '.diagnostics/semantic_oracle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qiskit-unitary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external Qiskit oracle
        run: python -m pip install 'qiskit>=2,<3' 'numpy>=1.26,<3'
      - name: Compare unchanged QPEexact8 QASM unitary matrices modulo global phase
        run: python -u .diagnostics/semantic_oracle/qpeexact8.py
      - name: Attach source and dependency provenance
        if: always()
        run: |
          mkdir -p qpeexact-oracle-results
          git rev-parse HEAD > qpeexact-oracle-results/source-sha.txt
          python -m pip freeze > qpeexact-oracle-results/packages.txt
          find qpeexact-oracle-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > qpeexact-oracle-results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-qpeexact8-unitary-oracle
          path: qpeexact-oracle-results/
          if-no-files-found: error
          retention-days: 30
