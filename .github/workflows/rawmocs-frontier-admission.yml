          cmp "$src/crates/rawmocs-cli/Cargo.lock" .rawmocs-candidate/crates/rawmocs-cli/Cargo.lock
          env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.rawmocs-candidate/crates/rawmocs-cli/target" cargo install --locked --path "$src/crates/rawmocs-cli" --root "$source_tmp/install"
          installed="$source_tmp/install/bin/rawmocs"
          test "$("$installed" --version)" = "rawmocs 0.2.0"
          cp "$installed" .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs
          cmp "$installed" .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs
          git -C .rawmocs-candidate rev-parse HEAD > "$evidence/source-revision.txt"
          git rev-parse HEAD > "$evidence/quprs-revision.txt"
          "$installed" --version > "$evidence/installed-version.txt"
          sha256sum "$src/crates/rawmocs-cli/Cargo.lock" > "$evidence/source-lock.sha256"
          echo V020_EXTRACTED_SOURCE_INTEGRATION_INSTALL_PASS
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
          python -m pip install 'maturin>=1.5,<2' 'qiskit==2.6.1'
          maturin build --release --locked --interpreter python --out .v020-rust-evidence/wheels
          python -m pip install .v020-rust-evidence/wheels/*.whl
          python -m pip check
          python -m pip freeze > .v020-rust-evidence/dependencies.txt
          sha256sum .rawmocs-{candidate,baseline}/crates/rawmocs-cli/target/release/rawmocs .gpmc/build/gpmc .v020-rust-evidence/wheels/*.whl > .v020-rust-evidence/binaries.sha256
          cat > .v020-rust-evidence/bin/frontier <<'SH'
          #!/bin/sh
          set -eu
          [ "$#" -eq 5 ] && [ "$1" = --digits ] && [ "$3" = --timeout-ms ] || exit 2
          exec "$(dirname "$0")/../../.rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs" "$1" "$2" "$3" "$4" --solver auto-frontier "$5"
          SH
          chmod 700 .v020-rust-evidence/bin/frontier
          sh -n .v020-rust-evidence/bin/frontier
          printf 'p cnf 1 0\nc t wmc\nc p weight 1 -1 0 0\n' > .v020-rust-evidence/control.cnf
          .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs --digits 30 --timeout-ms 1000 --solver auto-frontier .v020-rust-evidence/control.cnf > .v020-rust-evidence/direct.stdout
          .v020-rust-evidence/bin/frontier --digits 30 --timeout-ms 1000 .v020-rust-evidence/control.cnf > .v020-rust-evidence/wrapper.stdout
          cmp .v020-rust-evidence/direct.stdout .v020-rust-evidence/wrapper.stdout
      - name: Run existing public Rust API and fail-closed controls for three configurations
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research/rawmocs_integration:${{ github.workspace }}/.rawmocs-candidate/crates/rawmocs-cli/tools
