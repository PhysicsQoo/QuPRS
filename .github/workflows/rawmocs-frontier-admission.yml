          python -m pip install maturin==1.8.3 numpy sympy symengine 'qiskit==2.6.1' qiskit-qasm3-import psutil
          cargo build --locked --release --manifest-path .rawmocs-candidate/crates/rawmocs-cli/Cargo.toml
