name: RaWMoCS Frontier admission
on:
  push:
    branches: [experiment/rawmocs-integration]
    paths:
      - '.github/workflows/rawmocs-frontier-admission.yml'
      - 'research/rawmocs_integration/native_*.py'
      - 'src/QuPRS/utils/solver_adapter.py'
  workflow_dispatch:
    inputs:
      suite:
        description: Bounded Frontier admission suite
        type: choice
        options: [frontier-release-quality, frontier-vqe16-gpmc-scout, v020-cross-family-scout, v020-pinned-integration, v020-planner-diagnosis, v020-width-transfer, v020-rust-integration, v020-final-admission, v020-frontier-holdout, v020-shared-contraction, v020-package-rehearsal, p4-native-first, p4-native-long, p4-native-safety, p47-released-native, p47-released-long]
        default: frontier-release-quality
permissions:
  contents: read
  actions: read
concurrency:
  group: rawmocs-frontier-admission-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'routine' }}
  cancel-in-progress: true
jobs:
  frontier-release-quality:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'frontier-release-quality'
    name: Frontier release quality / style and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: dc8b0b8840212548d4126c1f1d1f81cc04b83db8
          path: .classes-candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .classes-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Audit formatting and clippy on formatted candidate
        run: |
          set -euo pipefail
          mkdir -p .frontier-quality
          test "$(git -C .classes-candidate rev-parse HEAD)" = dc8b0b8840212548d4126c1f1d1f81cc04b83db8
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc pkg-config
          manifest=.classes-candidate/crates/rawmocs-cli/Cargo.toml
          rc=0
          cargo fmt --manifest-path "$manifest" -- --check > .frontier-quality/original-fmt.log 2>&1 || rc=$?
          echo "ORIGINAL_FMT_EXIT=$rc" | tee .frontier-quality/original-fmt.exit
          cargo fmt --manifest-path "$manifest"
          git -C .classes-candidate diff -- crates/rawmocs-cli > .frontier-quality/rustfmt.patch
          git -C .classes-candidate diff --check
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings 2>&1 | tee .frontier-quality/clippy.log
          cargo test --locked --release --manifest-path "$manifest" 2>&1 | tee .frontier-quality/tests.log
          echo FORMATTED_CANDIDATE_LINT_TEST_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-frontier-release-quality
          path: .frontier-quality/
          include-hidden-files: true
          if-no-files-found: warn

  frontier-release-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'frontier-release-quality'
    name: Frontier release corpus / exact cross-build and route parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: dc8b0b8840212548d4126c1f1d1f81cc04b83db8
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 8a052355bfa33f52ec921184710b017b235ddfaa
          path: .frontier-release-main
          persist-credentials: false
      - name: Recover immutable release regeneration corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/release-regeneration.zip"
          gh api repos/PhysicsQoo/RaWMoCS/actions/artifacts/15084476883/zip > "$zip"
          echo '6ad6683a489057deffb6537c60600e13e38e0586f1dc4e40aa87a4e1da1c8e72  '"$zip" | sha256sum -c -
          unzip -q "$zip" -d .frontier-release-corpus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .classes-candidate/crates/rawmocs-cli -> target
            .frontier-release-main/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Build unmodified exact revisions
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = dc8b0b8840212548d4126c1f1d1f81cc04b83db8
          test "$(git -C .frontier-release-main rev-parse HEAD)" = 8a052355bfa33f52ec921184710b017b235ddfaa
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc pkg-config
          for repo in .classes-candidate .frontier-release-main; do
            cargo build --locked --release --manifest-path "$repo/crates/rawmocs-cli/Cargo.toml"
          done
      - name: Seven source-locked cohorts and three route arms
        run: |
          set -euo pipefail
          mkdir -p .frontier-release-evidence
          python3 - <<'PY'
          import hashlib,json,re,subprocess,sys
          from pathlib import Path
          root=Path(".frontier-release-evidence").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import CASES,check_count
          from regenerate_release import DIGITS,PIN
          regenpath,=Path(".frontier-release-corpus").rglob("regeneration.json")
          corpus=regenpath.parent
          regen=json.loads(regenpath.read_text())
          assert regen["status"]=="REGENERATION_COMPLETE" and regen["quprs_revision"]==PIN
          assert len(regen["sources"])==6 and len(regen["cohorts"])==len(CASES)
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          bins={"main":Path(".frontier-release-main/crates/rawmocs-cli/target/release/rawmocs").resolve(),"candidate":cli/"target/release/rawmocs"}
          report={"status":"IN_PROGRESS","binary_sha256":{k:sha(v) for k,v in bins.items()},"regeneration_sha256":sha(regenpath),"rows":[]}
          def save():(root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          save()
          for label,_,_,expected,bits in CASES:
              family=label.rsplit("-",1)[0]
              cnf,=(corpus/family).glob("*-gpmc.cnf")
              refpath=corpus/family/"independent-reference.json"
              ref=json.loads(refpath.read_text())
              src,=[x for x in regen["sources"] if x["family"]==family]
              cert,=[x for x in regen["cohorts"] if x["label"]==label]
              digits,target=DIGITS[bits]
              assert src["status"]=="SOURCE_EXACT" and src["cnf_sha256"]==expected==sha(cnf)==ref["source_sha256"]
              assert cert["status"]=="PASS" and cert["bits"]==bits and cert["target"]==target and cert["reference_sha256"]==sha(refpath)
              assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE") and ref["bits"]==550 and ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
              if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":assert ref["order_policy"] in ("fill-reverse","degree-reverse")
              old=None
              for arm,mode in (("main","auto"),("candidate","auto"),("candidate","auto-frontier")):
                  p=subprocess.run(["timeout","-k","2s","60s","prlimit","--as=3221225472","--",str(bins[arm]),"--digits",str(digits),"--solver",mode,str(cnf.resolve())],capture_output=True,text=True,timeout=65)
                  tag=f"{label}-{arm}-{mode}"
                  (root/f"{tag}.stdout").write_text(p.stdout)
                  (root/f"{tag}.stderr").write_text(p.stderr)
                  assert p.returncode==0,(tag,p.returncode,p.stderr[-1000:])
                  sat,count=p.stdout.splitlines()
                  fields=count.split()
                  assert sat in ("s SATISFIABLE","s UNSATISFIABLE") and len(fields)==5 and fields[:3]==["c","r","mpfr"]
                  assert re.findall(r"^RAWMOCS_COMPLETE route=prejoin digits=(\d+) bits=(\d+) ",p.stderr,re.M)==[(str(digits),str(bits))]
                  assert "PREJOIN_FRONTIER_STOP" not in p.stderr and "RAWMOCS_FALLBACK" not in p.stderr
                  plan,=re.findall(r"^PREJOIN_COMPLETE residual=(\d+) cuts=(\d+) leaves=(\d+) width=(\d+) work=(\d+) peak=(\d+) joins=(\d+) plan_ns=\d+$",p.stderr,re.M)
                  if old is None:old=(p.stdout,plan)
                  else:assert old==(p.stdout,plan),(tag,"exact output or plan signature drift")
                  row={"sat":sat=="s SATISFIABLE","real":fields[3],"imag":fields[4]}
                  upper=check_count(row,ref,target)
                  assert sha(cnf)==expected and sha(refpath)==cert["reference_sha256"]
                  report["rows"].append(dict(label=label,arm=arm,mode=mode,bits=bits,target=target,source_sha256=expected,plan=plan,witness_upper=upper))
                  save()
              print("FRONTIER_RELEASE_COHORT_PASS",label,flush=True)
          report["status"]="SEVEN_COHORT_THREE_ROUTE_REPLAY_PASS"
          save()
          print("FRONTIER_RELEASE_REPLAY_REPORT",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-frontier-release-replay
          path: .frontier-release-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  frontier-vqe16-gpmc-scout:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'frontier-vqe16-gpmc-scout'
    name: VQE16 actual fallback / bounded GPMC completer scout
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: dc8b0b8840212548d4126c1f1d1f81cc04b83db8
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          submodules: recursive
          persist-credentials: false
      - name: Recover prior original CNF and build GPMC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          zip="$RUNNER_TEMP/vqe16.zip"
          gh api repos/PhysicsQoo/QuPRS/actions/artifacts/15163671358/zip > "$zip"
          echo 'd0909fe45c075d5599da6f0e248127772e1a85bca566fbaeeea6c5d7dc7f869e  '"$zip" | sha256sum -c -
          unzip -q "$zip" -d .vqe16-original
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev time pkg-config
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
      - name: One native GPMC scout and witness only for completed long case
        run: |
          set -euo pipefail
          mkdir -p .vqe16-gpmc-evidence
          python3 - <<'PY'
          import hashlib,json,re,subprocess,sys,time
          from fractions import Fraction
          from pathlib import Path
          root=Path(".vqe16-gpmc-evidence").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          cnf,=Path(".vqe16-original").rglob("extended_vqe16-gpmc.cnf")
          receipt,=Path(".vqe16-original").rglob("report.json")
          old=json.loads(receipt.read_text())
          expected="e855eb330954ea8cbad70837126b1e447efbda5448d3d0fb69d7f7bb5ae32e21"
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert old["case"]=="vqe16" and old["cnf_sha256"]==expected==sha(cnf)
          assert old["status"]=="FRONTIER_NOT_COMPLETE" and old["rows"]["frontier"]["fallback_reasons"]==["no bounded prejoin plan"]
          binary=Path(".gpmc/build/gpmc").resolve()
          report={"case":"vqe16","source_sha256":expected,"gpmc_sha":"89bbc89d0de918e7a5385740355df55765039230","binary_sha256":sha(binary),"digits":130,"bits":432,"target":100,"previous_frontier":old["rows"]["frontier"]}
          def finish(status):
              report["status"]=status
              assert sha(cnf)==expected
              (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
              print("VQE16_GPMC_SCOUT_REPORT",json.dumps(report),flush=True)
          def bounded(cmd,seconds,tag):
              start=time.monotonic_ns()
              p=subprocess.run(["timeout","-k","2s",str(seconds),"prlimit","--as=3221225472","--",*map(str,cmd)],capture_output=True,text=True,timeout=seconds+7)
              (root/f"{tag}.stdout").write_text(p.stdout)
              (root/f"{tag}.stderr").write_text(p.stderr)
              return p,(time.monotonic_ns()-start)/1e9
          p,t=bounded([binary,"-mode=1","-prec=130",cnf.resolve()],120,"gpmc")
          row=dict(exit=p.returncode,wall_s=t)
          report["gpmc"]=row
          if p.returncode:
              finish("GPMC_CENSORED" if p.returncode in (124,137) else "GPMC_EXECUTION_ERROR")
              sys.exit(0)
          assert re.findall(r"^c o precision (\d+)\s*$",p.stdout,re.M)==["130"]
          row.update(parse(p.stdout,"gpmc"))
          if t<10:
              finish("SHORT_GPMC_COMPLETER_UNWITNESSED");sys.exit(0)
          for name in ("original_exact_prejoin.py","original_fixed_interval.py"):
              p,t=bounded([sys.executable,cli/"tools/repro"/name,cnf.resolve(),expected],45,name)
              report.setdefault("oracle_attempts",[]).append(dict(name=name,exit=p.returncode,wall_s=t))
              if p.returncode:continue
              c=json.loads(p.stdout)
              if name=="original_fixed_interval.py":
                  assert "FIXED_INTERVAL_SELF_TEST PASS" in p.stderr
                  assert c["order_policy"] in ("fill-reverse","degree-reverse")
              else: assert c["status"]=="INDEPENDENT_INTERVAL_COMPLETE"
              assert c["source_sha256"]==expected and c["bits"]==550 and type(c["sat"]) is bool
              assert c["width"]<=19 and c["work"]<=40000000 and c["peak"]<=2000000
              for k in ("real","imag"):
                  a,b=map(Fraction,c[k]);assert a<=b
              row["witness_upper"]=check_count(row,c,100)
              (root/"independent-reference.json").write_text(json.dumps(c,indent=2)+"\n")
              finish("LONG_GPMC_COMPLETER_WITNESSED");sys.exit(0)
          finish("LONG_GPMC_COMPLETER_UNWITNESSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-vqe16-gpmc-scout
          path: .vqe16-gpmc-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  v020-cross-family-scout:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-cross-family-scout'
    name: v0.2.0 cross-family scout / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: vqe16_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/vqe_nativegates_ibm_qiskit_opt0_16.qasm
            blob: 06ae97e5d904d270fa692cb91ad964596bf15381
          - case: qnn12_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/qnn_nativegates_ibm_qiskit_opt0_12.qasm
            blob: 8c5f70d4d718f962f39ba2aa08dd217b3cca17a6
          - case: qft22_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/qft_nativegates_ibm_qiskit_opt0_22.qasm
            blob: 4ef9fc3b26115ab9cc8d8d92aeceb11f713e30c0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 0b8538be510718e7c8d79a79875681628b73f9be
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .classes-candidate/crates/rawmocs-cli -> target
            .upstream/quprs/rust -> target
          shared-key: rawmocs-auto-fallback-scout
          cache-workspace-crates: 'false'
      - name: Build pinned exporter and native solvers
        env:
          SOURCE: ${{ matrix.source }}
          BLOB: ${{ matrix.blob }}
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = 0b8538be510718e7c8d79a79875681628b73f9be
          test "$(git -C .upstream/quprs rev-parse HEAD)" = 0b28736651b3740ed3b201edd2efdef3da541e0d
          test "$(git -C .upstream/quprs rev-parse "HEAD:$SOURCE")" = "$BLOB"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev m4 make gcc time pkg-config
          mkdir -p .frontier-positive-evidence
          repro=.classes-candidate/crates/rawmocs-cli/tools/repro
          test "$(git -C .classes-candidate hash-object crates/rawmocs-cli/tools/repro/quprs_long_tail_source_bridge.rs)" = fc32f4e8b0a2f34386b86e08ddf147469275c245
          cp "$repro/quprs_long_tail_source_bridge.rs" .upstream/quprs/rust/quprs/examples/
          cargo build --locked --release --no-default-features --manifest-path .upstream/quprs/rust/Cargo.toml -p quprs --example quprs_long_tail_source_bridge
          cargo test --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml 2>&1 | tee .frontier-positive-evidence/science.log
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Scout only validated frontier; witness genuine positive completions
        id: scout
        env:
          CASE: ${{ matrix.case }}
          SOURCE: ${{ matrix.source }}
          BLOB: ${{ matrix.blob }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys,time
          from fractions import Fraction
          from pathlib import Path
          root=Path(".frontier-positive-evidence").resolve()
          q=Path(".upstream/quprs").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          case=os.environ["CASE"];rel=os.environ["SOURCE"];label="extended_"+case
          binary=cli/"target/release/rawmocs"
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          report={"case":case,"source_path":rel,"qasm_blob":os.environ["BLOB"],"qasm_sha256":sha(q/rel),"quprs_sha":"0b28736651b3740ed3b201edd2efdef3da541e0d","rawmocs_sha":"0b8538be510718e7c8d79a79875681628b73f9be","binary_sha256":sha(binary),"digits":130,"bits":432,"target":100,"status":"IN_PROGRESS","rows":{}}
          def finish(status):
              report["status"]=status
              (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
              print("FRONTIER_POSITIVE_SCOUT_REPORT",json.dumps(report),flush=True)
          def bounded(cmd,seconds,tag):
              start=time.monotonic_ns()
              p=subprocess.run(["timeout","-k","2s",str(seconds),"prlimit","--as=3221225472","--",*map(str,cmd)],capture_output=True,text=True,timeout=seconds+7)
              (root/f"{tag}.stdout").write_text(p.stdout)
              (root/f"{tag}.stderr").write_text(p.stderr)
              return p,(time.monotonic_ns()-start)/1e9
          exporter=q/"rust/target/release/examples/quprs_long_tail_source_bridge"
          p,t=bounded([exporter,label,q,root,rel],30,"export")
          if p.returncode:
              report["export"]={"exit":p.returncode,"wall_s":t}
              finish("EXPORT_NOT_ADMITTED");sys.exit(0)
          cnf=root/(label+"-gpmc.cnf")
          assert (root/(label+".qasm")).read_bytes()==(q/rel).read_bytes()
          expected=sha(cnf);report["cnf_sha256"]=expected
          header=cnf.open().readline().split();assert header[:2]==["p","cnf"] and len(header)==4
          report["variables"],report["clauses"]=map(int,header[2:])
          p,t=bounded([binary,"--digits","130","--solver","auto-frontier","--timeout-ms","13000",cnf],15,"frontier")
          stop=re.findall(r"^PREJOIN_FRONTIER_STOP steps=(\d+) remaining=(\d+) reason=exact local bit cap$",p.stderr,re.M)
          row={"exit":p.returncode,"wall_s":t,"stop":stop,"fallback_reasons":re.findall(r"^RAWMOCS_FALLBACK reason=(.+)$",p.stderr,re.M)}
          report["rows"]["frontier"]=row
          assert sha(cnf)==expected
          if p.returncode:
              assert not p.stdout
              finish("FRONTIER_NOT_COMPLETE");sys.exit(0)
          row.update(parse(p.stdout,"rawmocs"))
          route,=re.findall(r"^RAWMOCS_COMPLETE route=([a-z-]+) digits=130 bits=432 ",p.stderr,re.M)
          row["route"]=route
          if not stop or route!="prejoin" or row["fallback_reasons"]:
              finish("NO_POSITIVE_FRONTIER_ROUTE");sys.exit(0)
          ref=None
          for name in ("original_exact_prejoin.py","original_fixed_interval.py"):
              p,t=bounded([sys.executable,cli/"tools/repro"/name,cnf,expected],45,name)
              report.setdefault("oracle_attempts",[]).append({"name":name,"exit":p.returncode,"wall_s":t})
              if p.returncode:continue
              c=json.loads(p.stdout)
              if name=="original_fixed_interval.py":
                  assert "FIXED_INTERVAL_SELF_TEST PASS" in p.stderr
                  c["status"]="INDEPENDENT_FIXED_INTERVAL_COMPLETE"
              if c.get("status") not in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE"):continue
              assert c["source_sha256"]==expected and c["bits"]==550 and type(c["sat"]) is bool
              assert c["width"]<=19 and c["work"]<=40000000 and c["peak"]<=2000000
              for key in ("real","imag"):
                  a,b=map(Fraction,c[key]);assert a<=b
              ref=c;break
          if ref is None:
              finish("POSITIVE_FRONTIER_UNWITNESSED");sys.exit(0)
          row["witness_upper"]=check_count(row,ref,100)
          (root/"independent-reference.json").write_text(json.dumps(ref,indent=2)+"\n")
          report["witness_sha256"]=sha(root/"independent-reference.json")
          assert sha(cnf)==expected
          finish("POSITIVE_FRONTIER_WITNESSED")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("qualified=true\n")
          PY
      - uses: actions/checkout@v4
        if: steps.scout.outputs.qualified == 'true'
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          submodules: recursive
          persist-credentials: false
      - name: Screen GPMC only after witnessed Frontier completion
        if: steps.scout.outputs.qualified == 'true'
        run: |
          set -euo pipefail
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
          python3 - <<'PY'
          import hashlib,json,re,subprocess,sys,time
          from pathlib import Path
          root=Path(".frontier-positive-evidence").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          report=json.loads((root/"report.json").read_text())
          cnf,=root.glob("*-gpmc.cnf")
          refpath=root/"independent-reference.json"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(cnf)==report["cnf_sha256"] and sha(refpath)==report["witness_sha256"]
          ref=json.loads(refpath.read_text())
          binary=Path(".gpmc/build/gpmc").resolve()
          report["gpmc_sha"]="89bbc89d0de918e7a5385740355df55765039230"
          report["gpmc_binary_sha256"]=sha(binary)
          start=time.monotonic_ns()
          p=subprocess.run(["timeout","-k","2s","120s","prlimit","--as=3221225472","--",str(binary),"-mode=1","-prec=130",str(cnf)],capture_output=True,text=True,timeout=127)
          row={"exit":p.returncode,"wall_s":(time.monotonic_ns()-start)/1e9}
          (root/"gpmc.stdout").write_text(p.stdout)
          (root/"gpmc.stderr").write_text(p.stderr)
          report["rows"]["gpmc"]=row
          if p.returncode:
              report["status"]="GPMC_CENSORED" if p.returncode in (124,137) else "GPMC_EXECUTION_ERROR"
          else:
              assert re.findall(r"^c o precision (\d+)\s*$",p.stdout,re.M)==["130"]
              row.update(parse(p.stdout,"gpmc"))
              row["witness_upper"]=check_count(row,ref,100)
              report["status"]="LONG_GPMC_AND_FRONTIER_WITNESSED" if row["wall_s"]>=10 else "SHORT_GPMC_AND_FRONTIER_WITNESSED"
          assert sha(cnf)==report["cnf_sha256"] and sha(refpath)==report["witness_sha256"]
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("V020_CROSS_FAMILY_SCOUT_REPORT",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-cross-family-${{ matrix.case }}
          path: .frontier-positive-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  v020-pinned-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-pinned-integration'
    name: v0.2.0 exact-main extracted-source QuPRS integration / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: [e2e, qaoa11-transport]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0344851c7944d846ccdeae69404d3d4bef3e54d5
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: e553bc7bd739ca912036d8fa9f3a1ddfe8d8859c
          path: .rawmocs-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: b3d02b2720c2fae5231c0ed5cf44950164a5780d
          path: .rawmocs-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .rawmocs-candidate/crates/rawmocs-cli -> target
            .rawmocs-baseline/crates/rawmocs-cli -> target
          cache-workspace-crates: 'false'
      - name: Build immutable solver revisions and record dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0344851c7944d846ccdeae69404d3d4bef3e54d5
          test "$(git -C .rawmocs-candidate rev-parse HEAD)" = e553bc7bd739ca912036d8fa9f3a1ddfe8d8859c
          test "$(git -C .rawmocs-baseline rev-parse HEAD)" = b3d02b2720c2fae5231c0ed5cf44950164a5780d
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev m4 make gcc time pkg-config
          python -m pip install numpy sympy symengine 'qiskit==2.6.1' qiskit-qasm3-import psutil
          mkdir -p .v020-integration
          python -m pip freeze > .v020-integration/dependencies.txt
          cargo build --locked --release --manifest-path .rawmocs-baseline/crates/rawmocs-cli/Cargo.toml
          # Install the exact committed candidate from a deterministic source archive.
          source_tmp="$(mktemp -d)"
          trap 'rm -rf "$source_tmp"' EXIT
          evidence="$GITHUB_WORKSPACE/.v020-integration"
          git -C .rawmocs-candidate archive --format=tar --prefix=rawmocs-0.2.0/ HEAD | gzip -n > "$source_tmp/rawmocs-0.2.0-source.tar.gz"
          git -C .rawmocs-candidate archive --format=tar --prefix=rawmocs-0.2.0/ HEAD | gzip -n > "$source_tmp/repeat.tar.gz"
          cmp "$source_tmp/rawmocs-0.2.0-source.tar.gz" "$source_tmp/repeat.tar.gz"
          (cd "$source_tmp"; sha256sum rawmocs-0.2.0-source.tar.gz) > "$evidence/source.sha256"
          tar -xzf "$source_tmp/rawmocs-0.2.0-source.tar.gz" -C "$source_tmp"
          src="$source_tmp/rawmocs-0.2.0"
          test ! -e "$src/.git"
          cmp "$src/crates/rawmocs-cli/Cargo.lock" .rawmocs-candidate/crates/rawmocs-cli/Cargo.lock
          env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.rawmocs-candidate/crates/rawmocs-cli/target" cargo install --locked --path "$src/crates/rawmocs-cli" --root "$source_tmp/install"
          installed="$source_tmp/install/bin/rawmocs"
          test "$("$installed" --version)" = "rawmocs 0.2.0"
          cp "$installed" .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs
          cmp "$installed" .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs
          git -C .rawmocs-candidate rev-parse HEAD > "$evidence/source-revision.txt"
          git rev-parse HEAD > "$evidence/quprs-revision.txt"
          "$installed" --version > "$evidence/installed-version.txt"
          sha256sum "$src/crates/rawmocs-cli/Cargo.lock" > "$evidence/source-lock.sha256"
          echo V020_EXTRACTED_SOURCE_INTEGRATION_INSTALL_PASS
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
          sha256sum .rawmocs-{candidate,baseline}/crates/rawmocs-cli/target/release/rawmocs .gpmc/build/gpmc > .v020-integration/binaries.sha256
          mkdir -p .v020-integration/bin
          cat > .v020-integration/bin/frontier <<'SH'
          #!/bin/sh
          set -eu
          [ "$#" -eq 5 ] && [ "$1" = --digits ] && [ "$3" = --timeout-ms ] || exit 2
          exec "$(dirname "$0")/../../.rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs" "$1" "$2" "$3" "$4" --solver auto-frontier "$5"
          SH
          chmod 700 .v020-integration/bin/frontier
          sh -n .v020-integration/bin/frontier
          printf 'p cnf 1 0\nc t wmc\nc p weight 1 -1 0 0\n' > .v020-integration/wrapper-control.cnf
          .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs --digits 130 --timeout-ms 1000 --solver auto-frontier .v020-integration/wrapper-control.cnf > .v020-integration/control-direct.stdout 2> .v020-integration/control-direct.stderr
          .v020-integration/bin/frontier --digits 130 --timeout-ms 1000 .v020-integration/wrapper-control.cnf > .v020-integration/control-wrapper.stdout 2> .v020-integration/control-wrapper.stderr
          cmp .v020-integration/control-direct.stdout .v020-integration/control-wrapper.stdout
          grep -q '^s SATISFIABLE$' .v020-integration/control-wrapper.stdout
          grep -q '^RAWMOCS_COMPLETE route=.* digits=130 bits=432 ' .v020-integration/control-wrapper.stderr
          echo V020_FRONTIER_WRAPPER_PREFLIGHT_PASS
      - name: Public Python check_equivalence and scoped adapter parity
        if: matrix.case == 'e2e'
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs-candidate/crates/rawmocs-cli/tools
        run: |
          set -euo pipefail
          for arm in baseline candidate frontier; do
            raw=".rawmocs-$arm/crates/rawmocs-cli/target/release/rawmocs"
            if [[ "$arm" == frontier ]]; then raw=.v020-integration/bin/frontier; fi
            python research/rawmocs_integration/compare.py --case e2e --raw "$raw" --gpmc .gpmc/build/gpmc --out ".v020-integration/$arm"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".v020-integration")
          reports={a:json.loads((root/a/"report.json").read_text()) for a in ("baseline","candidate","frontier")}
          for r in reports.values():assert r["status"]=="PASS" and len(r["groups"])==4
          def signature(r):
              return [(g["case"],g["method"],g["rows"]["rawmocs"]["verdict"],g["rows"]["rawmocs"]["status"],g["rows"]["rawmocs"].get("cnf_sha256")) for g in r["groups"]]
          assert signature(reports["baseline"])==signature(reports["candidate"])==signature(reports["frontier"])
          print("V020_QUPRS_PUBLIC_E2E_PASS",json.dumps(signature(reports["candidate"])),flush=True)
          PY
      - name: Recover source-locked QAOA11 witness
        if: matrix.case == 'qaoa11-transport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/qaoa11-native.zip"
          gh api repos/PhysicsQoo/QuPRS/actions/artifacts/15163386446/zip > "$zip"
          echo "60e9e24a2ca2a613f777c4fbb2fe5a5fc5d6e0c48af6f5d7eb4d8b8415cf5760  $zip" | sha256sum -c -
          unzip -q "$zip" -d .v020-original
      - name: Actual run_wmc transport with independent oracle and four pinned arms
        if: matrix.case == 'qaoa11-transport'
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs-candidate/crates/rawmocs-cli/tools:${{ github.workspace }}/research/rawmocs_integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from compare import measure,digest
          from QuPRS.interface.ps2wmc import run_wmc
          from QuPRS.utils.solver_adapter import get_solver_adapter
          from release_transfer import check_count
          root=Path(".v020-integration").resolve()
          cnf,=Path(".v020-original").rglob("extended_qaoa11_native-gpmc.cnf")
          witness,=Path(".v020-original").rglob("independent-reference.json")
          expected="9590aa1e585eaafae3bed6a9d6e7fbc96f914388d0b3524d567876185329af25"
          assert digest(cnf)==expected
          assert digest(witness)=="77017d899f861ce422c7ee264e64cfa2ab2ada1c43ef30b738ee615116828094"
          ref=json.loads(witness.read_text())
          assert ref["source_sha256"]==expected and ref["bits"]==550
          assert ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
          gpmc=Path(".gpmc/build/gpmc").resolve()
          os.environ["QUPRS_GPMC_PATH"]=str(gpmc)
          default=get_solver_adapter("gpmc")
          bins={a:Path(".rawmocs-"+a+"/crates/rawmocs-cli/target/release/rawmocs").resolve() for a in ("baseline","candidate")}
          bins["frontier"]=root/"bin"/"frontier"
          report={"status":"IN_PROGRESS","cnf_sha256":expected,"witness_sha256":digest(witness),"digits":130,"bits":432,"target":100,"rows":{}}
          def save():(root/"transport.json").write_text(json.dumps(report,indent=2)+"\n")
          save()
          def action(selected):
              value=run_wmc(str(cnf.resolve()),selected,timeout=120,preserve_count=True,precision_digits=130 if selected=="gpmc" else None)
              return {"transport_real":str(value.real),"transport_imag":str(value.imag)}
          for arm in ("gpmc","baseline","candidate","frontier"):
              selected="gpmc" if arm=="gpmc" else "rawmocs"
              row=measure(selected,130,bins.get(arm,bins["candidate"]),gpmc,root/arm,action)
              report["rows"][arm]=row;save()
              assert row["status"]=="COMPLETED" and row["cnf_sha256"]==expected,row
              row["witness_upper"]=check_count(row,ref,100)
              assert digest(cnf)==expected and digest(witness)==report["witness_sha256"]
              assert get_solver_adapter("gpmc") is default
              try:get_solver_adapter("rawmocs")
              except ValueError:pass
              else:raise AssertionError("scoped adapter leaked")
              if arm=="frontier":
                  stderr=(root/"frontier.stderr").read_text()
                  assert row["route"]=="prejoin" and re.search(r"^PREJOIN_FRONTIER_STOP steps=\d+ remaining=\d+ reason=exact local bit cap$",stderr,re.M)
                  assert "RAWMOCS_FALLBACK" not in stderr
              save()
          report["status"]="FOUR_ARM_WITNESSED_TRANSPORT_PASS";save()
          print("V020_QUPRS_TRANSPORT_PASS",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-integration-${{ matrix.case }}
          path: .v020-integration/
          include-hidden-files: true
          if-no-files-found: warn

  v020-planner-diagnosis:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-planner-diagnosis'
    name: v0.2.0 bounded plan-only diagnosis / ${{ matrix.case }}
    runs-on: ubuntu-24.04
