          import QuPRS._pathsum_rust as ffi
          import native_acceptance as a
          root=Path(".v020-rust-evidence").resolve()
          ext=Path(ffi.__file__).resolve()
          assert ext.is_file() and ext.suffix==".so",ext
          assert Path.cwd().resolve() not in ext.parents,ext
          a.GPMC=Path(".gpmc/build/gpmc").resolve()
          arms={k:Path(".rawmocs-"+k+"/crates/rawmocs-cli/target/release/rawmocs").resolve() for k in ("baseline","candidate")}
          arms["frontier"]=root/"bin"/"frontier"
          report={"status":"IN_PROGRESS","ffi_path":str(ext),"ffi_sha256":hashlib.sha256(ext.read_bytes()).hexdigest(),"rows":{}}
          def save():(root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          save()
          for arm,binary in arms.items():
              a.ROOT=root/arm
              a.ROOT.mkdir()
              a.RAW=binary
              a.api()
              r=json.loads((a.ROOT/"public-api.json").read_text())
              assert r["status"]=="PASS" and len(r["rows"])==22,r
              report["rows"][arm]=r["rows"];save()
          def signature(rows):
              return [(r.get("safe_mode"),r.get("case"),r.get("solver"),r.get("verdict"),r.get("invoked"),r.get("fault"),r.get("status")) for r in rows]
          assert signature(report["rows"]["baseline"])==signature(report["rows"]["candidate"])==signature(report["rows"]["frontier"])
          report["status"]="V020_RUST_FFI_PASS";save()
          print("V020_RUST_FFI_PASS",json.dumps({k:len(v) for k,v in report["rows"].items()}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-rust-integration
          path: |
            .v020-rust-evidence/
            !.v020-rust-evidence/wheels/
          include-hidden-files: true
          if-no-files-found: warn


