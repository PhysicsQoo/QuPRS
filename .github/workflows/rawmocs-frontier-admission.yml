            zip_sha: eef087d7370ad901056028457635c89eac4f6eede07f8b8818b06861e642ffdd
            cnf_sha: f8c76d883923363a7fcb5e32d6c6d8914f8443af3582fbe3d2e1d9c0b99c35b7
          - case: qaoa11_native
            artifact: 15163386446
            zip_sha: 60e9e24a2ca2a613f777c4fbb2fe5a5fc5d6e0c48af6f5d7eb4d8b8415cf5760
            cnf_sha: 9590aa1e585eaafae3bed6a9d6e7fbc96f914388d0b3524d567876185329af25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 0b8538be510718e7c8d79a79875681628b73f9be
          path: .router-candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: matrix.case == 'vqe8'
        with:
          pattern: rawmocs-quprs-planner-gen-vqe8
          run-id: 45734596083
          github-token: ${{ github.token }}
          path: .router-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .router-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Recover previous independent witness and exact original CNF
        env:
          GH_TOKEN: ${{ github.token }}
          CASE: ${{ matrix.case }}
          ARTIFACT: ${{ matrix.artifact }}
          ZIP_SHA: ${{ matrix.zip_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .router-candidate rev-parse HEAD)" = 0b8538be510718e7c8d79a79875681628b73f9be
          mkdir -p .router-witness .router-source .router-evidence
          zip="$RUNNER_TEMP/router-witness.zip"
          gh api "repos/PhysicsQoo/QuPRS/actions/artifacts/$ARTIFACT/zip" > "$zip"
          echo "$ZIP_SHA  $zip" | sha256sum -c -
          unzip -q "$zip" -d .router-witness
          if [[ "$CASE" == feynman_* ]]; then
            zip="$RUNNER_TEMP/historical-trail.zip"
            gh api repos/PhysicsQoo/RaWMoCS/actions/artifacts/14234415131/zip > "$zip"
            echo "5f91528c376448c537e4ff08e26e9bb38b81bb7574c3596c8b0f8f3a50a632f4  $zip" | sha256sum -c -
            unzip -q "$zip" -d .router-source
          fi
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc pkg-config
          cargo build --locked --release --manifest-path .router-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Original-source route and fail-closed replay
        env:
          CASE: ${{ matrix.case }}
          CNF_SHA: ${{ matrix.cnf_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys
          from pathlib import Path
          root=Path(".router-evidence").resolve()
          tools=Path(".router-candidate/crates/rawmocs-cli/tools").resolve()
          sys.path.insert(0,str(tools))
          from release_transfer import check_count
          from release_native_paired import parse
          case=os.environ["CASE"]; expected=os.environ["CNF_SHA"]
          qa=case=="qaoa11_native"
          base=Path(".router-witness") if qa else Path(".router-source")
          name="extended_qaoa11_native-gpmc.cnf" if qa else "gpmc-capture.cnf" if case=="vqe8" else case+"-gpmc.cnf"
          cnf,=base.rglob(name)
          witness,=Path(".router-witness").rglob("independent-reference.json")
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(cnf)==expected
          if qa:assert digest(witness)=="77017d899f861ce422c7ee264e64cfa2ab2ada1c43ef30b738ee615116828094"
          ref=json.loads(witness.read_text())
          assert ref["source_sha256"]==expected and ref["bits"]==550
          assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE")
          assert ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
          if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":assert ref["order_policy"] in ("fill-reverse","degree-reverse")
          binary=Path(".router-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          report={"case":case,"candidate":"0b8538be510718e7c8d79a79875681628b73f9be","source_sha256":expected,"witness_sha256":digest(witness),"binary_sha256":digest(binary),"status":"IN_PROGRESS","rows":{}}
          def save():(root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          save()
          def run(label,mode,ms):
              args=[str(binary),"--digits","130","--timeout-ms",str(ms)]
              if mode:args.extend(["--solver",mode])
              p=subprocess.run(["timeout","-k","2s","22s","prlimit","--as=3221225472","--",*args,str(cnf.resolve())],capture_output=True,text=True,timeout=26)
              (root/(label+".stdout")).write_text(p.stdout);(root/(label+".stderr")).write_text(p.stderr)
              row={"exit":p.returncode,"fallback":re.findall(r"^RAWMOCS_FALLBACK reason=(.+)$",p.stderr,re.M),"stop":re.findall(r"^PREJOIN_FRONTIER_STOP .+$",p.stderr,re.M)}
              report["rows"][label]=row;save()
              return p,row
          routes={"default":"general" if qa else "prejoin","auto":"general" if qa else "prejoin","auto-frontier":"prejoin","auto-separator":"general-separator" if qa else "prejoin","general":"general","general-separator":"general-separator"}
          for mode,route in routes.items():
              p,row=run(mode,None if mode=="default" else mode,20000)
              assert p.returncode==0,(mode,p.stderr[-2000:])
              m,=re.findall(r"^RAWMOCS_COMPLETE route=([a-z-]+) digits=130 bits=432 ",p.stderr,re.M)
              assert m==route,(mode,m,route)
              row["route"]=m;row.update(parse(p.stdout,"rawmocs"));row["witness_upper"]=check_count(row,ref,100)
              if qa and mode in ("default","auto","auto-separator"):assert row["fallback"]==["exact local bit cap"],row
              else:assert not row["fallback"],row
              if qa and mode=="auto-frontier":assert len(row["stop"])==1 and "reason=exact local bit cap" in row["stop"][0],row
              if route=="general-separator":
                  stats,=re.findall(r"^RAWMOCS_SEPARATOR_COMPLETE checks=(\d+) overrides=(\d+)$",p.stderr,re.M)
                  row["checks"],row["overrides"]=map(int,stats)
              else:assert "RAWMOCS_SEPARATOR_COMPLETE" not in p.stderr
              save()
          assert (root/"default.stdout").read_bytes()==(root/"auto.stdout").read_bytes()
          p,row=run("deadline","auto-frontier",0)
          assert p.returncode==4 and not p.stdout and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr
          if qa:
              p,row=run("explicit-prejoin-reject","prejoin",20000)
              assert p.returncode==6 and not p.stdout and "exact local bit cap" in p.stderr and not row["fallback"]
          assert digest(cnf)==expected and digest(witness)==report["witness_sha256"]
          report["status"]="ROUTER_WITNESS_REPLAY_PASS";save()
          print("V020_ROUTER_REPLAY_PASS",json.dumps({"case":case,"rows":{k:{x:v.get(x) for x in ("exit","route","fallback","stop","checks","overrides")} for k,v in report["rows"].items()}}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-router-${{ matrix.case }}
          path: .router-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  v020-release-verifier-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-final-admission'
    name: v0.2.0 release receipt policy preview (read only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 0b8538be510718e7c8d79a79875681628b73f9be
          path: .release-candidate
          persist-credentials: false
      - name: Test versioned quadruple receipt policy in disposable checkout
        run: |
          set -euo pipefail
          test "$(git -C .release-candidate rev-parse HEAD)" = 0b8538be510718e7c8d79a79875681628b73f9be
          mkdir -p .receipt-evidence
          python3 .release-candidate/scripts/test_release_source.py 2>&1 | tee .receipt-evidence/legacy.log
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".release-candidate/scripts/release_source.py")
          s=p.read_text()
          old='            required_steps = {"Seven order-rotated same-precision native triples"}'
          assert s.count(old)==1
          s=s.replace(old,'            required_steps = {"Seven order-rotated same-precision native quadruples" if tuple(map(int, r["version"].split("."))) >= (0, 2, 0) else "Seven order-rotated same-precision native triples"}')
          p.write_text(s)
          PY
          git -C .release-candidate diff --check
          git -C .release-candidate diff -- scripts/release_source.py > .receipt-evidence/verifier.patch
          python3 .release-candidate/scripts/test_release_source.py 2>&1 | tee .receipt-evidence/legacy-after.log
          PYTHONPATH=.release-candidate/scripts python3 - <<'PY' | tee .receipt-evidence/v020-policy.log
          from copy import deepcopy
          from test_release_source import fixture
          from release_source import verify_run
          req,run,jobs=fixture("0.2.0")
          def reject(req,run,jobs):
              try:verify_run(req,run,jobs,"science")
              except ValueError:return
              raise AssertionError("unqualified receipt admitted")
          reject(req,run,jobs)
          for j in jobs["jobs"]:
              for s in j["steps"]:
                  if s["name"]=="Seven order-rotated same-precision native triples":
                      s["name"]="Seven order-rotated same-precision native quadruples"
          verify_run(req,run,jobs,"science")
          run2={**run,"event":"pull_request"}
          reject(req,run2,jobs)
          reject(req,{**run,"head_branch":"candidate/v020-frontier-convergence"},jobs)
          reject(req,{**run,"head_sha":"b"*40},jobs)
          bad=deepcopy(jobs)
          for j in bad["jobs"]:
              for s in j["steps"]:
                  if s["name"]=="Seven order-rotated same-precision native quadruples":s["conclusion"]="skipped"
          reject(req,run,bad)
          print("V020_RELEASE_RECEIPT_PREVIEW_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-release-policy-preview
          path: .receipt-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  v020-frontier-holdout:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-frontier-holdout'
    name: v0.2.0 source-locked Frontier holdout / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: vqe8_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/vqe_nativegates_ibm_qiskit_opt0_8.qasm
            blob: dbb9a29b9e2f223e7aa08b2d49564f4e817ee8c4
          - case: qnn8_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/qnn_nativegates_ibm_qiskit_opt0_8.qasm
            blob: 113c6ad4d559b7f2d8f72104780ce76859bd42de
          - case: qwalk4_native
            source: benchmarks/MQTBench/qiskit-2.6.1-opt0/h,ry,rz,cx/qwalk-noancilla_nativegates_ibm_qiskit_opt0_4.qasm
            blob: f878245eda3be47a3d8b0baff46e81a57a909698
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 0b8538be510718e7c8d79a79875681628b73f9be
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/QuPRS
          ref: 0b28736651b3740ed3b201edd2efdef3da541e0d
          path: .upstream/quprs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .classes-candidate/crates/rawmocs-cli -> target
            .upstream/quprs/rust -> target
          shared-key: rawmocs-auto-fallback-scout
          cache-workspace-crates: 'false'
      - name: Build pinned exporter and native solvers
        env:
          SOURCE: ${{ matrix.source }}
          BLOB: ${{ matrix.blob }}
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = 0b8538be510718e7c8d79a79875681628b73f9be
          test "$(git -C .upstream/quprs rev-parse HEAD)" = 0b28736651b3740ed3b201edd2efdef3da541e0d
          test "$(git -C .upstream/quprs rev-parse "HEAD:$SOURCE")" = "$BLOB"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev m4 make gcc time pkg-config
          mkdir -p .frontier-positive-evidence
          repro=.classes-candidate/crates/rawmocs-cli/tools/repro
          test "$(git -C .classes-candidate hash-object crates/rawmocs-cli/tools/repro/quprs_long_tail_source_bridge.rs)" = fc32f4e8b0a2f34386b86e08ddf147469275c245
          cp "$repro/quprs_long_tail_source_bridge.rs" .upstream/quprs/rust/quprs/examples/
          cargo build --locked --release --no-default-features --manifest-path .upstream/quprs/rust/Cargo.toml -p quprs --example quprs_long_tail_source_bridge
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Scout only validated frontier; witness genuine positive completions
        id: scout
        env:
          CASE: ${{ matrix.case }}
          SOURCE: ${{ matrix.source }}
          BLOB: ${{ matrix.blob }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys,time
          from fractions import Fraction
          from pathlib import Path
          root=Path(".frontier-positive-evidence").resolve()
          q=Path(".upstream/quprs").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          case=os.environ["CASE"];rel=os.environ["SOURCE"];label="extended_"+case
          binary=cli/"target/release/rawmocs"
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          report={"case":case,"source_path":rel,"qasm_blob":os.environ["BLOB"],"qasm_sha256":sha(q/rel),"quprs_sha":"0b28736651b3740ed3b201edd2efdef3da541e0d","rawmocs_sha":"0b8538be510718e7c8d79a79875681628b73f9be","binary_sha256":sha(binary),"digits":130,"bits":432,"target":100,"status":"IN_PROGRESS","rows":{}}
          def finish(status):
              report["status"]=status
              (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
              print("FRONTIER_POSITIVE_SCOUT_REPORT",json.dumps(report),flush=True)
          def bounded(cmd,seconds,tag):
              start=time.monotonic_ns()
              p=subprocess.run(["timeout","-k","2s",str(seconds),"prlimit","--as=3221225472","--",*map(str,cmd)],capture_output=True,text=True,timeout=seconds+7)
              (root/f"{tag}.stdout").write_text(p.stdout)
              (root/f"{tag}.stderr").write_text(p.stderr)
              return p,(time.monotonic_ns()-start)/1e9
          exporter=q/"rust/target/release/examples/quprs_long_tail_source_bridge"
          p,t=bounded([exporter,label,q,root,rel],30,"export")
          if p.returncode:
              report["export"]={"exit":p.returncode,"wall_s":t}
              finish("EXPORT_NOT_ADMITTED");sys.exit(0)
          cnf=root/(label+"-gpmc.cnf")
          assert (root/(label+".qasm")).read_bytes()==(q/rel).read_bytes()
          expected=sha(cnf);report["cnf_sha256"]=expected
          header=cnf.open().readline().split();assert header[:2]==["p","cnf"] and len(header)==4
          report["variables"],report["clauses"]=map(int,header[2:])
          p,t=bounded([binary,"--digits","130","--solver","auto-frontier","--timeout-ms","13000",cnf],15,"frontier")
          stop=re.findall(r"^PREJOIN_FRONTIER_STOP steps=(\d+) remaining=(\d+) reason=exact local bit cap$",p.stderr,re.M)
          row={"exit":p.returncode,"wall_s":t,"stop":stop,"fallback_reasons":re.findall(r"^RAWMOCS_FALLBACK reason=(.+)$",p.stderr,re.M)}
          report["rows"]["frontier"]=row
          assert sha(cnf)==expected
          if p.returncode:
              assert not p.stdout
              finish("FRONTIER_NOT_COMPLETE");sys.exit(0)
          row.update(parse(p.stdout,"rawmocs"))
          route,=re.findall(r"^RAWMOCS_COMPLETE route=([a-z-]+) digits=130 bits=432 ",p.stderr,re.M)
          row["route"]=route
          if not stop or route!="prejoin" or row["fallback_reasons"]:
              finish("NO_POSITIVE_FRONTIER_ROUTE");sys.exit(0)
          ref=None
          for name in ("original_exact_prejoin.py","original_fixed_interval.py"):
              p,t=bounded([sys.executable,cli/"tools/repro"/name,cnf,expected],45,name)
              report.setdefault("oracle_attempts",[]).append({"name":name,"exit":p.returncode,"wall_s":t})
              if p.returncode:continue
              c=json.loads(p.stdout)
              if name=="original_fixed_interval.py":
                  assert "FIXED_INTERVAL_SELF_TEST PASS" in p.stderr
                  c["status"]="INDEPENDENT_FIXED_INTERVAL_COMPLETE"
              if c.get("status") not in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE"):continue
              assert c["source_sha256"]==expected and c["bits"]==550 and type(c["sat"]) is bool
              assert c["width"]<=19 and c["work"]<=40000000 and c["peak"]<=2000000
              for key in ("real","imag"):
                  a,b=map(Fraction,c[key]);assert a<=b
              ref=c;break
          if ref is None:
              finish("POSITIVE_FRONTIER_UNWITNESSED");sys.exit(0)
          row["witness_upper"]=check_count(row,ref,100)
          (root/"independent-reference.json").write_text(json.dumps(ref,indent=2)+"\n")
          report["witness_sha256"]=sha(root/"independent-reference.json")
          assert sha(cnf)==expected
          finish("POSITIVE_FRONTIER_WITNESSED")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("qualified=true\n")
          PY
      - uses: actions/checkout@v4
        if: steps.scout.outputs.qualified == 'true'
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          submodules: recursive
          persist-credentials: false
      - name: Screen GPMC only after witnessed Frontier completion
        id: gpmc-scout
        if: steps.scout.outputs.qualified == 'true'
        run: |
          set -euo pipefail
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
          python3 - <<'PY'
          import hashlib,json,re,subprocess,sys,time
          from pathlib import Path
          root=Path(".frontier-positive-evidence").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          report=json.loads((root/"report.json").read_text())
          cnf,=root.glob("*-gpmc.cnf")
          refpath=root/"independent-reference.json"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(cnf)==report["cnf_sha256"] and sha(refpath)==report["witness_sha256"]
          ref=json.loads(refpath.read_text())
          binary=Path(".gpmc/build/gpmc").resolve()
          report["gpmc_sha"]="89bbc89d0de918e7a5385740355df55765039230"
          report["gpmc_binary_sha256"]=sha(binary)
          start=time.monotonic_ns()
          p=subprocess.run(["timeout","-k","2s","120s","prlimit","--as=3221225472","--",str(binary),"-mode=1","-prec=130",str(cnf)],capture_output=True,text=True,timeout=127)
          row={"exit":p.returncode,"wall_s":(time.monotonic_ns()-start)/1e9}
          (root/"gpmc.stdout").write_text(p.stdout)
          (root/"gpmc.stderr").write_text(p.stderr)
          report["rows"]["gpmc"]=row
          if p.returncode:
              report["status"]="GPMC_CENSORED" if p.returncode in (124,137) else "GPMC_EXECUTION_ERROR"
          else:
              assert re.findall(r"^c o precision (\d+)\s*$",p.stdout,re.M)==["130"]
              row.update(parse(p.stdout,"gpmc"))
              row["witness_upper"]=check_count(row,ref,100)
              report["status"]="LONG_GPMC_AND_FRONTIER_WITNESSED" if row["wall_s"]>=10 else "SHORT_GPMC_AND_FRONTIER_WITNESSED"
          assert sha(cnf)==report["cnf_sha256"] and sha(refpath)==report["witness_sha256"]
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("V020_CROSS_FAMILY_SCOUT_REPORT",json.dumps(report),flush=True)
          if report["status"]=="LONG_GPMC_AND_FRONTIER_WITNESSED":
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("long=true\n")
          PY
      - uses: actions/checkout@v4
        if: steps.gpmc-scout.outputs.long == 'true'
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: b3d02b2720c2fae5231c0ed5cf44950164a5780d
          path: .rawmocs-baseline
          persist-credentials: false
      - name: Screen released baseline only for witnessed long GPMC cases
        if: steps.gpmc-scout.outputs.long == 'true'
        run: |
          set -euo pipefail
          test "$(git -C .rawmocs-baseline rev-parse HEAD)" = b3d02b2720c2fae5231c0ed5cf44950164a5780d
          cargo build --locked --release --manifest-path .rawmocs-baseline/crates/rawmocs-cli/Cargo.toml
          python3 - <<'PY'
          import hashlib,json,re,subprocess,sys,time
          from pathlib import Path
          root=Path(".frontier-positive-evidence").resolve()
          cli=Path(".classes-candidate/crates/rawmocs-cli").resolve()
          sys.path.insert(0,str(cli/"tools"))
          from release_transfer import check_count
          from release_native_paired import parse
          report=json.loads((root/"report.json").read_text())
          assert report["status"]=="LONG_GPMC_AND_FRONTIER_WITNESSED"
          cnf,=root.glob("*-gpmc.cnf")
          witness=root/"independent-reference.json"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(cnf)==report["cnf_sha256"] and sha(witness)==report["witness_sha256"]
          ref=json.loads(witness.read_text())
          binary=Path(".rawmocs-baseline/crates/rawmocs-cli/target/release/rawmocs").resolve()
          report["baseline_revision"]="b3d02b2720c2fae5231c0ed5cf44950164a5780d"
          report["baseline_binary_sha256"]=sha(binary)
          start=time.monotonic_ns()
          p=subprocess.run(["timeout","-k","2s","120s","prlimit","--as=3221225472","--",str(binary),"--digits","130","--timeout-ms","118000",str(cnf)],capture_output=True,text=True,timeout=127)
          row={"exit":p.returncode,"wall_s":(time.monotonic_ns()-start)/1e9}
          (root/"baseline.stdout").write_text(p.stdout)
          (root/"baseline.stderr").write_text(p.stderr)
          report["rows"]["baseline"]=row
          if p.returncode:
              assert not p.stdout
              report["status"]="BASELINE_CENSORED_OR_ERROR"
          else:
              row.update(parse(p.stdout,"rawmocs"))
              row["witness_upper"]=check_count(row,ref,100)
              row["route"],=re.findall(r"^RAWMOCS_COMPLETE route=([a-z-]+) digits=130 bits=432 ",p.stderr,re.M)
              report["status"]="LONG_HOLDOUT_PAIRED_TRIAL_CANDIDATE" if row["wall_s"]>=2*report["rows"]["frontier"]["wall_s"] else "LONG_HOLDOUT_BELOW_TARGET_SINGLE_SCOUT"
          assert sha(cnf)==report["cnf_sha256"] and sha(witness)==report["witness_sha256"]
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("V020_HOLDOUT_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-holdout-${{ matrix.case }}
          path: .frontier-positive-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  v020-shared-contraction:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-shared-contraction'
    name: v0.2.0 fixed-cut contraction reuse / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: vqe16_native
            artifact: 15166930703
            zip_sha: e535f1659836d6316eb1d20e2df2df74b810184d76ba67931e66e5599d1305c1
            cnf_sha: 5683d3d2780614cb23526a7c14644e7b52d710a994de8a6d9d81b1b2097bc624
          - case: qnn12_native
            artifact: 15166063610
            zip_sha: 6bb36c83a575ec45779d6fb8b9c384fe59d1684dad0fe3877f60597c5392d7bd
            cnf_sha: 7c8841e0cf9c1c3f8b8b366750311aa9f630639f5f4446921aa1917fb55f3703
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 0b8538be510718e7c8d79a79875681628b73f9be
          path: .plan-candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .plan-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Verify original candidate and recover immutable CNF
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          ZIP_SHA: ${{ matrix.zip_sha }}
          CNF_SHA: ${{ matrix.cnf_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .plan-candidate rev-parse HEAD)" = 0b8538be510718e7c8d79a79875681628b73f9be
          mkdir -p .v020-plan-evidence .v020-plan-input
          zip="$RUNNER_TEMP/plan-input.zip"
          gh api "repos/PhysicsQoo/QuPRS/actions/artifacts/$ARTIFACT/zip" > "$zip"
          echo "$ZIP_SHA  $zip" | sha256sum -c -
          unzip -q "$zip" -d .v020-plan-input
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc pkg-config
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(".v020-plan-input")
          cnf,=root.rglob("*-gpmc.cnf")
          report,=root.rglob("report.json")
          r=json.loads(report.read_text())
          assert r["rawmocs_sha"]=="0b8538be510718e7c8d79a79875681628b73f9be"
          assert r["status"]=="FRONTIER_NOT_COMPLETE" and r["rows"]["frontier"]["fallback_reasons"]==["no bounded prejoin plan"]
          assert hashlib.sha256(cnf.read_bytes()).hexdigest()==r["cnf_sha256"]==os.environ["CNF_SHA"]
          Path(".v020-plan-evidence/input.json").write_text(json.dumps({"cnf":str(cnf.resolve()),"source_sha256":r["cnf_sha256"],"prior":r["rows"]["frontier"],"artifact":os.environ["ARTIFACT"]},indent=2)+"\n")
          PY
      - name: Instrument fixed-plan exact-factor and ordered-operation interning
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".plan-candidate/crates/rawmocs-cli/src/factor_prejoin.rs")
          s=p.read_text()
          anchor="mod tests {\n    use super::*;"
          assert s.count(anchor)==1
          test=r'''
              // A structural diagnostic only: equal exact input tables and
              // identical ordered operations may share deterministic MPFR
              // intermediate values. Do not evaluate any contraction here.
              #[test]
              #[ignore = "fixed-cut shared contraction feasibility only"]
              fn v020_shared_contraction_probe() {
                  let raw=std::fs::read_to_string(std::env::var("RAWMOCS_TEST_ORIGINAL").unwrap()).unwrap();
                  let p=parse_emitted(&raw,432).unwrap();
                  let cuts:Vec<usize>=match std::env::var("RAWMOCS_PLAN_CASE").unwrap().as_str() {
                      "vqe16_native"=>vec![29,48,64,89],
                      "qnn12_native"=>vec![66,83,112,126],
                      _=>panic!("unapproved case")
                  };
                  let d=Instant::now()+Duration::from_secs(30);
                  let (fs,nodes,scalar,local)=local_frontier_policy::<false,true>(&p,&raw,d,true,true,None,true).unwrap();
                  assert!(cuts.iter().all(|v|nodes.contains(v)));
                  let ns:Scope=nodes.iter().copied().filter(|v|!cuts.contains(v)).collect();
                  let retained=fs.iter().map(|f|f.values.len()).sum::<usize>();
                  // Exact table equality includes scope, support (None vs Some)
                  // and the full signed complex rational values.
                  let mut inputs:BTreeMap<Vec<usize>,Vec<(Factor<R>,usize)>>=BTreeMap::new();
                  // Ordered child IDs are intentional: no reassociation or
                  // commutative sorting of rounded arithmetic is assumed.
                  let mut ops:BTreeMap<(Option<usize>,Vec<usize>,Vec<usize>),usize>=BTreeMap::new();
                  let mut next=0usize;
                  let mut input_cells=0usize;
                  let mut all_work=0usize;
                  let mut unique_work=0usize;
                  let mut unique_cells=0usize;
                  let mut all_ops=0usize;
                  let mut max_leaf_peak=0usize;
                  for m in 0..(1usize<<cuts.len()) {
                      if Instant::now()>=d {println!("V020_SHARE_TERMINAL DEADLINE");return;}
                      let (f,_branch_scalar)=match restrict(&fs,&scalar,&cuts,m) {
                          Ok(x)=>x,Err(reason)=>{println!("V020_SHARE_TERMINAL RESTRICT_ERROR {reason}");return;}
                      };
                      let mut leaf:Option<Plan>=None;
                      for policy in [Some(0),Some(4),None] {
                          for reverse in [true,false] {
                              match plan(&f,&ns,(policy,reverse),retained,d) {
                                  Ok(Some(x))=>{
                                      if leaf.as_ref().is_none_or(|b|(x.cost.work,x.cost.peak,x.cost.width)<(b.cost.work,b.cost.peak,b.cost.width)){leaf=Some(x);}
                                  }
                                  Ok(None)=>{}
                                  Err(reason)=>{println!("V020_SHARE_TERMINAL PLAN_ERROR {reason}");return;}
                              }
                          }
                      }
                      let Some(leaf)=leaf else {println!("V020_SHARE_TERMINAL LEAF_REJECT branch={m}");return;};
                      let mut ids=BTreeMap::new();
                      for (i,factor) in f.into_iter().enumerate() {
                          if Instant::now()>=d {println!("V020_SHARE_TERMINAL DEADLINE");return;}
                          let group=inputs.entry(factor.scope.clone()).or_default();
                          let id=if let Some((_,id))=group.iter().find(|(old,_)|old==&factor) {
                              *id
                          } else {
                              input_cells+=factor.values.len();
                              if input_cells>LIVE {println!("V020_SHARE_TERMINAL INPUT_INTERN_CAP");return;}
                              let id=next;next+=1;group.push((factor,id));id
                          };
                          ids.insert(i,id);
                      }
                      let mut leaf_work=0usize;
                      for op in &leaf.ops {
                          if Instant::now()>=d {println!("V020_SHARE_TERMINAL DEADLINE");return;}
                          let children:Vec<_>=op.ids.iter().map(|id|ids.remove(id).unwrap()).collect();
                          let size=1usize<<op.out.len();
                          let work=if op.pivot.is_some(){2*size*children.len()}else{2*size};
                          leaf_work+=work;
                          all_ops+=1;
                          let key=(op.pivot,op.out.clone(),children);
                          let id=if let Some(&id)=ops.get(&key){id}else{
                              let id=next;next+=1;
                              ops.insert(key,id);unique_work+=work;unique_cells+=size;id
                          };
                          assert!(ids.insert(op.dst,id).is_none());
                      }
                      assert_eq!(leaf_work,leaf.cost.work);
                      all_work+=leaf_work+retained;
                      max_leaf_peak=max_leaf_peak.max(leaf.cost.peak);
                      println!("V020_SHARE_BRANCH branch={m} width={} work={} peak={} unique_work={unique_work} unique_ops={} all_ops={all_ops}",leaf.cost.width,leaf.cost.work,leaf.cost.peak,ops.len());
                  }
                  // This optimistic cost omits cache lookup, scheduling,
                  // repeated restriction, scalar products and extra storage.
                  // If it exceeds the cap, this fixed schedule is a NO-GO
                  // even with free unlimited sharing of identical DAG nodes.
                  println!("V020_SHARE_TOTAL branches=16 local_work={} independent_work={} unique_work={} unique_ops={} all_ops={} input_cells={} unique_cells={} max_leaf_peak={}",local.work,all_work+local.work,unique_work+local.work,ops.len(),all_ops,input_cells,unique_cells,max_leaf_peak);
                  println!("V020_SHARE_TERMINAL {}",if unique_work+local.work>WORK {"FIXED_DAG_WORK_NO_GO"}else{"OPTIMISTIC_WORK_WITHIN_CAP_MEMORY_UNVERIFIED"});
              }
          '''
          p.write_text(s.replace(anchor,anchor+"\n"+test))
          PY
          git -C .plan-candidate diff --check
          git -C .plan-candidate diff -- crates/rawmocs-cli/src/factor_prejoin.rs > .v020-plan-evidence/diagnostic.patch
          test "$(git -C .plan-candidate diff --name-only)" = crates/rawmocs-cli/src/factor_prejoin.rs
          cargo test --locked --release --manifest-path .plan-candidate/crates/rawmocs-cli/Cargo.toml --no-run
      - name: Measure optimistic fixed-DAG reuse without executing WMC
        env:
          CASE: ${{ matrix.case }}
          CNF_SHA: ${{ matrix.cnf_sha }}
        run: |
          set -euo pipefail
          export RAWMOCS_TEST_ORIGINAL="$(python3 -c 'import json;print(json.load(open(".v020-plan-evidence/input.json"))["cnf"])')"
          export RAWMOCS_PLAN_CASE="$CASE"
          timeout -k 2s 40s prlimit --as=3221225472 -- cargo test --locked --release --manifest-path .plan-candidate/crates/rawmocs-cli/Cargo.toml v020_shared_contraction_probe -- --ignored --nocapture > .v020-plan-evidence/planner.log 2>&1
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(".v020-plan-evidence")
          log=(root/"planner.log").read_text()
          assert "1 passed; 0 failed" in log
          terminal=re.findall(r"^V020_SHARE_TERMINAL (.+)$",log,re.M)
          assert len(terminal)==1,terminal
          branches=re.findall(r"^V020_SHARE_BRANCH .+$",log,re.M)
          totals=re.findall(r"^V020_SHARE_TOTAL (.+)$",log,re.M)
          metrics={}
          if terminal[0] in ("FIXED_DAG_WORK_NO_GO","OPTIMISTIC_WORK_WITHIN_CAP_MEMORY_UNVERIFIED"):
              assert len(branches)==16 and len(totals)==1
              metrics={k:int(v) for k,v in re.findall(r"(\w+)=(\d+)",totals[0])}
              assert metrics["branches"]==16 and metrics["unique_work"]<=metrics["independent_work"]
              assert (metrics["unique_work"]>40000000)==(terminal[0]=="FIXED_DAG_WORK_NO_GO")
          assert hashlib.sha256(Path(os.environ["RAWMOCS_TEST_ORIGINAL"]).read_bytes()).hexdigest()==os.environ["CNF_SHA"]
          report={"case":os.environ["CASE"],"candidate":"0b8538be510718e7c8d79a79875681628b73f9be","source_sha256":os.environ["CNF_SHA"],"terminal":terminal[0],"branches":branches,"metrics":metrics,"scope":"fixed 4-cut DAG; ordered exact factor identity; optimistic unique work only; cache memory/liveness/overhead unverified; no WMC count or speed claim"}
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("V020_SHARED_CONTRACTION_REPORT",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-shared-contraction-${{ matrix.case }}
          path: .v020-plan-evidence/
          include-hidden-files: true
          if-no-files-found: warn


  v020-package-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'v020-package-rehearsal'
    name: v0.2.0 disposable version and source-package rehearsal (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: bff6901ac415424c2141ea353b145f6de2cffb6e
          path: .package-candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .package-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Create a local-only version rehearsal commit
        run: |
          set -euo pipefail
          mkdir -p .v020-package-evidence
          cd .package-candidate
          test "$(git rev-parse HEAD)" = bff6901ac415424c2141ea353b145f6de2cffb6e
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > ../.v020-package-evidence/original-revision.txt
          git hash-object releases/request.json > ../.v020-package-evidence/request-blob.txt
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          manifest=Path("crates/rawmocs-cli/Cargo.toml")
          lock=Path("crates/rawmocs-cli/Cargo.lock")
          m=manifest.read_text()
          l=lock.read_text()
          assert tomllib.loads(m)["package"]["version"]=="0.1.1"
          old='name = "rawmocs-cli"\nversion = "0.1.1"'
          new='name = "rawmocs-cli"\nversion = "0.2.0"'
          assert m.count(old)==1 and l.count(old)==1
          m2=m.replace(old,new);l2=l.replace(old,new)
          a=tomllib.loads(m);b=tomllib.loads(m2)
          a["package"]["version"]="0.2.0"
          assert a==b
          a=tomllib.loads(l);b=tomllib.loads(l2)
          selected=[p for p in a["package"] if p["name"]=="rawmocs-cli"]
          assert len(selected)==1 and selected[0]["version"]=="0.1.1"
          selected[0]["version"]="0.2.0"
          assert a==b
          manifest.write_text(m2);lock.write_text(l2)
          PY
          git diff --check
          git diff -- crates/rawmocs-cli/Cargo.toml crates/rawmocs-cli/Cargo.lock > ../.v020-package-evidence/version-only.patch
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "crates/rawmocs-cli/Cargo.lock crates/rawmocs-cli/Cargo.toml "
          git -c user.name="Release rehearsal" -c user.email="rehearsal@example.invalid" commit -m "Local-only source-package rehearsal" -- crates/rawmocs-cli/Cargo.toml crates/rawmocs-cli/Cargo.lock
          test "$(git rev-parse HEAD^)" = bff6901ac415424c2141ea353b145f6de2cffb6e
          test "$(git hash-object releases/request.json)" = "$(cat ../.v020-package-evidence/request-blob.txt)"
          git rev-parse HEAD > ../.v020-package-evidence/rehearsal-revision.txt
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install build prerequisites and validate the versioned policy
        run: |
          set -euo pipefail
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc pkg-config
          cd .package-candidate
          python3 scripts/test_release_source.py 2>&1 | tee ../.v020-package-evidence/receipt-tests.log
          PYTHONPATH=scripts python3 - <<'PY' | tee ../.v020-package-evidence/policy.log
          import tomllib
          from release_source import native_policy
          with open("crates/rawmocs-cli/Cargo.toml","rb") as f:
              version=tomllib.load(f)["package"]["version"]
          assert version=="0.2.0"
          assert native_policy(version,False)=={"quadruples":True,"baseline":"b3d02b2720c2fae5231c0ed5cf44950164a5780d"}
          print("V020_MANIFEST_POLICY_REHEARSAL_PASS")
          PY
          cargo metadata --locked --no-deps --format-version 1 --manifest-path crates/rawmocs-cli/Cargo.toml > ../.v020-package-evidence/cargo-metadata.json
      - name: Reuse the real extracted-tree packaging gate
        run: |
          set -euo pipefail
          cd .package-candidate
          bash crates/rawmocs-cli/tools/package_source.sh "$GITHUB_WORKSPACE/.v020-package-evidence/source-package" 2>&1 | tee "$GITHUB_WORKSPACE/.v020-package-evidence/package.log"
      - name: Verify package assets and reject altered provenance locally
        run: |
          set -euo pipefail
          PYTHONPATH=.package-candidate/scripts python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from release_source import verify_assets
          root=Path(".v020-package-evidence")
          pack=root/"source-package"
          original=(root/"original-revision.txt").read_text().strip()
          revision=(root/"rehearsal-revision.txt").read_text().strip()
          assert original=="bff6901ac415424c2141ea353b145f6de2cffb6e" and revision!=original
          names=("rawmocs-0.2.0-source.tar.gz","SHA256SUMS","source-package.json")
          assets={name:(pack/name).read_bytes() for name in names}
          sha=hashlib.sha256(assets[names[0]]).hexdigest()
          req={"version":"0.2.0","revision":revision,"source_sha256":sha}
          verify_assets(req,assets)
          def reject(r,a):
              try:verify_assets(r,a)
              except ValueError:return
              raise AssertionError("invalid package accepted")
          reject({**req,"revision":original},assets)
          reject({**req,"source_sha256":"0"*64},assets)
          reject(req,{**assets,"SHA256SUMS":b"0"*64+b"  rawmocs-0.2.0-source.tar.gz\n"})
          assert (pack/"version.txt").read_text().strip()=="rawmocs 0.2.0"
          report={"status":"V020_PACKAGE_REHEARSAL_PASS","candidate":original,"local_only_revision":revision,"source_sha256":sha,"published":False,"scope":"disposable commit; local asset verifier and extracted install only; not a release request or main CI receipt"}
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("V020_PACKAGE_REHEARSAL_PASS",json.dumps(report),flush=True)
          PY
          test "$(git -C .package-candidate hash-object releases/request.json)" = "$(cat .v020-package-evidence/request-blob.txt)"
          test -z "$(git -C .package-candidate status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-v020-package-rehearsal-not-for-release
          path: .v020-package-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  p4-native-first:
