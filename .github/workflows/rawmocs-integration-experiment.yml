          mkdir -p .classes-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import statistics
          import subprocess
          import sys
          import time
          root = Path(".classes-evidence").resolve()
          inputs = Path(".classes-input").resolve()
          sys.path.insert(0, str(Path(".classes-base/crates/rawmocs-cli/tools").resolve()))
          from release_transfer import check_count
          sources = {
              "qft16": ("planner-qft16", "c35ee4e3ce77faf21ae6c8cd39d2fe14d8cba9958abffb8f18857e4357c9ea22", 45733766561),
              "qft20": ("planner-qft20", "29fea8d65f63dd282cc740e8cac5439b071f618780b04541e4412bfbd39462c5", 45733766561),
              "qnn8": ("planner-qnn8", "24dbcd5b6f270fd39f92b739e55446da7c14e7e2c28ed5032b70cf34bc0f786c", 45733766561),
              "qaoa9": ("planner-gen-qaoa9", "9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4", 45734596083),
              "vqe8": ("planner-gen-vqe8", "55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee", 45734596083),
          }
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          base = Path(".classes-base/crates/rawmocs-cli/target/release/rawmocs").resolve()
          candidate = Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          mode = os.environ["EXPERIMENT"]
          anchor = mode == "sparse-anchor"
          memo = mode == "prefix-memo"
          operand = mode == "operand-profile"
          pool = mode == "pool-profile"
          profile = mode in ("axis-profile","operand-profile","pool-profile")
          direct = mode == "direct-binary"
          masked = mode == "masked-donor"
          donor = mode in ("last-use-donor","masked-donor")
          if memo or profile or direct or donor:
              sources["qpeinexact20"] = ("planner-gen-qpeinexact20", "9dca661e1a9cfecbfe325970cded1bcb5c3664f7983fa1628473bd42f2ba3fcb", 45734596083)
          flag = "RAWMOCS_RESEARCH_MASKED_DONOR" if masked else "RAWMOCS_RESEARCH_LAST_USE_DONOR" if donor else "RAWMOCS_RESEARCH_POOL_PROFILE" if pool else "RAWMOCS_RESEARCH_OPERAND_PROFILE" if operand else "RAWMOCS_RESEARCH_DIRECT_BINARY" if direct else "RAWMOCS_RESEARCH_AXIS_PROFILE" if profile else "RAWMOCS_RESEARCH_PREFIX_MEMO" if memo else "RAWMOCS_RESEARCH_SPARSE_ANCHOR" if anchor else "RAWMOCS_RESEARCH_FACTOR_CLASSES"
          marker = "PREJOIN_RESEARCH_MASKED_DONOR" if masked else "PREJOIN_RESEARCH_DONOR" if donor else "PREJOIN_RESEARCH_POOL" if pool else "PREJOIN_RESEARCH_OPERANDS" if operand else "PREJOIN_RESEARCH_BINARY" if direct else "PREJOIN_RESEARCH_AXIS" if profile else "PREJOIN_RESEARCH_PREFIX" if memo else "PREJOIN_RESEARCH_ANCHOR" if anchor else "PREJOIN_RESEARCH_CLASSES"
          arms = {"release":base, "on":candidate} if profile else {"release":base, "off":candidate, "on":candidate}
          if not (anchor or memo or profile or direct or donor):
              static = Path(".classes-static/crates/rawmocs-cli/target/release/rawmocs").resolve()
              arms.update(static_off=static, static_on=static)
          report = {"status":"RUNNING", "experiment":mode, "cases":{},
                    "baseline_sha":os.environ["BASELINE_SHA"],
                    "candidate_sha":os.environ["CANDIDATE_SHA"],
                    "arm_semantics":{"release":"admitted direct binary","off":"full-scope donor","on":"masked donor"} if masked else None,
                    "static_sha":None if anchor or memo or profile or direct or donor else "d28cdd98fa2b55c73cfd01392fee48ba70602104",
                    "binary_sha256":{k:digest(v) for k,v in arms.items()},
                    "scope":"Diagnostic only; instrumentation timing is not an efficiency result" if profile else "RaWMoCS only; prior independent count witness, not new GPMC timing"}
          def persist():
              (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          persist()
          config = ["options:",'  max-time: "5s"',"benchmarks:"]
          cohorts = [(name, name, 30, 100, 30) for name in sources]
          if anchor or memo or profile or direct or donor:
              cohorts += [(name+"-432", name, 130, 432, 100) for name in ("qft20","qnn8")]
          if memo or profile or direct or donor:
              cohorts += [("qft16-432","qft16",130,432,100)]
          for name,source,digits,bits,target in cohorts:
              artifact,sha,run = sources[source]
              directory = inputs/("rawmocs-quprs-"+artifact)
              cnf, = directory.rglob("gpmc-capture.cnf")
              witness, = directory.rglob("witness.json")
              ref = json.loads(witness.read_text())
              assert digest(cnf)==ref["source_sha256"]==sha and ref["bits"]==550
              assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE")
              assert ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
              if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":
                  assert ref["order_policy"] in ("fill-reverse","degree-reverse")
              case = {"source_run":run,"source_sha256":sha,"witness_sha256":digest(witness),
                      "bits":bits,"digits":digits,"target":target,"rows":[],
                      "source_scope":"COUNT_ONLY_SOURCE_EXPECTATION_MISMATCH" if source=="qpeinexact20" else "SOURCE_LOCKED_COUNT"}
              report["cases"][name]=case
              persist()
              expected = None
              signature = None
              order = ("release","on") if profile else ("release","off","on","on","off","release","off","on","release") if anchor or memo or direct or donor else (
                       "release","off","on","static_off","static_on",
                       "static_on","static_off","on","off","release",
                       "on","static_on","release","static_off","off")
              for i,arm in enumerate(order):
                  binary = arms[arm]
                  env = os.environ.copy()
                  env.pop("RAWMOCS_RESEARCH_FACTOR_CLASSES",None)
                  env.pop("RAWMOCS_RESEARCH_SPARSE_ANCHOR",None)
                  env.pop("RAWMOCS_RESEARCH_PREFIX_MEMO",None)
                  env.pop("RAWMOCS_RESEARCH_AXIS_PROFILE",None)
                  env.pop("RAWMOCS_RESEARCH_DIRECT_BINARY",None)
                  env.pop("RAWMOCS_RESEARCH_OPERAND_PROFILE",None)
                  env.pop("RAWMOCS_RESEARCH_POOL_PROFILE",None)
                  env.pop("RAWMOCS_RESEARCH_LAST_USE_DONOR",None)
                  env.pop("RAWMOCS_RESEARCH_MASKED_DONOR",None)
                  if arm in ("on","static_on"):
                      env[flag]="1"
                  elif masked and arm=="off":
                      env["RAWMOCS_RESEARCH_LAST_USE_DONOR"]="1"
                  label = f"{name}-{i}-{arm}"
                  rss = root/(label+".rss")
                  argv = [str(binary),"--digits",str(digits),"--solver","prejoin","--timeout-ms","90000",str(cnf)]
                  start=time.monotonic()
                  p=subprocess.run(["timeout","-k","2s","95s","prlimit","--as=3221225472","--",
                      "/usr/bin/time","-f","%M","-o",str(rss),*argv],env=env,text=True,
                      capture_output=True,timeout=100)
                  wall=time.monotonic()-start
                  (root/(label+".stdout")).write_text(p.stdout)
                  (root/(label+".stderr")).write_text(p.stderr)
                  row={"arm":arm,"exit":p.returncode,"wall_s":wall}
                  case["rows"].append(row)
                  persist()
                  assert p.returncode==0, (label,p.stderr[-2000:])
                  sat, count = p.stdout.splitlines()
                  f=count.split()
                  assert sat in ("s SATISFIABLE","s UNSATISFIABLE") and f[:3]==["c","r","mpfr"] and len(f)==5
                  row.update(sat=sat=="s SATISFIABLE",real=f[3],imag=f[4],rss_kib=int(rss.read_text()))
                  assert f"RAWMOCS_COMPLETE route=prejoin digits={digits} bits={bits} " in p.stderr
                  try:
                      row["witness_relative_upper"]=check_count(row,ref,target)
                      row["witness_status"]="PASS"
                  except AssertionError as e:
                      if bits == 100:
                          raise
                      row["witness_status"]="PRECISION_WITNESS_INCONCLUSIVE"
                      row["witness_error"]=str(e)[:500]
                  plan,=re.findall(r"^PREJOIN_COMPLETE (.*?) plan_ns=",p.stderr,re.M)
                  phase,=re.findall(r"^PREJOIN_PHASE_NS .*? execute=(\d+)",p.stderr,re.M)
                  row.update(plan=plan,execute_ns=int(phase))
                  if arm in ("on","static_on") or (masked and arm=="off"):
                      if donor:
                          lines=re.findall(r"^PREJOIN_RESEARCH_DONOR ops=(\d+) slots=(\d+) reuses=(\d+) cap=(\d+)$",p.stderr,re.M)
                          leaves=int(re.search(r"\bleaves=(\d+)",plan).group(1))
                          assert len(lines)==leaves
                          row["donor_telemetry"]=[dict(zip(("ops","slots","reuses","cap"),map(int,x))) for x in lines]
                          for x in row["donor_telemetry"]:
                              assert x["ops"]<=x["slots"] and x["reuses"]<=x["slots"] and x["cap"]<=32768
                          row["donor_summary"]={k:sum(x[k] for x in row["donor_telemetry"]) for k in ("ops","slots","reuses")}
                          row["donor_summary"]["cap"]=max(x["cap"] for x in row["donor_telemetry"])
                          expected_slots={"qft16":1094427,"qft20":6206858,"qnn8":441475,"qaoa9":1335,"vqe8":1175,"qpeinexact20":0}
                          assert row["donor_summary"]["slots"]<=expected_slots[source]
                          if masked:
                              partial=re.findall(r"^PREJOIN_RESEARCH_MASKED_DONOR ops=(\d+) slots=(\d+) reuses=(\d+)$",p.stderr,re.M)
                              if arm=="on":
                                  assert len(partial)==leaves
                                  row["partial_telemetry"]=[dict(zip(("ops","slots","reuses"),map(int,x))) for x in partial]
                                  for x,total in zip(row["partial_telemetry"],row["donor_telemetry"]):
                                      assert x["ops"]<=total["ops"] and x["slots"]<=total["slots"] and x["reuses"]<=min(x["slots"],total["reuses"])
                                  row["partial_summary"]={k:sum(x[k] for x in row["partial_telemetry"]) for k in ("ops","slots","reuses")}
                              else:
                                  assert not partial
                      elif pool:
                          lines=re.findall(r"^PREJOIN_RESEARCH_POOL (.*)$",p.stderr,re.M)
                          leaves=int(re.search(r"\bleaves=(\d+)",plan).group(1))
                          assert len(lines)==leaves
                          fields=("ops","slots","hits","misses","absent","dead_supported","harvested","unharvested","peak_pool","cap","remaining","saturated_ops","overlap_upper","max_op_misses")
                          row["pool_telemetry"]=[{k:int(v) for k,v in (term.split("=") for term in line.split())} for line in lines]
                          for x in row["pool_telemetry"]:
                              assert tuple(x)==fields
                              assert x["slots"]==x["hits"]+x["misses"]+x["absent"]
                              assert x["harvested"]==x["hits"]+x["remaining"]
                              assert x["dead_supported"]==x["harvested"]+x["unharvested"]
                              assert x["remaining"]<=x["peak_pool"]<=x["cap"]<=32768
                              assert x["saturated_ops"]<=x["ops"] and x["max_op_misses"]<=x["misses"]
                              assert x["overlap_upper"]<=min(x["misses"],x["dead_supported"])
                          row["pool_summary"]={k:sum(x[k] for x in row["pool_telemetry"]) for k in fields if k not in ("peak_pool","cap","max_op_misses")}
                          for k in ("peak_pool","cap","max_op_misses"):
                              row["pool_summary"][k]=max(x[k] for x in row["pool_telemetry"])
                      elif operand:
                          lines=re.findall(r"^PREJOIN_RESEARCH_OPERANDS (.*)$",p.stderr,re.M)
                          binary_lines=re.findall(r"^PREJOIN_RESEARCH_BINARY ops=(\d+) visits=(\d+) join_visits=(\d+)$",p.stderr,re.M)
                          leaves=int(re.search(r"\bleaves=(\d+)",plan).group(1))
                          assert len(lines)==len(binary_lines)==leaves
                          fields=("absent","zero","one","nonfinite","rr","ri","rc","ir","ii","ic","cr","ci","cc","existing_products","zero_product_upper")
                          row["operand_telemetry"]=[{k:int(v) for k,v in (term.split("=") for term in line.split())} for line in lines]
                          for x,b in zip(row["operand_telemetry"],binary_lines):
                              assert tuple(x)==fields
                              assert sum(x[k] for k in fields[:13])==int(b[1])
                              assert x["existing_products"]==4*sum(x[k] for k in fields[3:13])
                              assert x["zero_product_upper"]==3*sum(x[k] for k in ("rr","ri","ir","ii"))+2*sum(x[k] for k in ("rc","ic","cr","ci"))
                          row["operand_summary"]={k:sum(x[k] for x in row["operand_telemetry"]) for k in fields}
                          expected_calls={"qft16":3254360,"qft20":17389912,"qnn8":1608756,"qaoa9":4140,"vqe8":2660,"qpeinexact20":0}
                          assert 2*sum(row["operand_summary"][k] for k in fields[:13])==expected_calls[source]
                      elif direct:
                          lines=re.findall(r"^PREJOIN_RESEARCH_BINARY ops=(\d+) visits=(\d+) join_visits=(\d+)$",p.stderr,re.M)
                          leaves=int(re.search(r"\bleaves=(\d+)",plan).group(1))
                          assert len(lines)==leaves
                          row["binary_telemetry"]=[dict(zip(("ops","visits","join_visits"),map(int,x))) for x in lines]
                          visits=sum(x["visits"] for x in row["binary_telemetry"])
                          expected_calls={"qft16":3254360,"qft20":17389912,"qnn8":1608756,"qaoa9":4140,"vqe8":2660,"qpeinexact20":0}
                          assert 2*visits==expected_calls[source], (name,visits)
                          assert all(x["ops"]<=x["visits"] and x["join_visits"]<=x["visits"] for x in row["binary_telemetry"])
                          row["scheduled_binary_visits"]=visits
                      elif profile:
                          lines=re.findall(r"^PREJOIN_RESEARCH_AXIS (.*)$",p.stderr,re.M)
                          leaves=int(re.search(r"\bleaves=(\d+)",plan).group(1))
                          assert len(lines)==leaves
                          fields=("tables","cells","axes","sample_pairs","sample_equal","sample_75_axes","sample_all_equal","full_pairs","rejected","unverified","proven_axes","proven_saved_cells","projected_saved_cells","projected_saved_calls","unary_calls","binary_calls","wide_calls","join_calls","prefix_twofold_ops","prefix_bounded_ops","prefix_potential_calls","max_table")
                          row["axis_telemetry"]=[{k:int(v) for k,v in (term.split("=") for term in line.split())} for line in lines]
                          for x in row["axis_telemetry"]:
                              assert tuple(x)==fields
                              assert x["full_pairs"]<=8000000 and x["sample_equal"]<=x["sample_pairs"]
                              assert x["sample_all_equal"]==x["proven_axes"]+x["rejected"]+x["unverified"]
                              assert x["sample_all_equal"]<=x["sample_75_axes"]<=x["axes"]
                              assert x["proven_saved_cells"]<=x["cells"]
                              assert x["projected_saved_calls"]<=x["unary_calls"]+x["binary_calls"]+x["wide_calls"]
                              assert x["prefix_bounded_ops"]<=x["prefix_twofold_ops"]
                          row["axis_summary"]={k:sum(x[k] for x in row["axis_telemetry"]) for k in fields if k!="max_table"}
                          row["axis_summary"]["max_table"]=max(x["max_table"] for x in row["axis_telemetry"])
                      elif memo:
                          lines=re.findall(r"^PREJOIN_RESEARCH_PREFIX ops=(\d+) peak_slots=(\d+) hits=(\d+) misses=(\d+) absent_hits=(\d+) saved_calls=(\d+)",p.stderr,re.M)
                          assert lines
                          row["prefix_telemetry"]=[dict(zip(("ops","peak_slots","hits","misses","absent_hits","saved_calls"),map(int,x))) for x in lines]
                          assert all(x["peak_slots"]<=4096 and x["saved_calls"]>=2*x["hits"] for x in row["prefix_telemetry"])
                      elif anchor:
                          lines=re.findall(r"^PREJOIN_RESEARCH_ANCHOR ops=(\d+) inspected=(\d+) checks=(\d+) skips=(\d+) prefix_upper=(\d+)",p.stderr,re.M)
                          assert lines
                          row["anchor_telemetry"]=[dict(zip(("ops","inspected","checks","skips","prefix_upper"),map(int,x))) for x in lines]
                          assert all(x["skips"]<=x["checks"] for x in row["anchor_telemetry"])
                      else:
                          lines=re.findall(r"^PREJOIN_RESEARCH_CLASSES factors=(\d+) cells=(\d+) peak_bytes=(\d+)",p.stderr,re.M)
                          assert lines
                          row["metadata"]=[list(map(int,x)) for x in lines]
                          assert all(x[2]<=2000000 for x in row["metadata"])
                  else:
                      assert marker not in p.stderr
                  if expected is None:
                      expected,signature=p.stdout,plan
                  assert p.stdout==expected and plan==signature, (label,"same-plan count mismatch")
                  persist()
              case["median"]={a:{k:statistics.median(r[k] for r in case["rows"] if r["arm"]==a)
                                for k in ("wall_s","execute_ns","rss_kib")} for a in arms}
              case["status"]="SAME_PLAN_WITNESSED_PASS" if all(r["witness_status"]=="PASS" for r in case["rows"]) else "PRECISION_WITNESS_INCONCLUSIVE"
              # Simulation is intentionally short: exclude QFT20 and any
              # case with native p50 > 0.5s on any arm.
              sim_cases = ("qft16","qnn8") if masked else ("qft16","qnn8","qaoa9","vqe8")
              if not profile and name in sim_cases and max(x["wall_s"] for x in case["median"].values())<=0.5:
                  # Keep the heavier QFT16 at three frozen arms; all five
                  # arms on the other shorter, structurally distinct cases.
                  sim_arms = ["off","on"] if masked else ["release","off","on"] if name=="qft16" else list(arms)
                  case["simulation_arms"] = sim_arms
                  for arm in sim_arms:
                      binary=arms[arm]
                      wrapper=root/f"{name}-{arm}.simulation.sh"
                      out=root/f"{name}-{arm}.simulation.stdout"
                      cmd=["env","-u","RAWMOCS_RESEARCH_FACTOR_CLASSES","-u","RAWMOCS_RESEARCH_SPARSE_ANCHOR","-u","RAWMOCS_RESEARCH_PREFIX_MEMO","-u","RAWMOCS_RESEARCH_AXIS_PROFILE","-u","RAWMOCS_RESEARCH_DIRECT_BINARY","-u","RAWMOCS_RESEARCH_OPERAND_PROFILE","-u","RAWMOCS_RESEARCH_POOL_PROFILE","-u","RAWMOCS_RESEARCH_LAST_USE_DONOR","-u","RAWMOCS_RESEARCH_MASKED_DONOR"]
                      if arm in ("on","static_on"):
                          cmd+=[flag+"=1"]
                      elif masked and arm=="off":
                          cmd+=["RAWMOCS_RESEARCH_LAST_USE_DONOR=1"]
                      cmd += [str(binary),"--digits","30","--solver","prejoin","--timeout-ms","90000",str(cnf)]
                      wrapper.write_text("#!/bin/sh\nset -eu\nexec "+shlex.join(cmd)+" >"+shlex.quote(str(out))+"\n")
                      wrapper.chmod(0o755)
                      group="rawmocs_masked_donor" if masked else "rawmocs_last_use_donor" if donor else "rawmocs_direct_binary" if direct else "rawmocs_prefix_memo" if memo else "rawmocs_sparse_anchor" if anchor else "rawmocs_factor_classes"
                      config.extend([f'  - name: "{group}/{name}/{arm}_mpfr100"',f'    exec: "{wrapper}"'])
                  (root/f"{name}.expected").write_text(expected)
                  case["simulation"]="ADMITTED"
              else:
                  case["simulation"]="NOT_RUN_DIAGNOSTIC" if profile else "NOT_ADMITTED_LONG"
              persist()
          if profile:
              report["status"]="PASS" if all(c["status"]=="SAME_PLAN_WITNESSED_PASS" for c in report["cases"].values()) else "PARTIAL_WITNESS"
              persist()
              print("POOL_PROFILE_FINAL" if pool else "OPERAND_PROFILE_FINAL" if operand else "AXIS_PROFILE_FINAL",json.dumps(report),flush=True)
          else:
              assert len(config)>3
              Path("codspeed-factor-classes.generated.yml").write_text("\n".join(config)+"\n")
              report["status"]="NATIVE_COMPLETE"
              persist()
              print("MASKED_DONOR_NATIVE_FINAL" if masked else "LAST_USE_DONOR_NATIVE_FINAL" if donor else "DIRECT_BINARY_NATIVE_FINAL" if direct else "PREFIX_MEMO_NATIVE_FINAL" if memo else "SPARSE_ANCHOR_NATIVE_FINAL" if anchor else "FACTOR_CLASS_NATIVE_FINAL",json.dumps(report),flush=True)
          PY
      - name: Compare bounded solver CPU and flamegraphs
        if: env.EXPERIMENT != 'axis-profile' && env.EXPERIMENT != 'operand-profile' && env.EXPERIMENT != 'pool-profile'
        uses: CodSpeedHQ/action@v5
        timeout-minutes: 8
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          config: codspeed-factor-classes.generated.yml
      - name: Verify simulated counts
        if: env.EXPERIMENT != 'axis-profile' && env.EXPERIMENT != 'operand-profile' && env.EXPERIMENT != 'pool-profile'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".classes-evidence")
          report=json.loads((root/"report.json").read_text())
          assert report["status"]=="NATIVE_COMPLETE"
          for name,case in report["cases"].items():
              if case["simulation"]!="ADMITTED":
                  continue
              for arm in case["simulation_arms"]:
                  assert (root/f"{name}-{arm}.simulation.stdout").read_bytes()==(root/f"{name}.expected").read_bytes()
              case["simulation"]="COUNT_PARITY_PASS"
          report["status"]="PASS" if all(c["status"]=="SAME_PLAN_WITNESSED_PASS" for c in report["cases"].values()) else "PARTIAL_WITNESS"
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print({"masked-donor":"MASKED_DONOR_FINAL","last-use-donor":"LAST_USE_DONOR_FINAL","direct-binary":"DIRECT_BINARY_FINAL","prefix-memo":"PREFIX_MEMO_FINAL","sparse-anchor":"SPARSE_ANCHOR_FINAL","factor-classes":"FACTOR_CLASS_FINAL"}[report["experiment"]],json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-${{ env.EXPERIMENT }}
          path: |
            .classes-evidence/
            codspeed-factor-classes.generated.yml
          include-hidden-files: true
          if-no-files-found: warn

  descendant-units:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'descendant-units' || inputs.suite == 'inplace-scan' || inputs.suite == 'inplace-branch' || inputs.suite == 'move-components' || inputs.suite == 'borrowed-cache' || inputs.suite == 'general-cumulative' || inputs.suite == 'general-simulation-repair')
    name: General fallback descendant unit closure
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPERIMENT: ${{ inputs.suite == 'descendant-units' && 'descendant-units' || inputs.suite == 'inplace-scan' && 'inplace-scan' || inputs.suite == 'inplace-branch' && 'inplace-branch' || inputs.suite == 'move-components' && 'move-components' || inputs.suite == 'borrowed-cache' && 'borrowed-cache' || inputs.suite == 'general-cumulative' && 'general-cumulative' || 'general-simulation-repair' }}
      CANDIDATE_SHA: ${{ inputs.suite == 'descendant-units' && '762a1da60c70000134b31dd41aee7e0c78068209' || inputs.suite == 'inplace-scan' && '9b10e04b02637db0eede7e5811f3cd54d054b191' || inputs.suite == 'inplace-branch' && '14cd70cae44cf116ba7014da1a446f30eec4a48b' || inputs.suite == 'move-components' && '0d7c3d482c6d45f6c5b1eeaf718d7b79a96572f8' || '5d74b2649639db3372fcc5ea5155ed0a50233fea' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: ${{ env.CANDIDATE_SHA }}
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rawmocs-quprs-planner-gen-*
          run-id: 45734596083
          github-token: ${{ github.token }}
          path: .descendant-input
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .classes-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Build exact candidate and exercise weighted closure controls
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          cargo test --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Source-locked bounded descendant propagation ablation
        id: general-native
        run: |
          set -euo pipefail
          mkdir -p .descendant-evidence
          python3 - <<'PY'
          import hashlib, json, os, re, shlex, statistics, subprocess, sys, time
          from fractions import Fraction
          from pathlib import Path
          root = Path(".descendant-evidence").resolve()
          solver = Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          sys.path.insert(0, str(Path(".classes-candidate/crates/rawmocs-cli/tools").resolve()))
          from release_transfer import check_count
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          chain = root/"branch-chain.cnf"
          repair=os.environ['EXPERIMENT']=='general-simulation-repair'
          n=512 if repair else 2048
          chain.write_text(f"p cnf {n} {2*(n-1)}\nc t wmc\nc p weight 1 -0.5 0.25 0\nc p weight -1 0.25 -0.125 0\n" +
              "".join(f"-{i} {i+1} 0\n{i} -{i+1} 0\n" for i in range(1,n)))
          cases=[("chain",chain,digest(chain),5,None)]
          source_cases=(("qpeinexact20","9dca661e1a9cfecbfe325970cded1bcb5c3664f7983fa1628473bd42f2ba3fcb",2),) if repair else (
              ("vqe8","55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee",5),
              ("qaoa9","9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4",15),
              ("qnn12","2c74e555a8a8ea974cde02bcc5cc0823c5ed63b5fc7be8f628f777accd433204",15))
          for name,sha,limit in source_cases:
              src=Path(".descendant-input")/("rawmocs-quprs-planner-gen-"+name)
              cnf,=src.rglob("gpmc-capture.cnf")
              assert digest(cnf)==sha
              witnesses=list(src.rglob("witness.json"))
              assert len(witnesses)<=1
              ref=None
              if witnesses:
                  obj=json.loads(witnesses[0].read_text())
                  if obj.get("status") in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE"):
                      assert obj["source_sha256"]==sha and obj["bits"]==550
                      assert obj["width"]<=19 and obj["work"]<=40000000 and obj["peak"]<=2000000
                      if obj["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":
                          assert obj["order_policy"] in ("fill-reverse","degree-reverse")
                      ref=obj
              if name in ("vqe8","qaoa9","qpeinexact20"):
                  assert ref is not None
              cases.append((name,cnf.resolve(),sha,limit,ref))
          experiment=os.environ["EXPERIMENT"]
          candidate_arm={"descendant-units":"adaptive","inplace-scan":"inplace","inplace-branch":"branch","move-components":"components","borrowed-cache":"borrowed","general-cumulative":"borrowed","general-simulation-repair":"borrowed"}[experiment]
          baseline_arm="components" if experiment=="borrowed-cache" else "branch" if experiment=="move-components" else "inplace" if experiment=="inplace-branch" else "scan"
          cumulative=experiment=="general-cumulative"
          if cumulative:
              cases += [(name+"-432",cnf,sha,8,ref) for name,cnf,sha,limit,ref in cases if name in ("chain","vqe8")]
          report={"experiment":experiment,"candidate_sha":os.environ["CANDIDATE_SHA"],"binary_sha256":digest(solver),
                  "working_bits":([100,432] if cumulative else 100),"scope":"Same-binary instrumented general fallback; bounded search progress, not GPMC speedup","cases":{}}
          def save():
              (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          for name,cnf,sha,limit,ref in cases:
              digits,bits=(130,432) if name.endswith("-432") else (30,100)
              case={"source_sha256":sha,"timeout_s":limit,"digits":digits,"bits":bits,"rows":[]}
              report["cases"][name]=case
              def run(arm,i):
                  label=f"{name}-{arm}-{i}"
                  env=os.environ.copy()
                  env.pop("RAWMOCS_RESEARCH_DESCENDANT_UNITS",None)
                  env.pop("RAWMOCS_RESEARCH_INPLACE_SCAN",None)
                  env.pop("RAWMOCS_RESEARCH_INPLACE_BRANCH",None)
                  env.pop("RAWMOCS_RESEARCH_MOVE_COMPONENTS",None)
                  env.pop("RAWMOCS_RESEARCH_BORROWED_CACHE",None)
                  env["RAWMOCS_RESEARCH_GENERAL_STATS"]="1"
                  if arm=="adaptive":
                      env["RAWMOCS_RESEARCH_DESCENDANT_UNITS"]="1"
                  elif arm in ("inplace","branch","components","borrowed"):
                      env["RAWMOCS_RESEARCH_INPLACE_SCAN"]="1"
                  if arm in ("branch","components","borrowed"):
                      env["RAWMOCS_RESEARCH_INPLACE_BRANCH"]="1"
                  if arm in ("components","borrowed"):
                      env["RAWMOCS_RESEARCH_MOVE_COMPONENTS"]="1"
                  if arm=="borrowed":
                      env["RAWMOCS_RESEARCH_BORROWED_CACHE"]="1"
                  rss=root/(label+".rss")
                  argv=["timeout","-k","2s",str(limit+3)+"s","prlimit","--as=3221225472","--",
                      "/usr/bin/time","-f","%M","-o",str(rss),str(solver),"--digits",str(digits),
                      "--solver","general","--timeout-ms",str(limit*1000),str(cnf)]
                  t=time.monotonic()
                  p=subprocess.run(argv,env=env,capture_output=True,text=True,timeout=limit+7)
                  row={"arm":arm,"exit":p.returncode,"wall_s":time.monotonic()-t}
                  case["rows"].append(row)
                  (root/(label+".stdout")).write_text(p.stdout)
                  (root/(label+".stderr")).write_text(p.stderr)
                  if rss.exists():
                      numeric=[s for s in rss.read_text().splitlines() if s.strip().isdigit()]
                      if len(numeric)==1:
                          row["rss_kib"]=int(numeric[0])
                  save()
                  lines=re.findall(r"^GENERAL_RESEARCH_DESCENDANT (.*)$",p.stderr,re.M)
                  if p.returncode==124:
                      assert not p.stdout.strip()
                      row["status"]="CENSORED_EXTERNAL_TIMEOUT"
                  else:
                      assert len(lines)==1, (label,p.stderr[-1000:])
                      stats={k:int(v) for k,v in (t.split("=") for t in lines[0].split())}
                      row["stats"]=stats
                      assert stats["complete"]==int(p.returncode==0)
                      assert stats["root_indexed"]<=stats["indexed_attempts"]
                      assert stats["indexed_complete"]+stats["indexed_conflicts"]<=stats["indexed_attempts"]
                      if arm in ("scan","inplace","branch","components","borrowed"):
                          assert stats["indexed_attempts"]==0
                      if p.returncode==0:
                          sat,count=p.stdout.splitlines()
                          f=count.split()
                          assert sat in ("s SATISFIABLE","s UNSATISFIABLE") and f[:3]==["c","r","mpfr"] and len(f)==5
                          assert f"RAWMOCS_COMPLETE route=general digits={digits} bits={bits} " in p.stderr
                          row.update(sat=sat=="s SATISFIABLE",real=f[3],imag=f[4])
                          row["stdout_sha256"]=hashlib.sha256(p.stdout.encode()).hexdigest()
                          if name in ("chain","chain-432"):
                              assert row["sat"] and Fraction(row["real"])==Fraction(-1,4) and Fraction(row["imag"])==Fraction(1,8)
                              if arm=="adaptive":
                                  assert stats["indexed_complete"]>=2 and stats["root_indexed"]==0
                              row["status"]="ANALYTIC_PASS"
                          elif ref is not None:
                              row["witness_upper"]=check_count(row,ref,digits)
                              row["status"]="WITNESSED_PASS"
                          else:
                              row["status"]="COUNT_UNWITNESSED"
                      else:
                          assert p.returncode==4 and not p.stdout.strip() and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr, (label,p.stderr[-1000:])
                          row["status"]="CENSORED_SOLVER_TIMEOUT"
                  save()
                  return row
              a=run(baseline_arm,0)
              b=run(candidate_arm,1)
              if name in ("chain","chain-432"):
                  assert a["status"]==b["status"]=="ANALYTIC_PASS"
              if cumulative and name in ("vqe8","vqe8-432"):
                  assert a["status"]==b["status"]=="WITNESSED_PASS"
              if a["exit"]==b["exit"]==0:
                  assert a["stdout_sha256"]==b["stdout_sha256"]
                  for k in ("nodes","cache_hits","branches","splits"):
                      assert a["stats"][k]==b["stats"][k], (name,k)
                  if candidate_arm in ("inplace","branch","components","borrowed"):
                      assert a["stats"]==b["stats"], name
                  c=run(candidate_arm,2)
                  d=run(baseline_arm,3)
                  assert c["exit"]==d["exit"]==0 and c["stdout_sha256"]==d["stdout_sha256"]==a["stdout_sha256"]
                  if candidate_arm in ("inplace","branch","components","borrowed"):
                      assert a["stats"]==c["stats"]==d["stats"], name
                  case["status"]="PAIRED_COUNT_PARITY" if all(r["status"] in ("ANALYTIC_PASS","WITNESSED_PASS") for r in case["rows"]) else "COUNT_PARITY_UNWITNESSED"
              else:
                  case["status"]="CENSORED_COMPARISON"
              save()
          report["status"]="BOUNDED_DIAGNOSTIC_COMPLETE"
          # Restrict Simulation to completed, bounded samples; never simulate censored cases.
          if repair:
              config=["options:",'  max-time: "5s"',"benchmarks:"]
              admitted=[]
              for name,cnf,sha,limit,ref in cases:
                  case=report["cases"][name]
                  if case["status"]!="PAIRED_COUNT_PARITY":
                      case["simulation"]="NOT_ADMITTED_NATIVE_INCOMPLETE"
                      continue
                  med={arm:statistics.median(r["wall_s"] for r in case["rows"] if r["arm"]==arm) for arm in ("scan","borrowed")}
                  case["native_median_s"]=med
                  if max(med.values())>0.05:
                      case["simulation"]="NOT_ADMITTED_NATIVE_LIMIT"
                      continue
                  flags=["RAWMOCS_RESEARCH_DESCENDANT_UNITS","RAWMOCS_RESEARCH_INPLACE_SCAN","RAWMOCS_RESEARCH_INPLACE_BRANCH","RAWMOCS_RESEARCH_MOVE_COMPONENTS","RAWMOCS_RESEARCH_BORROWED_CACHE","RAWMOCS_RESEARCH_GENERAL_STATS"]
                  for arm in ("scan","borrowed"):
                      wrapper=root/f"{name}-{arm}.simulation.sh"
                      out=root/f"{name}-{arm}.simulation.stdout"
                      cmd=["env"]+[x for flag in flags for x in ("-u",flag)]
                      if arm=="borrowed":
                          cmd += [flag+"=1" for flag in flags[1:5]]
                      cmd += [str(solver),"--digits","30","--solver","general","--timeout-ms","30000",str(cnf)]
                      wrapper.write_text("#!/bin/sh\nset -eu\nexec "+shlex.join(cmd)+" >"+shlex.quote(str(out))+"\n")
                      wrapper.chmod(0o755)
                      config.extend([f'  - name: "rawmocs_general_short/{name}/{arm}_mpfr100"',f'    exec: "{wrapper}"'])
                  (root/f"{name}.expected").write_bytes((root/f"{name}-scan-0.stdout").read_bytes())
                  admitted.append(name)
                  case["simulation"]="ADMITTED"
              assert "chain" in admitted, "short analytic control failed admission"
              report["simulation_cases"]=admitted
              Path("codspeed-general.generated.yml").write_text("\n".join(config)+"\n")
              with open(os.environ["GITHUB_OUTPUT"],"a") as stream:
                  stream.write("simulation=true\n")
          # Restrict historical Simulation to two arms on a completed, source-locked
          # VQE8 case. Never simulate censored long cases.
          sim=False
          if cumulative:
              name="vqe8"
              case=report["cases"][name]
              assert case["status"]=="PAIRED_COUNT_PARITY"
              med={arm:statistics.median(r["wall_s"] for r in case["rows"] if r["arm"]==arm) for arm in ("scan","borrowed")}
              case["native_median_s"]=med
              if max(med.values())<=1.5:
                  cnf=next(cnf for key,cnf,sha,limit,ref in cases if key==name)
                  flags=["RAWMOCS_RESEARCH_DESCENDANT_UNITS","RAWMOCS_RESEARCH_INPLACE_SCAN","RAWMOCS_RESEARCH_INPLACE_BRANCH","RAWMOCS_RESEARCH_MOVE_COMPONENTS","RAWMOCS_RESEARCH_BORROWED_CACHE","RAWMOCS_RESEARCH_GENERAL_STATS"]
                  config=["options:",'  max-time: "5s"',"benchmarks:"]
                  expected=root/"vqe8-scan-0.stdout"
                  for arm in ("scan","borrowed"):
                      wrapper=root/f"vqe8-{arm}.simulation.sh"
                      out=root/f"vqe8-{arm}.simulation.stdout"
                      cmd=["env"]+[x for flag in flags for x in ("-u",flag)]
                      if arm=="borrowed":
                          cmd += [flag+"=1" for flag in flags[1:5]]
                      cmd += [str(solver),"--digits","30","--solver","general","--timeout-ms","90000",str(cnf)]
                      wrapper.write_text("#!/bin/sh\nset -eu\nexec "+shlex.join(cmd)+" >"+shlex.quote(str(out))+"\n")
                      wrapper.chmod(0o755)
                      config.extend([f'  - name: "rawmocs_general_cumulative/vqe8/{arm}_mpfr100"',f'    exec: "{wrapper}"'])
                  (root/"vqe8.expected").write_bytes(expected.read_bytes())
                  Path("codspeed-general.generated.yml").write_text("\n".join(config)+"\n")
                  case["simulation"]="ADMITTED"
                  sim=True
              else:
                  case["simulation"]="NOT_ADMITTED_NATIVE_LIMIT"
              with open(os.environ["GITHUB_OUTPUT"],"a") as stream:
                  stream.write("simulation="+str(sim).lower()+"\n")
          save()
          print({"descendant-units":"DESCENDANT_UNITS_FINAL","inplace-scan":"INPLACE_SCAN_FINAL","inplace-branch":"INPLACE_BRANCH_FINAL","move-components":"MOVE_COMPONENTS_FINAL","borrowed-cache":"BORROWED_CACHE_FINAL","general-cumulative":"GENERAL_CUMULATIVE_NATIVE_FINAL","general-simulation-repair":"GENERAL_SHORT_NATIVE_FINAL"}[experiment],json.dumps(report),flush=True)
          PY
      - name: Compare bounded general solver Simulation and flamegraphs
        if: steps.general-native.outputs.simulation == 'true'
        uses: CodSpeedHQ/action@v5
        timeout-minutes: 4
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          config: codspeed-general.generated.yml
      - name: Verify simulated counts
        if: steps.general-native.outputs.simulation == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".descendant-evidence")
          report=json.loads((root/"report.json").read_text())
          assert report["experiment"] in ("general-cumulative","general-simulation-repair")
          for name in report.get("simulation_cases",["vqe8"]):
              for arm in ("scan","borrowed"):
                  assert (root/f"{name}-{arm}.simulation.stdout").read_bytes()==(root/f"{name}.expected").read_bytes()
              report["cases"][name]["simulation"]="COUNT_PARITY_PASS"
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("GENERAL_SHORT_SIMULATION_FINAL" if report["experiment"]=="general-simulation-repair" else "GENERAL_CUMULATIVE_SIMULATION_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-${{ env.EXPERIMENT }}
          path: |
            .descendant-evidence/
            codspeed-general.generated.yml
          include-hidden-files: true
          if-no-files-found: warn

  general-native-gpmc:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'general-native-gpmc'
    name: Source-locked long native GPMC / auto route
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 5d74b2649639db3372fcc5ea5155ed0a50233fea
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rawmocs-quprs-planner-q*
          run-id: 45733766561
          github-token: ${{ github.token }}
          path: .long-input
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .classes-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Build source-pinned native binaries
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = 5d74b2649639db3372fcc5ea5155ed0a50233fea
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev m4 make gcc time pkg-config
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
      - name: Compare witnessed long native source cohorts
        run: |
          set -euo pipefail
          mkdir -p .long-evidence
          python3 - <<'PY'
          import hashlib, json, os, re, statistics, subprocess, sys, time
          from pathlib import Path
          root=Path(".long-evidence").resolve()
          raw=Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          gpmc=Path(".gpmc/build/gpmc").resolve()
          sys.path.insert(0,str(Path(".classes-candidate/crates/rawmocs-cli/tools").resolve()))
          from release_native_paired import parse
          from release_transfer import check_count
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          flags=["RAWMOCS_RESEARCH_INPLACE_SCAN","RAWMOCS_RESEARCH_INPLACE_BRANCH","RAWMOCS_RESEARCH_MOVE_COMPONENTS","RAWMOCS_RESEARCH_BORROWED_CACHE"]
          report={"status":"RUNNING","scope":"Native auto route, not forced-general speedup","bits":100,"digits":30,"limit_s":45,"as_bytes":3221225472,"binary_sha256":{"raw":digest(raw),"gpmc":digest(gpmc)},"candidate_sha":"5d74b2649639db3372fcc5ea5155ed0a50233fea","gpmc_sha":"89bbc89d0de918e7a5385740355df55765039230","cases":{}}
          def save(): (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          for name,sha in (("qft20","29fea8d65f63dd282cc740e8cac5439b071f618780b04541e4412bfbd39462c5"),("qnn8","24dbcd5b6f270fd39f92b739e55446da7c14e7e2c28ed5032b70cf34bc0f786c")):
              src=Path(".long-input")/("rawmocs-quprs-planner-"+name)
              cnf,=src.rglob("gpmc-capture.cnf")
              witness,=src.rglob("witness.json")
              ref=json.loads(witness.read_text())
              assert digest(cnf)==ref["source_sha256"]==sha and ref["bits"]==550
              assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE")
              assert ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
              if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":
                  assert ref["order_policy"] in ("fill-reverse","degree-reverse")
              case={"source_sha256":sha,"witness_sha256":digest(witness),"rows":[]}
              report["cases"][name]=case
              for i,arm in enumerate(("gpmc","off","on","on","off","gpmc")):
                  if i>=3 and any(r["status"]!="WITNESSED_PASS" for r in case["rows"]): break
                  env={k:v for k,v in os.environ.items() if not k.startswith("RAWMOCS_RESEARCH_")}
                  if arm=="on": env.update({k:"1" for k in flags})
                  cmd=[str(gpmc),"-mode=1","-prec=30",str(cnf.resolve())] if arm=="gpmc" else [str(raw),"--digits","30","--timeout-ms","45000",str(cnf.resolve())]
                  label=f"{name}-{i}-{arm}"
                  rss=root/(label+".rss")
                  start=time.monotonic()
                  p=subprocess.run(["timeout","-k","2s","45s","prlimit","--as=3221225472","--","/usr/bin/time","-f","%M","-o",str(rss),*cmd],env=env,capture_output=True,text=True,timeout=52)
                  row={"arm":arm,"exit":p.returncode,"wall_s":time.monotonic()-start}
                  case["rows"].append(row)
                  (root/(label+".stdout")).write_text(p.stdout)
                  (root/(label+".stderr")).write_text(p.stderr)
                  if rss.exists():
                      vals=[s for s in rss.read_text().splitlines() if s.strip().isdigit()]
                      if len(vals)==1: row["rss_kib"]=int(vals[0])
                  if p.returncode:
                      row["status"]="CENSORED_TIMEOUT" if p.returncode==124 or (arm!="gpmc" and p.returncode==4 and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr) else "EXECUTION_ERROR"
                      save()
                      assert row["status"]=="CENSORED_TIMEOUT",(label,p.returncode,p.stderr[-1000:])
                  else:
                      row.update(parse(p.stdout,"gpmc" if arm=="gpmc" else "rawmocs"))
                      if arm=="gpmc":
                          assert re.findall(r"^c o precision (\d+)\s*$",p.stdout,re.M)==["30"]
                      else:
                          route,=re.findall(r"^RAWMOCS_COMPLETE route=(\w+) digits=30 bits=100 ",p.stderr,re.M)
                          row["route"]=route
                      row["witness_upper"]=check_count(row,ref,30)
                      row["stdout_sha256"]=hashlib.sha256(p.stdout.encode()).hexdigest()
                      row["status"]="WITNESSED_PASS"
                      save()
                  print("GENERAL_GPMC_ROW",name,arm,row["status"],row["wall_s"],flush=True)
              rows=case["rows"]
              if len(rows)==6 and all(r["status"]=="WITNESSED_PASS" for r in rows):
                  assert len({r["sat"] for r in rows})==1
                  assert len({r["stdout_sha256"] for r in rows if r["arm"]!="gpmc"})==1
                  assert len({r["route"] for r in rows if r["arm"]!="gpmc"})==1
                  med={a:statistics.median(r["wall_s"] for r in rows if r["arm"]==a) for a in ("gpmc","off","on")}
                  case.update(status="TWO_MATCHED_TRIPLES_PASS",median_s=med,gpmc_over_on=med["gpmc"]/med["on"],off_over_on=med["off"]/med["on"])
              else: case["status"]="CENSORED_NO_RATIO"
              save()
          report["status"]="NATIVE_DIAGNOSTIC_COMPLETE"
          save()
          print("GENERAL_GPMC_NATIVE_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-general-native-gpmc
          path: .long-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  scope-scratch:
    if: github.event_name == 'push' || inputs.suite == 'scope-scratch'
    name: Scope-reset scratch / same-binary general fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 8edf491a294c2d8bb09486156a8d91b39e4010cd
          path: .classes-candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rawmocs-quprs-planner-gen-*
          run-id: 45734596083
          github-token: ${{ github.token }}
          path: .scratch-input
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .classes-candidate/crates/rawmocs-cli -> target
          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Build and test exact candidate
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = 8edf491a294c2d8bb09486156a8d91b39e4010cd
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          cargo test --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Source locked exact parity and bounded native ablation
        run: |
          set -euo pipefail
          mkdir -p .scratch-evidence
          python3 - <<'PY'
          import hashlib, json, os, re, statistics, subprocess, sys, time
          from pathlib import Path
          root=Path(".scratch-evidence").resolve()
          solver=Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          sys.path.insert(0,str(Path(".classes-candidate/crates/rawmocs-cli/tools").resolve()))
          from release_native_paired import parse
          from release_transfer import check_count
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          report={"candidate_sha":"8edf491a294c2d8bb09486156a8d91b39e4010cd","binary_sha256":digest(solver),"scope":"Forced general; identical production ownership optimizations; only scratch reuse differs","cases":{}}
          def save(): (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          for name,sha,digits,limit in (
              ("vqe8","55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee",30,5),
              ("vqe8","55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee",130,8),
              ("qpeinexact20","9dca661e1a9cfecbfe325970cded1bcb5c3664f7983fa1628473bd42f2ba3fcb",30,5),
              ("qaoa9","9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4",30,15),
              ("qnn12","2c74e555a8a8ea974cde02bcc5cc0823c5ed63b5fc7be8f628f777accd433204",30,15)):
              src=Path(".scratch-input")/("rawmocs-quprs-planner-gen-"+name)
              cnf,=src.rglob("gpmc-capture.cnf")
              assert digest(cnf)==sha
              ref=None
              witnesses=list(src.rglob("witness.json"))
              if witnesses:
                  assert len(witnesses)==1
                  obj=json.loads(witnesses[0].read_text())
                  if obj.get("status") in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE"):
                      assert obj["source_sha256"]==sha and obj["bits"]==550 and obj["width"]<=19 and obj["work"]<=40000000 and obj["peak"]<=2000000
                      if obj["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":
                          assert obj["order_policy"] in ("fill-reverse","degree-reverse")
                      ref=obj
              if name!="qnn12": assert ref is not None
              key=f"{name}-{digits}"
              case={"source_sha256":sha,"digits":digits,"limit_s":limit,"rows":[]}
              report["cases"][key]=case
              for i,arm in enumerate(("off","on","on","off")):
                  if i>=2 and any(r["status"]!="WITNESSED_PASS" for r in case["rows"]): break
                  env={k:v for k,v in os.environ.items() if not k.startswith("RAWMOCS_RESEARCH_")}
                  if arm=="on": env["RAWMOCS_RESEARCH_SCOPE_SCRATCH"]="1"
                  label=f"{key}-{i}-{arm}"
                  rss=root/(label+".rss")
                  start=time.monotonic()
                  p=subprocess.run(["timeout","-k","2s",str(limit+3)+"s","prlimit","--as=3221225472","--","/usr/bin/time","-f","%M","-o",str(rss),str(solver),"--digits",str(digits),"--solver","general","--timeout-ms",str(limit*1000),str(cnf.resolve())],env=env,capture_output=True,text=True,timeout=limit+7)
                  row={"arm":arm,"exit":p.returncode,"wall_s":time.monotonic()-start}
                  case["rows"].append(row)
                  (root/(label+".stdout")).write_text(p.stdout)
                  (root/(label+".stderr")).write_text(p.stderr)
                  if rss.exists():
                      vals=[l for l in rss.read_text().splitlines() if l.strip().isdigit()]
                      if len(vals)==1: row["rss_kib"]=int(vals[0])
                  if p.returncode:
                      assert not p.stdout.strip() and (p.returncode==124 or (p.returncode==4 and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr)),(label,p.returncode,p.stderr[-1000:])
                      row["status"]="CENSORED_TIMEOUT"
                  else:
                      bits={30:100,130:432}[digits]
                      assert f"RAWMOCS_COMPLETE route=general digits={digits} bits={bits} " in p.stderr
                      frames,=re.findall(r"^RAWMOCS_GENERAL_COMPLETE max_frames=(\d+)$",p.stderr,re.M)
                      row.update(parse(p.stdout,"rawmocs"),frames=int(frames),stdout_sha256=hashlib.sha256(p.stdout.encode()).hexdigest())
                      row["status"]="COUNT_UNWITNESSED"
                      if ref is not None:
                          row["witness_upper"]=check_count(row,ref,digits)
                          row["status"]="WITNESSED_PASS"
                  save()
              rows=case["rows"]
              completed=[r for r in rows if r["exit"]==0]
              if completed:
                  assert len({r["stdout_sha256"] for r in completed})==1 and len({r["frames"] for r in completed})==1
              if name in ("vqe8","qpeinexact20"):
                  assert len(rows)==4 and all(r["status"]=="WITNESSED_PASS" for r in rows)
              if len(rows)==4 and all(r["status"]=="WITNESSED_PASS" for r in rows):
                  case["status"]="PAIRED_WITNESS_PASS"
                  case["median_s"]={a:statistics.median(r["wall_s"] for r in rows if r["arm"]==a) for a in ("off","on")}
              else:
                  case["status"]="CENSORED_OR_UNWITNESSED_NO_RATIO"
              save()
          report["status"]="BOUNDED_DIAGNOSTIC_COMPLETE"
          save()
          print("SCOPE_SCRATCH_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-scope-scratch
          path: .scratch-evidence/
          include-hidden-files: true
          if-no-files-found: warn
