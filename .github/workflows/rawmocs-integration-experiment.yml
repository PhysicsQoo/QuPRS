  historical-gap-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'historical-gap-baseline'
    name: Historical weak case / v0.1.1 vs GPMC / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        case: [feynman_hwb6, feynman_mod_mult_55]
    steps:
      - uses: actions/checkout@v4
        with:
