                      row["status"]="FIXED_PREFIX_COMPLETE"
                  else:
                      assert p.returncode==4 and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr,row
                      row["status"]="CENSORED_TIMEOUT"
                  save()
              rows=case["rows"]
              if all(r["status"]=="FIXED_PREFIX_COMPLETE" for r in rows):
                  assert len({r["fingerprint"] for r in rows})==1,(key,rows)
                  for k in ("nodes","branches","splits","hits"):
                      assert len({r["stats"][k] for r in rows})==1,(key,k,rows)
                  if name=="wstate16":
                      assert all(r["stats"]["descendant_index_complete"]>0 for r in rows if r["arm"]=="on")
                  case["status"]="MATCHED_PREFIX_PASS"
                  case["median_s"]={a:statistics.median(r["wall_s"] for r in rows if r["arm"]==a) for a in ("off","on")}
              else:
                  case["status"]="CENSORED_NO_RATIO"
              save()
          report["status"]="FIXED_WORK_DIAGNOSTIC_COMPLETE"
          save()
          print("FIXED_DESC_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
