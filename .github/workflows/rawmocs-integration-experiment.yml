name: Experimental RaWMoCS integration
on:
  push:
    branches: [experiment/rawmocs-integration]
    paths:
      - 'research/rawmocs_integration/**'
      - '.github/workflows/rawmocs-integration-experiment.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Experimental evidence suite
        type: choice
        options: [legacy, cross-family, source-admission, root-profile, factor-classes, sparse-anchor, prefix-memo, axis-profile, direct-binary, operand-profile, pool-profile, last-use-donor, masked-donor, descendant-units, inplace-scan, inplace-branch, move-components, borrowed-cache, general-cumulative, general-simulation-repair, general-native-gpmc, scope-scratch]
        default: legacy
permissions:
  contents: read
  actions: read
concurrency:
  group: rawmocs-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comparison:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'legacy' || inputs.suite == 'cross-family')
    name: QuPRS / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.suite == 'legacy' && '["e2e","qpeinexact22-432","grover6-432","gf2-7-333","fallback","qft16-memory","qft20","qft22","qpeinexact20","grover6","qaoa9","vqe8","qnn8","wstate8","qft20-negative","planner-qft16","planner-qft22","planner-qft20","planner-qnn8"]' || '["planner-gen-qaoa9","planner-gen-vqe8","planner-gen-wstate16","planner-gen-qpeexact16","planner-gen-qpeinexact20","planner-gen-grover5","planner-gen-qwalk4","planner-gen-graphstate16","planner-gen-ghz32","planner-gen-qnn12","planner-gen-fallback"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: ef8d1ee606bed672ee9be62d189a2b3fbcc905a0
          path: .rawmocs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/GPMC
          ref: 89bbc89d0de918e7a5385740355df55765039230
          path: .gpmc
          persist-credentials: false
      - uses: actions/checkout@v4
        if: startsWith(matrix.case, 'planner-')
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 056b5d5ad0fc1fc336c78863bbb5983984e2c130
          path: .rawmocs-candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .rawmocs/crates/rawmocs-cli -> target
            rust -> target
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev libmpfr-dev zlib1g-dev m4 make gcc time pkg-config
          python -m pip install numpy sympy symengine 'qiskit==2.6.1' qiskit-qasm3-import psutil
      - name: Build pinned solvers
        run: |
          set -euo pipefail
          test "$(git -C .rawmocs rev-parse HEAD)" = ef8d1ee606bed672ee9be62d189a2b3fbcc905a0
          test "$(git -C .gpmc rev-parse HEAD)" = 89bbc89d0de918e7a5385740355df55765039230
          cargo build --locked --release --manifest-path .rawmocs/crates/rawmocs-cli/Cargo.toml
          cmake -S .gpmc -B .gpmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .gpmc/build --target gpmc-bin --parallel 2
          .rawmocs/crates/rawmocs-cli/target/release/rawmocs --version
      - name: Build current QuPRS source exporter
        if: contains(fromJSON('["qpeinexact22-432","grover6-432","gf2-7-333"]'), matrix.case)
        run: |
          set -euo pipefail
          bridge=.rawmocs/crates/rawmocs-cli/tools/repro/quprs_long_tail_source_bridge.rs
          test "$(git hash-object "$bridge")" = fc32f4e8b0a2f34386b86e08ddf147469275c245
          cp "$bridge" rust/quprs/examples/
          cargo build --locked --release --no-default-features --manifest-path rust/Cargo.toml -p quprs --example quprs_long_tail_source_bridge
      - name: Run scoped boundary conformance and comparison
        if: contains(fromJSON('["e2e","qpeinexact22-432","grover6-432","gf2-7-333"]'), matrix.case)
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs/crates/rawmocs-cli/tools
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .integration-evidence
          python -m pip freeze > .integration-evidence/dependencies.txt
          git rev-parse HEAD > .integration-evidence/quprs-revision.txt
          git -C .rawmocs rev-parse HEAD > .integration-evidence/rawmocs-revision.txt
          git -C .gpmc rev-parse HEAD > .integration-evidence/gpmc-revision.txt
          if [ "$CASE" = e2e ]; then
            python .rawmocs/crates/rawmocs-cli/tools/quprs_python_integration.py --bin .rawmocs/crates/rawmocs-cli/target/release/rawmocs --out .integration-evidence/conformance
          fi
          python research/rawmocs_integration/compare.py \
            --case "$CASE" \
            --raw .rawmocs/crates/rawmocs-cli/target/release/rawmocs \
            --gpmc .gpmc/build/gpmc \
            --exporter rust/target/release/examples/quprs_long_tail_source_bridge \
            --oracle .rawmocs/crates/rawmocs-cli/tools/repro \
            --out .integration-evidence/comparison
      - name: Build and test experimental planner candidate
        if: startsWith(matrix.case, 'planner-')
        run: |
          set -euo pipefail
          test "$(git -C .rawmocs-candidate rev-parse HEAD)" = 056b5d5ad0fc1fc336c78863bbb5983984e2c130
          cargo test --locked --release --manifest-path .rawmocs-candidate/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .rawmocs-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Build expanded native cohort verifier
        if: "!contains(fromJSON('[\"e2e\",\"qpeinexact22-432\",\"grover6-432\",\"gf2-7-333\",\"fallback\"]'), matrix.case)"
        env:
          QUPRS_SOLVER_PROVISION: external
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --example rawmocs_cohort
      - name: Run expanded cohort or exact fallback controls
        if: "!startsWith(matrix.case, 'planner-') && !contains(fromJSON('[\"e2e\",\"qpeinexact22-432\",\"grover6-432\",\"gf2-7-333\"]'), matrix.case)"
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs/crates/rawmocs-cli/tools
          CASE: ${{ matrix.case }}
        run: |
          mkdir -p .integration-evidence
          git rev-parse HEAD > .integration-evidence/quprs-revision.txt
          git -C .rawmocs rev-parse HEAD > .integration-evidence/rawmocs-revision.txt
          git -C .gpmc rev-parse HEAD > .integration-evidence/gpmc-revision.txt
          python research/rawmocs_integration/expanded_cohort.py --case "$CASE" \
            --raw .rawmocs/crates/rawmocs-cli/target/release/rawmocs --gpmc .gpmc/build/gpmc \
            --bin rust/target/release/examples/rawmocs_cohort --oracle .rawmocs/crates/rawmocs-cli/tools/repro --out .integration-evidence/expanded
      - name: Run matched planner and memory ablation
        if: startsWith(matrix.case, 'planner-') && !startsWith(matrix.case, 'planner-gen-')
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs/crates/rawmocs-cli/tools
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .integration-evidence
          git rev-parse HEAD > .integration-evidence/quprs-revision.txt
          git -C .rawmocs rev-parse HEAD > .integration-evidence/rawmocs-revision.txt
          git -C .rawmocs-candidate rev-parse HEAD > .integration-evidence/candidate-revision.txt
          git -C .gpmc rev-parse HEAD > .integration-evidence/gpmc-revision.txt
          N="${CASE#planner-qft}"
          if [ "$CASE" = planner-qnn8 ]; then N=8; fi
          python research/rawmocs_integration/planner_ablation.py --n "$N" \
            --raw .rawmocs/crates/rawmocs-cli/target/release/rawmocs \
            --candidate .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs \
            --gpmc .gpmc/build/gpmc --bin rust/target/release/examples/rawmocs_cohort \
            --oracle .rawmocs/crates/rawmocs-cli/tools/repro --out .integration-evidence/ablation
      - name: Evaluate frozen candidate across circuit families and fallback
        if: startsWith(matrix.case, 'planner-gen-')
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/.rawmocs/crates/rawmocs-cli/tools
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .integration-evidence
          git rev-parse HEAD > .integration-evidence/quprs-revision.txt
          git -C .rawmocs rev-parse HEAD > .integration-evidence/rawmocs-revision.txt
          git -C .rawmocs-candidate rev-parse HEAD > .integration-evidence/candidate-revision.txt
          git -C .gpmc rev-parse HEAD > .integration-evidence/gpmc-revision.txt
          python research/rawmocs_integration/cross_family.py --case "${CASE#planner-gen-}" \
            --raw .rawmocs/crates/rawmocs-cli/target/release/rawmocs \
            --candidate .rawmocs-candidate/crates/rawmocs-cli/target/release/rawmocs \
            --gpmc .gpmc/build/gpmc --bin rust/target/release/examples/rawmocs_cohort \
            --oracle .rawmocs/crates/rawmocs-cli/tools/repro --out .integration-evidence/cross-family
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-quprs-${{ matrix.case }}
          path: .integration-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  source-admission:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'source-admission'
    name: Source-locked Wstate16 admission replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: ef8d1ee606bed672ee9be62d189a2b3fbcc905a0
          path: .rawmocs-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 40e3e3e26821d37820130492177743b9db08670b
          path: .rawmocs-admission
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rawmocs-quprs-planner-gen-wstate16
          run-id: 45734596083
          github-token: ${{ github.token }}
          path: .source-admission-input
      - name: Build exact baseline and admission candidate
        run: |
          set -euo pipefail
          test "$(git -C .rawmocs-base rev-parse HEAD)" = ef8d1ee606bed672ee9be62d189a2b3fbcc905a0
          test "$(git -C .rawmocs-admission rev-parse HEAD)" = 40e3e3e26821d37820130492177743b9db08670b
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          cargo build --locked --release --manifest-path .rawmocs-base/crates/rawmocs-cli/Cargo.toml
          cargo test --locked --release --manifest-path .rawmocs-admission/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .rawmocs-admission/crates/rawmocs-cli/Cargo.toml
      - name: Profile original residual and replay bounded source admission
        run: |
          set -euo pipefail
          mkdir -p .source-admission-evidence
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          root = Path(".source-admission-evidence").resolve()
          cnf, = Path(".source-admission-input").rglob("gpmc-capture.cnf")
          cnf = cnf.resolve()
          raw = cnf.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          assert sha == "d7b8732b06552354e7e08e516fd858d2f9419b33ccb185e6d8c31ce96d5ba78c"
          lines = [line for line in raw.splitlines() if line.strip()]
          header = lines[0].split()
          assert header[:2] == [b"p", b"cnf"] and len(header) == 4
          assert lines[1].strip() == b"c t wmc"
          clauses = [line.split() for line in lines[2:] if not line.lstrip().startswith(b"c")]
          weights = [line.split() for line in lines[2:] if line.lstrip().startswith(b"c")]
          assert len(clauses) == int(header[3])
          assert all(row[-1] == b"0" for row in clauses)
          report = {
              "status": "RUNNING", "source_run": 45734596083,
              "source_artifact": 15078696784, "source_sha256": sha,
              "baseline_sha": "ef8d1ee606bed672ee9be62d189a2b3fbcc905a0",
              "candidate_sha": "40e3e3e26821d37820130492177743b9db08670b",
              "source_bytes": len(raw), "variables": int(header[2]),
              "clauses": len(clauses), "weight_records": len(weights),
              "literal_items": sum(len(row)-1 for row in clauses),
              "max_clause_width": max(map(lambda row: len(row)-1, clauses), default=0),
              "max_nonempty_line_bytes": max(map(len, lines)),
              "max_weight_token_bytes": max((len(t) for row in weights for t in row), default=0),
              "limit_s": 90, "address_space_bytes": 3221225472, "bits": 100,
              "prior_gpmc_status": "CENSORED_TIMEOUT",
              "comparison_scope": "source admission only; no speedup claim",
              "rows": [],
          }
          del raw, lines, clauses, weights
          def persist():
              (root / "report.json").write_text(json.dumps(report, indent=2) + "\n")
          persist()
          def trial(name, binary, extra):
              rss = root / (name + ".rss")
              cmd = ["timeout", "-k", "2s", "95s", "prlimit", "--as=3221225472", "--",
                     "/usr/bin/time", "-f", "%M", "-o", str(rss), str(binary),
                     "--digits", "30", "--timeout-ms", "90000", *extra, str(cnf)]
              start = time.monotonic()
              proc = subprocess.run(cmd, capture_output=True, text=True, timeout=100)
              (root / (name + ".stdout")).write_text(proc.stdout)
              (root / (name + ".stderr")).write_text(proc.stderr)
              row = {"arm": name, "exit": proc.returncode, "wall_s": time.monotonic()-start,
                     "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
                     "stderr_tail": proc.stderr[-4000:], "empty_stdout": not proc.stdout.strip()}
              if rss.exists():
                  row["rss_raw"] = rss.read_text()
              if proc.returncode == 0:
                  out = proc.stdout.splitlines()
                  assert len(out) == 2 and out[0] in ("s SATISFIABLE", "s UNSATISFIABLE")
                  fields = out[1].split()
                  assert fields[:3] == ["c", "r", "mpfr"] and len(fields) == 5
                  row.update(status="COMPLETED_UNWITNESSED", sat=out[0]=="s SATISFIABLE",
                             real=fields[3], imag=fields[4])
              else:
                  assert not proc.stdout.strip(), row
                  reason = re.search(r"RAWMOCS_FAILURE kind=(\w+): (.*)", proc.stderr)
                  row["status"] = reason.group(1) if reason else "WATCHDOG_OR_PROCESS_ERROR"
                  row["reason"] = reason.group(2) if reason else ""
              report["rows"].append(row)
              persist()
              return row
          base = Path(".rawmocs-base/crates/rawmocs-cli/target/release/rawmocs").resolve()
          candidate = Path(".rawmocs-admission/crates/rawmocs-cli/target/release/rawmocs").resolve()
          b = trial("release-default", base, [])
          d = trial("candidate-default", candidate, [])
          assert b["exit"] == d["exit"] == 5 and b["reason"] == d["reason"] == "source bytes cap", report
          x = trial("candidate-explicit", candidate, ["--max-source-bytes", "16000000"])
          assert x["exit"] in (0, 4, 5, 6, 124), x
          if x["exit"] == 0:
              tools = Path(".rawmocs-base/crates/rawmocs-cli/tools").resolve()
              sys.path.insert(0, str(tools))
              from release_transfer import check_count
              report["witness"] = {"status": "UNAVAILABLE", "attempts": []}
              for script in ("original_exact_prejoin.py", "original_fixed_interval.py"):
                  cmd = ["timeout", "-k", "2s", "120s", "prlimit", "--as=3221225472", "--",
                         sys.executable, str(tools / "repro" / script), str(cnf), sha]
                  ref = subprocess.run(cmd, capture_output=True, text=True, timeout=125)
                  (root / (script + ".stdout")).write_text(ref.stdout)
                  (root / (script + ".stderr")).write_text(ref.stderr)
                  report["witness"]["attempts"].append({"script": script, "exit": ref.returncode})
                  persist()
                  if ref.returncode != 0:
                      continue
                  receipt = json.loads(ref.stdout)
                  assert receipt["source_sha256"] == sha and receipt["bits"] == 550
                  assert receipt["width"] <= 19 and receipt["work"] <= 40000000 and receipt["peak"] <= 2000000
                  assert receipt["status"] in ("INDEPENDENT_INTERVAL_COMPLETE", "INDEPENDENT_FIXED_INTERVAL_COMPLETE")
                  report["witness"]["relative_upper"] = check_count(x, receipt, 30)
                  report["witness"]["status"] = "PASS"
                  break
              report["status"] = "WITNESSED_COUNT" if report["witness"]["status"] == "PASS" else "COMPLETED_UNWITNESSED"
          else:
              report["status"] = "BOUNDED_INCONCLUSIVE"
          persist()
          print("SOURCE_ADMISSION_FINAL", json.dumps(report), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-wstate16-source-admission
          path: .source-admission-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  root-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'root-profile'
    name: Root structure / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: wstate16
            sha: d7b8732b06552354e7e08e516fd858d2f9419b33ccb185e6d8c31ce96d5ba78c
          - case: qnn12
            sha: 2c74e555a8a8ea974cde02bcc5cc0823c5ed63b5fc7be8f628f777accd433204
          - case: qaoa9
            sha: 9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4
          - case: vqe8
            sha: 55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rawmocs-quprs-planner-gen-${{ matrix.case }}
          run-id: 45734596083
          github-token: ${{ github.token }}
          path: .root-profile-input
      - name: Source-locked structural profile (not a count)
        env:
          CASE: ${{ matrix.case }}
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          mkdir -p .root-profile-evidence
          timeout -k 2s 90s prlimit --as=3221225472 -- python - <<'PY'
          import hashlib
          import heapq
          import json
          import os
          from collections import Counter
          from pathlib import Path
          cnf, = Path(".root-profile-input").rglob("gpmc-capture.cnf")
          raw = cnf.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          assert sha == os.environ["SOURCE_SHA"]
          lines = iter(line.split() for line in raw.splitlines() if line.strip())
          p, kind, nv, nc = next(lines)
          assert (p, kind) == (b"p", b"cnf")
          n, declared = int(nv), int(nc)
          assert next(lines) == [b"c", b"t", b"wmc"]
          original, seen, weights, tautologies = 0, set(), 0, 0
          for row in lines:
              if row[0] == b"c":
                  assert row[1:3] == [b"p", b"weight"]
                  weights += 1
                  continue
              assert row[-1] == b"0"
              original += 1
              c = tuple(sorted(set(map(int, row[:-1]))))
              assert all(0 < abs(v) <= n for v in c)
              if any(-v in c for v in c):
                  tautologies += 1
              else:
                  seen.add(c)
          assert original == declared
          clauses = sorted(seen)
          del seen, raw
          def slot(v):
              return 2*(abs(v)-1) + int(v < 0)
          occ = [[] for _ in range(2*n)]
          lengths = list(map(len, clauses))
          initial_units = lengths.count(1)
          heap = [i for i, size in enumerate(lengths) if size == 1]
          heapq.heapify(heap)
          for i, c in enumerate(clauses):
              for lit in c:
                  occ[slot(lit)].append(i)
          assigned = [0]*(n+1)
          forced, touches, scan_clause_visits = 0, 0, 0
          live = len(clauses)
          conflict = 0 in lengths
          while heap and not conflict:
              i = heapq.heappop(heap)
              if lengths[i] != 1:
                  continue
              lit, = (v for v in clauses[i] if not assigned[abs(v)])
              assigned[abs(lit)] = 1 if lit > 0 else -1
              forced += 1
              scan_clause_visits += live
              for j in occ[slot(lit)]:
                  touches += 1
                  if lengths[j] >= 0:
                      live -= 1
                      lengths[j] = -1
              for j in occ[slot(-lit)]:
                  touches += 1
                  if lengths[j] < 0:
                      continue
                  lengths[j] -= 1
                  if lengths[j] == 0:
                      conflict = True
                  elif lengths[j] == 1:
                      heapq.heappush(heap, j)
          report = {
              "case": os.environ["CASE"], "source_sha256": sha,
              "status": "STRUCTURAL_PROFILE_ONLY", "variables": n,
              "source_clauses": declared, "weight_records": weights,
              "normalized_clauses": len(clauses), "tautologies": tautologies,
              "duplicate_clauses": declared-tautologies-len(clauses),
              "initial_units": initial_units, "forced": forced,
              "occurrence_touches": touches, "scan_assign_clause_visits_lower_bound": scan_clause_visits,
              "root_conflict": conflict,
          }
          if not conflict:
              parent = list(range(n+1))
              active = set()
              def root(v):
                  while parent[v] != v:
                      parent[v] = parent[parent[v]]
                      v = parent[v]
                  return v
              count, lits, width = 0, 0, 0
              for i, c in enumerate(clauses):
                  if lengths[i] < 0:
                      continue
                  rem = [abs(v) for v in c if not assigned[abs(v)]]
                  assert len(rem) == lengths[i] and len(rem) >= 2
                  active.update(rem)
                  count += 1
                  lits += len(rem)
                  width = max(width, len(rem))
                  first = root(rem[0])
                  for v in rem[1:]:
                      parent[root(v)] = first
              sizes = Counter(root(v) for v in active)
              report.update(residual_clauses=count, residual_literals=lits,
                            residual_max_clause_width=width, active_variables=len(active),
                            free_variables=n-forced-len(active), components=len(sizes),
                            largest_component=max(sizes.values(), default=0))
          Path(".root-profile-evidence/profile.json").write_text(json.dumps(report, indent=2)+"\n")
          print("ROOT_PROFILE_FINAL", json.dumps(report), flush=True)
          PY
      - uses: actions/checkout@v4
        if: matrix.case == 'qaoa9' || matrix.case == 'vqe8'
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: e99bb8fce774f3b21e1a0b61b2a81e6efdac288d
          path: .indexed-root
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.case == 'qaoa9' || matrix.case == 'vqe8'
      - name: Build candidate and run bounded paired general controls
        if: matrix.case == 'qaoa9' || matrix.case == 'vqe8'
        run: |
          set -euo pipefail
          test "$(git -C .indexed-root rev-parse HEAD)" = e99bb8fce774f3b21e1a0b61b2a81e6efdac288d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          cargo test --locked --release --manifest-path .indexed-root/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .indexed-root/crates/rawmocs-cli/Cargo.toml
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import time
          from fractions import Fraction
          from pathlib import Path
          root = Path(".root-profile-evidence")
          source, = Path(".root-profile-input").rglob("gpmc-capture.cnf")
          profile = json.loads((root / "profile.json").read_text())
          assert hashlib.sha256(source.read_bytes()).hexdigest() == profile["source_sha256"]
          binary = Path(".indexed-root/crates/rawmocs-cli/target/release/rawmocs")
          chain = root / "chain.cnf"
          chain.write_text("p cnf 2048 2048\nc t wmc\nc p weight 1 -0.5 0.25 0\n1 0\n" +
                           "".join(f"-{i} {i+1} 0\n" for i in range(1,2048)))
          report = {"candidate": "e99bb8fce774f3b21e1a0b61b2a81e6efdac288d",
                    "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
                    "bits": 100, "rows": [], "source_sha256": profile["source_sha256"]}
          def persist():
              (root / "native.json").write_text(json.dumps(report, indent=2)+"\n")
          def trial(case, path, arm, index):
              env = os.environ.copy()
              env.pop("RAWMOCS_RESEARCH_INDEXED_ROOT", None)
              if arm == "indexed":
                  env["RAWMOCS_RESEARCH_INDEXED_ROOT"] = "1"
              label = f"{case}-{arm}-{index}"
              rss = root / (label+".rss")
              cmd = ["timeout", "-k", "2s", "95s", "prlimit", "--as=3221225472", "--",
                     "/usr/bin/time", "-f", "%M", "-o", str(rss), str(binary),
                     "--digits", "30", "--solver", "general", "--timeout-ms", "90000", str(path)]
              t = time.monotonic()
              p = subprocess.run(cmd, env=env, capture_output=True, text=True, timeout=100)
              row = {"case":case, "arm":arm, "exit":p.returncode, "wall_s":time.monotonic()-t,
                     "stderr_tail":p.stderr[-2000:]}
              if rss.exists():
                  row["rss_raw"] = rss.read_text()
              (root / (label+".stdout")).write_text(p.stdout)
              (root / (label+".stderr")).write_text(p.stderr)
              if p.returncode == 0:
                  sat, count = p.stdout.splitlines()
                  f = count.split()
                  assert sat in ("s SATISFIABLE", "s UNSATISFIABLE") and f[:3] == ["c","r","mpfr"] and len(f)==5
                  row.update(status="COMPLETED", sat=sat, real=f[3], imag=f[4])
              else:
                  assert not p.stdout.strip() and p.returncode in (4,124), row
                  row["status"] = "CENSORED_TIMEOUT"
              report["rows"].append(row)
              persist()
              return row
          def value(row):
              return row["sat"], Fraction(row["real"]), Fraction(row["imag"])
          for case, path in (("chain", chain), ("original", source)):
              a = trial(case, path, "scan", 0)
              b = trial(case, path, "indexed", 1)
              if case == "chain":
                  assert a["status"] == b["status"] == "COMPLETED"
                  assert value(a) == value(b) == ("s SATISFIABLE", Fraction(-1,2), Fraction(1,4))
              if a["status"] == b["status"] == "COMPLETED":
                  c = trial(case, path, "indexed", 2)
                  d = trial(case, path, "scan", 3)
                  assert c["status"] == d["status"] == "COMPLETED"
                  assert value(a) == value(b) == value(c) == value(d)
          report["status"] = "NATIVE_DIAGNOSTIC_COMPLETE"
          persist()
          print("ROOT_NATIVE_FINAL", json.dumps(report), flush=True)
          PY
