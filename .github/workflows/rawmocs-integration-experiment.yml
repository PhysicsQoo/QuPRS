                      row["route"]=route
                  row["witness_upper"]=check_count(row,ref,target)
                  row["stdout_sha256"]=hashlib.sha256(p.stdout.encode()).hexdigest()
                  row["status"]="WITNESSED_PASS"
                  save()
              print("LONG_CANDIDATE_ROW",label,arm,row["status"],row["wall_s"],flush=True)
          rows=report["rows"]
          if len(rows)==6 and all(r["status"]=="WITNESSED_PASS" for r in rows):
