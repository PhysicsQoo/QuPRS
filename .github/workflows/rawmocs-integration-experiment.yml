              else:
                  row.update(parse(p.stdout,"gpmc" if arm=="gpmc" else "rawmocs"))
                  if arm=="gpmc": assert re.findall(r"^c o precision (\d+)\s*$",p.stdout,re.M)==["130"]
                  else:
