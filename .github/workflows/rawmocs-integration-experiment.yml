                  rows.append(row)
              assert len(rows)==8 and [r["reuse"] for r in rows]==[False,True,True,False]*2
              assert len({(r["sat"],r["real"],r["imag"]) for r in rows})==1
              med={str(a):statistics.median(r["wall_ns"] for r in rows if r["reuse"]==a) for a in (False,True)}
              report["cases"][case]={"trace":trace,"rows":rows,"median_ns":med,"base_over_trail":med["False"]/med["True"]}
          report["status"]="SCOPED_FULL_WITNESSED_COMPLETE"
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("SCOPED_FULL_REPORT",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-scoped-complete-ablation-${{ matrix.digits }}
          path: .scoped-full-evidence/
          include-hidden-files: true
          if-no-files-found: warn

