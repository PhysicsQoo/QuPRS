          python3 - <<'PY'
          import hashlib,json,os,re,statistics,sys
          from fractions import Fraction
          from pathlib import Path
          root=Path(".scoped-full-evidence")
          sys.path.insert(0,str(Path(".classes-candidate/crates/rawmocs-cli/tools").resolve()))
          from release_transfer import check_count
          witness,=Path(".scoped-original").rglob("witness.json")
          ref=json.loads(witness.read_text())
          expected="55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee"
          assert ref["source_sha256"]==expected and ref["bits"]==550
          assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE") and ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
          if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE": assert ref["order_policy"] in ("fill-reverse","degree-reverse")
          digits=int(os.environ["DIGITS"])
          target={30:30,130:100}[digits]
          lines=(root/"full.log").read_text().splitlines()
          report={"source_sha256":expected,"witness_sha256":hashlib.sha256(witness.read_bytes()).hexdigest(),"candidate_sha":"3d7d1c7028f49f5d291a6b41c69f77e512cb7933","digits":digits,"target":target,"cases":{}}
          for case in ("chain8192","split4096","vqe8"):
              trace,=[x for x in lines if x.startswith("SCOPED_WORK_TRACE case="+case+" ")]
              rows=[]
              for line in lines:
                  if not line.startswith("SCOPED_FULL_FINAL case="+case+" "): continue
                  r=dict(x.split("=",1) for x in line.split()[1:])
                  assert int(r["digits"])==digits
                  row={"trial":int(r["trial"]),"reuse":r["reuse"]=="true","wall_ns":int(r["wall_ns"]),"sat":r["sat"]=="SATISFIABLE","real":r["real"],"imag":r["imag"]}
