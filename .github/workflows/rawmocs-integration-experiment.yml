          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import statistics
          import subprocess
          import sys
          import time
          root = Path(".classes-evidence").resolve()
          inputs = Path(".classes-input").resolve()
          sys.path.insert(0, str(Path(".classes-base/crates/rawmocs-cli/tools").resolve()))
          from release_transfer import check_count
          sources = {
              "qft16": ("planner-qft16", "c35ee4e3ce77faf21ae6c8cd39d2fe14d8cba9958abffb8f18857e4357c9ea22", 45733766561),
              "qft20": ("planner-qft20", "29fea8d65f63dd282cc740e8cac5439b071f618780b04541e4412bfbd39462c5", 45733766561),
              "qnn8": ("planner-qnn8", "24dbcd5b6f270fd39f92b739e55446da7c14e7e2c28ed5032b70cf34bc0f786c", 45733766561),
              "qaoa9": ("planner-gen-qaoa9", "9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4", 45734596083),
              "vqe8": ("planner-gen-vqe8", "55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee", 45734596083),
