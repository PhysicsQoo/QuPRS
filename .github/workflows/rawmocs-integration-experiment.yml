          assert certified["status"]=="PASS" and certified["bits"]==bits and certified["target"]==target
          assert certified["reference_sha256"]==digest(refpath) and digest(cnf)==expected==ref["source_sha256"]
          assert ref["status"] in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE") and ref["bits"]==550
          assert ref["width"]<=19 and ref["work"]<=40000000 and ref["peak"]<=2000000
          if ref["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE": assert ref["order_policy"] in ("fill-reverse","degree-reverse")
          binaries={"candidate":Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve(),"baseline":Path(".long-baseline/crates/rawmocs-cli/target/release/rawmocs").resolve(),"gpmc":Path(".gpmc/build/gpmc").resolve()}
          report={"case":label,"candidate_sha":"146a5fabd94a79324f27c3a99eff332cb76ee4d0","baseline_sha":"92a28a2c621cdd98a9593664e5a1cc83c8519b25","gpmc_sha":"89bbc89d0de918e7a5385740355df55765039230","scope":"Auto route regression, not large-general attribution or release qualification","digits":digits,"bits":bits,"target":target,"source_sha256":expected,"witness_sha256":digest(refpath),"binaries":{a:digest(p) for a,p in binaries.items()},"rows":[]}
          def save(): (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
