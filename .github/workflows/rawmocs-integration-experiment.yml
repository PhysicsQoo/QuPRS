          shared-key: rawmocs-general-dependencies
          cache-workspace-crates: 'false'
      - name: Build and test exact candidate
        run: |
          set -euo pipefail
          test "$(git -C .classes-candidate rev-parse HEAD)" = 919882b04bdfbbed5424013668ff1fcae395a39c
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          cargo test --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
          cargo build --locked --release --manifest-path .classes-candidate/crates/rawmocs-cli/Cargo.toml
      - name: Source locked exact parity and bounded native ablation
        run: |
          set -euo pipefail
          mkdir -p .fair-evidence
          python3 - <<'PY'
          import hashlib, json, os, re, statistics, subprocess, sys, time
          from fractions import Fraction
          from pathlib import Path
          root=Path(".fair-evidence").resolve()
          solver=Path(".classes-candidate/crates/rawmocs-cli/target/release/rawmocs").resolve()
          sys.path.insert(0,str(Path(".classes-candidate/crates/rawmocs-cli/tools").resolve()))
          from release_native_paired import parse
          from release_transfer import check_count
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          report={"candidate_sha":"919882b04bdfbbed5424013668ff1fcae395a39c","binary_sha256":digest(solver),"scope":"Forced general; identical production ownership optimizations; only scratch reuse differs","cases":{}}
          def save(): (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          sparse=root/"sparse4096.cnf"
          sparse.write_text("p cnf 4096 2048\nc t wmc\n"+"".join(f"c p weight -{v} 0 0 0\n" for v in range(1,4097))+"".join(f"{v} {v+1} 0\n" for v in range(1,4097,2)))
          for name,sha,digits,limit in (
              ("sparse",digest(sparse),30,5),
              ("vqe8","55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee",30,5),
              ("vqe8","55938d577be87d91dd520b7002de7ec886c6035405e5400f6f80392a385562ee",130,8),
              ("qpeinexact20","9dca661e1a9cfecbfe325970cded1bcb5c3664f7983fa1628473bd42f2ba3fcb",30,5),
              ("qaoa9","9b5bf2619c2c2dd0c16c80f372a33bb23fb0ca0f7feeb671c6fcfd1c80f15be4",30,15),
              ("qnn12","2c74e555a8a8ea974cde02bcc5cc0823c5ed63b5fc7be8f628f777accd433204",30,15)):
              src=Path(".fair-input")/("rawmocs-quprs-planner-gen-"+name)
              if name=="sparse":
                  cnf=sparse
              else:
                  cnf,=src.rglob("gpmc-capture.cnf")
              assert digest(cnf)==sha
              ref=None
              witnesses=list(src.rglob("witness.json"))
              if witnesses:
                  assert len(witnesses)==1
                  obj=json.loads(witnesses[0].read_text())
                  if obj.get("status") in ("INDEPENDENT_INTERVAL_COMPLETE","INDEPENDENT_FIXED_INTERVAL_COMPLETE"):
                      assert obj["source_sha256"]==sha and obj["bits"]==550 and obj["width"]<=19 and obj["work"]<=40000000 and obj["peak"]<=2000000
                      if obj["status"]=="INDEPENDENT_FIXED_INTERVAL_COMPLETE":
                          assert obj["order_policy"] in ("fill-reverse","degree-reverse")
                      ref=obj
              if name not in ("qnn12","sparse"): assert ref is not None
              key=f"{name}-{digits}"
              case={"source_sha256":sha,"digits":digits,"limit_s":limit,"rows":[]}
              report["cases"][key]=case
              orders=("off","on","on","off")*3 if name in ("vqe8","sparse") else ("off","on","on","off")
              for i,arm in enumerate(orders):
                  if i>=2 and any(r["status"]!="WITNESSED_PASS" for r in case["rows"]): break
                  env={k:v for k,v in os.environ.items() if not k.startswith("RAWMOCS_RESEARCH_")}
                  if arm=="on": env["RAWMOCS_RESEARCH_SCOPE_SCRATCH"]="1"
                  label=f"{key}-{i}-{arm}"
                  rss=root/(label+".rss")
                  start=time.monotonic()
                  p=subprocess.run(["timeout","-k","2s",str(limit+3)+"s","prlimit","--as=3221225472","--","/usr/bin/time","-f","%M","-o",str(rss),str(solver),"--digits",str(digits),"--solver","general","--timeout-ms",str(limit*1000),str(cnf.resolve())],env=env,capture_output=True,text=True,timeout=limit+7)
                  row={"arm":arm,"exit":p.returncode,"wall_s":time.monotonic()-start}
                  case["rows"].append(row)
                  (root/(label+".stdout")).write_text(p.stdout)
                  (root/(label+".stderr")).write_text(p.stderr)
                  if rss.exists():
                      vals=[l for l in rss.read_text().splitlines() if l.strip().isdigit()]
                      if len(vals)==1: row["rss_kib"]=int(vals[0])
                  if p.returncode:
                      assert not p.stdout.strip() and (p.returncode==124 or (p.returncode==4 and "RAWMOCS_FAILURE kind=TIMEOUT" in p.stderr)),(label,p.returncode,p.stderr[-1000:])
                      row["status"]="CENSORED_TIMEOUT"
                  else:
                      bits={30:100,130:432}[digits]
                      assert f"RAWMOCS_COMPLETE route=general digits={digits} bits={bits} " in p.stderr
                      frames,=re.findall(r"^RAWMOCS_GENERAL_COMPLETE max_frames=(\d+)$",p.stderr,re.M)
                      row.update(parse(p.stdout,"rawmocs"),frames=int(frames),stdout_sha256=hashlib.sha256(p.stdout.encode()).hexdigest())
                      row["status"]="COUNT_UNWITNESSED"
                      if name=="sparse":
                          assert row["sat"] and Fraction(row["real"])==1 and Fraction(row["imag"])==0
                          row["status"]="WITNESSED_PASS"
                      elif ref is not None:
                          row["witness_upper"]=check_count(row,ref,digits)
                          row["status"]="WITNESSED_PASS"
                  save()
              rows=case["rows"]
              completed=[r for r in rows if r["exit"]==0]
              if completed:
                  assert len({r["stdout_sha256"] for r in completed})==1 and len({r["frames"] for r in completed})==1
              if name in ("vqe8","qpeinexact20","sparse"):
                  assert len(rows)==len(orders) and all(r["status"]=="WITNESSED_PASS" for r in rows)
              if len(rows)==len(orders) and all(r["status"]=="WITNESSED_PASS" for r in rows):
                  case["status"]="PAIRED_WITNESS_PASS"
                  case["median_s"]={a:statistics.median(r["wall_s"] for r in rows if r["arm"]==a) for a in ("off","on")}
                  case["paired_ratio"]=[next(r["wall_s"] for r in rows[t:t+2] if r["arm"]=="off")/next(r["wall_s"] for r in rows[t:t+2] if r["arm"]=="on") for t in range(0,len(rows),2)]
              else:
                  case["status"]="CENSORED_OR_UNWITNESSED_NO_RATIO"
              save()
          report["status"]="BOUNDED_DIAGNOSTIC_COMPLETE"
          save()
          print("FAIR_SCRATCH_FINAL",json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawmocs-scope-scratch-fair
          path: .fair-evidence/
          include-hidden-files: true
          if-no-files-found: warn

