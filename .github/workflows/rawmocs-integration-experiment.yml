                  if large: assert "RAWMOCS_SOURCE_ADMITTED variables=63399 clauses=536464 literals=1482754 " in p.stderr
                  assert row["stats"]["root_index_attempts"]==0
                  if arm=="off": assert row["stats"]["descendant_index_attempts"]==0
                  if p.returncode==8:
