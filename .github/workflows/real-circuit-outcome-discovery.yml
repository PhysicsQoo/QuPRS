name: Genuine MQTBench Elim Outcome Discovery and Family LOFO

on:
  pull_request:
    paths:
      - '.github/workflows/real-circuit-outcome-discovery.yml'
      - '.diagnostics/real_circuit_outcomes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-elim-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact native engine and analysis library
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2' 'numpy>=1.26,<3'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Search independent real MQTBench circuits and audit native model coverage
        run: |
          python -u .diagnostics/real_circuit_outcomes/discover.py
      - name: Seal original raw evidence even when scientific search fails
        if: always()
        run: |
          mkdir -p independent-family-cost-results
          git rev-parse HEAD > independent-family-cost-results/source-head-sha.txt
          find independent-family-cost-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > independent-family-cost-results/SHA256SUMS
      - name: Preserve complete original discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-circuit-elim-coverage
          path: independent-family-cost-results/
          if-no-files-found: error
          retention-days: 30
