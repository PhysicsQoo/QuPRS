name: Rust RR tolerance interval fast-path CodSpeed diagnostic

on:
  push:
    branches: [experiment/rr-tolerance-parity]
    paths:
      - '.github/workflows/rr-f64-certified-boundary-diagnostic.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: rr-f64-certified-boundary-diagnostic
  cancel-in-progress: true

jobs:
  native-rr:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_SHA: 817f9a0a8eea98f97d5f00ec57d11c56430550d5
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 817f9a0a8eea98f97d5f00ec57d11c56430550d5
          path: original-src
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 817f9a0a8eea98f97d5f00ec57d11c56430550d5
          path: candidate-src
          submodules: recursive
          persist-credentials: false
      - name: Set up CodSpeed Rust and system libraries
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          bins: cargo-codspeed
          cache-target: release
      - name: Install GMP and MPFR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Prepare source-identical experimental candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-src rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate-src rev-parse HEAD)" = "$SOURCE_SHA"
          for x in benchmarks/Feynman/tof_3.qasm benchmarks/Feynman/h,y,z,t,tdg,cx/tof_3.qasm \
            benchmarks/MQTBench/qaoa_nativegates_ibm_qiskit_opt0_7.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/qaoa_nativegates_ibm_qiskit_opt0_7.qasm \
            benchmarks/MQTBench/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/vqe_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/vqe_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm; do
            test "$(git -C original-src rev-parse "HEAD:$x")" = "$(git -C candidate-src rev-parse "HEAD:$x")"
          done
          python3 - <<'PY'
          from pathlib import Path
          original = Path("original-src/rust/pathsum/src/reduction.rs").read_text()
          source = Path("candidate-src/rust/pathsum/src/reduction.rs")
          content = source.read_text()
          assert content == original
          anchor = "    fn rr_matches(&self, coeff: &PhaseCoeff, target: Rational) -> bool {"
          end_anchor = "    /// Python-equivalent normalization of non-global phase terms."
          assert content.count(anchor) == content.count(end_anchor) == 1
          start = content.index(anchor)
          end = content.index(end_anchor, start)
          original_fn = content[start:end]
          assert "phase_cycles_within_tolerance(coeff, target, &tolerance)" in original_fn
          content = content[:start] + "\n    /// Purely native round-to-nearest binary64 enclosure for the common\n    /// source-radian case; the source representation is not changed.\n    /// Each i64->f64 cast, rational division, PI constant, sum and nearest-\n    /// integer subtraction is bounded by the conservative accumulated error.\n    /// We only evaluate inputs whose exact integer numerator and denominator\n    /// are representable as i64. All other cases take the certified path.\n    /// The distance to the nearest integer is 1-Lipschitz, including wrap.\n    fn rr_fast_float_decision(\n        coeff: &PhaseCoeff, target: Rational, tolerance: f64,\n    ) -> Option<bool> {\n        use num_traits::ToPrimitive;\n        if tolerance <= 0.0 || !tolerance.is_finite() { return None; }\n        if !coeff.symbols.is_empty() { return Some(false); }\n\n        let radians = if let Some(r) = &coeff.radians {\n            let numer = r.numer().to_i64()?;\n            let denom = r.denom().to_i64()?;\n            if denom <= 0 { return None; }\n            (numer as f64 / denom as f64) / std::f64::consts::PI\n        } else {\n            0.0\n        };\n\n        let constant = coeff.constant.numer as f64 / coeff.constant.denom as f64;\n        let target_cycles = target.numer as f64 / target.denom as f64;\n        let delta = (constant + radians) - target_cycles;\n\n        // Avoid integer-spacing amplification and exceptional floating values.\n        if !delta.is_finite() || delta.abs() > 1e12 { return None; }\n        let distance = (delta - delta.round()).abs();\n        // 64*EPSILON comfortably encloses the rounding of two integer casts,\n        // division, pi, addition, subtraction and nearest-integer subtraction\n        // for finite i64 input fractions and bounded delta. Failure to\n        // separate the interval from the configured threshold is NOT a verdict.\n        let error = 64.0 * f64::EPSILON\n            * (1.0 + constant.abs() + radians.abs() + target_cycles.abs() + delta.abs());\n        if !error.is_finite() { return None; }\n        if distance + error < tolerance { return Some(true); }\n        if distance > tolerance + error { return Some(false); }\n        None\n    }\n\n    /// Match without rounding the original source. Numeric tolerance is the\n    /// policy; the arbitrary-precision pi interval is only a boundary fallback.\n    fn rr_matches(&self, coeff: &PhaseCoeff, target: Rational) -> bool {\n        if !coeff.symbols.is_empty() { return false; }\n        if coeff.radians.is_none() && coeff.constant == target { return true; }\n        if self.rr_tolerance == 0.0 { return false; }\n\n        if let Some(classified) =\n            Self::rr_fast_float_decision(coeff, target, self.rr_tolerance)\n        {\n            return classified;\n        }\n\n        // Unrepresentable inputs and any boundary overlap preserve the\n        // existing full-source certified decision exactly.\n        let radians = coeff.radians.as_ref().and_then(num_traits::ToPrimitive::to_f64);\n        if coeff.radians.is_none() || radians.is_some_and(f64::is_finite) {\n            let cycles = coeff.constant.numer as f64 / coeff.constant.denom as f64\n                + radians.unwrap_or(0.0) / std::f64::consts::PI;\n            let expected = target.numer as f64 / target.denom as f64;\n            if cycles.is_finite() && cycles.abs() < 1e12 {\n                let delta = (cycles - expected).rem_euclid(1.0);\n                let distance = delta.min(1.0 - delta);\n                let uncertainty = 256.0 * f64::EPSILON * (1.0 + cycles.abs());\n                if distance > self.rr_tolerance + uncertainty { return false; }\n            }\n        }\n        let Some(tolerance) = num_rational::BigRational::from_float(self.rr_tolerance) else {\n            return false;\n        };\n        crate::phase_cycles_within_tolerance(coeff, target, &tolerance)\n    }\n\n" + content[end:]
          test_anchor = "    #[test]\n    fn rr_tolerance_zero_is_exact_and_positive_tolerance_matches()"
          assert content.count(test_anchor) == 1
          content = content.replace(test_anchor, "\n    #[test]\n    fn rr_fast_float_has_positive_negative_and_boundary_paths() {\n        use num_bigint::BigInt;\n        use num_rational::BigRational;\n        let below = PhaseCoeff {\n            constant: Rational::ZERO,\n            radians: Some(BigRational::new(BigInt::from(1), BigInt::from(1_000_000_000_000_i64))),\n            symbols: Default::default(),\n        };\n        let above = PhaseCoeff {\n            constant: Rational::ZERO,\n            radians: Some(BigRational::new(BigInt::from(1), BigInt::from(1_000_000_i64))),\n            symbols: Default::default(),\n        };\n        assert_eq!(PathSum::rr_fast_float_decision(&below, Rational::ZERO, 1e-10), Some(true));\n        assert_eq!(PathSum::rr_fast_float_decision(&above, Rational::ZERO, 1e-10), Some(false));\n        let threshold = num_rational::BigRational::from_float(1e-10).unwrap();\n        let borderline = PhaseCoeff {\n            constant: Rational::ZERO,\n            radians: Some(threshold * BigRational::from_integer(BigInt::from(3))),\n            symbols: Default::default(),\n        };\n        assert_eq!(PathSum::rr_fast_float_decision(&borderline, Rational::ZERO, 1e-10), None);\n    }\n\n    #[test]\n    fn rr_fast_float_matches_old_certified_clifford_decisions() {\n        use num_bigint::BigInt;\n        use num_rational::BigRational;\n        // Compare against the pre-optimization public math predicate for a\n        // varied bounded corpus, including negative phase and wraparound.\n        let mut coefficients = vec![\n            PhaseCoeff::ZERO, PhaseCoeff::HALF,\n            PhaseCoeff::QUARTER, PhaseCoeff::THREE_QUARTERS,\n            PhaseCoeff::new_constant(Rational::new(1, 2_000_000_000)),\n            PhaseCoeff::new_constant(Rational::new(499_999_999, 1_000_000_000)),\n        ];\n        for (n, d) in [\n            (1_i64, 1_000_000_000_000_i64),\n            (-1, 1_000_000_000_000), (1, 1_000_000_000),\n            (31415926535897931, 10_000_000_000_000_000),\n            (-31415926535897931, 10_000_000_000_000_000),\n            (1_619_883_712_007_237, 1_000_000_000_000_000),\n            (-2_580_205_812_676_381, 1_000_000_000_000_000),\n            (1, 9_000_000_000_000_000_000),\n        ] {\n            for exact in [Rational::ZERO, Rational::HALF, Rational::QUARTER] {\n                coefficients.push(PhaseCoeff {\n                    constant: exact,\n                    radians: Some(BigRational::new(BigInt::from(n), BigInt::from(d))),\n                    symbols: Default::default(),\n                });\n            }\n        }\n        let targets = [Rational::ZERO, Rational::HALF,\n                       Rational::QUARTER, Rational::THREE_QUARTERS];\n        let mut tested = 0;\n        let mut fast_accept = 0;\n        let mut fast_reject = 0;\n        let mut slow_fallback = 0;\n        let mut ps = setup_test_env(1);\n        for coeff in &coefficients {\n            for &target in &targets {\n                for tol in [0_f64, 1e-3, 1e-6, 1e-8, 1e-10,\n                            1e-12, 1e-16, 1e-20, 1e-35] {\n                    ps.rr_tolerance = tol;\n                    let baseline = if !coeff.symbols.is_empty() {\n                        false\n                    } else if coeff.radians.is_none() && coeff.constant == target {\n                        true\n                    } else if tol == 0.0 {\n                        false\n                    } else {\n                        crate::phase_cycles_within_tolerance(\n                            coeff, target,\n                            &BigRational::from_float(tol).unwrap(),\n                        )\n                    };\n                    let candidate = ps.rr_matches(coeff, target);\n                    assert_eq!(candidate, baseline,\n                        \"source={:?} target={:?} tol={:?}\", coeff, target, tol);\n                    if let Some(fast) = PathSum::rr_fast_float_decision(coeff, target, tol) {\n                        if fast { fast_accept += 1; } else { fast_reject += 1; }\n                    } else { slow_fallback += 1; }\n                    tested += 1;\n                }\n            }\n        }\n        eprintln!(\"RR_FAST_PATH_COVERAGE total={tested} accepted={fast_accept} rejected={fast_reject} fallback={slow_fallback}\");\n        assert!(fast_accept > 20 && fast_reject > 20 && slow_fallback > 20);\n    }\n" + "\n" + test_anchor)
          source.write_text(content)
          assert list(__import__("subprocess").check_output(
              ["git", "-C", "candidate-src", "diff", "--name-only"], text=True
          ).splitlines()) == ["rust/pathsum/src/reduction.rs"]
          print("RR_FAST_PREPARED: only reduction.rs modified")
          PY
      - name: Test original and fast-path science contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path candidate-src/rust/Cargo.toml -p pathsum rr_fast_float -- --nocapture
          cargo test --locked --manifest-path candidate-src/rust/Cargo.toml -p pathsum rr_tolerance -- --nocapture
          cargo test --locked --manifest-path candidate-src/rust/Cargo.toml -p pathsum compact_rr -- --nocapture
      - name: Prepare exact source-matched native CodSpeed benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-lab/original/benches native-lab/candidate/benches
          cat > native-lab/original/Cargo.toml <<'TOML'
          [package]
          name = "quprs-native-f64-original"
          version = "0.1.0"
          edition = "2021"
          publish = false
          [dependencies]
          pathsum = { path = "../../original-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }
          [[bench]]
          name = "rr_original"
          harness = false
          [workspace]
          resolver = "2"
          TOML
          sed -e 's/quprs-native-f64-original/quprs-native-f64-candidate/g' \
              -e 's@../../original-src/rust/pathsum@../../candidate-src/rust/pathsum@g' \
              -e 's/rr_original/rr_candidate/g' \
              native-lab/original/Cargo.toml > native-lab/candidate/Cargo.toml
          cat > native-lab/original/benches/rr_original.rs <<'RUST'
          use std::path::Path;
          use pathsum::{check_equivalence_with_options, qasm, EquivalenceStatus,
                        VerificationMethod, VerificationOptions, VerificationStrategy};
          const CASES: [(&str, &str, &str, &str, bool, VerificationStrategy); 5] = [
              ("tof3", "Feynman", "h,y,z,t,tdg,cx", "tof_3.qasm", true, VerificationStrategy::Proportional),
              ("qaoa7", "MQTBench", "h,ry,rz,cx", "qaoa_nativegates_ibm_qiskit_opt0_7.qasm", false, VerificationStrategy::Proportional),
              ("qft16", "MQTBench", "h,ry,rz,cx", "qft_nativegates_ibm_qiskit_opt0_16.qasm", true, VerificationStrategy::Proportional),
              ("vqe4", "MQTBench", "h,ry,rz,cx", "vqe_nativegates_ibm_ibm_qiskit_opt0_4.qasm", false, VerificationStrategy::Proportional),
              ("grover4", "MQTBench", "h,ry,rz,cx", "grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm", true, VerificationStrategy::Proportional),
          ];
          fn native_rr(bencher: divan::Bencher, id: usize) {
              let (name, folder, sub, filename, reverse, strategy) = CASES[id];
              let base = Path::new(env!("CARGO_MANIFEST_DIR"))
                  .join("../../original-src/benchmarks").join(folder);
              let (mut lhs, n) = qasm::parse_file(&base.join(filename)).unwrap();
              let (mut rhs, m) = qasm::parse_file(&base.join(sub).join(filename)).unwrap();
              assert_eq!(n, m, "{name}");
              if reverse { std::mem::swap(&mut lhs, &mut rhs); }
              let options = VerificationOptions {
                  method: VerificationMethod::ReductionRules,
                  strategy, rr_tolerance: 1e-10,
                  ..VerificationOptions::default()
              };
              let before = check_equivalence_with_options(n, &lhs, &rhs, &options).unwrap();
              assert_ne!(before.status, EquivalenceStatus::Timeout);
              eprintln!("RR_PREFLIGHT {name} {:?}", before.status);
              bencher.bench(|| {
                  let result = check_equivalence_with_options(
                      divan::black_box(n), divan::black_box(&lhs),
                      divan::black_box(&rhs), divan::black_box(&options)
                  ).unwrap();
                  divan::black_box(result.status);
              });
          }
          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_default(bencher: divan::Bencher, id: usize) {
              native_rr(bencher, id);
          }
          fn main() { divan::main(); }
          RUST
          sed -e 's@../../original-src/benchmarks@../../candidate-src/benchmarks@g' \
              native-lab/original/benches/rr_original.rs > native-lab/candidate/benches/rr_candidate.rs
      - name: Compile source-matched CodSpeed native benchmarks
        shell: bash
        run: |
          set -euo pipefail
          (cd native-lab/original && cargo codspeed build -m simulation --bench rr_original)
          (cd native-lab/candidate && cargo codspeed build -m simulation --bench rr_candidate)
      - name: Record matched native CPU using CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: (cd native-lab/original && cargo codspeed run --bench rr_original) && (cd native-lab/candidate && cargo codspeed run --bench rr_candidate)
      - name: Preserve full candidate and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-f64-certified-candidate-evidence
          path: |
            candidate-src/rust/pathsum/src/reduction.rs
            native-lab/original/Cargo.toml
            native-lab/candidate/Cargo.toml
            native-lab/original/benches/rr_original.rs
            native-lab/candidate/benches/rr_candidate.rs
          if-no-files-found: warn
          retention-days: 14
