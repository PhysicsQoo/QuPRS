name: Rust Native In-Process RR CodSpeed Simulation

on:
  push:
    branches:
      - experiment/rr-tolerance-parity
    paths:
      - '.github/workflows/rr-native-simulation-diagnostic.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: quprs-native-rr-simulation
  cancel-in-progress: true

jobs:
  rr-native-cpu:
    name: Compare Rust-native RR-only without Python or solver
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEV_SHA: 55e78c7597966617c1a193b89056ff4e99c3ddfb
      PR_SHA: 9c32f42cf5965caef62cf83aa821e04bbf4ebd0e
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout diagnostic workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact dev
        uses: actions/checkout@v4
        with:
          ref: 55e78c7597966617c1a193b89056ff4e99c3ddfb
          path: dev-src
          submodules: recursive
          persist-credentials: false
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: 9c32f42cf5965caef62cf83aa821e04bbf4ebd0e
          path: head-src
          submodules: recursive
          persist-credentials: false
      - name: Checkout exact PR source for isolated candidate
        uses: actions/checkout@v4
        with:
          ref: 9c32f42cf5965caef62cf83aa821e04bbf4ebd0e
          path: candidate-src
          submodules: recursive
          persist-credentials: false
      - name: Configure Rust and cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Verify source, solver and QASM input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dev-src rev-parse HEAD)" = "$DEV_SHA"
          test "$(git -C head-src rev-parse HEAD)" = "$PR_SHA"
          test "$(git -C candidate-src rev-parse HEAD)" = "$PR_SHA"
          test "$(git -C dev-src rev-parse HEAD:GPMC)" = "$(git -C head-src rev-parse HEAD:GPMC)"
          test "$(git -C dev-src rev-parse HEAD:pyproject.toml)" = "$(git -C head-src rev-parse HEAD:pyproject.toml)"
          for name in graphstate_nativegates_ibm_qiskit_opt0_16.qasm \
                      grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm \
                      qft_nativegates_ibm_qiskit_opt0_16.qasm \
                      qaoa_nativegates_ibm_qiskit_opt0_7.qasm \
                      vqe_nativegates_ibm_qiskit_opt0_4.qasm; do
            for sub in "" "h,ry,rz,cx/"; do
              test "$(git -C dev-src rev-parse "HEAD:benchmarks/MQTBench/$sub$name")" = \
                   "$(git -C head-src rev-parse "HEAD:benchmarks/MQTBench/$sub$name")"
            done
          done
          rustc --version
          command -v cargo-codspeed
          cargo-codspeed --version || true
          lscpu | grep -E 'Model name|Architecture' || true
      - name: Generate isolated native Rust benchmark workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rr-native-lab/dev/benches rr-native-lab/head/benches rr-native-lab/candidate/benches
          cat > rr-native-lab/dev/Cargo.toml <<'TOML'
          [package]
          name = "quprs-rr-dev-probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          pathsum = { path = "../../dev-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }

          [[bench]]
          name = "rr_native_dev"
          harness = false

          [workspace]
          resolver = "2"
          TOML
          cat > rr-native-lab/head/Cargo.toml <<'TOML'
          [package]
          name = "quprs-rr-head-probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          pathsum = { path = "../../head-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }

          [[bench]]
          name = "rr_native_head"
          harness = false

          [workspace]
          resolver = "2"
          TOML
          cat > rr-native-lab/dev/benches/rr_native_dev.rs <<'RUST'
          use std::path::Path;
          use pathsum::{
              check_equivalence_with_options, qasm, EquivalenceStatus,
              VerificationMethod, VerificationOptions, VerificationStrategy,
          };

          const CASES: [(&str, &str, bool, VerificationStrategy); 5] = [
              ("graphstate16", "graphstate_nativegates_ibm_qiskit_opt0_16.qasm", false, VerificationStrategy::Naive),
              ("grover4", "grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm", true, VerificationStrategy::Proportional),
              ("qft16", "qft_nativegates_ibm_qiskit_opt0_16.qasm", true, VerificationStrategy::Proportional),
              ("qaoa7", "qaoa_nativegates_ibm_qiskit_opt0_7.qasm", false, VerificationStrategy::Proportional),
              ("vqe4", "vqe_nativegates_ibm_qiskit_opt0_4.qasm", false, VerificationStrategy::Proportional),
          ];

          fn run_native_rr(bencher: divan::Bencher, id: usize, tolerance: f64, warmed: bool) {
              let (case, filename, reverse, strategy) = CASES[id];
              let base = Path::new(env!("CARGO_MANIFEST_DIR"))
                  .join("../../dev-src/benchmarks/MQTBench");
              // The package-local dev-src/head-src ancestor differs, but
              // the QASM fixture contents are hash-checked byte-identical.
              let base = if env!("CARGO_PKG_NAME") == "quprs-rr-head-probe" {
                  Path::new(env!("CARGO_MANIFEST_DIR")).join("../../head-src/benchmarks/MQTBench")
              } else { base };
              let (mut first, n) = qasm::parse_file(&base.join(filename)).unwrap();
              let (mut second, other_n) = qasm::parse_file(&base.join("h,ry,rz,cx").join(filename)).unwrap();
              assert_eq!(n, other_n, "circuit qubit mismatch: {}", case);
              if reverse { std::mem::swap(&mut first, &mut second); }
              let options = VerificationOptions {
                  method: VerificationMethod::ReductionRules,
                  strategy,
                  rr_tolerance: tolerance,
                  ..VerificationOptions::default()
              };
              // Warm control: perform exactly the same native call before the
              // simulated region. This primes OnceLock and other lazy state;
              // it does not change RR tolerance or the source gates.
              if warmed {
                  let before = check_equivalence_with_options(n, &first, &second, &options)
                      .expect("native RR warmup failed");
                  assert_ne!(before.status, EquivalenceStatus::Timeout);
                  divan::black_box(before.status);
              }
              // Only native miter construction, RR and verdict classification
              // are timed; QASM IO, Python, FFI, CNF and Solver are excluded.
              bencher.bench(|| {
                  let answer = check_equivalence_with_options(
                      divan::black_box(n), divan::black_box(&first),
                      divan::black_box(&second), divan::black_box(&options)
                  ).expect("native RR check failed");
                  assert_ne!(answer.status, EquivalenceStatus::Timeout);
                  divan::black_box(answer.status)
              });
          }

          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_tolerant(bencher: divan::Bencher, id: usize) {
              run_native_rr(bencher, id, 1e-10, false)
          }

          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_tolerant_warm(bencher: divan::Bencher, id: usize) {
              run_native_rr(bencher, id, 1e-10, true)
          }

          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_strict(bencher: divan::Bencher, id: usize) {
              run_native_rr(bencher, id, 0.0, false)
          }

          fn main() { divan::main(); }
          RUST
          cp rr-native-lab/dev/benches/rr_native_dev.rs rr-native-lab/head/benches/rr_native_head.rs
          # Candidate uses a separate source-pinned path dependency and lockfile.
          cat > rr-native-lab/candidate/Cargo.toml <<'TOML'
          [package]
          name = "quprs-rr-candidate-probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          pathsum = { path = "../../candidate-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }

          [[bench]]
          name = "rr_native_candidate"
          harness = false

          [workspace]
          resolver = "2"
          TOML
          python3 - <<'PY'
          from pathlib import Path
          orig = Path("rr-native-lab/head/benches/rr_native_head.rs").read_text()
          assert orig.count("quprs-rr-head-probe") == 1
          assert orig.count("../../head-src/benchmarks/MQTBench") == 1
          new = orig.replace("quprs-rr-head-probe", "quprs-rr-candidate-probe")
          new = new.replace("../../head-src/benchmarks/MQTBench", "../../candidate-src/benchmarks/MQTBench")
          Path("rr-native-lab/candidate/benches/rr_native_candidate.rs").write_text(new)
          PY
          # The integration baseline predates the per-call RR tolerance API.
          # Exercise its original native RR defaults as the baseline, never
          # claim that the old revision can execute an explicit zero tolerance.
          # The PR revision independently measures default 1e-10 and exact 0.
          python3 - <<'PY'
          from pathlib import Path
          file = Path("rr-native-lab/dev/benches/rr_native_dev.rs")
          code = file.read_text()
          field = "rr_tolerance: tolerance,"
          assert code.count(field) == 1
          code = code.replace(field, "")
          code = code.replace(
              "fn run_native_rr(bencher: divan::Bencher, id: usize, tolerance: f64, warmed: bool)",
              "fn run_native_rr(bencher: divan::Bencher, id: usize, _tolerance: f64, warmed: bool)",
          )
          code = code.replace("fn rr_tolerant(", "fn rr_legacy_default(")
          code = code.replace("fn rr_tolerant_warm(", "fn rr_legacy_default_warm(")
          strict_start = code.index("#[divan::bench(args = [0, 1, 2, 3, 4])]\nfn rr_strict")
          main_start = code.index("fn main() { divan::main(); }", strict_start)
          code = code[:strict_start] + code[main_start:]
          assert "rr_tolerance:" not in code
          file.write_text(code)
          PY
          echo "Bench corpus: 5 cases, each with cold/warm native default and cold/warm PR tolerant; PR strict control"
      - name: Test isolated omega singleton prefilter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("candidate-src/rust/pathsum/src/reduction.rs")
          s = p.read_text()
          old = '''    fn check_omega_conditions(&self, y: u32) -> bool {
        let mut has_c0 = false;
        for (mono, coeff) in &self.p.terms {
            if mono.contains(&y) {
                if mono.len() == 1 {
                    if self.rr_matches(coeff, Rational::QUARTER) || self.rr_matches(coeff, Rational::THREE_QUARTERS) {
                        has_c0 = true;
                    } else {
                        return false; 
                    }
                } else {
                    if !self.rr_matches(coeff, Rational::HALF) {
                        return false; 
                    }
                }
            }
        }
        has_c0
    }'''
          new = '''    fn check_omega_conditions(&self, y: u32) -> bool {
        // A quarter-cycle singleton on y is necessary for omega.
        // Reject impossible candidates before scanning unrelated terms.
        let Some(coeff) = self.p.terms.get(&vec![y]) else { return false; };
        if !self.rr_matches(coeff, Rational::QUARTER)
            && !self.rr_matches(coeff, Rational::THREE_QUARTERS)
        {
            return false;
        }
        for (mono, coeff) in &self.p.terms {
            if mono.len() > 1 && mono.contains(&y)
                && !self.rr_matches(coeff, Rational::HALF)
            {
                return false;
            }
        }
        true
    }'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          unit = r'''
          #[cfg(test)]
          mod omega_singleton_candidate_tests {
              use super::*;
              fn old_check(ps: &PathSum, y: u32) -> bool {
                  let mut has_c0 = false;
                  for (m, c) in &ps.p.terms {
                      if m.contains(&y) {
                          if m.len() == 1 {
                              if ps.rr_matches(c, Rational::QUARTER) ||
                                  ps.rr_matches(c, Rational::THREE_QUARTERS) { has_c0 = true; }
                              else { return false; }
                          } else if !ps.rr_matches(c, Rational::HALF) { return false; }
                      }
                  }
                  has_c0
              }
              #[test]
              fn eligibility_matches_old_full_scan() {
                  let vals = [Rational::ZERO, Rational::HALF, Rational::QUARTER,
                      Rational::THREE_QUARTERS,
                      Rational::new(250000001, 1000000000),
                      Rational::new(500000001, 1000000000)];
                  for tol in [0.0, 1e-10, 1e-8] {
                      for single in std::iter::once(None).chain(vals.iter().copied().map(Some)) {
                          for extra in std::iter::once(None).chain(vals.iter().copied().map(Some)) {
                              let mut ps = PathSum::new(2);
                              ps.rr_tolerance = tol;
                              ps.v.path_vars.insert(2);
                              if let Some(c) = single { ps.p.add_term(vec![2], PhaseCoeff::new_constant(c)); }
                              if let Some(c) = extra { ps.p.add_term(vec![0,2], PhaseCoeff::new_constant(c)); }
                              ps.p.add_term(vec![0], PhaseCoeff::QUARTER);
                              assert_eq!(ps.check_omega_conditions(2), old_check(&ps,2),
                                  "tol={tol}, single={single:?}, extra={extra:?}");
                          }
                      }
                  }
              }
          }
          '''
          p.write_text(s + "\n" + unit)
          PY
          test "$(git -C candidate-src rev-parse HEAD)" = "$PR_SHA"
          test "$(git -C candidate-src diff --name-only)" = "rust/pathsum/src/reduction.rs"
          (cd candidate-src/rust && cargo test -p pathsum --lib omega_singleton_candidate_tests)
          (cd candidate-src/rust && cargo test -p pathsum --lib reduction::tests)
          (cd candidate-src/rust && cargo test -p pathsum --test exact_decimal_phases)
      - name: Build CodSpeed Simulation instrumentation for both revisions
        shell: bash
        run: |
          set -euo pipefail
          (cd rr-native-lab/dev && cargo codspeed build -m simulation --bench rr_native_dev)
          (cd rr-native-lab/head && cargo codspeed build -m simulation --bench rr_native_head)
          (cd rr-native-lab/candidate && cargo codspeed build -m simulation --bench rr_native_candidate)
      - name: Measure Rust-native RR under CodSpeed Simulation
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: (cd rr-native-lab/dev && cargo codspeed run --bench rr_native_dev) && (cd rr-native-lab/head && cargo codspeed run --bench rr_native_head) && (cd rr-native-lab/candidate && cargo codspeed run --bench rr_native_candidate)
      - name: Upload reproducibility manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-native-simulation-source-manifest
          path: |
            rr-native-lab/dev/Cargo.lock
            rr-native-lab/head/Cargo.lock
            rr-native-lab/candidate/Cargo.lock
            rr-native-lab/dev/Cargo.toml
            rr-native-lab/head/Cargo.toml
            rr-native-lab/candidate/Cargo.toml
            rr-native-lab/dev/benches/rr_native_dev.rs
            rr-native-lab/head/benches/rr_native_head.rs
            rr-native-lab/candidate/benches/rr_native_candidate.rs
          if-no-files-found: warn
          retention-days: 7
