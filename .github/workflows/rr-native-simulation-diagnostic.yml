name: Rust RR Source-Pinned Native CodSpeed Diagnostic

on:
  push:
    branches:
      - experiment/rr-tolerance-parity
    paths:
      - '.github/workflows/rr-native-simulation-diagnostic.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: quprs-native-rr-simulation
  cancel-in-progress: true

jobs:
  rust-native-simulation:
    name: Compare native dev, tolerant PR and strict PR on one host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEV_SHA: 55e78c7597966617c1a193b89056ff4e99c3ddfb
      PR_SHA: af5213180c0ec2a6313a6a24f0e618e897f436fa
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout diagnostic workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact dev source
        uses: actions/checkout@v4
        with:
          ref: 55e78c7597966617c1a193b89056ff4e99c3ddfb
          path: dev-src
          persist-credentials: false
      - name: Checkout exact PR head source
        uses: actions/checkout@v4
        with:
          ref: af5213180c0ec2a6313a6a24f0e618e897f436fa
          path: head-src
          persist-credentials: false
      - name: Set up Rust and CodSpeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Install Rust native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Assert exact source and QASM input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dev-src rev-parse HEAD)" = "$DEV_SHA"
          test "$(git -C head-src rev-parse HEAD)" = "$PR_SHA"
          for subpath in \
            benchmarks/Feynman/tof_3.qasm \
            benchmarks/Feynman/h,y,z,t,tdg,cx/tof_3.qasm \
            benchmarks/MQTBench/qaoa_nativegates_ibm_qiskit_opt0_7.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/qaoa_nativegates_ibm_qiskit_opt0_7.qasm \
            benchmarks/MQTBench/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/qft_nativegates_ibm_qiskit_opt0_16.qasm \
            benchmarks/MQTBench/vqe_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/vqe_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm \
            benchmarks/MQTBench/h,ry,rz,cx/grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm; do
            test "$(git -C dev-src rev-parse "HEAD:$subpath")" = "$(git -C head-src rev-parse "HEAD:$subpath")"
          done
          rustc --version
          cargo-codspeed --version || true
          lscpu | grep -E 'Model name|Architecture' || true
      - name: Generate two isolated native Rust benchmark packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-lab/dev/benches native-lab/head/benches
          cat > native-lab/dev/Cargo.toml <<'TOML'
          [package]
          name = "quprs-native-dev-probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          pathsum = { path = "../../dev-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }

          [[bench]]
          name = "rr_native_dev"
          harness = false

          [workspace]
          resolver = "2"
          TOML
          cat > native-lab/head/Cargo.toml <<'TOML'
          [package]
          name = "quprs-native-head-probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          pathsum = { path = "../../head-src/rust/pathsum" }
          divan = { package = "codspeed-divan-compat", version = "=4.7.0" }

          [[bench]]
          name = "rr_native_head"
          harness = false

          [workspace]
          resolver = "2"
          TOML
          cat > native-lab/head/benches/rr_native_head.rs <<'RUST'
          use std::path::Path;
          use pathsum::{
              check_equivalence_with_options, qasm, EquivalenceStatus,
              VerificationMethod, VerificationOptions, VerificationStrategy,
          };

          const CASES: [(&str, &str, &str, &str, bool, VerificationStrategy); 5] = [
              ("tof3", "Feynman", "h,y,z,t,tdg,cx", "tof_3.qasm", true, VerificationStrategy::Proportional),
              ("qaoa7", "MQTBench", "h,ry,rz,cx", "qaoa_nativegates_ibm_qiskit_opt0_7.qasm", false, VerificationStrategy::Proportional),
              ("qft16", "MQTBench", "h,ry,rz,cx", "qft_nativegates_ibm_qiskit_opt0_16.qasm", true, VerificationStrategy::Proportional),
              ("vqe4", "MQTBench", "h,ry,rz,cx", "vqe_nativegates_ibm_qiskit_opt0_4.qasm", false, VerificationStrategy::Proportional),
              ("grover4", "MQTBench", "h,ry,rz,cx", "grover-noancilla_nativegates_ibm_qiskit_opt0_4.qasm", true, VerificationStrategy::Proportional),
          ];

          fn native_rr(bencher: divan::Bencher, id: usize, tolerance: f64) {
              let (case, folder, transpiled, filename, reverse, strategy) = CASES[id];
              let base = Path::new(env!("CARGO_MANIFEST_DIR"))
                  .join("../../head-src/benchmarks").join(folder);
              let (mut original, n) = qasm::parse_file(&base.join(filename)).unwrap();
              let (mut modified, m) = qasm::parse_file(&base.join(transpiled).join(filename)).unwrap();
              assert_eq!(n, m, "qubit mismatch: {case}");
              if reverse { std::mem::swap(&mut original, &mut modified); }
              let options = VerificationOptions {
                  method: VerificationMethod::ReductionRules,
                  strategy,
                  rr_tolerance: tolerance,
                  ..VerificationOptions::default()
              };
              let preflight = check_equivalence_with_options(n, &original, &modified, &options)
                  .expect("native RR preflight failed");
              assert_ne!(preflight.status, EquivalenceStatus::Timeout);
              eprintln!("NATIVE_PREFLIGHT case={case} tol={tolerance} verdict={:?}", preflight.status);
              // Exclude QASM parse, Python, PyO3, WMC and Solver from the measured region.
              bencher.bench(|| {
                  let result = check_equivalence_with_options(
                      divan::black_box(n), divan::black_box(&original),
                      divan::black_box(&modified), divan::black_box(&options)
                  ).expect("native RR failed");
                  divan::black_box(result.status);
              });
          }

          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_tolerant(bencher: divan::Bencher, id: usize) {
              native_rr(bencher, id, 1e-10)
          }

          #[divan::bench(args = [0, 1, 2, 3, 4])]
          fn rr_strict(bencher: divan::Bencher, id: usize) {
              native_rr(bencher, id, 0.0)
          }

          fn main() { divan::main(); }
          RUST
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native-lab/head/benches/rr_native_head.rs")
          source = p.read_text()
          source = source.replace("../../head-src/benchmarks", "../../dev-src/benchmarks")
          source = source.replace("rr_tolerance: tolerance,", "")
          source = source.replace("tolerance: f64", "_tolerance: f64")
          source = source.replace("case={case} tol={tolerance}", "case={case} legacy-default")
          source = source.replace("fn rr_tolerant(", "fn rr_legacy_default(")
          first = source.index("          #[divan::bench(args = [0, 1, 2, 3, 4])]\n          fn rr_strict(") if "          #[divan::bench(args = [0, 1, 2, 3, 4])]\n          fn rr_strict(" in source else source.index("#[divan::bench(args = [0, 1, 2, 3, 4])]\nfn rr_strict(")
          last = source.index("fn main() { divan::main(); }", first)
          source = source[:first] + source[last:]
          assert "rr_tolerance:" not in source
          Path("native-lab/dev/benches/rr_native_dev.rs").write_text(source)
          PY
          test "$(git -C head-src rev-parse HEAD)" = "$PR_SHA"
          test "$(git -C dev-src rev-parse HEAD)" = "$DEV_SHA"
      - name: Build native CodSpeed Simulation benchmarks
        shell: bash
        run: |
          set -euo pipefail
          (cd native-lab/dev && cargo codspeed build -m simulation --bench rr_native_dev)
          (cd native-lab/head && cargo codspeed build -m simulation --bench rr_native_head)
      - name: Measure matched native CPU with CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: (cd native-lab/dev && cargo codspeed run --bench rr_native_dev) && (cd native-lab/head && cargo codspeed run --bench rr_native_head)
      - name: Upload reproducibility manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-native-dev-pr-af521318-source-manifest
          path: |
            native-lab/dev/Cargo.toml
            native-lab/head/Cargo.toml
            native-lab/dev/Cargo.lock
            native-lab/head/Cargo.lock
            native-lab/dev/benches/rr_native_dev.rs
            native-lab/head/benches/rr_native_head.rs
          if-no-files-found: warn
          retention-days: 7
