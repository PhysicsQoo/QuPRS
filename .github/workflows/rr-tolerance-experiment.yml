name: RR Unknown To WMC Decision Experiment

on:
  push:
    branches:
      - experiment/rr-tolerance-parity
    paths:
      - '.diagnostics/rr-tolerance/run-marker.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rr-experiment-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-correctness:
    name: RR-only Unknown vs WMC/Hybrid Real Solvers
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: rr-tolerance-focused-v1
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Build exact source and Solver distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution
      - name: Run focused WMC fallback and source-boundary regressions
        run: |
          python -m pytest -q -ra \
            test/test_rr_unknown_hybrid_fallback.py \
            test/test_hybrid_rr_distance_boundary.py \
            --junitxml=rr-unknown-fallback.xml
      - name: Upload exact-source focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-unknown-hybrid-wmc-contract
          path: rr-unknown-fallback.xml
          if-no-files-found: ignore
          retention-days: 14
