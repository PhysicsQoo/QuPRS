name: RR Experimental Full Science Acceptance

on:
  push:
    branches:
      - experiment/rr-tolerance-parity
    paths:
      - '.diagnostics/rr-tolerance/run-marker.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rr-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-correctness:
    name: Full Rust/Python Science + Benchmark Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: rr-tolerance-focused-v1
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Complete native Rust correctness (one final experiment gate)
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum -p QuPRS_cli

      - name: Build Python extension and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev

      - name: Verify native solver distribution
        run: python -m QuPRS.utils.ganak_distribution

      - name: Complete Python scientific and benchmark suite
        id: python_correctness
        run: |
          python -m pytest -n auto -q -ra --junitxml=rr-science-final.xml

      - name: Audit full representative benchmark evidence
        if: ${{ !cancelled() && steps.python_correctness.outcome != 'skipped' }}
        run: |
          python scripts/check_benchmark_evidence.py \
            --junit rr-science-final.xml \
            --json rr-science-evidence.json \
            --markdown rr-science-evidence.md

      - name: Upload final scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-experiment-full-science
          path: |
            rr-science-final.xml
            rr-science-evidence.json
            rr-science-evidence.md
          if-no-files-found: ignore
          retention-days: 14
