name: RR Tolerance Experimental Correctness

on:
  push:
    branches:
      - experiment/rr-tolerance-parity
    paths:
      - '.diagnostics/rr-tolerance/run-marker.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rr-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-correctness:
    name: Rust RR and Python parity (focused)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: rr-tolerance-focused-v1
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
      - name: Focused native Rust tests
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum --lib reduction::tests -- --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum --lib exact_global_phase_verdict_tests -- --nocapture
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum --lib verification_options_contract_tests -- --nocapture
      - name: Build Python extension and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Focused Python/Rust parity
        run: |
          python -m pytest -q -ra \
            test/test_per_call_tolerance_contract.py \
            test/test_rr_backend_tolerance_parity.py \
            test/test_phase_source_tolerance_cache.py
      - name: Graphstate16 exact-source and approximate RR regression
        run: |
          python -m pytest -q -ra test/test_graphstate16_source_contract.py
          python -m pytest -q -ra test/test_MQT.py -k graphstate
      - name: Complete Python and benchmark evidence gate
        run: |
          python -m pytest -n auto -q -ra --junitxml=rr-experiment-complete.xml
          python scripts/check_benchmark_evidence.py \
            --junit rr-experiment-complete.xml \
            --json rr-experiment-evidence.json \
            --markdown rr-experiment-evidence.md
