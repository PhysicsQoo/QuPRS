name: Rust API Documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'rust/pathsum/src/lib.rs'
      - 'rust/pathsum/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'mkdocs.yml'
      - 'docs/requirements-site.txt'
      - 'docs/site/reference.md'
      - 'docs/site/architecture.md'
      - 'docs/site/python-api.md'
      - 'scripts/check_rust_api_docs.py'
      - 'docs/site/path-sum.md'
      - 'docs/site/weighted-model-counting.md'
      - 'docs/site/examples.md'
      - 'scripts/check_docs_science.py'
      - 'scripts/check_docs_visual.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/docs_versioning.py'
      - 'docs/requirements-versioned.txt'
      - '.github/workflows/rust-api-docs.yml'
  push:
    branches: [dev]
    paths:
      - 'rust/pathsum/src/lib.rs'
      - 'rust/pathsum/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'mkdocs.yml'
      - 'docs/requirements-site.txt'
      - 'docs/site/reference.md'
      - 'docs/site/architecture.md'
      - 'docs/site/python-api.md'
      - 'scripts/check_rust_api_docs.py'
      - 'docs/site/path-sum.md'
      - 'docs/site/weighted-model-counting.md'
      - 'docs/site/examples.md'
      - 'scripts/check_docs_science.py'
      - 'scripts/check_docs_visual.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/docs_versioning.py'
      - 'docs/requirements-versioned.txt'
      - '.github/workflows/rust-api-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-api-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-reference:
    name: Rust API / Generated Reference
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source and native dependencies
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements-site.txt
      - name: Build Python reference and documentation site
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            cp mkdocs.yml mkdocs-preview.yml
            printf '\nsite_url: https://physicsqoo.github.io/QuPRS/pr-preview/pr-${{ github.event.number }}/\n' >> mkdocs-preview.yml
            zensical build --strict --clean -f mkdocs-preview.yml
          else
            cp mkdocs.yml mkdocs-dev-check.yml
            printf '\nsite_url: https://physicsqoo.github.io/QuPRS/\n' >> mkdocs-dev-check.yml
            zensical build --strict --clean -f mkdocs-dev-check.yml
          fi
      - name: Verify public mathematical identities
        run: python scripts/check_docs_science.py
      - name: Verify Python reference
        run: python scripts/check_docs_site.py --site
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: rust-api-reference-v1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev libssl-dev
      - name: Build Rust library reference
        run: cargo doc --locked --manifest-path rust/Cargo.toml -p pathsum --no-deps
      - name: Run Rust documentation tests
        run: cargo test --locked --manifest-path rust/Cargo.toml -p pathsum --doc
      - name: Compose and validate both API references
        run: python scripts/check_rust_api_docs.py --compose --check
      - name: Audit all internal links against deployment URL prefix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/check_docs_links.py --site site --base-url https://physicsqoo.github.io/QuPRS/pr-preview/pr-${{ github.event.number }}/
          else
            python scripts/check_docs_links.py --site site --base-url https://physicsqoo.github.io/QuPRS/
          fi

      - name: Save source-built Rustdoc for versioned dev publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-versioned-dev-${{ github.sha }}
          path: rust/target/doc/
          retention-days: 3
          if-no-files-found: error

      - name: Install browser for preview inspection
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Inspect real browser rendering
        if: github.event_name == 'pull_request'
        run: python scripts/check_docs_visual.py --site site --output docs-preview-review --base-path /QuPRS/pr-preview/pr-${{ github.event.number }}/
      - name: Upload preview website for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quprs-preview-site-pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload desktop and mobile screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quprs-visual-review-pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: docs-preview-review/
          retention-days: 14
          if-no-files-found: warn

  preview-deploy:
    name: Publish review-only preview subtree
    needs: generated-reference
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Reject stale preview deployments
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}" --jq '.head.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Retrieve reviewed static website
        uses: actions/download-artifact@v4
        with:
          name: quprs-preview-site-pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: preview-site
      - name: Validate deployed artifact boundaries
        run: |
          test -f preview-site/index.html
          test -f preview-site/path-sum/index.html
          test -f preview-site/weighted-model-counting/index.html
          test -f preview-site/examples/index.html
          test -f preview-site/python-api/index.html
          test -f preview-site/rust-api/pathsum/index.html
          test -d preview-site/rust-api/static.files
          if find preview-site -type l | grep -q .; then
            echo 'Symlinks are not supported in the preview tree' >&2
            exit 1
          fi
      - name: Check out isolated preview branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: preview-branch
          fetch-depth: 1
          persist-credentials: true
      - name: Update only this PR's preview directory
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          destination="preview-branch/pr-preview/pr-${{ github.event.number }}"
          mkdir -p "$(dirname "$destination")"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a preview-site/. "$destination/"
          printf '%s\n' "$EXPECTED_SHA" > "$destination/source-sha.txt"
          git -C preview-branch add -- pr-preview/pr-${{ github.event.number }}
          if git -C preview-branch diff --cached --quiet; then
            echo 'Preview subtree is already identical to the reviewed artifact'
          else
            git -C preview-branch -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'docs: refresh isolated pull-request preview'
            git -C preview-branch push origin HEAD:gh-pages
          fi
      - name: Confirm Pages URL serves the exact preview
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base='https://physicsqoo.github.io/QuPRS/pr-preview/pr-${{ github.event.number }}'
          matched=false
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 12 \
              -H 'Cache-Control: no-cache' \
              -o preview-sha.txt "$base/source-sha.txt?v=$EXPECTED_SHA"; then
              actual="$(tr -d '\r\n' < preview-sha.txt)"
              if [[ "$actual" == "$EXPECTED_SHA" ]]; then
                matched=true
                echo "Public Pages source SHA matches reviewed artifact on check $attempt"
                break
              fi
              echo "Pages propagation pending ($attempt/30): observed ${actual:0:100}"
            else
              echo "Pages not available yet ($attempt/30)"
            fi
            sleep 8
          done
          test "$matched" = true
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 12 -o preview-home.html "$base/?v=$EXPECTED_SHA"
          grep -q 'QuPRS' preview-home.html



  versioned-dev-deploy:
    name: Publish isolated /docs/dev site from reviewed Rustdoc
    needs: generated-reference
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact tested dev source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Zensical versioning toolchain
        run: python -m pip install -r docs/requirements-versioned.txt
      - name: Retrieve exact-source native documentation
        uses: actions/download-artifact@v4
        with:
          name: rustdoc-versioned-dev-${{ github.sha }}
          path: rust/target/doc
      - name: Prepare source-accurate versioned site
        run: |
          set -euo pipefail
          python scripts/docs_versioning.py config --ref dev
          python scripts/docs_versioning.py stage-native --source-sha "${{ github.sha }}"
      - name: Stage dev docs in an isolated git branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:refs/heads/gh-pages
          origin_pages="$(git rev-parse gh-pages)"
          echo "$origin_pages" > "$RUNNER_TEMP/pages-base.txt"
          before_root="$(git rev-parse gh-pages:index.html)"
          before_preview="$(git rev-parse gh-pages:pr-preview 2>/dev/null || printf absent)"
          was_versioned=false
          if git cat-file -e gh-pages:docs/index.html 2>/dev/null; then
            was_versioned=true
          fi
          mike deploy --branch gh-pages --config-file mkdocs.versioned.yml dev
          if [[ "$was_versioned" == false ]]; then
            mike set-default --branch gh-pages --config-file mkdocs.versioned.yml dev
          fi
          test "$(git show gh-pages:docs/dev/source-sha.txt | tr -d '\r\n')" = "${{ github.sha }}"
          git cat-file -e gh-pages:docs/dev/rust-api/pathsum/index.html
          test "$(git rev-parse gh-pages:index.html)" = "$before_root"
          test "$(git rev-parse gh-pages:pr-preview 2>/dev/null || printf absent)" = "$before_preview"
          git worktree add --detach "$RUNNER_TEMP/versioned-docs" gh-pages
          python scripts/docs_versioning.py check-layout \
            --pages "$RUNNER_TEMP/versioned-docs" --versions dev
          python scripts/check_docs_links.py \
            --site "$RUNNER_TEMP/versioned-docs/docs/dev" \
            --base-url https://physicsqoo.github.io/QuPRS/docs/dev/
      - name: Publish only the isolated docs subtree
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/pages-base.txt")"
          actual="$(git ls-remote origin refs/heads/gh-pages | cut -f1)"
          if [[ "$expected" != "$actual" ]]; then
            echo 'gh-pages changed since validation; stop without overwriting it' >&2
            exit 1
          fi
          git push origin gh-pages:gh-pages
      - name: Validate live dev docs provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://physicsqoo.github.io/QuPRS/docs/dev/source-sha.txt'
          matched=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 12 \
              -o source-sha.txt "$url?v=$EXPECTED_SHA"; then
              observed="$(tr -d '\r\n' < source-sha.txt)"
              if [[ "$observed" == "$EXPECTED_SHA" ]]; then
                matched=true
                echo "Live versioned dev source SHA verified ($attempt/30)"
                break
              fi
            fi
            sleep 8
          done
          test "$matched" = true
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -o homepage.html 'https://physicsqoo.github.io/QuPRS/docs/dev/'
          grep -q 'QuPRS' homepage.html
