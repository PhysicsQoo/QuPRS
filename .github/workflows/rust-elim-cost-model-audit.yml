name: Rust Elim Cost Family-Held-Out Model Audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'research/run-cost-model-*'
    paths:
      - '.github/research-runs/cost-model/request.json'

permissions:
  contents: read
  actions: read

jobs:
  research_request:
    name: Validate branch research request
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.resolve.outputs.execute }}
    steps:
      - name: Resolve explicit research intent without building native dependencies
        id: resolve
        uses: actions/github-script@v7
        env:
          RESEARCH_REQUEST_FILE: '.github/research-runs/cost-model/request.json'
        with:
          script: |
            core.setOutput('execute', 'false');
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('execute', 'true');
              core.info('Manual research run requested.');
              return;
            }
            if (context.eventName !== 'push') {
              throw new Error('Unsupported research event');
            }
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: process.env.RESEARCH_REQUEST_FILE,
              ref: context.sha
            });
            if (Array.isArray(response.data) || response.data.type !== 'file') {
              throw new Error('Research request must be a single JSON file');
            }
            const data = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            if (!data || !['smoke', 'run'].includes(data.mode)
                || typeof data.purpose !== 'string' || !data.purpose.trim()) {
              throw new Error('Request requires mode=smoke|run and a nonempty purpose');
            }
            if (data.mode === 'run') {
              core.setOutput('execute', 'true');
            }
            core.info(`Research request ${data.mode}; expensive job ${data.mode === 'run' ? 'enabled' : 'skipped'}`);

  source-pinned-model-audit:
    needs: research_request
    if: ${{ needs.research_request.outputs.execute == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the offline analysis dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Retrieve original accepted six-family native timing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original-elim
          gh run download 39528135089 --repo PhysicsQoo/QuPRS \
            --name rust-elim-six-family-cost --dir original-elim
          (cd original-elim && zip -q -r ../original-elim.zip *)
          # The source download from gh is decompressed; the archived ZIP
          # byte hash differs from the initial GitHub archive, but every
          # original internal SHA256SUMS entry must still verify.
      - name: Audit hashes and evaluate entire held-out circuit families
        run: |
          python -u .diagnostics/cost_model_lofo/validate.py \
            --artifact original-elim.zip --out cost-model-lofo-results
      - name: Seal source and analytical output
        if: always()
        run: |
          mkdir -p cost-model-lofo-results
          git rev-parse HEAD > cost-model-lofo-results/analysis-head-sha.txt
          find cost-model-lofo-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > cost-model-lofo-results/SHA256SUMS
      - name: Upload auditable LOFO result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-elim-family-heldout-model-audit
          path: cost-model-lofo-results/
          retention-days: 30
