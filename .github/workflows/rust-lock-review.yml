# Temporary, read-only lockfile generation for this source migration.
# Remove after reviewed lockfiles are committed; never publishes or pushes.
name: Rust dependency lock review
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rust-lock-review.yml'
permissions:
  contents: read
jobs:
  regenerate-locked-resolver-state:
    if: ${{ github.event.pull_request.head.repo.full_name == 'PhysicsQoo/QuPRS' && github.head_ref == 'build/pyo3-0301-python314-compat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the pinned PyO3 workspace dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          cargo update --manifest-path rust/Cargo.toml -p pyo3 --precise 0.30.1
          cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 > /dev/null
      - name: Independently resolve the standalone publishable crate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_rust_crate_candidate.py --output "$RUNNER_TEMP/standalone-quprs"
          cargo update --manifest-path "$RUNNER_TEMP/standalone-quprs/Cargo.toml" -p quprs
          cargo metadata --manifest-path "$RUNNER_TEMP/standalone-quprs/Cargo.toml" --locked --no-deps --format-version 1 > /dev/null
      - name: Print reproducible review artifacts (public Cargo.lock only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          import os
          candidates = {
              "WORKSPACE": Path("rust/Cargo.lock"),
              "STANDALONE": Path(os.environ["RUNNER_TEMP"]) / "standalone-quprs" / "Cargo.lock",
          }
          for label, path in candidates.items():
              payload = path.read_bytes()
              encoded = base64.b64encode(payload).decode("ascii")
              print(f"LOCK_BEGIN {label} {len(payload)} {hashlib.sha256(payload).hexdigest()}")
              for offset in range(0, len(encoded), 2048):
                  print(f"LOCK_DATA {label} {encoded[offset:offset+2048]}")
              print(f"LOCK_END {label}")
          PY
