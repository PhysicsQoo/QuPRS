name: Rust Native Rule Attribution Six-Family Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/rust-native-rule-attribution.yml'
      - '.diagnostics/native_rule_attribution/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-rule-attribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-native-rule-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact experiment head with solver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile exact-source native Rust FFI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Focused opt-in native rule correctness and FFI schema
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p pathsum \
            --lib diagnostics::tests
          python -m pytest -q test/test_rust_structural_probe_ffi.py
      - name: Collect randomized same-CPU six-family native rule attribution
        run: |
          python -u .diagnostics/native_rule_attribution/pilot.py
      - name: Seal all raw evidence with SHA256 on pass or failure
        if: always()
        run: |
          mkdir -p native-rule-attribution-results
          git rev-parse HEAD > native-rule-attribution-results/experiment-source-sha.txt
          find native-rule-attribution-results -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 -r sha256sum > native-rule-attribution-results/SHA256SUMS
      - name: Upload raw six-family attribution evidence on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rule-attribution-six-family
          path: native-rule-attribution-results/
          retention-days: 30
          if-no-files-found: error
