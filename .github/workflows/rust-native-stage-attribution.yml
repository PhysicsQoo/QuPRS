          by={(r["case"],r["tolerance"]):r for r in rows}
          assert len(by)==6
          for k in ("tof_3","qwalk-noancilla_negative_3"):
              for tol in (None,0.0):
                  r=by[k,tol]
                  assert r["verdict"]==("equivalent" if k=="tof_3" else "unknown")
                  assert r["solver_invoked"] is False
          r=by["qwalk-noancilla_3",None]
          assert r["verdict"]=="equivalent" and r["rr_approximate"] and not r["solver_invoked"]
          assert r["h"]==0 and r["numeric_wrapped_l1_cycles"].startswith("2.220446049250313")
          assert by["qwalk-noancilla_3",0.0]["verdict"]=="unknown"
          print("D7E3_RED_GREEN_PASS")
          PY
