          lscpu > eq-dag-d3b-evidence/cpu.txt
          if test -x "$RUNNER_TEMP/gpmc"; then ldd "$RUNNER_TEMP/gpmc" > eq-dag-d3b-evidence/gpmc-ldd.txt; fi
          cd eq-dag-d3b-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d3b-balanced-topology
          path: eq-dag-d3b-evidence/
          retention-days: 30

  eq-dag-d3c:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d2a-rewritten-cnfs
          run-id: 46007045267
