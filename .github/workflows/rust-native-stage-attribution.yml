name: Rust Native Stage Attribution Pilot

on:
  workflow_dispatch:
    inputs:
      dag_stage:
        description: 'DAG experiment stage (one stage only; smoke is default)'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - d1
          - d1c
          - d1d
          - d1e
          - d2a
          - d3
          - d3b
          - d3c
          - raw-pilot
          - e1a
          - e1b
          - e1c
          - e1e
          - e1f
          - d2b-parity
          - d4a
          - d5a
          - d2b-factored
          - d4b
          - d5b
          - d6a
          - d6b
          - d6c
          - d7a
          - d7b
          - d7c
          - d7d
          - d7e
          - d7e2
          - d7e3
          - d7e4
          - d8
          - d8b
          - d8c
          - d8d
          - d9
          - e1c-matrix
          - l1
  push:
    branches: [experiment/eq-dag-encoder]
    paths:
      - 'rust/quprs/examples/eq_dag_d1.rs'
      - 'rust/research/eq_dag_d1*'
      - 'rust/research/eq_dag_phase_screen.py'
      - 'rust/research/eq_dag_d1d*'
      - 'rust/research/eq_dag_d1e*'
      - 'rust/research/eq_dag_d2a*'
      - 'rust/research/eq_dag_d3*'
      - 'rust/research/eq_dag_e1*'
      - 'rust/research/eq_dag_ci_smoke.py'
      - 'rust/quprs/examples/eq_dag_d3_count.rs'
      - 'rust/quprs/examples/eq_dag_d2b_parity.rs'
      - 'rust/quprs/src/wmc_parity_experiment.rs'
      - '.github/workflows/rust-native-stage-attribution.yml'

permissions:
  contents: read

jobs:
  native-stage-pilot:
    if: github.ref != 'refs/heads/experiment/eq-dag-encoder'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout pinned Rust/Python source and published solver manifest
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore pinned Ganak archive when available
        uses: ./.github/actions/cache-ganak-release
      - name: Build native Rust and scientific Python package
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -c 'import QuPRS, qiskit, symengine; print(QuPRS.__version__, qiskit.__version__, symengine.__version__)'
      - name: Verify Rust stage session and exclusive ledger tests
        run: |
          cargo test --manifest-path rust/Cargo.toml -p quprs --lib diagnostics::tests -- --nocapture
      - name: Run real native GPMC and Operator parity diagnostics
        run: |
          python -u .diagnostics/rust_stage_ledger/run.py
      - name: Seal source and raw evidence
        if: always()
        run: |
          mkdir -p rust-native-stage-results
          git rev-parse HEAD > rust-native-stage-results/checked-out-sha.txt
          python3 -c 'from scripts.gpmc_release_source_identity import source_commit; print(source_commit())' > rust-native-stage-results/gpmc-release-source.txt
          find rust-native-stage-results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > rust-native-stage-results/SHA256SUMS
      - name: Upload original native result and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-exclusive-stage-pilot
          path: rust-native-stage-results/
          if-no-files-found: error
          retention-days: 30

  eq-dag-d1:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Restore pinned Ganak archive
        uses: ./.github/actions/cache-ganak-release
      - name: Build unchanged native EQ plus census example
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --example eq_dag_d1
      - name: Run source-pinned residual census (not performance benchmark)
        run: |
          set -euo pipefail
          python -u rust/research/eq_dag_d1.py rust/target/release/examples/eq_dag_d1 src/QuPRS/utils/wmc_tools/gpmc eq-dag-d1-evidence | tee eq-dag-d1.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d1-evidence
          test ! -f eq-dag-d1.log || cp eq-dag-d1.log eq-dag-d1-evidence/
          git rev-parse HEAD > eq-dag-d1-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d1-evidence/tree.txt
          rustc --version > eq-dag-d1-evidence/rust.txt
          lscpu > eq-dag-d1-evidence/cpu.txt
          cd eq-dag-d1-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d1-residual-census
          path: eq-dag-d1-evidence/
          retention-days: 30

  eq-dag-d1c:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd1c'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1-residual-census
          run-id: 46002431913
          github-token: ${{ github.token }}
          path: d1b
      - name: Validate original receipt and analyze phase reuse without solver
        run: |
          set -euo pipefail
          (cd d1b && sha256sum -c SHA256SUMS)
          python3 -u rust/research/eq_dag_phase_screen.py d1b eq-dag-d1c-evidence | tee d1c.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d1c-evidence
          test ! -f d1c.log || cp d1c.log eq-dag-d1c-evidence/
          git rev-parse HEAD > eq-dag-d1c-evidence/head.txt
          cd eq-dag-d1c-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d1c-phase-screen
          path: eq-dag-d1c-evidence/
          retention-days: 30

  eq-dag-d1d:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd1d'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
      - name: Restore pinned Ganak archive
        uses: ./.github/actions/cache-ganak-release
      - name: Build unchanged native EQ plus census example
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --example eq_dag_d1
      - name: Run source-pinned residual census (not performance benchmark)
        run: |
          set -euo pipefail
          python -u rust/research/eq_dag_d1.py rust/target/release/examples/eq_dag_d1 src/QuPRS/utils/wmc_tools/gpmc eq-dag-d1d-evidence --manifest rust/research/eq_dag_d1d_manifest.json --hybrid-only --address-space-mib 4096 | tee eq-dag-d1d.log
      - name: Screen matched residual cost without additional solver calls
        run: |
          git rev-parse HEAD > eq-dag-d1d-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d1d-evidence/tree.txt
          python3 -u rust/research/eq_dag_d1d_screen.py eq-dag-d1d-evidence rust/research/eq_dag_d1d_manifest.json eq-dag-d1d-evidence/phase_screen.json
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d1d-evidence
          test ! -f eq-dag-d1d.log || cp eq-dag-d1d.log eq-dag-d1d-evidence/
          git rev-parse HEAD > eq-dag-d1d-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d1d-evidence/tree.txt
          rustc --version > eq-dag-d1d-evidence/rust.txt
          lscpu > eq-dag-d1d-evidence/cpu.txt
          cd eq-dag-d1d-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d1d-heldout-mqt
          path: eq-dag-d1d-evidence/
          retention-days: 30


  eq-dag-d1e:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd1e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - name: Validate original receipts and screen proper subset roots
        run: |
          set -euo pipefail
          (cd d1d && sha256sum -c SHA256SUMS)
          python3 -u rust/research/eq_dag_d1e_screen.py d1d eq-dag-d1e-evidence | tee d1e.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d1e-evidence
          test ! -f d1e.log || cp d1e.log eq-dag-d1e-evidence/
          git rev-parse HEAD > eq-dag-d1e-evidence/head.txt
          cd eq-dag-d1e-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d1e-subset-root-screen
          path: eq-dag-d1e-evidence/
          retention-days: 30

  eq-dag-d2a:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd2a'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - name: Generate actual DAG CNFs and replay all definitions
        run: |
          set -euo pipefail
          (cd d1d && sha256sum -c SHA256SUMS)
          python3 -u rust/research/eq_dag_d2a_rewrite.py d1d eq-dag-d2a-evidence | tee d2a.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d2a-evidence
          test ! -f d2a.log || cp d2a.log eq-dag-d2a-evidence/
          git rev-parse HEAD > eq-dag-d2a-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d2a-evidence/tree.txt
          cd eq-dag-d2a-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d2a-rewritten-cnfs
          path: eq-dag-d2a-evidence/
          retention-days: 30

  eq-dag-d3:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd3'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d2a-rewritten-cnfs
          run-id: 46007045267
          github-token: ${{ github.token }}
          path: d2a
      - name: Validate original artifacts
        run: |
          (cd d1d && sha256sum -c SHA256SUMS)
          (cd d2a && sha256sum -c SHA256SUMS)
      - name: Install pinned GPMC and compile production count reader
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python3 scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/gpmc"
          QUPRS_SOLVER_PROVISION=external cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --example eq_dag_d3_count
          ldd "$RUNNER_TEMP/gpmc"
      - name: Matched same-residual same-host GPMC A/B
        run: |
          set -euo pipefail
          python3 -u rust/research/eq_dag_d3_ab.py d1d d2a "$RUNNER_TEMP/gpmc" rust/target/release/examples/eq_dag_d3_count eq-dag-d3-evidence | tee d3.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d3-evidence
          test ! -f d3.log || cp d3.log eq-dag-d3-evidence/
          git rev-parse HEAD > eq-dag-d3-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d3-evidence/tree.txt
          lscpu > eq-dag-d3-evidence/cpu.txt
          if test -x "$RUNNER_TEMP/gpmc"; then ldd "$RUNNER_TEMP/gpmc" > eq-dag-d3-evidence/gpmc-ldd.txt; fi
          cd eq-dag-d3-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d3-matched-solver-ab
          path: eq-dag-d3-evidence/
          retention-days: 30

  eq-dag-d3b:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd3b'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d2a-rewritten-cnfs
          run-id: 46007045267
          github-token: ${{ github.token }}
          path: d2a
      - name: Validate original artifacts
        run: |
          (cd d1d && sha256sum -c SHA256SUMS)
          (cd d2a && sha256sum -c SHA256SUMS)
      - name: Install pinned GPMC and compile production count reader
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libgmp-dev libmpfr-dev zlib1g-dev
          python3 scripts/install_gpmc_release.py --dest "$RUNNER_TEMP/gpmc"
          QUPRS_SOLVER_PROVISION=external cargo build --locked --release --manifest-path rust/Cargo.toml -p quprs --example eq_dag_d3_count
          ldd "$RUNNER_TEMP/gpmc"
      - name: Matched three-way topology comparison
        run: |
          set -euo pipefail
          python3 -u rust/research/eq_dag_d3b_topology.py d1d d2a "$RUNNER_TEMP/gpmc" rust/target/release/examples/eq_dag_d3_count eq-dag-d3b-evidence | tee d3b.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d3b-evidence
          test ! -f d3b.log || cp d3b.log eq-dag-d3b-evidence/
          git rev-parse HEAD > eq-dag-d3b-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d3b-evidence/tree.txt
          lscpu > eq-dag-d3b-evidence/cpu.txt
          if test -x "$RUNNER_TEMP/gpmc"; then ldd "$RUNNER_TEMP/gpmc" > eq-dag-d3b-evidence/gpmc-ldd.txt; fi
          cd eq-dag-d3b-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d3b-balanced-topology
          path: eq-dag-d3b-evidence/
          retention-days: 30

  eq-dag-d3c:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'd3c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d2a-rewritten-cnfs
          run-id: 46007045267
          github-token: ${{ github.token }}
          path: d2a
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d3-matched-solver-ab
          run-id: 46007390837
          github-token: ${{ github.token }}
          path: d3
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d3b-balanced-topology
          run-id: 46009831478
          github-token: ${{ github.token }}
          path: d3b
      - name: Offline source-pinned GPMC mechanism audit
        run: |
          set -euo pipefail
          for d in d1d d2a d3 d3b; do (cd "$d" && sha256sum -c SHA256SUMS); done
          python3 -u rust/research/eq_dag_d3c_mechanism.py d1d d2a d3 d3b eq-dag-d3c-evidence | tee d3c.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-d3c-evidence
          test ! -f d3c.log || cp d3c.log eq-dag-d3c-evidence/
          git rev-parse HEAD > eq-dag-d3c-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-d3c-evidence/tree.txt
          cd eq-dag-d3c-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-dag-d3c-mechanism-audit
          path: eq-dag-d3c-evidence/
          retention-days: 30

  eq-dag-raw-pilot:
    if: github.ref == 'refs/heads/experiment/eq-dag-encoder' && github.event_name == 'workflow_dispatch' && inputs.dag_stage == 'raw-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d1d-heldout-mqt
          run-id: 46004315659
          github-token: ${{ github.token }}
          path: d1d
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d2a-rewritten-cnfs
          run-id: 46007045267
          github-token: ${{ github.token }}
          path: d2a
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d3-matched-solver-ab
          run-id: 46007390837
          github-token: ${{ github.token }}
          path: d3
      - uses: actions/download-artifact@v4
        with:
          name: eq-dag-d3b-balanced-topology
          run-id: 46009831478
          github-token: ${{ github.token }}
          path: d3b
      - uses: actions/checkout@v4
        with:
          repository: PhysicsQoo/RaWMoCS
          ref: 7ff6b1fdb772f16367fd1e094761a368d54f2ea7
          path: .rawmocs-dag
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.rawmocs-dag/crates/rawmocs-cli -> target'
      - name: Build published RaWMoCS v0.2.2
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev m4 make gcc time pkg-config
          test "$(git -C .rawmocs-dag rev-parse HEAD)" = 7ff6b1fdb772f16367fd1e094761a368d54f2ea7
          cargo build --locked --release --manifest-path .rawmocs-dag/crates/rawmocs-cli/Cargo.toml
      - name: Matched RaWMoCS topology screening
        run: |
          set -euo pipefail
          for d in d1d d2a d3 d3b; do (cd "$d" && sha256sum -c SHA256SUMS); done
          python3 -u rust/research/eq_dag_d3c_raw.py d1d d2a d3 d3b .rawmocs-dag .rawmocs-dag/crates/rawmocs-cli/target/release/rawmocs eq-dag-raw-evidence | tee raw-dag.log
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p eq-dag-raw-evidence
          test ! -f raw-dag.log || cp raw-dag.log eq-dag-raw-evidence/
          git rev-parse HEAD > eq-dag-raw-evidence/head.txt
          git rev-parse 'HEAD^{tree}' > eq-dag-raw-evidence/tree.txt
