name: Opt-in Rust QASM Strict Source Guard

on:
  pull_request:
    branches: [dev]
    paths:
      - 'rust/pathsum/src/qasm.rs'
      - 'rust/pathsum/src/rational.rs'
      - 'rust/pathsum/src/gates.rs'
      - 'test/test_rust_qasm_fail_closed.py'
      - 'test/test_rust_p_phase_semantics.py'
      - 'test/test_graphstate16_qiskit_provenance.py'
      - '.github/workflows/rust-qasm-source-guard.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
  push:
    branches:
      - fix/rust-qasm-fail-closed-20261023
    paths:
      - 'rust/pathsum/src/qasm.rs'
      - 'rust/pathsum/src/gates.rs'
      - 'test/test_rust_qasm_fail_closed.py'
      - 'test/test_rust_p_phase_semantics.py'
      - 'test/test_graphstate16_qiskit_provenance.py'
      - '.github/workflows/rust-qasm-source-guard.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
      - 'docs/development/rust-qasm-source-safety.md'
  workflow_dispatch:

permissions:
  contents: read

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    name: Incremental CI impact / rust-qasm-source-guard.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_heavy: ${{ steps.resolve.outputs.run_heavy }}
      reused_run_id: ${{ steps.resolve.outputs.reused_run_id }}
      measured_head_sha: ${{ steps.resolve.outputs.measured_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate incremental routing contract tests
        run: node .github/scripts/test-ci-impact-reuse.cjs
      - name: Validate previous successful results for unchanged source
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./.github/scripts/ci-impact-reuse.cjs');
            await resolve({
              github, context, core,
              workflowFile: 'rust-qasm-source-guard.yml',
              requiredJobs: [{"name":"Native parser and QASM source semantics","count":1}]
            });

  # Existing Rust/QASM source-level safety tests on one resolved Qiskit environment.
  qasm-guard:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' }}
    name: Native parser and QASM source semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native requirements and QuPRS with resolved dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          print("RESOLVED_QISKIT_VERSION", version("qiskit"))
          PY
      - name: Capture environment and metadata compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree-sha.txt
          python -m pip freeze > evidence/pip-freeze.txt
          python --version > evidence/python-version.txt 2>&1
          rustc --version > evidence/rustc-version.txt 2>&1
          python -m pip check 2>&1 | tee evidence/pip-check.txt
      - name: Run genuine Rust parse fail-closed unit regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml -p pathsum qasm::tests --lib --release -- --nocapture \
            2>&1 | tee evidence/rust-qasm-tests.log
      - name: Verify exact native P/U1 phase-normalization gate regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/Cargo.toml -p pathsum gates::tests::test_apply_p --lib --release -- --nocapture \
            2>&1 | tee evidence/rust-p-phase-tests.log
          cargo test --manifest-path rust/Cargo.toml -p pathsum gates::tests::test_p_u1_relative_phase_unit_contract --lib --release -- --nocapture \
            2>&1 | tee evidence/rust-p-u1-tests.log
      - name: Test public Python→Rust gate/parse behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_rust_qasm_fail_closed.py \
            test/test_rust_p_phase_semantics.py \
            --junitxml=evidence/qasm-python-rust-junit.xml \
            2>&1 | tee evidence/public-rust-qasm-tests.log
      - name: Verify Graphstate16 independent Qiskit full-state oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_graphstate16_qiskit_provenance.py \
            --junitxml=evidence/graphstate16-qiskit-junit.xml \
            2>&1 | tee evidence/graphstate16-qiskit-tests.log
      - name: Seal source and result evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum \
            rust/pathsum/src/qasm.rs \
            rust/pathsum/src/rational.rs \
            rust/pathsum/src/gates.rs \
            test/test_rust_qasm_fail_closed.py \
            test/test_rust_p_phase_semantics.py \
            test/test_graphstate16_qiskit_provenance.py \
            docs/development/graphstate16-qasm-provenance.md \
            .github/workflows/rust-qasm-source-guard.yml \
            docs/development/rust-qasm-source-safety.md > evidence/source-sha256.txt
          (
            cd evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Preserve source-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-qasm-source-guard-resolved
          path: evidence/
          retention-days: 30
          if-no-files-found: error
