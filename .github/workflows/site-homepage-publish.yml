name: QuPRS Homepage Publish

# Trusted dev-push trigger and optional manual recovery entry. The shared
# Website Publish workflow owns all homepage validation and publication logic.
on:
  # Auto-publish only changes relevant to the homepage after a dev merge.
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - 'scripts/site/stage-homepage.py'
      - 'scripts/site/test_homepage.py'
      - '.github/workflows/site-homepage.yml'
      - '.github/workflows/site-homepage-publish.yml'
      - '.github/workflows/website-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Optional manual recovery publish (dev or main only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  website-publish:
    uses: ./.github/workflows/website-publish.yml
    with:
      target: homepage
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: write
      actions: read
      pages: write
