name: QuPRS Homepage Publish

# Backward-compatible manual entry. The deployment implementation and approval
# logic now live in Website Publish; remove this adapter only after the new
# workflow is registered on the repository default branch.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation (manual maintainer action)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  website-publish:
    uses: ./.github/workflows/website-publish.yml
    with:
      target: homepage
      publish: ${{ inputs.publish }}
    permissions:
      contents: write
      actions: read
      pages: write
