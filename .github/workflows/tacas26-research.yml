name: TACAS26 Paper Reproduction — Experiment Branch

on:
  push:
    branches:
      - experiment/tacas26-paper-reproduction
    paths:
      - 'scripts/tacas26_*.py'
      - 'scripts/replay_tacas26_artifact.py'
      - 'test/test_tacas26_*.py'
      - 'docs/development/tacas26-*'
      - '.github/workflows/tacas26-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tacas26-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper-source-schema:
    name: TACAS paper case/oracle/source contracts (no Solver)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pure research tooling and install pytest
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/tacas26_compare_paper.py \
            scripts/tacas26_paper_matrix.py \
            scripts/tacas26_archive_qpe20_probe.py \
            scripts/replay_tacas26_artifact.py
          python -m pip install --disable-pip-version-check pytest
      - name: Audit official 184-call QuPRS protocol plus legacy 187-row evidence
        run: |
          python -m pytest \
            test/test_tacas26_paper_matrix.py \
            test/test_tacas26_published_oracle.py \
            test/test_tacas26_reproduction_ledger.py \
            test/test_tacas26_archive_probe.py \
            test/test_tacas26_quprs_only.py -q
          python scripts/tacas26_paper_matrix.py --list \
            > "$RUNNER_TEMP/tacas26-full-matrix-index.json"
          python scripts/tacas26_quprs_only.py --list \
            > "$RUNNER_TEMP/tacas26-quprs-only-plan.json"
      - name: Preserve legacy case index and canonical QuPRS-only plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tacas26-paper-source-contract-index
          path: |
            ${{ runner.temp }}/tacas26-full-matrix-index.json
            ${{ runner.temp }}/tacas26-quprs-only-plan.json
          retention-days: 14
          if-no-files-found: warn
