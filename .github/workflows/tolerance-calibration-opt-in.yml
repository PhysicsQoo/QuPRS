name: Opt-in Numerical Tolerance Calibration

on:
  push:
    branches:
      - 'experiment/**'
    paths:
      - '.diagnostics/tolerance_calibration/**'
      - 'test/test_numerical_tolerance_contract_research.py'
      - 'test/test_precision_count_transport.py'
      - '.diagnostics/tolerance_calibration/printed_distance_parity.tsv'
      - 'test/test_rr_approximation_provenance.py'
      - 'test/test_wmc_distance_resolution_research.py'
      - 'test/test_gpmc_precision_budget.py'
      - 'test/test_wmc_integer_phase_encoding.py'
      - 'src/QuPRS/utils/gpmc_distance_budget.py'
      - 'src/QuPRS/utils/gpmc_cnf_metadata.py'
      - 'src/QuPRS/pathsum/reduction_provenance.py'
      - 'src/QuPRS/pathsum/reduction.py'
      - 'src/QuPRS/pathsum/pattern_match.py'
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'src/QuPRS/utils/precision_count.py'
      - 'src/QuPRS/utils/wmc_solvers.py'
      - 'src/QuPRS/utils/solver_adapter.py'
      - 'src/QuPRS/interface/ps2wmc.py'
      - 'rust/pathsum/src/precision_count.rs'
      - 'rust/pathsum/src/solver_adapter.rs'
      - 'rust/pathsum/src/wmc.rs'
      - 'rust/pathsum/src/lib.rs'
      - 'rust/python_ffi/src/api.rs'
      - '.github/workflows/tolerance-calibration-opt-in.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tolerance-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-distance-contract:
    name: Focused numerical distance and solver regression
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'research(boundary):') && !startsWith(github.event.head_commit.message, 'research(precision):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build source and native solvers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution
          python -m pip check
      - name: Test focused distance and numerical contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python -m compileall -q test/test_numerical_tolerance_contract_research.py
          python -m pytest -q -ra -s test/test_numerical_tolerance_contract_research.py \
            --junitxml=focused-tolerance-evidence/junit.xml \
            2>&1 | tee focused-tolerance-evidence/pytest.log
      - name: Verify Python and Rust solver precision-format parsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python -m pytest -q -ra test/test_wmc_solver_adapters.py             --junitxml=focused-tolerance-evidence/parser-python-junit.xml             2>&1 | tee focused-tolerance-evidence/parser-python.log
          cargo test --manifest-path rust/pathsum/Cargo.toml             mode6_complex_scientific_output -- --nocapture             2>&1 | tee focused-tolerance-evidence/parser-rust.log

      - name: Check MPFR count-output digit transport
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror             .diagnostics/tolerance_calibration/mpfr_result_printer_probe.c             -lmpfr -lgmp -o /tmp/quprs-mpfr-printer
          /tmp/quprs-mpfr-printer | tee focused-tolerance-evidence/mpfr-printer.log
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path
          output = dict(
              row.split(' ', 1) for row in
              Path('focused-tolerance-evidence/mpfr-printer.log').read_text().splitlines()
          )
          exact = Decimal('0.99999999999999994746875')
          assert Decimal(output['short']) == Decimal('1')
          assert abs(Decimal(output['long']) - exact) < Decimal('1e-35')
          print('MPFR_PRINT_TRANSPORT_PASS')
          PY

      - name: Verify printed-count projective distance in Python Decimal and Rust MPFR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python .diagnostics/tolerance_calibration/precision_transport_probe.py \
            --out focused-tolerance-evidence \
            2>&1 | tee focused-tolerance-evidence/transport-python.log
          cargo test --release \
            --manifest-path .diagnostics/tolerance_calibration/rust_precision_transport/Cargo.toml \
            2>&1 | tee focused-tolerance-evidence/transport-rust-tests.log
          cargo run --release \
            --manifest-path .diagnostics/tolerance_calibration/rust_precision_transport/Cargo.toml \
            -- focused-tolerance-evidence/transport-input.tsv \
            focused-tolerance-evidence/transport-rust.tsv \
            2>&1 | tee focused-tolerance-evidence/transport-rust.log
          python .diagnostics/tolerance_calibration/precision_transport_probe.py \
            --out focused-tolerance-evidence --verify \
            2>&1 | tee focused-tolerance-evidence/transport-parity.log

      - name: Validate production precision-count consumer contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python -m pytest -q -ra test/test_precision_count_transport.py \
            --junitxml=focused-tolerance-evidence/production-precision-python-junit.xml \
            2>&1 | tee focused-tolerance-evidence/production-precision-python.log
          cargo test --manifest-path rust/pathsum/Cargo.toml \
            precision_count::tests -- --nocapture \
            2>&1 | tee focused-tolerance-evidence/production-precision-rust.log
          cargo test --manifest-path rust/pathsum/Cargo.toml \
            third_adapter_runs_via_existing_supervisor -- --nocapture \
            2>&1 | tee focused-tolerance-evidence/production-precision-rust-solver.log

      - name: Run native precision transport comparison (research only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python -m pytest -q -ra -s \
            .diagnostics/tolerance_calibration/test_native_precision_transport.py \
            --junitxml=focused-tolerance-evidence/precision-junit.xml \
            2>&1 | tee focused-tolerance-evidence/precision-test.log
      - name: Verify RR provenance fail-closed and exact rule controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra test/test_rr_approximation_provenance.py \
            --junitxml=focused-tolerance-evidence/rr-provenance-junit.xml \
            2>&1 | tee focused-tolerance-evidence/rr-provenance.log
      - name: Test GPMC budget/replay and fail-closed conditions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra test/test_gpmc_precision_budget.py \
            --junitxml=focused-tolerance-evidence/gpmc-budget-junit.xml \
            2>&1 | tee focused-tolerance-evidence/gpmc-budget.log
      - name: Ensure integer-cycle phases produce numeric WMC weights
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra test/test_wmc_integer_phase_encoding.py \
            --junitxml=focused-tolerance-evidence/wmc-integer-phase-junit.xml \
            2>&1 | tee focused-tolerance-evidence/wmc-integer-phase.log
      - name: Independently enumerate small printed GPMC CNFs with exact rational arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra .diagnostics/tolerance_calibration/test_exact_gpmc_cnf_oracle.py \
            --junitxml=focused-tolerance-evidence/exact-cnf-junit.xml \
            2>&1 | tee focused-tolerance-evidence/exact-cnf.log
      - name: Stress GPMC precision model across rotations, cancellations and small algorithm families
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/gpmc_model_validation.py \
            2>&1 | tee focused-tolerance-evidence/gpmc-model-stress.log
      - name: Characterize native WMC printed-count distance resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra -s test/test_wmc_distance_resolution_research.py \
            --junitxml=focused-tolerance-evidence/wmc-resolution-junit.xml \
            2>&1 | tee focused-tolerance-evidence/wmc-resolution.log
      - name: Native Rz source and RR precision observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          python -u .diagnostics/tolerance_calibration/native_rz_rr_probe.py \
            2>&1 | tee focused-tolerance-evidence/native-rz-rr-probe.log
      - name: Audit Rust native source-to-CNF weight bytes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/pathsum/Cargo.toml \
            native_rz_weight_bytes_audit -- --nocapture \
            2>&1 | tee focused-tolerance-evidence/native-rust-weight.log
          python .diagnostics/tolerance_calibration/rust_native_weight_audit.py \
            2>&1 | tee focused-tolerance-evidence/native-rust-weight-audit.log
      - name: Compare Rust CNF f64 against high-precision weight candidates and circuit RR
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/native_weight_rr_followup.py \
            2>&1 | tee focused-tolerance-evidence/native-weight-rr-followup.log
      - name: Audit native Rust MPFR phase-to-weight precision against solvers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path \
            .diagnostics/tolerance_calibration/rust_precision_transport/Cargo.toml \
            --bin phase_weight_mpfr -- --nocapture \
            2>&1 | tee focused-tolerance-evidence/native-rust-mpfr-weights-tests.log
          python -u .diagnostics/tolerance_calibration/native_rust_mpfr_weight_ab.py \
            2>&1 | tee focused-tolerance-evidence/native-rust-mpfr-weight-ab.log
      - name: Record evidence and checksum
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-tolerance-evidence
          git rev-parse HEAD > focused-tolerance-evidence/source-sha.txt
          git rev-parse 'HEAD^{tree}' > focused-tolerance-evidence/source-tree.txt
          python --version > focused-tolerance-evidence/python-version.txt
          rustc --version > focused-tolerance-evidence/rustc-version.txt
          sha256sum .diagnostics/tolerance_calibration/native_rz_rr_probe.py \
            .diagnostics/tolerance_calibration/rust_native_weight_audit.py \
            .diagnostics/tolerance_calibration/native_weight_rr_followup.py \
            .diagnostics/tolerance_calibration/gpmc_model_validation.py \
            .diagnostics/tolerance_calibration/exact_gpmc_cnf_oracle.py \
            .diagnostics/tolerance_calibration/test_exact_gpmc_cnf_oracle.py \
            .diagnostics/tolerance_calibration/native_rust_mpfr_weight_ab.py \
            .diagnostics/tolerance_calibration/rust_precision_transport/src/bin/phase_weight_mpfr.rs \
            test/test_numerical_tolerance_contract_research.py \
            test/test_precision_count_transport.py \
            test/test_rr_approximation_provenance.py \
            test/test_wmc_distance_resolution_research.py \
            test/test_gpmc_precision_budget.py \
            test/test_wmc_integer_phase_encoding.py \
            src/QuPRS/utils/gpmc_distance_budget.py \
            src/QuPRS/utils/gpmc_cnf_metadata.py \
            src/QuPRS/interface/ps2wmc.py \
            src/QuPRS/pathsum/reduction_provenance.py \
            src/QuPRS/pathsum/reduction.py \
            src/QuPRS/pathsum/pattern_match.py \
            src/QuPRS/interface/load_qiskit.py \
            src/QuPRS/utils/precision_count.py \
            src/QuPRS/utils/solver_adapter.py \
            src/QuPRS/interface/ps2wmc.py \
            rust/pathsum/src/precision_count.rs \
            rust/pathsum/src/solver_adapter.rs \
            rust/pathsum/src/lib.rs \
            rust/python_ffi/src/api.rs \
            test/test_wmc_solver_adapters.py \
            src/QuPRS/utils/wmc_solvers.py \
            rust/pathsum/src/wmc.rs \
            .diagnostics/tolerance_calibration/mpfr_result_printer_probe.c \
            .diagnostics/tolerance_calibration/high_precision_count_fixture.tsv \
            .diagnostics/tolerance_calibration/printed_distance_parity.tsv \
            .diagnostics/tolerance_calibration/precision_transport_probe.py \
            .diagnostics/tolerance_calibration/rust_precision_transport/Cargo.toml \
            .diagnostics/tolerance_calibration/rust_precision_transport/src/main.rs \
            .diagnostics/tolerance_calibration/test_native_precision_transport.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > focused-tolerance-evidence/source-files-sha256.txt
          (
            cd focused-tolerance-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-tolerance-contract-evidence
          path: focused-tolerance-evidence/
          retention-days: 30
          if-no-files-found: error

  public-single-pass-boundary:
    # Scoped experiment only: do not rerun 95-case pilots or old precision
    # replays on a code-review or release branch.
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'research(boundary):')
    name: Experimental single-solve public output and QPE boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PUBLIC_DEV_SHA: '55e78c7597966617c1a193b89056ff4e99c3ddfb'
    steps:
      - name: Check out existing experimental branch and native GPMC
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native solver build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
      - name: Materialize exact public dev source without changing any Git checkout
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/public-dev-source"
          mkdir -p "$BASELINE" "$RUNNER_TEMP/public-boundary-evidence"
          git cat-file -e "$PUBLIC_DEV_SHA^{commit}"
          git archive "$PUBLIC_DEV_SHA" | tar -x -C "$BASELINE"
          rm -rf "$BASELINE/GPMC"
          ln -s "$GITHUB_WORKSPACE/GPMC" "$BASELINE/GPMC"
          printf '%s\n' "$PUBLIC_DEV_SHA" > "$BASELINE/PUBLIC_DEV_BASELINE_SHA.txt"
          test "$(git rev-parse "$PUBLIC_DEV_SHA:GPMC")" = "$(git rev-parse "HEAD:GPMC")"
          printf '%s\n' "$PUBLIC_DEV_SHA" > "$RUNNER_TEMP/public-boundary-evidence/dev-sha.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/public-boundary-evidence/experiment-sha.txt"
          printf 'source=%s\n' "$BASELINE" >> "$GITHUB_OUTPUT"
      - name: Build and install exact public dev verifier and selected native solvers
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution
          python -m pip check
      - name: Run bounded raw GPMC printed-count and Rust QPE source study
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python -u "$GITHUB_WORKSPACE/.diagnostics/tolerance_calibration/public_api_boundary_probe.py" \
            --expected-dev-sha "$PUBLIC_DEV_SHA" \
            --output "$RUNNER_TEMP/public-boundary-evidence" \
            2>&1 | tee "$RUNNER_TEMP/public-boundary-evidence/study.log"
      - name: Seal exact source and experimental report hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/public-boundary-evidence"
          sha256sum .diagnostics/tolerance_calibration/public_api_boundary_probe.py \
            .github/workflows/tolerance-calibration-opt-in.yml > "$OUT/study-source-sha256.txt"
          (cd "$OUT"; find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 -r sha256sum > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: Upload bounded numerical experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-public-single-pass-boundary-experiment
          path: ${{ runner.temp }}/public-boundary-evidence/
          retention-days: 30
          if-no-files-found: error

  experimental-precision-followup:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'research(precision):')
    name: Experimental MPFR printer actual-CNF and Rust QPE source boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PUBLIC_DEV_SHA: '55e78c7597966617c1a193b89056ff4e99c3ddfb'
      QUPRS_LARGE_CNF_ONLY: '1'
    steps:
      - name: Checkout existing experiment source and native GPMC
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
      - name: Materialize exact public dev source outside Git checkout
        id: source
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/public-dev-precision-source"
          mkdir -p "$DEST" "$RUNNER_TEMP/precision-followup-evidence"
          git cat-file -e "$PUBLIC_DEV_SHA^{commit}"
          test "$(git rev-parse "$PUBLIC_DEV_SHA:GPMC")" = "$(git rev-parse 'HEAD:GPMC')"
          git archive "$PUBLIC_DEV_SHA" | tar -x -C "$DEST"
          # git archive can materialize a placeholder GPMC directory: replace it
          # before linking the exact checked-out gitlink, rather than nesting.
          rm -rf "$DEST/GPMC"
          ln -s "$GITHUB_WORKSPACE/GPMC" "$DEST/GPMC"
          test -f "$DEST/GPMC/CMakeLists.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/precision-followup-evidence/experiment-sha.txt"
          printf '%s\n' "$PUBLIC_DEV_SHA" > "$RUNNER_TEMP/precision-followup-evidence/dev-sha.txt"
          printf 'source=%s\n' "$DEST" >> "$GITHUB_OUTPUT"
      - name: Build pinned public Python Rust verifier and native solvers
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution
          python -m pip check
      - name: Compile pinned GPMC MPFR printer probe
        if: ${{ !contains(github.event.head_commit.message, 'large-only') }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I "$GITHUB_WORKSPACE/GPMC" \
            "$GITHUB_WORKSPACE/.diagnostics/tolerance_calibration/printer_mpfr_contract.cpp" \
            -lmpfr -lgmpxx -lgmp -o "$RUNNER_TEMP/mpfr-printer-contract"
      - name: Prove bounded MPFR 90-digit stream rounding against binary mantissas
        if: ${{ !contains(github.event.head_commit.message, 'large-only') }}
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python -u "$GITHUB_WORKSPACE/.diagnostics/tolerance_calibration/precision_followup_v2.py" \
            --mode printer --printer-binary "$RUNNER_TEMP/mpfr-printer-contract" \
            --output "$RUNNER_TEMP/precision-followup-evidence" \
            2>&1 | tee "$RUNNER_TEMP/precision-followup-evidence/printer-study.log"
      - name: Diagnose Rust QPEexact8 input uncertainty from captured CNF and stdout
        if: ${{ !contains(github.event.head_commit.message, 'large-only') }}
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python -u "$GITHUB_WORKSPACE/.diagnostics/tolerance_calibration/precision_followup_v2.py" \
            --mode rust --output "$RUNNER_TEMP/precision-followup-evidence" \
            2>&1 | tee "$RUNNER_TEMP/precision-followup-evidence/rust-qpe-study.log"
      - name: Generate real algorithm-family CNFs with bounded solving
        shell: bash
        working-directory: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          python -u "$GITHUB_WORKSPACE/.diagnostics/tolerance_calibration/precision_followup_v2.py" \
            --mode corpus --output "$RUNNER_TEMP/precision-followup-evidence" \
            2>&1 | tee "$RUNNER_TEMP/precision-followup-evidence/real-cnf-study.log"
      - name: Seal source provenance and study evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/precision-followup-evidence"
          mkdir -p "$OUT"
          git rev-parse 'HEAD^{tree}' > "$OUT/experiment-tree.txt"
          sha256sum .diagnostics/tolerance_calibration/printer_mpfr_contract.cpp \
            .diagnostics/tolerance_calibration/precision_followup_v2.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > "$OUT/study-source-sha256.txt"
          (cd "$OUT"; find . -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 -r sha256sum > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: Upload native precision research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mpfr-cnf-rust-qpe-science-v2
          path: ${{ runner.temp }}/precision-followup-evidence/
          retention-days: 30
          if-no-files-found: error

  numerical-observations:
    if: github.event_name == 'workflow_dispatch'
    name: Python Rust RR Hybrid WMC paired tolerance observations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout pinned experiment source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native QuPRS and independent solvers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution
          python -m pip check

      - name: Fast compile sanity for experimental Python changes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/QuPRS/config.py src/QuPRS/pathsum/gates \
            .diagnostics/tolerance_calibration/gate_phase_study.py
          python - <<'PY'
          import math
          from QuPRS import config
          prior=config.get_tolerance()
          try:
              for value in (float("nan"),float("inf"),float("-inf"),True,False,0,-1):
                  try:
                      config.set_tolerance(value)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError(("invalid accepted",value))
                  assert config.get_tolerance()==prior
          finally:
              config.set_tolerance(prior)
          print("TOLERANCE_SETTER_SMOKE_PASS")
          PY

      - name: Run source-pinned bounded tolerance comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          python -u .diagnostics/tolerance_calibration/run_matrix.py \
            2>&1 | tee tolerance-calibration-results/runner.log

      - name: Validate existing strict native source contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          python -m pytest -q -ra \
            test/test_exact_diagonal_oracle.py \
            test/test_rust_p_phase_semantics.py \
            test/test_rust_global_phase_qasm_contract.py \
            --junitxml=tolerance-calibration-results/strict-source-junit.xml \
            2>&1 | tee tolerance-calibration-results/strict-source.log

      - name: Validate WMC-only tolerance API and numerical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_wmc_tolerance_api.py \
            test/test_wmc_boundary_parity.py \
            --junitxml=tolerance-calibration-results/wmc-api-junit.xml \
            2>&1 | tee tolerance-calibration-results/wmc-api.log

      - name: Validate Graphstate strict and independent approximate contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_graphstate16_source_contract.py \
            -k 'test_graphstate_strict_non_equivalence_up_to_phase or test_graphstate_independent_approximate_contract' \
            --junitxml=tolerance-calibration-results/graphstate-junit.xml \
            2>&1 | tee tolerance-calibration-results/graphstate.log

      - name: Compare opt-in numerical policy, source strictness and solver precision
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/followup_matrix.py \
            2>&1 | tee tolerance-calibration-results/followup.log

      - name: Experiment on gate-phase preservation and reduction hits
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/gate_phase_study.py \
            2>&1 | tee tolerance-calibration-results/gate-phase.log

      - name: Run resource-bounded QFT QPE Graphstate paired source benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/representative_pairs.py \
            2>&1 | tee tolerance-calibration-results/representative-pairs.log

      - name: Run bounded paper-first magnitude calibration pilot
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/paper_precision_pilot.py \
            2>&1 | tee tolerance-calibration-results/paper-precision-pilot.log

      - name: Seal results and source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          git rev-parse HEAD > tolerance-calibration-results/source-sha.txt
          git rev-parse 'HEAD^{tree}' > tolerance-calibration-results/source-tree.txt
          git status --porcelain > tolerance-calibration-results/git-status.txt
          python --version > tolerance-calibration-results/python-version.txt
          rustc --version > tolerance-calibration-results/rustc-version.txt
          uname -a > tolerance-calibration-results/kernel.txt
          python -m pip freeze > tolerance-calibration-results/python-packages.txt
          sha256sum \
            .diagnostics/tolerance_calibration/run_matrix.py \
            .diagnostics/tolerance_calibration/followup_matrix.py \
            .diagnostics/tolerance_calibration/gate_phase_study.py \
            .diagnostics/tolerance_calibration/representative_pairs.py \
            .diagnostics/tolerance_calibration/paper_precision_pilot.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > tolerance-calibration-results/source-files-sha256.txt
          (
            cd tolerance-calibration-results
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve raw experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tolerance-calibration-observations
          path: tolerance-calibration-results/
          retention-days: 30
          if-no-files-found: error
  ganak-printer-paired-source:
    name: Ganak v2.8.0 same-source printer A/B
    # Re-run the pinned source-building A/B only on explicit demand.
    # Producer source and its 48 native observations are unchanged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out pinned experimental scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config help2man \
            libgmp-dev libmpfr-dev zlib1g-dev curl git time

      - name: Build baseline and printer-only candidate, run paired native CNFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganak-ab-evidence
          bash .diagnostics/tolerance_calibration/build_ganak_printer_ab.sh \
            2>&1 | tee ganak-ab-evidence/build.log

      - name: Seal source and result identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganak-ab-evidence
          git rev-parse HEAD > ganak-ab-evidence/quprs-source-head.txt
          git rev-parse 'HEAD^{tree}' > ganak-ab-evidence/quprs-source-tree.txt
          python --version > ganak-ab-evidence/python-version.txt
          cmake --version | head -n 1 > ganak-ab-evidence/cmake-version.txt
          sha256sum \
            .diagnostics/tolerance_calibration/build_ganak_printer_ab.sh \
            .diagnostics/tolerance_calibration/ganak_printer_ab.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > ganak-ab-evidence/experiment-source-sha256.txt
          (
            cd ganak-ab-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z |
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload paired baseline and high-precision candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganak-printer-paired-source-evidence
          path: ganak-ab-evidence/
          retention-days: 30
          if-no-files-found: error
