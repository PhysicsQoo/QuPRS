                      pass
                  else:
                      raise AssertionError(("invalid accepted",value))
                  assert config.get_tolerance()==prior
          finally:
              config.set_tolerance(prior)
          print("TOLERANCE_SETTER_SMOKE_PASS")
          PY

      - name: Run source-pinned bounded tolerance comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          python -u .diagnostics/tolerance_calibration/run_matrix.py \
            2>&1 | tee tolerance-calibration-results/runner.log

      - name: Validate existing strict native source contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          python -m pytest -q -ra \
            test/test_exact_diagonal_oracle.py \
            test/test_rust_p_phase_semantics.py \
            test/test_rust_global_phase_qasm_contract.py \
            --junitxml=tolerance-calibration-results/strict-source-junit.xml \
            2>&1 | tee tolerance-calibration-results/strict-source.log

      - name: Validate WMC-only tolerance API and numerical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_wmc_tolerance_api.py \
            test/test_wmc_boundary_parity.py \
            --junitxml=tolerance-calibration-results/wmc-api-junit.xml \
            2>&1 | tee tolerance-calibration-results/wmc-api.log

      - name: Validate Graphstate strict and independent approximate contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_graphstate16_source_contract.py \
            -k 'test_graphstate_strict_non_equivalence_up_to_phase or test_graphstate_independent_approximate_contract' \
            --junitxml=tolerance-calibration-results/graphstate-junit.xml \
            2>&1 | tee tolerance-calibration-results/graphstate.log

      - name: Compare opt-in numerical policy, source strictness and solver precision
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/followup_matrix.py \
            2>&1 | tee tolerance-calibration-results/followup.log

      - name: Experiment on gate-phase preservation and reduction hits
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/gate_phase_study.py \
            2>&1 | tee tolerance-calibration-results/gate-phase.log

      - name: Run resource-bounded QFT QPE Graphstate paired source benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/representative_pairs.py \
            2>&1 | tee tolerance-calibration-results/representative-pairs.log

      - name: Run bounded paper-first magnitude calibration pilot
        shell: bash
        run: |
          set -euo pipefail
          python -u .diagnostics/tolerance_calibration/paper_precision_pilot.py \
            2>&1 | tee tolerance-calibration-results/paper-precision-pilot.log

      - name: Seal results and source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tolerance-calibration-results
          git rev-parse HEAD > tolerance-calibration-results/source-sha.txt
          git rev-parse 'HEAD^{tree}' > tolerance-calibration-results/source-tree.txt
          git status --porcelain > tolerance-calibration-results/git-status.txt
          python --version > tolerance-calibration-results/python-version.txt
          rustc --version > tolerance-calibration-results/rustc-version.txt
          uname -a > tolerance-calibration-results/kernel.txt
          python -m pip freeze > tolerance-calibration-results/python-packages.txt
          sha256sum \
            .diagnostics/tolerance_calibration/run_matrix.py \
            .diagnostics/tolerance_calibration/followup_matrix.py \
            .diagnostics/tolerance_calibration/gate_phase_study.py \
            .diagnostics/tolerance_calibration/representative_pairs.py \
            .diagnostics/tolerance_calibration/paper_precision_pilot.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > tolerance-calibration-results/source-files-sha256.txt
          (
            cd tolerance-calibration-results
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve raw experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tolerance-calibration-observations
          path: tolerance-calibration-results/
          retention-days: 30
          if-no-files-found: error
  ganak-printer-paired-source:
    name: Ganak v2.8.0 same-source printer A/B
    # Re-run the pinned source-building A/B only on explicit demand.
    # Producer source and its 48 native observations are unchanged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out pinned experimental scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config help2man \
            libgmp-dev libmpfr-dev zlib1g-dev curl git time

      - name: Build baseline and printer-only candidate, run paired native CNFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganak-ab-evidence
          bash .diagnostics/tolerance_calibration/build_ganak_printer_ab.sh \
            2>&1 | tee ganak-ab-evidence/build.log

      - name: Seal source and result identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganak-ab-evidence
          git rev-parse HEAD > ganak-ab-evidence/quprs-source-head.txt
          git rev-parse 'HEAD^{tree}' > ganak-ab-evidence/quprs-source-tree.txt
          python --version > ganak-ab-evidence/python-version.txt
          cmake --version | head -n 1 > ganak-ab-evidence/cmake-version.txt
          sha256sum \
            .diagnostics/tolerance_calibration/build_ganak_printer_ab.sh \
            .diagnostics/tolerance_calibration/ganak_printer_ab.py \
            .github/workflows/tolerance-calibration-opt-in.yml \
            > ganak-ab-evidence/experiment-source-sha256.txt
          (
            cd ganak-ab-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z |
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload paired baseline and high-precision candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganak-printer-paired-source-evidence
          path: ganak-ab-evidence/
          retention-days: 30
          if-no-files-found: error
