name: Website Dev Deploy

# The only automatic dev-push entrypoint for Homepage, Playground and /docs/dev.
# Validators remain reusable; stable signed release uses docs-release-publish.
# Preserve the existing gh-pages source, shared publication lock and Environments.
on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/test-docs-workflow-coverage.cjs'
      - '.github/workflows/browser-workbench.yml'
      - '.github/workflows/docs-release-publish.yml'
      - '.github/workflows/rust-api-docs.yml'
      - '.github/workflows/site-homepage.yml'
      - '.github/workflows/website-ci.yml'
      - '.github/workflows/website-deploy.yml'
      - '.github/workflows/website-publish.yml'
      - 'docs/requirements-site.txt'
      - 'docs/requirements-versioned.txt'
      - 'docs/site/**'
      - 'mkdocs.yml'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/quprs/**'
      - 'rust/quprs/Cargo.toml'
      - 'rust/quprs/README.md'
      - 'rust/quprs/build.rs'
      - 'rust/quprs/native/**'
      - 'rust/quprs/src/**'
      - 'rust/quprs/tests/**'
      - 'rust/web/**'
      - 'scripts/build-rustdoc.sh'
      - 'scripts/check_docs_gate_stubs.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_docs_science.py'
      - 'scripts/check_docs_site.py'
      - 'scripts/check_docs_visual.py'
      - 'scripts/check_rust_api_docs.py'
      - 'scripts/docs_versioning.py'
      - 'scripts/generate_stubs.py'
      - 'scripts/rustdoc_navigation.css'
      - 'scripts/rustdoc_quprs_head.html'
      - 'scripts/rustdoc_version_selector.js'
      - 'scripts/site/stage-homepage.py'
      - 'scripts/site/test_homepage.py'
      - 'scripts/site/test_website_impact.py'
      - 'scripts/site/website-impact.py'
      - 'scripts/stage_rust_crate_candidate.py'
      - 'scripts/web/**'
      - 'src/QuPRS/__init__.py'
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'src/QuPRS/pathsum/__init__.py'
      - 'src/QuPRS/pathsum/core.py'
      - 'src/QuPRS/pathsum/core.pyi'
      - 'src/QuPRS/pathsum/gates/**'
      - 'src/QuPRS/pathsum/statistics.py'
      - 'src/QuPRS/py.typed'
      - 'test/test_docs_auto_publication.py'
      - 'test/test_docs_rustdoc_versions.py'
      - 'web/**'
      - 'website/**'

permissions:
  contents: read

concurrency:
  group: quprs-website-dev-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  impact:
    name: Website / Dev changed-path routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      homepage: ${{ steps.scope.outputs.homepage }}
      browser: ${{ steps.scope.outputs.browser }}
      docs_reference: ${{ steps.scope.outputs.docs_reference }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify routing fixtures
        run: python -m unittest discover -s scripts/site -p test_website_impact.py -v
      - name: Select changed site subsystems from the exact protected push
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/site/website-impact.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  homepage:
    name: Website / Publish Homepage
    needs: impact
    if: needs.impact.outputs.homepage == 'true'
    uses: ./.github/workflows/website-publish.yml
    with:
      target: homepage
      publish: true
    permissions:
      contents: write
      actions: read
      pages: write

  playground:
    name: Website / Publish Playground
    needs: impact
    if: needs.impact.outputs.browser == 'true'
    uses: ./.github/workflows/website-publish.yml
    with:
      target: playground
      publish: true
    permissions:
      contents: write
      actions: read
      pages: write

  docs-dev:
    name: Website / Publish Dev Docs and Rustdoc
    needs: impact
    if: needs.impact.outputs.docs_reference == 'true'
    uses: ./.github/workflows/rust-api-docs.yml
    permissions:
      contents: write
      pull-requests: read
      actions: read
