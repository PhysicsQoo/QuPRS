name: Website Publish

# Reusable automatic (trusted dev push) and manual recovery publication control.
# No source job requests a deployment Environment from dev/main. It
# updates only the existing gh-pages source, then requests and verifies the
# legacy Pages build. Existing github-pages Environment rules are unchanged.
# Documentation stable/dev and PR-preview workflows retain their independent
# admission policies and keep the shared gh-pages serialization lock.
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      release_tag:
        description: Signed stable tag for guarded browser publication
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target:
        description: Select the isolated website subtree to publish
        required: true
        type: choice
        options:
          - playground
          - homepage
        default: playground
      publish:
        description: Manual recovery only (automatic dev-push publication needs no input)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quprs-website-publish-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  browser-validation:
    name: Website / Browser WASM admission
    if: ${{ inputs.target == 'playground' }}
    uses: ./.github/workflows/browser-workbench.yml
    permissions:
      contents: read

  browser-stable-validation:
    name: Website / Signed stable Browser WASM admission
    needs: policy
    if: ${{ inputs.target == 'playground-stable' && needs.policy.result == 'success' }}
    uses: ./.github/workflows/browser-workbench.yml
    with:
      source_sha: ${{ needs.policy.outputs.source_sha }}
      release_tag: ${{ inputs.release_tag }}
    permissions:
      contents: read

  homepage-validation:
    name: Website / Homepage admission
    if: ${{ inputs.target == 'homepage' }}
    uses: ./.github/workflows/site-homepage.yml
    permissions:
      contents: read

  policy:
    name: Verify trusted source-publishing policy
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    env:
      TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_REF: ${{ github.event.workflow_run.head_branch }}
      SOURCE_RUN_EVENT: ${{ github.event.workflow_run.event }}
      SOURCE_RUN_REPO: ${{ github.event.workflow_run.repository.full_name }}
      SOURCE_RUN_PATH: ${{ github.event.workflow_run.path }}
      SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected branch or signed release
        id: gate
        run: |
          set -euo pipefail
          if [[ "$TARGET" == playground-stable ]]; then
            test "$GITHUB_REF" = refs/heads/main
            case "$GITHUB_EVENT_NAME" in
              workflow_run)
                test "$SOURCE_RUN_EVENT" = push
                test "$SOURCE_RUN_REPO" = "$GITHUB_REPOSITORY"
                test "$SOURCE_RUN_PATH" = .github/workflows/python-publish.yml
                test "$SOURCE_RUN_CONCLUSION" = success
                test "$SOURCE_RUN_REF" = "$RELEASE_TAG"
                ;;
              push|workflow_dispatch) ;;
              *) echo "::error::Unsupported stable release event"; exit 1 ;;
            esac
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
              test "$SOURCE_RUN_SHA" = "$source_sha"
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)" = tag
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.verified)" = true
            release_state="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | tostring')"
            test "$release_state" = '[false,false]'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&per_page=100" |
              jq -e --arg tag "$RELEASE_TAG" --arg sha "$source_sha" '
                [.workflow_runs[] | select(
                  .name == "Build and Publish Python Package" and .event == "push"
                  and .path == ".github/workflows/python-publish.yml"
                  and .head_branch == $tag and .head_sha == $sha
                  and .conclusion == "success"
                )] | length >= 1
              ' >/dev/null
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            echo "Signed stable release admitted: $RELEASE_TAG at $source_sha"
          else
            case "$GITHUB_EVENT_NAME" in
              push) test "$GITHUB_REF" = refs/heads/dev ;;
              workflow_dispatch)
                [[ "$GITHUB_REF" == refs/heads/dev || "$GITHUB_REF" == refs/heads/main ]] ;;
              *) echo "::error::Untrusted website publication event"; exit 1 ;;
            esac
            case "$TARGET" in
              playground|homepage) ;;
              *) echo "::error::Unexpected publication target"; exit 1 ;;
            esac
          fi

  publish:
    name: Publish isolated, validated Pages content
    needs: [browser-validation, browser-stable-validation, homepage-validation, policy]
    if: >-
      ${{ always() && !cancelled() && inputs.publish == true &&
          needs.policy.result == 'success' &&
          ((inputs.target == 'playground' && needs.browser-validation.result == 'success' &&
            needs.browser-stable-validation.result == 'skipped' &&
            needs.homepage-validation.result == 'skipped') ||
           (inputs.target == 'homepage' && needs.homepage-validation.result == 'success' &&
            needs.browser-validation.result == 'skipped' &&
            needs.browser-stable-validation.result == 'skipped') ||
           (inputs.target == 'playground-stable' &&
            needs.browser-stable-validation.result == 'success' &&
            needs.browser-validation.result == 'skipped' &&
            needs.homepage-validation.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: quprs-gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ needs.policy.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true
      - uses: actions/download-artifact@v4
        if: ${{ inputs.target == 'playground' }}
        with:
          name: tested-browser-site
          path: browser-site

      - name: Confirm the existing GitHub Pages branch source
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-config.json"
          python3 - "$RUNNER_TEMP/pages-config.json" <<'PYCODE'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f:
              p=json.load(f)
          assert p.get("build_type")=="legacy", "Expected existing branch publication"
          assert p.get("source")=={"branch":"gh-pages","path":"/"}, "Unexpected Pages source"
          PYCODE
          echo "PAGES_BASE=https://physicsqoo.github.io/QuPRS" >> "$GITHUB_ENV"

      - name: Reject obsolete source after concurrent dev merges
        if: ${{ inputs.target != 'playground-stable' }}
        run: |
          set -euo pipefail
          # Run under the shared Pages publication lock, immediately before
          # staging, so an older long-running WASM build cannot overwrite a
          # newer dev version that has already merged.
          branch="${GITHUB_REF#refs/heads/}"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::Validated source $GITHUB_SHA is stale; $branch is now $latest"
            exit 1
          fi

      - name: Stage only the selected Pages subtree
        if: ${{ inputs.target != 'playground-stable' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            playground)
              test "$(tr -d '\r\n' < browser-site/source-sha.txt)" = "$GITHUB_SHA"
              test -f browser-site/index.html
              test -f browser-site/app.js
              test -f browser-site/worker.js
              test -f browser-site/pkg/quprs_web_bg.wasm
              test -f browser-site/engines/gpmc.wasm
              python3 source/scripts/web/stage-versioned-pages.py dev browser-site pages --sha "$GITHUB_SHA"
              ;;
            homepage)
              python3 source/scripts/site/stage-homepage.py source/website pages "$GITHUB_SHA"
              ;;
            *) exit 1 ;;
          esac
          python3 - "$TARGET" <<'PYCODE'
          import subprocess,sys
          target=sys.argv[1]
          paths=subprocess.check_output(
              ["git","-C","pages","diff","--cached","--name-only"],text=True
          ).splitlines()
          assert all(
              (p=="index.html" if target=="homepage" else p.startswith("playground/dev/"))
              for p in paths
          ),f"Unrelated Pages files staged: {paths}"
          print(f"Isolated staged paths: {len(paths)}")
          PYCODE
          # Check only first-party browser assets. NOTICE.md and the archived
          # upstream GPMC source patch are reproduced byte-for-byte and can
          # legitimately contain upstream whitespace that git --check flags.
          # The staged-path whitelist above still rejects every unrelated file.
          if [[ "$TARGET" == playground ]]; then
            git -C pages diff --cached --check -- \
              playground/dev/index.html \
              playground/dev/app.js \
              playground/dev/worker.js \
              playground/dev/style.css \
              playground/dev/engines/host.js \
              playground/dev/engines/output.js \
              playground/dev/engines/runner.js
          else
            git -C pages diff --cached --check -- index.html
          fi
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "site: publish validated $TARGET"
            git -C pages push origin HEAD:gh-pages
          fi
          git -C pages fetch --no-tags origin gh-pages
          test "$(git -C pages rev-parse HEAD)" = "$(git -C pages rev-parse FETCH_HEAD)"
          echo "Published $TARGET to gh-pages without altering sibling subtrees." >> "$GITHUB_STEP_SUMMARY"

      - name: Request and verify real GitHub Pages publication
        if: ${{ inputs.target != 'playground-stable' }}
        run: |
          set -euo pipefail
          # Publishing via GITHUB_TOKEN does not automatically trigger a Pages build.
          build_url="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .url)"
          built=false
          for _ in $(seq 1 40); do
            status="$(gh api "$build_url" --jq .status)"
            if [[ "$status" == built ]]; then built=true; break; fi
            if [[ "$status" == errored ]]; then gh api "$build_url"; exit 1; fi
            sleep 15
          done
          test "$built" = true
          if [[ "$TARGET" == playground ]]; then
            public="$PAGES_BASE/playground/dev"
            matched=false
            for _ in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 10 "$public/source-sha.txt?verify=$GITHUB_SHA" -o "$RUNNER_TEMP/public-sha.txt" &&
                 test "$(tr -d '\r\n' < "$RUNNER_TEMP/public-sha.txt")" = "$GITHUB_SHA"; then
                matched=true; break
              fi
              sleep 10
            done
            test "$matched" = true
            for file in index.html app.js worker.js pkg/quprs_web_bg.wasm engines/gpmc.wasm; do
              curl --fail --silent --show-error --max-time 30 "$public/$file?verify=$GITHUB_SHA" -o "$RUNNER_TEMP/public-asset"
              test "$(sha256sum "$RUNNER_TEMP/public-asset" | cut -d' ' -f1)" = "$(sha256sum "browser-site/$file" | cut -d' ' -f1)"
            done
            echo "Verified public Playground: $public/" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TARGET" == homepage ]]; then
            public="$PAGES_BASE/"
            matched=false
            for _ in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 15 "$public?verify=$GITHUB_SHA" -o "$RUNNER_TEMP/public-homepage.html" &&
                 grep -Fq "name=\"quprs-source-revision\" content=\"$GITHUB_SHA\"" "$RUNNER_TEMP/public-homepage.html"; then
                matched=true; break
              fi
              sleep 10
            done
            test "$matched" = true
            cmp "$RUNNER_TEMP/public-homepage.html" pages/index.html
            echo "Verified public homepage: $public" >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

      - name: Publish immutable release and stable alias
        if: ${{ inputs.target == 'playground-stable' }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < browser-site/source-sha.txt)" = "$SOURCE_SHA"
          bash source/scripts/web/publish-stable-pages.sh browser-site pages "$RELEASE_TAG" "$SOURCE_SHA"
