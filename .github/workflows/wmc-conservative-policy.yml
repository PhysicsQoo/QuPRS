name: Opt-in Conservative WMC Evidence Policy

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'test/test_wmc_conservative_policy.py'
      - 'docs/development/wmc-evidence-policy.md'
      - '.github/workflows/wmc-conservative-policy.yml'
  push:
    branches:
      - fix/wmc-conservative-evidence-20261023
    paths:
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'test/test_wmc_conservative_policy.py'
      - 'docs/development/wmc-evidence-policy.md'
      - '.github/workflows/wmc-conservative-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservative-wmc-policy:
    name: Python Rust GPMC Ganak conservative WMC evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out exact source and native solver dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution

      - name: Run source-pinned conservative policy native regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conservative-wmc-results
          python -m pytest -q -ra \
            test/test_wmc_conservative_policy.py \
            --junitxml=conservative-wmc-results/policy-junit.xml \
            2>&1 | tee conservative-wmc-results/policy-test-log.txt

      - name: Run existing historical numerical boundary controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_wmc_numerics.py \
            --junitxml=conservative-wmc-results/legacy-junit.xml \
            2>&1 | tee conservative-wmc-results/legacy-test-log.txt

      - name: Seal exact HEAD, dependency and test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conservative-wmc-results
          git rev-parse HEAD > conservative-wmc-results/source-head.txt
          git rev-parse 'HEAD^{tree}' > conservative-wmc-results/source-tree.txt
          python --version > conservative-wmc-results/python-version.txt 2>&1
          python -m pip freeze > conservative-wmc-results/python-packages.txt
          rustc --version > conservative-wmc-results/rustc-version.txt 2>&1
          uname -a > conservative-wmc-results/kernel.txt
          sha256sum \
            src/QuPRS/interface/load_qiskit.py \
            test/test_wmc_conservative_policy.py \
            test/test_wmc_numerics.py \
            .github/workflows/wmc-conservative-policy.yml \
            docs/development/wmc-evidence-policy.md \
            > conservative-wmc-results/source-files-sha256.txt
          (
            cd conservative-wmc-results
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve native regressions and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservative-wmc-evidence
          path: conservative-wmc-results/
          retention-days: 30
          if-no-files-found: error
