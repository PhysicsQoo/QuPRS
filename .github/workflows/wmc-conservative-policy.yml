name: WMC Numerical Evidence Contract

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/QuPRS/interface/load_qiskit.py'
      - 'src/QuPRS/utils/wmc_solvers.py'
      - 'src/QuPRS/config.py'
      - 'rust/pathsum/src/lib.rs'
      - 'rust/python_ffi/src/api.rs'
      - 'test/test_wmc_evidence_contract.py'
      - 'test/test_numerical_tolerance_contract.py'
      - 'test/test_wmc_tolerance_api.py'
      - 'docs/development/wmc-evidence-policy.md'
      - 'docs/development/wmc-numerical-tolerance.md'
      - 'docs/development/equivalence-semantics.md'
      - '.github/workflows/wmc-conservative-policy.yml'
      - '.github/scripts/ci-impact-reuse.cjs'
      - '.github/scripts/test-ci-impact-reuse.cjs'
  workflow_dispatch:

permissions:
  contents: read

# Supersede only stale runs of this workflow for this PR.
# Jobs within a run still execute independently and concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    name: Incremental CI impact / wmc-conservative-policy.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_heavy: ${{ steps.resolve.outputs.run_heavy }}
      reused_run_id: ${{ steps.resolve.outputs.reused_run_id }}
      measured_head_sha: ${{ steps.resolve.outputs.measured_head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate incremental routing contract tests
        run: node .github/scripts/test-ci-impact-reuse.cjs
      - name: Validate previous successful results for unchanged source
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./.github/scripts/ci-impact-reuse.cjs');
            await resolve({
              github, context, core,
              workflowFile: 'wmc-conservative-policy.yml',
              requiredJobs: [{"name":"Python Rust GPMC Ganak numerical evidence","count":1}]
            });

  wmc-evidence-contract:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.run_heavy == 'true' }}
    name: Python Rust GPMC Ganak numerical evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out exact source and native solver dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore pinned Ganak archive when available
        uses: ./.github/actions/cache-ganak-release
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution

      - name: Run source-pinned WMC numerical evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wmc-evidence-results
          python -m pytest -q -ra \
            test/test_wmc_evidence_contract.py \
            --junitxml=wmc-evidence-results/policy-junit.xml \
            2>&1 | tee wmc-evidence-results/policy-test-log.txt

      - name: Run public and native projective-distance conformance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_numerical_tolerance_contract.py \
            --junitxml=wmc-evidence-results/distance-junit.xml \
            2>&1 | tee wmc-evidence-results/distance-test-log.txt

      - name: Run existing historical numerical boundary controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra \
            test/test_wmc_numerics.py \
            --junitxml=wmc-evidence-results/legacy-junit.xml \
            2>&1 | tee wmc-evidence-results/legacy-test-log.txt

      - name: Seal exact HEAD, dependency and test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wmc-evidence-results
          git rev-parse HEAD > wmc-evidence-results/source-head.txt
          git rev-parse 'HEAD^{tree}' > wmc-evidence-results/source-tree.txt
          python --version > wmc-evidence-results/python-version.txt 2>&1
          python -m pip freeze > wmc-evidence-results/python-packages.txt
          rustc --version > wmc-evidence-results/rustc-version.txt 2>&1
          uname -a > wmc-evidence-results/kernel.txt
          sha256sum \
            src/QuPRS/interface/load_qiskit.py \
            test/test_wmc_evidence_contract.py \
            test/test_numerical_tolerance_contract.py \
            test/test_wmc_numerics.py \
            .github/workflows/wmc-conservative-policy.yml \
            docs/development/wmc-evidence-policy.md \
            > wmc-evidence-results/source-files-sha256.txt
          (
            cd wmc-evidence-results
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve native regressions and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmc-numerical-evidence
          path: wmc-evidence-results/
          retention-days: 30
          if-no-files-found: error
