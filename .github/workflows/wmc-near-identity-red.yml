name: Opt-in WMC Near-Identity Scientific RED

# This diagnostic is not a required source correctness or performance gate.
on:
  push:
    branches:
      - research/wmc-near-identity-red-20261023
    paths:
      - '.diagnostics/wmc_near_identity_red/**'
      - '.github/workflows/wmc-near-identity-red.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmc-near-identity-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independently-oracled-wmc-red:
    name: Independent matrix oracle and selected native WMC RED
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out exact diagnostic source with native solvers
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build exact-source Python/Rust QuPRS
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
          python -m QuPRS.utils.ganak_distribution

      - name: Validate independent physics and count controls
        run: |
          mkdir -p wmc-near-identity-red-results
          python -m pytest -q -ra \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_independent_dense_operator_controls \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_count_policy_controls_and_true_negative \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_default_threshold_rejects_historical_counterexample \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_explicit_historical_tolerance_retains_numeric_acceptance \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_conservative_mode_does_not_claim_small_angle_proof \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_two_numerical_thresholds_are_not_equivalence_proofs \
            --junitxml=wmc-near-identity-red-results/reference-junit.xml \
            2>&1 | tee wmc-near-identity-red-results/reference-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Enforce strict no-false-positive scientific RED
        shell: bash
        run: |
          set +e
          python -m pytest -vv -ra \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_near_identity_count_must_not_certify_equivalence_red \
            .diagnostics/wmc_near_identity_red/test_near_identity.py::test_selected_native_wmc_near_identity_red \
            --junitxml=wmc-near-identity-red-results/red-junit.xml \
            > wmc-near-identity-red-results/red-output.txt 2>&1
          status=$?
          cat wmc-near-identity-red-results/red-output.txt
          exit "$status"

      - name: Seal reproducible scientific evidence
        if: always()
        run: |
          mkdir -p wmc-near-identity-red-results
          git rev-parse HEAD > wmc-near-identity-red-results/source-sha.txt
          git rev-parse 'HEAD^{tree}' > wmc-near-identity-red-results/source-tree.txt
          python --version > wmc-near-identity-red-results/python-version.txt 2>&1
          python -m pip freeze > wmc-near-identity-red-results/python-packages.txt
          uname -a > wmc-near-identity-red-results/kernel.txt
          lscpu > wmc-near-identity-red-results/cpu.txt
          sha256sum \
            .diagnostics/wmc_near_identity_red/test_near_identity.py \
            .github/workflows/wmc-near-identity-red.yml \
            > wmc-near-identity-red-results/source-files-sha256.txt
          (
            cd wmc-near-identity-red-results
            find . -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve green controls and RED cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmc-near-identity-scientific-red
          path: wmc-near-identity-red-results/
          if-no-files-found: error
          retention-days: 30
