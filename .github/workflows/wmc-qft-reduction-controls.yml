name: Hybrid Reduction and Native WMC Observation Probe

# Isolated research diagnostic; never modifies CodSpeed production baselines.
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/wmc-qft-reduction-controls.yml'
      - 'scripts/probe_wmc_dispatch_controls.py'
      - 'test/test_wmc_dispatch_trace_classifier.py'

concurrency:
  group: qft-native-reduction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  native-vs-reduction:
    name: Observe Hybrid RR-only and native WMC execution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out original paper QASM and solver sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> target'
          key: qft-native-and-reduction-controls-v1

      - name: Install native solver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev strace

      - name: Build unchanged original QuPRS backends
        run: |
          python -m pip install 'maturin>=1.5,<2'
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev

      - name: Check trace classifier against native and version-only controls
        run: |
          python -m pytest -q test/test_wmc_dispatch_trace_classifier.py

      - name: Observe Hybrid reduction-only and native work without requiring WMC
        run: |
          set -euo pipefail
          root=solver-dispatch-evidence
          mkdir -p "$root"
          git rev-parse HEAD > "$root/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$root/source-tree.txt"
          lscpu > "$root/lscpu.txt"
          uname -a > "$root/kernel.txt"
          python -m pip freeze > "$root/python-packages.txt"
          rustc --version > "$root/rust-version.txt"
          for case in qft16 graphstate16; do
            for solver in gpmc ganak; do
              for backend in python rust; do
                prefix="$root/${case}-${solver}-${backend}"
                strace -f -qq -e trace=execve -o "${prefix}.execve.log" \
                  python scripts/probe_wmc_dispatch_controls.py \
                    --case "$case" --solver "$solver" --backend "$backend" \
                    --output "${prefix}.json"
              done
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("scripts").resolve()))
          from probe_wmc_dispatch_controls import native_solver_work_execve
          root = Path("solver-dispatch-evidence")
          binary_ids = {}
          qasm_ids = {}
          rows = []
          for case in ("qft16", "graphstate16"):
              for solver in ("gpmc", "ganak"):
                  for backend in ("python", "rust"):
                      prefix = root / f"{case}-{solver}-{backend}"
                      info = json.loads(prefix.with_suffix(".json").read_text())
                      trace = prefix.with_suffix(".execve.log").read_text()
                      binary = info["solver_binary"]
                      observed = native_solver_work_execve(trace, binary, solver)
                      version_probe = any(
                          'execve("' + binary + '"' in line
                          and '"--version"' in line
                          and line.rstrip().endswith('= 0')
                          for line in trace.splitlines()
                      )
                      # Hybrid may complete after Reduction Rules for *any* case.
                      # Neither a solver PID nor numeric tool_time is mandatory.
                      assert info["verdict"] in ("equivalent", "equivalent*")
                      assert info["tool_time_numeric"] == (
                          isinstance(info["tool_time_s"], (int, float))
                          and not isinstance(info["tool_time_s"], bool)
                      )
                      binary_ids.setdefault(solver, info["solver_sha256"])
                      assert info["solver_sha256"] == binary_ids[solver]
                      qasm_ids.setdefault(case, info["qasm_sha256"])
                      assert info["qasm_sha256"] == qasm_ids[case]
                      rows.append({"case": case, "solver": solver, "backend": backend,
                                   "verdict": info["verdict"],
                                   "native_model_count_execve": observed,
                                   "native_version_probe_execve": version_probe,
                                   "tool_time_numeric": info["tool_time_numeric"],
                                   "execution_path": "native_wmc" if observed else "rr_only",
                                   "native_time_consistent": observed == info["tool_time_numeric"]})
          assert len(rows) == 8
          n_native = sum(row["native_model_count_execve"] for row in rows)
          n_reduction_only = len(rows) - n_native
          (root / "audit.json").write_text(json.dumps({
              "scope": "observed original Hybrid execution paths outside CodSpeed",
              "checks": rows,
              "native_wmc_observed": n_native,
              "rr_only_observed": n_reduction_only,
              "solver_attribution_possible": n_native > 0,
              "status": "COMPLETE" if n_native > 0 else "INCONCLUSIVE_NO_NATIVE_WORK",
          }, sort_keys=True, indent=2) + "\n")
          print(f"8/8 positive equivalence; native WMC observed: {n_native}, RR-only: {n_reduction_only}", flush=True)
          PY

      - name: CodSpeed v5 Simulation with subprocess tracing enabled
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'true'
          run: >-
            pytest test/test_MQT.py --codspeed
            -k 'qft_nativegates_ibm_qiskit_opt0_16 or graphstate_nativegates_ibm_qiskit_opt0_16'

      - name: Seal self-contained evidence with portable checksums
        if: always()
        run: |
          mkdir -p solver-dispatch-evidence
          (
            cd solver-dispatch-evidence
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z | xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve positive and negative native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-dispatch-controls-original-qasm
          path: solver-dispatch-evidence/
          if-no-files-found: error
          retention-days: 90
