name: Rust WMC Subprocess Attribution Probe

# Isolated diagnostic for subprocess instrumentation; no maintained baseline updates.
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/wmc-rust-subprocess-probe.yml'
      - 'scripts/verify_wmc_rust_subprocess_probe.py'

permissions:
  contents: read
  id-token: write

jobs:
  native-rust-wmc-attribution:
    name: Rust native WMC / subprocess capture false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact tested source and native solver
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native solver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libmpfr-dev zlib1g-dev strace
      - name: Build exact checked-out source and all solvers
        run: |
          python -m pip install --upgrade pip maturin
          export VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")"
          maturin develop --release -E dev
      - name: Prove independently launched Rust-backend GPMC and Ganak
        run: |
          set -euo pipefail
          mkdir -p rust-subprocess-evidence
          git rev-parse HEAD > rust-subprocess-evidence/source-sha.txt
          git rev-parse 'HEAD^{tree}' > rust-subprocess-evidence/source-tree.txt
          lscpu > rust-subprocess-evidence/cpu.txt
          uname -a > rust-subprocess-evidence/kernel.txt
          python --version > rust-subprocess-evidence/python.txt 2>&1
          rustc --version > rust-subprocess-evidence/rust.txt 2>&1
          printf '%s\n' "false" > rust-subprocess-evidence/subprocess-capture-mode.txt
          for solver in gpmc ganak; do
            strace -f -qq -e trace=execve \
              -o "rust-subprocess-evidence/${solver}.execve.log" \
              python scripts/verify_wmc_rust_subprocess_probe.py \
                --solver "${solver}" --output "rust-subprocess-evidence/${solver}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('rust-subprocess-evidence')
          seen = {}
          for solver in ('gpmc', 'ganak'):
              report = json.loads((root / (solver + '.json')).read_text())
              assert report['backend'] == 'rust'
              assert report['status'] in ('equivalent', 'equivalent*')
              assert report['solver_time_seconds'] >= 0
              binary = report['solver']['binary']
              lines = (root / (solver + '.execve.log')).read_text().splitlines()
              assert any('execve("' + binary + '"' in s and s.rstrip().endswith('= 0')
                         for s in lines), f'{solver} not actually spawned'
              seen[solver] = report['source_hashes']
              print(f'{solver}: rust native execve verified', flush=True)
          assert seen['gpmc'] == seen['ganak'], 'input QASM changed across solvers'
          PY
      - name: Run original Rust Grover4 CodSpeed benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          simulation-track-subprocess: 'false'
          run: >-
            pytest test/test_MQT.py --codspeed
            -k 'grover-noancilla_nativegates_ibm_qiskit_opt0_4 and rust'
      - name: Seal opt-in native evidence
        if: always()
        run: |
          mkdir -p rust-subprocess-evidence
          (
            cd rust-subprocess-evidence
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z | xargs -0 -r sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Preserve exact solver and capture configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-subprocess-capture-false
          path: rust-subprocess-evidence/
          retention-days: 45
          if-no-files-found: error
