# Isolated CodSpeed benchmark crate: never changes QuPRS shipping dependencies
# or the paper's canonical 32 pytest benchmark identifiers.
[package]
name = "quprs-codspeed-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
pathsum = { package = "quprs", path = "../../rust/quprs" }
divan = { package = "codspeed-divan-compat", version = "=6.0.0" }

[workspace]

[[bench]]
name = "core"
harness = false
