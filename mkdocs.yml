site_name: QuPRS
site_description: Quantum circuit equivalence checking with Path-sum reduction and weighted model counting
repo_url: https://github.com/PhysicsQoo/QuPRS
repo_name: PhysicsQoo/QuPRS
edit_uri: edit/dev/docs/site/
docs_dir: docs/site
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members: false
            docstring_style: google

nav:
  - Overview: index.md
  - User guide:
      - Getting started: getting-started.md
      - Native Rust and external solvers: rust-native.md
      - Executable examples: examples.md
      - Verification methods: verification.md
  - Theory:
      - Overview: theory.md
      - Path-sum and reduction: path-sum.md
      - Weighted model counting: weighted-model-counting.md
  - API Reference:
      - Overview: reference.md
      - General Python API: python-api.md
      - Advanced Path-sum API: pathsum-api.md
      - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
