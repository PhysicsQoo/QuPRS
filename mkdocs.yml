site_name: QuPRS
site_description: Quantum circuit equivalence checking with Path-sum reduction and weighted model counting
repo_url: https://github.com/PhysicsQoo/QuPRS
repo_name: PhysicsQoo/QuPRS
edit_uri: edit/dev/docs/site/
docs_dir: docs/site
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Verification: verification.md
  - Theory: theory.md
  - API Reference: reference.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
