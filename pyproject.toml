[build-system]
requires = ["hatchling", "hatch-vcs", "cmake"]
build-backend = "hatchling.build"

[project]
name = "QuPRS"
authors = [
    { name = "Wei-Jia Huang", email = "wei.jia.huang.physics@gmail.com" },
]
description = "QuPRS: Quantum Path-sum Reduction and Solver" 
keywords = ["pathsum", "weighted model counting", "quantum circuit", "equivalence checking", ]
readme = "README.md"
license-files  = ["LICENSE.md", "NOTICE.md"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha", # (Alpha, Beta, Production/Stable)
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent", 
]
dependencies = [
    "numpy",
    "sympy",
    "symengine",
    "qiskit<2.0,>=1.0.0",
    "qiskit-qasm3-import>=0.5.1",
    "psutil",
]
dynamic = ["version"]
[project.optional-dependencies]
dev = [
    "ipykernel",
    "build",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-flake8",
    "pytest-benchmark",
    "pytest-html",
    "pandas",
    "tqdm"
]
[project.urls]
Homepage = "https://github.com/PhysicsQoo/QuPRS" # GitHub link
PyPI = "https://pypi.org/project/QuPRS/"
# (Optional) Other URLs related to your project
# "Bug Tracker" = "..."
# "Documentation" = "..."

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
artifacts = ["src/QuPRS/utils/wmc_tools/*"]
packages = ["src/QuPRS"]
pure = false

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "scripts",
    "GPMC",
    "ganak",
    "LICENSE.md",
    "NOTICE.md",
    "README.md",
    "pyproject.toml"
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/QuPRS/_version.py"

[tool.cibuildwheel]
# Skip PyPy, 32-bit, and musllinux builds
skip = ["pp*", "*i686*", "*musllinux*"]
build-frontend = "build"

[tool.cibuildwheel.linux]
before-all = "yum install -y gmp-devel mpfr-devel zlib-devel"

[tool.cibuildwheel.macos]
before-all = "brew install gmp mpfr zlib"