[build-system]
# Use maturin as the build backend for Rust/Python integration
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "QuPRS"
# Version is dynamically fetched from rust/python_ffi/Cargo.toml (Single Source of Truth)
dynamic = ["version"]
authors = [
    { name = "Wei-Jia Huang", email = "wei.jia.huang.physics@gmail.com" },
]
description = "QuPRS: Quantum Path-sum Reduction and Solver" 
keywords = ["pathsum", "weighted model counting", "quantum circuit", "equivalence checking"]
readme = "README.md"
license-files  = ["LICENSE.md", "NOTICE.md"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",   
    "Operating System :: MacOS :: MacOS X", 
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy",
    "sympy",
    "symengine",
    "qiskit<2.0,>=1.0.0",
    "qiskit-qasm3-import>=0.5.1",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "build",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-flake8",
    "pytest-benchmark",
    "pytest-codspeed",
    "pytest-html",
    "pandas",
    "tqdm"
]

[project.urls]
Homepage = "https://github.com/PhysicsQoo/QuPRS"
PyPI = "https://pypi.org/project/QuPRS/"
"Bug Tracker" = "https://github.com/PhysicsQoo/QuPRS/issues"
"Documentation" = "https://github.com/PhysicsQoo/QuPRS#readme"

# ==========================================
# Maturin Specific Configuration
# ==========================================
[tool.maturin]
# Path to the Cargo.toml that defines the Python FFI (cdylib)
manifest-path = "rust/python_ffi/Cargo.toml"

# Directory where the Python package source resides
python-source = "src"
module-name = "QuPRS._pathsum_rust"
# List of patterns to include in the Source Distribution (Sdist)
# Essential for users building from source who need C++ code and build scripts
include = [
    "GPMC/**/*",                   # C++ source for GPMC
    "scripts/install_linux_deps.sh", # Environment setup script
    "src/QuPRS/utils/wmc_tools/*", # Compiled binaries from build.rs
]

# ==========================================
# cibuildwheel Configuration for Cross-Platform Builds
# ==========================================
[tool.cibuildwheel]
# Skip specific platforms to save CI time
skip = ["pp*", "*i686*", "*musllinux*", "cp314*"]
build-frontend = "build"

[tool.cibuildwheel.linux]
# Ensure system libraries (GMP/MPFR) are installed in the Docker container before building
before-all = "sh scripts/install_linux_deps.sh"

[tool.cibuildwheel.macos]
# Install dependencies using Homebrew on macOS Runners
before-all = "brew install gmp mpfr zlib cmake"

# ==========================================
# Pytest Configuration
# ==========================================
[tool.pytest.ini_options]
testpaths = ["test"]