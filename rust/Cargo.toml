# rust/Cargo.toml
[workspace]
members = [
    "quprs",
    "web",
    "cli",
    "python_ffi",
]

resolver = "2"

[workspace.package]
version = "0.17.3"
edition = "2021" 
authors = ["Wei-Jia Huang <wei.jia.huang.physics@gmail.com>"]
publish = false

[workspace.metadata.release]
shared-version = true    
consolidate-commits = true
tag = true               
tag-name = "v{{version}}"
push = false             
sign-commit = false      

pre-release-commit-message = "chore: release v{{version}}"

[profile.release]
debug = 1

# Correctness tests retain CLI fault injection and arithmetic checks.
# The source-locked CPR heavy gate also retains its 15-second budget.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
