# rust/pathsum/Cargo.toml

[package]
name = "pathsum"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rustc-hash = "2.0"
num-integer = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-complex = "0.4"
rand = "0.8"
similar = "2.4.0"
log = "0.4"
anyhow = "1.0"
sha2 = "0.10"

[build-dependencies]
# The shared Ganak diagnostics module supervises its --version child in build.rs too.
anyhow = "1.0"
cmake = "0.1"
pkg-config = "0.3"
reqwest = { version = "0.11", features = ["blocking"] } 
zip = "0.6"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.0"

[features]
mpfr-experiment = [] # test-only bridge; opt-in experimental CI, no production dependency
high-precision-gpmc = [] # opt-in release candidate; never globally uses MPFR
