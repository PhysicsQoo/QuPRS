# rust/python_ffi/Cargo.toml

[package]
name = "quprs_python"   
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true


[package.metadata.release]
pre-release-replacements = [
    { file = "../../src/QuPRS/_version.py", search = '__version__ = ".*"', replace = '__version__ = "{{version}}"' },
]
[lib]
name = "_pathsum_rust"   
crate-type = ["cdylib"] 

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py311"] }
pathsum = { package = "quprs", path = "../pathsum", default-features = false }

[features]
default = ["high-precision-gpmc"]
high-precision-gpmc = ["pathsum/high-precision-gpmc"]
