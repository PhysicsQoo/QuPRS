# rust/python_ffi/pyproject.toml
# Standalone pyproject.toml for developing the FFI layer in isolation.
# For full package builds, use the root QuPRS/pyproject.toml instead.

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "quprs-python-ffi"
dynamic = ["version"]
description = "Rust-accelerated Quantum Path-sum Reduction System"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "_pathsum_rust"