# rust/python_ffi/pyproject.toml

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pathsum_rust"
version = "0.1.0"
description = "Rust-accelerated Quantum Path-sum Reduction System"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "pathsum_rust"