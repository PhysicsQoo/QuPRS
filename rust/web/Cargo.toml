[package]
name="quprs-web"
version.workspace=true
edition.workspace=true
publish=false
license="MIT"
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
anyhow="1"
quprs={path="../quprs",default-features=false,features=["browser-transport"]}
wasm-bindgen="=0.2.100"
getrandom={version="0.2",features=["js"]}
serde={version="1",features=["derive"]}
serde_json="1"
num-rational="0.4"
num-bigint="0.4"
num-traits="0.2"
console_error_panic_hook="0.1"
